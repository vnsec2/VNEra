
name: VN-Revera Private APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4

      - name: Extract VN-Revera source
        run: |
          mkdir source
          unzip -q VN-Revera-1.0.7-vn1-source.zip -d source
          echo "PROJECT_DIR=$(find source -type f -name gradlew -printf '%h\n' | head -1)" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew :app:assembleDebug -Pabis=arm64-v8a --no-daemon

      - name: Upload private APK
        uses: actions/upload-artifact@v4
        with:
          name: VN-Revera-APK
          path: source/**/base/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
