name: Prepare VNERaBase & Revera Branches

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: 'Έκδοση (π.χ. 1.0.10 -> ψάχνει Revera-1.0.10.zip στο main)'
        required: true
        default: '1.0.10'
        type: string
      old_clean_branch:
        description: 'Καθαρό branch προηγούμενης έκδοσης'
        required: true
        default: 'work/revera-1.0.9-clean'
        type: string
      old_custom_branch:
        description: 'Branch με τις δικές σου αλλαγές'
        required: true
        default: 'vnera-2.3.1'
        type: string

permissions:
  contents: write

jobs:
  build-trees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Create Revera & VNERaBase Branches
        env:
          NEW_V: ${{ github.event.inputs.new_version }}
          OLD_CLEAN: ${{ github.event.inputs.old_clean_branch }}
          OLD_CUSTOM: ${{ github.event.inputs.old_custom_branch }}
        run: |
          set -euo pipefail
          NEW_V="${NEW_V#v}"
          OLD_V=$(echo "$OLD_CLEAN" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 1. Φέρνουμε το main (μαζί με τυχόν LFS αρχεία) και βρίσκουμε το Revera-1.0.10.zip
          git fetch origin main "$OLD_CLEAN" "$OLD_CUSTOM"
          git checkout -B "Revera${NEW_V}" origin/main
          git lfs pull origin main 2>/dev/null || true

          ZIP_FILE=$(find . -maxdepth 3 -name "Revera-${NEW_V}.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Δεν βρέθηκε το Revera-${NEW_V}.zip στο main."
            exit 1
          fi

          ls -lh "$ZIP_FILE"
          file "$ZIP_FILE"

          mkdir -p /tmp/zip_out
          if ! unzip -q "$ZIP_FILE" -d /tmp/zip_out 2>/dev/null; then
            rm -rf /tmp/zip_out/*
            if ! 7z x -y "$ZIP_FILE" -o/tmp/zip_out >/dev/null 2>&1; then
              echo "ERROR: Το $ZIP_FILE δεν είναι έγκυρο αρχείο zip/archive (πιθανώς ανέβηκε κατεστραμμένο ή μισό στο main)."
              head -c 200 "$ZIP_FILE" || true
              exit 1
            fi
          fi

          # Αφαιρούμε τα upstream workflows από το zip για να μην μπλοκάρει το push
          find /tmp/zip_out -path "*/.github/workflows" -exec rm -rf {} + 2>/dev/null || true

          ENTRY_COUNT=$(find /tmp/zip_out -mindepth 1 -maxdepth 1 | wc -l)
          SINGLE_DIR=$(find /tmp/zip_out -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ "$ENTRY_COUNT" -eq 1 ] && [ -n "$SINGLE_DIR" ]; then
            SRC_DIR="$SINGLE_DIR"
          else
            SRC_DIR="/tmp/zip_out"
          fi

          # Καθαρίζουμε τα παλιά αρχεία κρατώντας ανέπαφα τα .github/workflows του main
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          [ -d .github ] && find .github -mindepth 1 -maxdepth 1 ! -name 'workflows' -exec rm -rf {} +
          cp -a "$SRC_DIR"/. .
          rm -f Revera-*.zip

          git add -A
          git commit -m "Revera ${NEW_V}"
          git push -f origin "Revera${NEW_V}"

          # 2. Περνάμε τις δικές σου αλλαγές πάνω στο Revera1.0.10 -> VNERaBase1.0.10
          git checkout -B "VNERaBase${NEW_V}"
          EXCLUDES=(-- . ':!.github/workflows' ':!*.zip' ':!extract-source.yml')

          echo "=== Αρχεία που μεταφέρονται από ${OLD_CUSTOM} ==="
          git diff --name-status "origin/${OLD_CLEAN}" "origin/${OLD_CUSTOM}" "${EXCLUDES[@]}"
          git diff --binary "origin/${OLD_CLEAN}" "origin/${OLD_CUSTOM}" "${EXCLUDES[@]}" > /tmp/vnera.patch

          if ! git apply --3way --ignore-whitespace /tmp/vnera.patch; then
            echo "ERROR: Conflict στα παρακάτω αρχεία:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

          if [ -n "$OLD_V" ] && [ "$OLD_V" != "$NEW_V" ]; then
            for gf in app/build.gradle.kts gradle/libs.versions.toml; do
              [ -f "$gf" ] && sed -i "s/\"${OLD_V}\"/\"${NEW_V}\"/g" "$gf"
            done
          fi

          git add -A
          git commit -m "VNERaBase ${NEW_V}"
          git push -f origin "VNERaBase${NEW_V}"
