name: Prepare VNERaBase & Revera Branches

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: 'Νέα έκδοση Revera (π.χ. 1.0.10)'
        required: true
        default: '1.0.10'
        type: string
      old_clean_branch:
        description: 'Καθαρό branch προηγούμενης έκδοσης'
        required: true
        default: 'work/revera-1.0.9-clean'
        type: string
      old_custom_branch:
        description: 'Branch με τις δικές σου αλλαγές'
        required: true
        default: 'vnera-2.3.1'
        type: string
      zip_url:
        description: 'Direct link για το zip του Revera 1.0.10 (υποχρεωτικό αν δεν υπάρχει public tag)'
        required: false
        default: ''
        type: string
      upstream_repo:
        description: 'Upstream GitHub repo του Revera (owner/repo)'
        required: true
        default: 'caruno/Revera'
        type: string

permissions:
  contents: write

jobs:
  build-trees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: _repo

      - name: Create Revera1.0.10 & VNERaBase1.0.10
        env:
          NEW_V: ${{ github.event.inputs.new_version }}
          OLD_CLEAN: ${{ github.event.inputs.old_clean_branch }}
          OLD_CUSTOM: ${{ github.event.inputs.old_custom_branch }}
          ZIP_URL: ${{ github.event.inputs.zip_url }}
          UPSTREAM: ${{ github.event.inputs.upstream_repo }}
        run: |
          set -euo pipefail
          NEW_V="${NEW_V#v}"
          OLD_V=$(echo "$OLD_CLEAN" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || true)

          # 1. Εντοπισμός μόνο των 11 καθαρών αρχείων αλλαγών (χωρίς παλιά .zip ή extract-source.yml)
          git -C _repo fetch origin "$OLD_CLEAN" "$OLD_CUSTOM"
          EXCLUDES=(-- . ':!.github/workflows' ':!*.zip' ':!extract-source.yml')
          CHANGED_COUNT=$(git -C _repo diff --name-only "origin/${OLD_CLEAN}" "origin/${OLD_CUSTOM}" "${EXCLUDES[@]}" | wc -l)

          echo "=== Αρχεία που θα μεταφερθούν από το ${OLD_CUSTOM} ($CHANGED_COUNT) ==="
          git -C _repo diff --name-status "origin/${OLD_CLEAN}" "origin/${OLD_CUSTOM}" "${EXCLUDES[@]}"

          if [ "$CHANGED_COUNT" -eq 0 ] || [ "$CHANGED_COUNT" -gt 60 ]; then
            echo "ERROR: Βρέθηκαν $CHANGED_COUNT αρχεία. Έλεγξε τα ονόματα των branches."
            exit 1
          fi

          git -C _repo diff --binary "origin/${OLD_CLEAN}" "origin/${OLD_CUSTOM}" "${EXCLUDES[@]}" > /tmp/vnera.patch

          # 2. Λήψη & αποσυμπίεση του Revera zip -> branch Revera1.0.10
          mkdir -p _zip _clean
          DOWNLOADED=0
          if [ -n "$ZIP_URL" ]; then
            echo "Λήψη από zip_url: $ZIP_URL"
            if curl -fsSL "$ZIP_URL" -o _zip/revera.zip; then
              DOWNLOADED=1
            else
              echo "ERROR: Το link στο zip_url έδωσε 404 ή δεν είναι προσβάσιμο: $ZIP_URL"
              exit 1
            fi
          else
            for U in \
              "https://github.com/${UPSTREAM}/archive/refs/tags/v${NEW_V}.zip" \
              "https://github.com/${UPSTREAM}/archive/refs/tags/${NEW_V}.zip" \
              "https://api.github.com/repos/${UPSTREAM}/zipball/v${NEW_V}" \
              "https://api.github.com/repos/${UPSTREAM}/zipball/${NEW_V}"; do
              if curl -fsSL -H "Accept: application/vnd.github+json" "$U" -o _zip/revera.zip 2>/dev/null; then
                DOWNLOADED=1
                echo "Βρέθηκε zip στο: $U"
                break
              fi
            done
          fi

          if [ "$DOWNLOADED" -ne 1 ]; then
            echo "ERROR: Δεν βρέθηκε το zip της έκδοσης ${NEW_V} στο '${UPSTREAM}' (404 Not Found)."
            echo "Λύση: Βάλε το ακριβές download link του Revera ${NEW_V} zip στο πεδίο 'zip_url' όταν πατάς Run workflow."
            exit 1
          fi

          unzip -q _zip/revera.zip -d _zip/out
          TOP_DIR=$(find _zip/out -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -n "$TOP_DIR" ]; then
            cp -a "$TOP_DIR"/. _clean/
          else
            cp -a _zip/out/. _clean/
          fi

          # Διατήρηση των workflows σου ανέπαφων (NewVERARUNNER.yml κ.λπ.)
          mkdir -p _clean/.github/workflows
          cp -rf _repo/.github/workflows/. _clean/.github/workflows/

          cd _clean
          git init -b "Revera${NEW_V}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -m "Revera ${NEW_V} (from zip)"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin "Revera${NEW_V}"

          # 3. Εφαρμογή μόνο των δικών σου αλλαγών πάνω στο Revera1.0.10 -> VNERaBase1.0.10
          git checkout -b "VNERaBase${NEW_V}"
          export GIT_ALTERNATE_OBJECT_DIRECTORIES="$(realpath ../_repo/.git/objects)"

          if ! git apply --3way --ignore-whitespace /tmp/vnera.patch; then
            echo "ERROR: Υπήρξε conflict κατά τη συγχώνευση των αλλαγών σου πάνω στην ${NEW_V}."
            exit 1
          fi

          if [ -n "$OLD_V" ] && [ "$OLD_V" != "$NEW_V" ]; then
            for gf in app/build.gradle.kts gradle/libs.versions.toml; do
              [ -f "$gf" ] && sed -i "s/\"${OLD_V}\"/\"${NEW_V}\"/g" "$gf"
            done
          fi

          git add -A && git commit -m "VNERaBase ${NEW_V} (base + custom changes)"
          git push -f origin "VNERaBase${NEW_V}"
