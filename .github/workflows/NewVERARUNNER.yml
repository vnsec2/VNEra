          @Composable
          fun VnFullscreenLyricsOverlay(fromImmersivePanel: Boolean = false) {
              val c = LocalContext.current
              val act = remember(c) { c.findActivity() }
              VnFpsPref.ensureInit(c)

              if (!VnFpsPref.lyricsFullscreenOpen) return
              if (!fromImmersivePanel && VnFpsPref.immersivePanelActive) return

              var isClosing by remember { mutableStateOf(false) }
              val scope = rememberCoroutineScope()
              val closeOverlay: () -> Unit = {
                  if (!isClosing) {
                      isClosing = true
                      scope.launch {
                          delay(260L)
                          VnFpsPref.closeLyricsFullscreen(act)
                          isClosing = false
                      }
                  }
              }

              LaunchedEffect(VnFpsPref.lyricsImmersiveEnabled) {
                  VnFpsPref.setSystemBarsHidden(act, VnFpsPref.lyricsImmersiveEnabled)
              }
              DisposableEffect(Unit) {
                  onDispose { VnFpsPref.setSystemBarsHidden(act, false) }
              }

              Dialog(
                  onDismissRequest = closeOverlay,
                  properties = DialogProperties(usePlatformDefaultWidth = false, decorFitsSystemWindows = false)
              ) {
                  CompositionLocalProvider(LocalVnIsPlayerInlineLyric provides false, LocalVnFullscreenOverlayContent provides true) {
                      BackHandler(onBack = closeOverlay)
                      Box(
                          modifier = Modifier
                              .fillMaxSize()
                              .vnFullscreenSlideContainer(isClosing = isClosing, matchPlayerBackground = false)
                              .background(Brush.verticalGradient(listOf(Color(0xFF080A10), Color(0xFF171B28), Color(0xFF0B0D14))))
                              .vnSmartLyricsSwipe(act = act, isExpanded = true, onCollapseToPlayer = closeOverlay)
                              .statusBarsPadding()
                              .navigationBarsPadding()
                      ) {
                          com.music.spotui.ui.immersive.lyrics.ImmersiveLyricsPanel(
                              modifier = Modifier.fillMaxSize(),
                              contentPadding = PaddingValues(top = 56.dp, bottom = 76.dp)
                          )
                          Box(
                              modifier = Modifier.align(Alignment.TopEnd).padding(top = 10.dp, end = 12.dp).zIndex(99f)
                          ) {
                              VnLyricsFullscreenButton(
                                  isFullscreen = true,
                                  ownerId = "overlay_fullscreen",
                                  onClick = closeOverlay
                              )
                          }
                      }
                  }
              }
          }

