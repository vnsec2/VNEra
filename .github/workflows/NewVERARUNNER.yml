name: Build VNEra Debug APK (1.0.9 Base)

on:
  push:
    branches:
      - vnera2-3-1
      - VNERA2-1-3
      - vnera-2.3.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main for Persistent Signing Key
        uses: actions/checkout@v4
        with:
          ref: main
          path: _keystore_repo
          fetch-depth: 1

      - name: Prepare Signing Keystore (Update-Safe)
        env:
          VN_KEYSTORE_B64: ${{ secrets.VN_KEYSTORE_B64 }}
          VN_STORE_PASS: ${{ secrets.VN_STORE_PASS }}
          VN_KEY_ALIAS: ${{ secrets.VN_KEY_ALIAS }}
          VN_KEY_PASS: ${{ secrets.VN_KEY_PASS }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "_keystore_repo/.github"
          KEYSTORE="_keystore_repo/.github/vnera-debug.keystore"
          STORE_PASS="android"
          KEY_ALIAS="androiddebugkey"
          KEY_PASS="android"

          if [ -n "${VN_KEYSTORE_B64:-}" ]; then
            echo "OK: Using persistent signing keystore from VN_KEYSTORE_B64 secret for in-place updates."
            printf '%s' "$VN_KEYSTORE_B64" | base64 -d > "$KEYSTORE"
            [ -n "${VN_STORE_PASS:-}" ] && STORE_PASS="$VN_STORE_PASS"
            [ -n "${VN_KEY_ALIAS:-}" ] && KEY_ALIAS="$VN_KEY_ALIAS"
            [ -n "${VN_KEY_PASS:-}" ] && KEY_PASS="$VN_KEY_PASS"
          elif [ -f "$KEYSTORE" ]; then
            echo "OK: Using committed keystore from main/.github/vnera-debug.keystore."
          else
            echo "WARNING: No persistent keystore found! Future builds will NOT update in-place unless VN_KEYSTORE_B64 is set."
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass "$STORE_PASS" -alias "$KEY_ALIAS" -keypass "$KEY_PASS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=VNEra Debug,O=VNEra,C=GR"
          fi

          keytool -list -v -keystore "$KEYSTORE" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" | grep -E "Alias name:|SHA256:" || true

          echo "VN_STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "VN_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "VN_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"
          cp -f "$KEYSTORE" "$HOME/.android/debug.keystore"
          cp -f "$KEYSTORE" "/tmp/vnera-debug.keystore"

      - name: Checkout Target Branch (1.0.9 Base)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Prepare Keystore & Gradle Wrapper
        run: |
          set -euo pipefail
          mkdir -p app
          cp -f "/tmp/vnera-debug.keystore" "app/vnera-debug.keystore"
          chmod +x ./gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Link SDK 37 & Fix Versions & Apply Patches
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SUDO=""; command -v sudo >/dev/null 2>&1 && [ ! -w "$SDK_ROOT/platforms" ] && SUDO="sudo"
          [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ] && $SUDO ln -sfn "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"

          export HAS_SDK_37="false"
          [ -d "$SDK_ROOT/platforms/android-37" ] && export HAS_SDK_37="true"
          export FALLBACK_SDK="35"
          [ -d "$SDK_ROOT/platforms/android-36" ] && export FALLBACK_SDK="36"
          export BUILD_VERSION_CODE=$(( $(date +%s) / 10 ))
          echo "HAS_SDK_37=$HAS_SDK_37" >> "$GITHUB_ENV"
          echo "BUILD_VERSION_CODE=$BUILD_VERSION_CODE" >> "$GITHUB_ENV"
          echo "Using monotonically increasing BUILD_VERSION_CODE=$BUILD_VERSION_CODE"

          mkdir -p app/src/main/java/com/music/spotui/ui/screens
          cat <<'EOF' > app/src/main/java/com/music/spotui/ui/screens/VnFrameRateManager.kt
          package com.music.spotui.ui.screens

          import android.app.*
          import android.content.*
          import android.media.AudioManager
          import android.os.*
          import android.view.*
          import android.widget.Toast
          import androidx.activity.compose.BackHandler
          import androidx.compose.animation.AnimatedVisibility
          import androidx.compose.animation.animateColorAsState
          import androidx.compose.animation.core.*
          import androidx.compose.animation.fadeIn
          import androidx.compose.animation.fadeOut
          import androidx.compose.animation.slideInVertically
          import androidx.compose.animation.slideOutVertically
          import androidx.compose.foundation.*
          import androidx.compose.foundation.gestures.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyListState
          import androidx.compose.foundation.shape.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.rounded.Check
          import androidx.compose.material.icons.rounded.Close
          import androidx.compose.material.icons.rounded.Fullscreen
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.*
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.input.nestedscroll.*
          import androidx.compose.ui.input.pointer.*
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.text.AnnotatedString
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.buildAnnotatedString
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.*
          import androidx.compose.ui.window.Dialog
          import androidx.compose.ui.window.DialogProperties
          import androidx.compose.ui.window.Popup
          import androidx.compose.ui.window.PopupProperties
          import androidx.core.view.*
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import org.json.*
          import java.io.File
          import kotlin.math.*

          val LocalVnIsPlayerInlineLyric = compositionLocalOf { false }
          val LocalVnFullscreenOverlayContent = compositionLocalOf { false }

          object VnFpsPref {
              const val PREFS_NAME = "vnera_display_prefs"
              const val KEY_TARGET_FPS = "target_fps"
              const val KEY_LYRICS_IMMERSIVE = "lyrics_immersive_fullscreen"
              const val KEY_CUSTOM_COLOR = "custom_accent_color_argb"
              const val KEY_ANIM_ENABLED = "element_animation_enabled"
              const val KEY_ANIM_MODE = "element_animation_mode"
              const val KEY_ANIM_PAUSE_ON_PAUSE = "element_animation_pause_on_playback_pause"
              const val KEY_PLAYBACK_ALERTS = "playback_quality_order_alerts"
              const val KEY_KEEP_SHUFFLE = "keep_shuffle_enabled"
              const val KEY_SHUFFLE_LOCKED_ON = "shuffle_locked_on"
              const val KEY_LAST_BACKUP_JSON = "last_loaded_backup_json"
              const val KEY_LAST_BACKUP_EXTENSIONS = "last_loaded_backup_extensions"
              const val KEY_RESTORED_EXTENSIONS = "restored_extensions_list"
              const val KEY_LYRICS_BEAUTIFUL = "lyrics_beautiful_enabled"
              const val KEY_LYRICS_COLOR = "lyrics_custom_color_argb"
              const val KEY_PLAYER_KARAOKE_BG_COLOR = "player_karaoke_bg_color_argb"
              const val KEY_LYRICS_FONT_SCALE = "lyrics_font_scale"
              const val KEY_PLAYER_LYRICS_FONT_SCALE = "player_lyrics_font_scale"

              @Volatile private var initialized = false
              @Volatile var appCtx: Context? = null
              private var prefListener: SharedPreferences.OnSharedPreferenceChangeListener? = null

              var targetFps by mutableIntStateOf(0); private set
              var lyricsImmersiveEnabled by mutableStateOf(true); private set
              var lyricsBarsHidden by mutableStateOf(false)
              var lyricsFullscreenOpen by mutableStateOf(false)
              var nativeLyricsScreenActive by mutableStateOf(false)
              var immersivePanelActive by mutableStateOf(false)
              var onExternalOpenLyrics: (() -> Unit)? = null
              var onExternalCloseLyrics: (() -> Unit)? = null

              var activeLyricsScrollState: ScrollableState? = null
              var savedPlayerLyricText by mutableStateOf("")
              var savedPlayerLyricLines by mutableStateOf<List<String>>(emptyList())
              var savedPlayerActiveLineIndex by mutableIntStateOf(-1)
              var savedPlayerPreviewScrollIndex by mutableIntStateOf(0)
              var savedPlayerPreviewScrollOffset by mutableIntStateOf(0)
              var playerBackgroundColorArgb by mutableLongStateOf(0L)

              var customAccentColorArgb by mutableLongStateOf(0L); private set
              var elementAnimEnabled by mutableStateOf(false); private set
              var elementAnimMode by mutableIntStateOf(1); private set
              var elementAnimPauseOnPause by mutableStateOf(true); private set
              var isPlaybackPlaying by mutableStateOf(false)
              @Volatile var hasDirectPlayerIsPlaying = false
              var playbackAlertsEnabled by mutableStateOf(true); private set
              var keepShuffleEnabled by mutableStateOf(false); private set
              var shuffleLockedOn by mutableStateOf(false); private set
              var cachedExtensionsText by mutableStateOf(""); private set
              var lyricsBeautifulEnabled by mutableStateOf(false); private set
              var lyricsCustomColorArgb by mutableLongStateOf(0L); private set
              var playerKaraokeBgColorArgb by mutableLongStateOf(0L); private set
              var lyricsFontScale by mutableFloatStateOf(1.0f); private set
              var playerLyricsFontScale by mutableFloatStateOf(1.0f); private set
              var staticAppPrimaryArgb by mutableLongStateOf(0L)

              val extraColorPalette = listOf(
                  "Αυτόματο" to 0L, "Crimson" to 0xFFE53935L, "Coral" to 0xFFFF5722L, "Amber" to 0xFFFF9800L,
                  "Gold" to 0xFFFFC107L, "Lime" to 0xFFAEEA00L, "Emerald" to 0xFF00C853L, "Mint" to 0xFF00BFA5L,
                  "Cyan" to 0xFF00BCD4L, "Sky" to 0xFF29B6F6L, "Royal" to 0xFF2979FFL, "Indigo" to 0xFF3F51B5L,
                  "Violet" to 0xFF7C4DFFL, "Lavender" to 0xFFB388FFL, "Magenta" to 0xFFE040FBL, "Rose" to 0xFFFF4081L,
                  "Peach" to 0xFFFFAB91L, "Silver" to 0xFFCFD8DCL
              )

              fun resolveAppContext(): Context? {
                  appCtx?.let { return it }
                  return runCatching {
                      val app = Class.forName("android.app.ActivityThread")
                          .getMethod("currentApplication")
                          .invoke(null) as? Context
                      val ac = app?.applicationContext
                      if (ac != null) appCtx = ac
                      ac
                  }.getOrNull()
              }

              private fun prefs(c: Context): SharedPreferences {
                  val ac = c.applicationContext ?: c
                  if (appCtx == null) appCtx = ac
                  return ac.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
              }

              private fun loadFromPrefs(sp: SharedPreferences) {
                  targetFps = sp.getInt(KEY_TARGET_FPS, 0)
                  lyricsImmersiveEnabled = sp.getBoolean(KEY_LYRICS_IMMERSIVE, true)
                  customAccentColorArgb = sp.getLong(KEY_CUSTOM_COLOR, 0L)
                  elementAnimEnabled = sp.getBoolean(KEY_ANIM_ENABLED, false)
                  elementAnimMode = sp.getInt(KEY_ANIM_MODE, 1).coerceIn(1, 3)
                  elementAnimPauseOnPause = sp.getBoolean(KEY_ANIM_PAUSE_ON_PAUSE, true)
                  playbackAlertsEnabled = sp.getBoolean(KEY_PLAYBACK_ALERTS, true)
                  val keep = sp.getBoolean(KEY_KEEP_SHUFFLE, false)
                  val locked = keep && sp.getBoolean(KEY_SHUFFLE_LOCKED_ON, false)
                  keepShuffleEnabled = keep
                  shuffleLockedOn = locked
                  VnShuffleGuard.syncFromPrefs(locked)
                  cachedExtensionsText = sp.getString(KEY_LAST_BACKUP_EXTENSIONS, "").orEmpty()
                  lyricsCustomColorArgb = sp.getLong(KEY_LYRICS_COLOR, 0L)
                  lyricsBeautifulEnabled = sp.getBoolean(KEY_LYRICS_BEAUTIFUL, false) || (lyricsCustomColorArgb != 0L)
                  playerKaraokeBgColorArgb = sp.getLong(KEY_PLAYER_KARAOKE_BG_COLOR, 0L)
                  lyricsFontScale = sp.getFloat(KEY_LYRICS_FONT_SCALE, 1.0f).coerceIn(0.70f, 1.70f)
                  playerLyricsFontScale = sp.getFloat(KEY_PLAYER_LYRICS_FONT_SCALE, 1.0f).coerceIn(0.60f, 1.60f)
              }

              fun ensureInit(c: Context) {
                  val sp = prefs(c)
                  if (!initialized) {
                      synchronized(this) {
                          if (!initialized) {
                              loadFromPrefs(sp)
                              val listener = SharedPreferences.OnSharedPreferenceChangeListener { shared, _ ->
                                  loadFromPrefs(shared)
                              }
                              prefListener = listener
                              sp.registerOnSharedPreferenceChangeListener(listener)
                              initialized = true
                          }
                      }
                  }
              }

              fun init(c: Context) {
                  ensureInit(c)
                  loadFromPrefs(prefs(c))
              }

              fun reportPlayerIsPlaying(playing: Boolean) {
                  hasDirectPlayerIsPlaying = true
                  if (isPlaybackPlaying != playing) {
                      isPlaybackPlaying = playing
                  }
              }

              fun update(c: Context, fps: Int) { targetFps = fps; prefs(c).edit().putInt(KEY_TARGET_FPS, fps).apply(); c.findActivity()?.let { applyWindowFrameRate(it, fps, true) } }
              fun updateLyricsImmersive(c: Context, en: Boolean) { lyricsImmersiveEnabled = en; prefs(c).edit().putBoolean(KEY_LYRICS_IMMERSIVE, en).apply() }
              fun updateCustomColor(c: Context, argb: Long) { customAccentColorArgb = argb; prefs(c).edit().putLong(KEY_CUSTOM_COLOR, argb).apply() }
              fun updateElementAnim(c: Context, en: Boolean, mode: Int = elementAnimMode) {
                  val m = mode.coerceIn(1, 3); elementAnimEnabled = en; elementAnimMode = m
                  prefs(c).edit().putBoolean(KEY_ANIM_ENABLED, en).putInt(KEY_ANIM_MODE, m).apply()
              }
              fun updateElementAnimPauseOnPause(c: Context, pause: Boolean) {
                  elementAnimPauseOnPause = pause
                  prefs(c).edit().putBoolean(KEY_ANIM_PAUSE_ON_PAUSE, pause).apply()
              }
              fun updatePlaybackAlerts(c: Context, en: Boolean) { playbackAlertsEnabled = en; prefs(c).edit().putBoolean(KEY_PLAYBACK_ALERTS, en).apply() }
              fun updateKeepShuffle(c: Context, en: Boolean) {
                  ensureInit(c)
                  keepShuffleEnabled = en
                  val locked = en && VnShuffleGuard.lastObservedShuffleOn
                  shuffleLockedOn = locked
                  prefs(c).edit()
                      .putBoolean(KEY_KEEP_SHUFFLE, en)
                      .putBoolean(KEY_SHUFFLE_LOCKED_ON, locked)
                      .apply()
                  VnShuffleGuard.syncFromPrefs(locked)
              }
              fun saveShuffleLock(c: Context?, locked: Boolean) {
                  shuffleLockedOn = locked
                  (c ?: resolveAppContext())?.let {
                      prefs(it).edit().putBoolean(KEY_SHUFFLE_LOCKED_ON, locked).apply()
                  }
              }
              fun updateLyricsBeautiful(c: Context, en: Boolean) {
                  lyricsBeautifulEnabled = en
                  prefs(c).edit().putBoolean(KEY_LYRICS_BEAUTIFUL, en).apply()
              }
              fun updateLyricsCustomColor(c: Context, argb: Long) {
                  lyricsCustomColorArgb = argb
                  if (argb != 0L) lyricsBeautifulEnabled = true
                  prefs(c).edit()
                      .putLong(KEY_LYRICS_COLOR, argb)
                      .putBoolean(KEY_LYRICS_BEAUTIFUL, lyricsBeautifulEnabled)
                      .apply()
              }
              fun updatePlayerKaraokeBgColor(c: Context, argb: Long) {
                  playerKaraokeBgColorArgb = argb
                  prefs(c).edit().putLong(KEY_PLAYER_KARAOKE_BG_COLOR, argb).apply()
              }
              fun updateLyricsFontScale(c: Context, scale: Float) {
                  val s = ((scale * 20f).roundToInt() / 20f).coerceIn(0.70f, 1.70f)
                  lyricsFontScale = s
                  prefs(c).edit().putFloat(KEY_LYRICS_FONT_SCALE, s).apply()
              }
              fun updatePlayerLyricsFontScale(c: Context, scale: Float) {
                  val s = ((scale * 20f).roundToInt() / 20f).coerceIn(0.60f, 1.60f)
                  playerLyricsFontScale = s
                  prefs(c).edit().putFloat(KEY_PLAYER_LYRICS_FONT_SCALE, s).apply()
              }

              fun resetLyricsCache() {
                  savedPlayerLyricText = ""
                  savedPlayerLyricLines = emptyList()
                  savedPlayerActiveLineIndex = -1
              }

              private fun normalizeLyricLine(s: String): String =
                  s.trim().replace(Regex("\\s+"), " ")

              private fun isIgnoredUiToken(norm: String): Boolean {
                  val low = norm.lowercase()
                  if (low.length < 2) return true
                  val generic = setOf(
                      "στίχοι", "lyrics", "no lyrics", "δεν υπάρχουν στίχοι", "...",
                      "εμφάνιση", "αναπαραγωγή", "εφαρμογή", "αυτόματο", "αυτόματη",
                      "auto", "εντάξει"
                  )
                  if (low in generic) return true
                  if (norm.matches(Regex("^\\d{1,2}:\\d{2}(:\\d{2})?$"))) return true
                  if (norm.matches(Regex("^\\d{1,3}%$"))) return true
                  return false
              }

              fun captureLyricLine(rawText: String, isActive: Boolean = true) {
                  val rawLines = rawText.lines()
                      .map { normalizeLyricLine(it) }
                      .filter { !isIgnoredUiToken(it) }
                  if (rawLines.isEmpty()) return

                  if (rawLines.size > 1) {
                      if (savedPlayerLyricLines != rawLines) {
                          savedPlayerLyricLines = rawLines
                      }
                      return
                  }

                  val single = rawLines.first()
                  val current = savedPlayerLyricLines
                  val next = current.toMutableList()
                  if (next.lastOrNull()?.equals(single, ignoreCase = true) != true) {
                      next.add(single)
                      if (next.size > 500) next.removeAt(0)
                      savedPlayerLyricLines = next
                  }

                  if (isActive) {
                      savedPlayerActiveLineIndex = (savedPlayerLyricLines.size - 1).coerceAtLeast(0)
                      if (!savedPlayerLyricText.equals(single, ignoreCase = true)) {
                          savedPlayerLyricText = single
                      }
                  }
              }

              fun openLyricsFullscreen(act: Activity?, onExpand: (() -> Unit)? = null) {
                  lyricsFullscreenOpen = true
                  if (lyricsImmersiveEnabled) setSystemBarsHidden(act, true)
                  runCatching { onExpand?.invoke() }
                  runCatching { onExternalOpenLyrics?.invoke() }
              }

              fun closeLyricsFullscreen(act: Activity?, onCollapse: (() -> Unit)? = null) {
                  lyricsFullscreenOpen = false
                  setSystemBarsHidden(act, false)
                  runCatching { onCollapse?.invoke() }
                  runCatching { onExternalCloseLyrics?.invoke() }
              }

              fun isSwipeToExpandLyricsEnabled(c: Context): Boolean {
                  runCatching {
                      val sp = prefs(c)
                      for ((k, v) in sp.all) {
                          val kl = k.lowercase()
                          if ((kl.contains("swipe") && kl.contains("lyric")) || (kl.contains("expand") && kl.contains("lyric"))) {
                              if (v is Boolean) return v
                          }
                      }
                  }
                  return true
              }

              fun setSystemBarsHidden(act: Activity?, hidden: Boolean) {
                  lyricsBarsHidden = hidden
                  val w = act?.window ?: return
                  WindowCompat.getInsetsController(w, w.decorView).apply {
                      if (hidden) {
                          systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          hide(WindowInsetsCompat.Type.systemBars())
                      } else {
                          show(WindowInsetsCompat.Type.systemBars())
                      }
                  }
              }
              fun toggleSystemBars(act: Activity?) = setSystemBarsHidden(act, !lyricsBarsHidden)

              private val vneraBackupKeys = setOf(
                  KEY_TARGET_FPS,
                  KEY_LYRICS_IMMERSIVE,
                  KEY_CUSTOM_COLOR,
                  KEY_ANIM_ENABLED,
                  KEY_ANIM_MODE,
                  KEY_ANIM_PAUSE_ON_PAUSE,
                  KEY_PLAYBACK_ALERTS,
                  KEY_KEEP_SHUFFLE,
                  KEY_SHUFFLE_LOCKED_ON,
                  KEY_LYRICS_BEAUTIFUL,
                  KEY_LYRICS_COLOR,
                  KEY_PLAYER_KARAOKE_BG_COLOR,
                  KEY_LYRICS_FONT_SCALE,
                  KEY_PLAYER_LYRICS_FONT_SCALE
              )

              private fun isVneraBackupKeyAllowed(key: String): Boolean =
                  key in vneraBackupKeys &&
                  key != KEY_LAST_BACKUP_JSON &&
                  key != KEY_LAST_BACKUP_EXTENSIONS &&
                  key != KEY_RESTORED_EXTENSIONS

              private val junkBackupSubstrings = arrayOf(
                  "vnera_display_prefs", "__vnera_",
                  "androidx.", "com.google.", "firebase", "workmanager",
                  "webview", "chromium", "coil", "okhttp", "exoplayer", "media3",
                  "acra", "leakcanary", "extension", "repositor", "plugin", "addon",
                  "history", "recent", "queue", "current_track", "current_song",
                  "last_track", "last_song", "playback_state", "seek_pos", "resume_pos",
                  "lyrics_cache", "image_cache", "crash_log", "telemetry", "analytics",
                  "cookie", "token", "oauth", "credential", "password", "playlist_tracks",
                  "cached_songs", "downloaded_songs"
              )

              fun isJunkBackupKey(key: String): Boolean {
                  val kl = key.trim().lowercase()
                  if (kl.isEmpty()) return true
                  if (kl == "repo" || kl == "repos" || kl == "cache" || kl == "logs" || kl == "log" || kl == "session") return true
                  for (sub in junkBackupSubstrings) {
                      if (kl.contains(sub)) return true
                  }
                  return false
              }

              private fun pruneBackupJsonInPlace(obj: JSONObject, depth: Int = 0) {
                  val keys = ArrayList<String>(obj.length())
                  val it = obj.keys()
                  while (it.hasNext()) keys.add(it.next())
                  for (k in keys) {
                      if (isJunkBackupKey(k)) {
                          obj.remove(k)
                          continue
                      }
                      val v = obj.opt(k)
                      when {
                          v == null || v === JSONObject.NULL -> obj.remove(k)
                          v is String && v.length > 2048 -> obj.remove(k)
                          v is JSONArray -> {
                              if (v.length() > 120 || depth >= 3) {
                                  obj.remove(k)
                              } else {
                                  for (i in 0 until v.length()) {
                                      val el = v.opt(i)
                                      if (el is JSONObject) pruneBackupJsonInPlace(el, depth + 1)
                                  }
                              }
                          }
                          v is JSONObject -> {
                              if (depth >= 3) {
                                  obj.remove(k)
                              } else {
                                  pruneBackupJsonInPlace(v, depth + 1)
                                  if (v.length() == 0) obj.remove(k)
                              }
                          }
                      }
                  }
              }

              fun exportAllPrefsJson(c: Context): JSONObject = JSONObject().also { all ->
                  val source = prefs(c).all
                  val entries = JSONObject()
                  vneraBackupKeys.forEach { key ->
                      if (!isVneraBackupKeyAllowed(key)) return@forEach
                      when (val v = source[key]) {
                          is Boolean -> entries.put(key, JSONObject().put("t", "b").put("v", v))
                          is Int -> entries.put(key, JSONObject().put("t", "i").put("v", v))
                          is Long -> entries.put(key, JSONObject().put("t", "l").put("v", v))
                          is Float -> entries.put(key, JSONObject().put("t", "f").put("v", v.toDouble()))
                          is String -> entries.put(key, JSONObject().put("t", "s").put("v", v))
                          is Set<*> -> entries.put(key, JSONObject().put("t", "set").put("v", JSONArray().apply {
                              v.filterNotNull().forEach { put(it.toString()) }
                          }))
                      }
                  }
                  if (entries.length() > 0) all.put(PREFS_NAME, entries)
              }

              fun enrichBackupJson(c: Context, jsonStr: String): String = try {
                  val baseObj = JSONObject(jsonStr)
                  pruneBackupJsonInPlace(baseObj)
                  baseObj.put("__vnera_all_prefs__", exportAllPrefsJson(c))
                  baseObj.toString()
              } catch (_: Exception) { jsonStr }

              fun importAndParseBackupJson(c: Context, rawText: String): JSONObject {
                  val root: JSONObject
                  try {
                      root = JSONObject(rawText)
                      val allPrefs = root.optJSONObject("__vnera_all_prefs__")
                      val entries = allPrefs?.optJSONObject(PREFS_NAME)
                      val ed = prefs(c).edit()
                      ed.remove(KEY_LAST_BACKUP_JSON)
                      ed.remove(KEY_LAST_BACKUP_EXTENSIONS)
                      ed.remove(KEY_RESTORED_EXTENSIONS)
                      if (entries != null) {
                          val it = entries.keys()
                          while (it.hasNext()) {
                              val k = it.next()
                              if (!isVneraBackupKeyAllowed(k)) continue
                              val item = entries.optJSONObject(k) ?: continue
                              when (item.optString("t")) {
                                  "b" -> ed.putBoolean(k, item.optBoolean("v"))
                                  "i" -> ed.putInt(k, item.optInt("v"))
                                  "l" -> ed.putLong(k, item.optLong("v"))
                                  "f" -> ed.putFloat(k, item.optDouble("v").toFloat())
                                  "s" -> ed.putString(k, item.optString("v"))
                                  "set" -> item.optJSONArray("v")?.let { arr ->
                                      ed.putStringSet(k, (0 until arr.length()).mapTo(LinkedHashSet()) { arr.optString(it) })
                                  }
                              }
                          }
                      }
                      ed.apply()
                      loadFromPrefs(prefs(c))
                      pruneBackupJsonInPlace(root)
                  } catch (e: Exception) {
                      throw IllegalArgumentException("Backup import failed: ${e.message ?: e.javaClass.simpleName}", e)
                  }
                  c.findActivity()?.let { act ->
                      Handler(Looper.getMainLooper()).postDelayed({
                          if (!act.isFinishing && !act.isDestroyed) act.recreate()
                      }, 750L)
                  }
                  return root
              }

              fun onBackupImported(c: Context, rawText: String): String =
                  importAndParseBackupJson(c, rawText).toString()

              fun recordBackupAndExtractExtensions(c: Context, raw: String) {}

              private val ignoredSettingTokens = setOf(
                  "true", "false", "null", "[]", "{}", "auto", "default", "none", "high", "low", "medium",
                  "lossless", "normal", "enabled", "disabled", "order", "priority", "quality", "shuffle",
                  "repeat", "lyrics", "theme", "color", "fps", "anim", "backup", "cache", "timeout"
              )

              private fun isSystemSettingKey(key: String): Boolean {
                  val kl = key.lowercase()
                  return listOf(
                      "order", "priority", "quality", "audio", "theme", "color", "fps", "anim",
                      "shuffle", "repeat", "lyric", "player", "cache", "alert", "backup", "timeout",
                      "immersive", "swipe", "expand", "scale", "font", "mode", "pause", "equalizer",
                      "volume", "crossfade", "gapless", "normalize", "download", "wifi", "notification"
                  ).any { kl.contains(it) }
              }

              private fun formatExtEntry(name: String, url: String): String {
                  val cleanName = name.trim().trim('"', '\'', '-', ':', '|')
                  val cleanUrl = url.trim().trim('"', '\'')
                  if (cleanName.lowercase() in ignoredSettingTokens && cleanUrl.isEmpty()) return ""
                  if (cleanName.all { it.isDigit() || it == '.' } && cleanUrl.isEmpty()) return ""
                  return when {
                      cleanName.isNotEmpty() && cleanUrl.isNotEmpty() && !cleanName.equals(cleanUrl, true) -> "$cleanName - $cleanUrl"
                      cleanName.isNotEmpty() -> cleanName
                      cleanUrl.isNotEmpty() -> cleanUrl
                      else -> ""
                  }
              }

              private fun isRelevantExtUrl(u: String): Boolean {
                  val ul = u.lowercase()
                  if (!ul.startsWith("http://") && !ul.startsWith("https://")) return false
                  if (ul.contains("vnsec2/vnera") || ul.contains("revera.caruno.wtf")) return false
                  return true
              }

              fun extractExtensionsFromBackup(raw: String): String {
                  val trimmed = raw.trim()
                  if (trimmed.isEmpty()) return ""
                  val entries = LinkedHashMap<String, String>()
                  val urlRegex = Regex("""https?://[^\s"'<>\]\)]+""")

                  fun addEntry(name: String, url: String) {
                      val validUrl = if (isRelevantExtUrl(url)) url else ""
                      val formatted = formatExtEntry(name, validUrl)
                      if (formatted.isBlank()) return
                      val key = (validUrl.ifBlank { name.trim() }).lowercase()
                      val existing = entries[key]
                      if (existing == null || formatted.length > existing.length) {
                          entries[key] = formatted
                      }
                  }

                  fun extractObjectEntry(obj: JSONObject): Boolean {
                      if (obj.has("t") && obj.has("v") && obj.length() <= 3) return false
                      val nameKeys = listOf("extensionName", "pluginName", "addonName", "repoName", "displayName", "name", "title", "label")
                      val urlKeys = listOf("repoUrl", "repositoryUrl", "sourceUrl", "manifestUrl", "jsonUrl", "apkUrl", "downloadUrl", "url", "link", "uri", "href", "homepage", "repo")
                      var foundName = nameKeys.firstNotNullOfOrNull { k ->
                          obj.optString(k, "").trim().takeIf { it.isNotEmpty() && it.lowercase() !in ignoredSettingTokens }
                      }.orEmpty()
                      if (foundName.isEmpty()) {
                          val pkg = obj.optString("packageName", "").ifBlank { obj.optString("pkg", "") }.trim()
                          if (pkg.isNotEmpty() && pkg != "null") foundName = pkg
                      }
                      var foundUrl = urlKeys.firstNotNullOfOrNull { k ->
                          obj.optString(k, "").trim().takeIf { isRelevantExtUrl(it) }
                      }.orEmpty()
                      if (foundUrl.isEmpty()) {
                          foundUrl = urlRegex.find(obj.toString())?.value?.takeIf(::isRelevantExtUrl).orEmpty()
                      }
                      if (foundName.isNotEmpty() || foundUrl.isNotEmpty()) {
                          addEntry(foundName, foundUrl)
                          return true
                      }
                      return false
                  }

                  fun scan(node: Any?, hint: String = "") {
                      val hl = hint.lowercase()
                      if (hl == "__vnera_all_prefs__" || isSystemSettingKey(hl)) return
                      when (node) {
                          is JSONObject -> {
                              val isExtContext = listOf("extension", "addon", "plugin", "repositor", "repo", "installed").any { hl.contains(it) }
                              if (isExtContext && !node.has("t")) extractObjectEntry(node)
                              node.keys().forEach { k ->
                                  val kl = k.lowercase()
                                  if (kl == "__vnera_all_prefs__" || isSystemSettingKey(kl)) return@forEach
                                  val v = node.opt(k)
                                  val childIsExt = isExtContext || listOf("extension", "addon", "plugin", "repositor", "repo").any { kl.contains(it) }
                                  if (childIsExt) {
                                      when (v) {
                                          is JSONArray -> {
                                              for (i in 0 until v.length()) {
                                                  val el = v.opt(i)
                                                  if (el is JSONObject) extractObjectEntry(el)
                                                  else scan(el, k)
                                              }
                                          }
                                          is JSONObject -> {
                                              if (v.has("t") && v.has("v")) {
                                                  if (v.optString("t") in setOf("s", "set")) scan(v.opt("v"), k)
                                              } else if (!extractObjectEntry(v)) {
                                                  scan(v, k)
                                              }
                                          }
                                          is String -> scan(v, k)
                                      }
                                  } else {
                                      scan(v, k)
                                  }
                              }
                          }
                          is JSONArray -> {
                              for (i in 0 until node.length()) {
                                  val el = node.opt(i)
                                  if (el is JSONObject && listOf("extension", "addon", "plugin", "repositor", "repo").any { hl.contains(it) }) {
                                      extractObjectEntry(el)
                                  }
                                  scan(el, hint)
                              }
                          }
                          is String -> {
                              val s = node.trim()
                              if ((s.startsWith("{") || s.startsWith("[")) && s.length > 2) {
                                  runCatching {
                                      if (s.startsWith("{")) scan(JSONObject(s), hint)
                                      else scan(JSONArray(s), hint)
                                  }
                              } else if (listOf("extension", "addon", "plugin", "repositor", "repo").any { hl.contains(it) } && s.isNotEmpty() && s.lowercase() !in ignoredSettingTokens) {
                                  val u = urlRegex.find(s)?.value.orEmpty()
                                  val n = if (u.isNotEmpty()) s.replace(u, "").trim(' ', '-', ':', '|', '"', '\'') else s
                                  addEntry(n, u)
                              }
                          }
                      }
                  }

                  runCatching {
                      if (trimmed.startsWith("{")) scan(JSONObject(trimmed))
                      else if (trimmed.startsWith("[")) scan(JSONArray(trimmed))
                  }
                  if (entries.isEmpty()) {
                      trimmed.lines().forEach { line ->
                          val l = line.trim()
                          if (l.isEmpty() || l.startsWith("{") || l.startsWith("}")) return@forEach
                          val u = urlRegex.find(l)?.value?.takeIf(::isRelevantExtUrl).orEmpty()
                          val n = if (u.isNotEmpty()) l.replace(u, "").trim(' ', '-', ':', '|', '"', '\'') else l
                          if (u.isNotEmpty() || (!l.contains(":") && l.lowercase() !in ignoredSettingTokens)) {
                              addEntry(n, u)
                          }
                      }
                  }
                  return entries.values.joinToString("\n")
              }

              private fun collectInstalledExtensionsOnly(c: Context): LinkedHashSet<String> {
                  val collected = LinkedHashSet<String>()
                  prefs(c).getString(KEY_RESTORED_EXTENSIONS, "").orEmpty().lines().filter { it.isNotBlank() }.forEach(collected::add)
                  cachedExtensionsText.lines().filter { it.isNotBlank() }.forEach(collected::add)
                  return collected
              }

              fun copyExtensionsToClipboard(c: Context) {
                  init(c)
                  val collected = collectInstalledExtensionsOnly(c)
                  val text = collected.joinToString("\n")
                  if (text.isBlank()) {
                      Toast.makeText(c, "Δεν βρέθηκαν extensions για αντιγραφή", Toast.LENGTH_SHORT).show()
                      return
                  }
                  (c.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager).setPrimaryClip(ClipData.newPlainText("VNEra Extensions", text))
                  Toast.makeText(c, "Αντιγράφηκαν ${collected.size} extensions στο πρόχειρο", Toast.LENGTH_SHORT).show()
              }

              fun getClipboardText(c: Context): String = runCatching {
                  val cm = c.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cm.primaryClip?.getItemAt(0)?.coerceToText(c)?.toString().orEmpty()
              }.getOrDefault("")

              fun restoreExtensionsOnly(c: Context, rawInput: String): Int {
                  init(c)
                  val trimmed = rawInput.trim()
                  if (trimmed.isEmpty()) return 0
                  val parsedLines = if (trimmed.startsWith("{") || trimmed.startsWith("[")) {
                      extractExtensionsFromBackup(trimmed).lines().filter { it.isNotBlank() }
                  } else {
                      trimmed.lines().map { it.trim() }.filter { it.isNotEmpty() && it.lowercase() !in ignoredSettingTokens }
                  }
                  if (parsedLines.isEmpty()) return 0

                  val existing = collectInstalledExtensionsOnly(c)
                  existing.addAll(parsedLines)
                  val mergedText = existing.joinToString("\n")
                  cachedExtensionsText = mergedText
                  prefs(c).edit()
                      .putString(KEY_RESTORED_EXTENSIONS, mergedText)
                      .putString(KEY_LAST_BACKUP_EXTENSIONS, mergedText)
                      .apply()

                  return parsedLines.size
              }
          }

