          def split_top_level_args(arg_body: str) -> list[tuple[int, int, str]]:
              parts = []
              dp = db = dc = 0
              in_str = False
              esc = False
              start = 0
              for i, ch in enumerate(arg_body):
                  if in_str:
                      if esc:
                          esc = False
                      elif ch == '\\':
                          esc = True
                      elif ch == '"':
                          in_str = False
                      continue
                  if ch == '"':
                      in_str = True
                      continue
                  if ch == '(': dp += 1
                  elif ch == ')': dp -= 1
                  elif ch == '[': db += 1
                  elif ch == ']': db -= 1
                  elif ch == '{': dc += 1
                  elif ch == '}': dc -= 1
                  elif ch == ',' and dp == 0 and db == 0 and dc == 0:
                      parts.append((start, i, arg_body[start:i]))
                      start = i + 1
              if start <= len(arg_body):
                  parts.append((start, len(arg_body), arg_body[start:]))
              return parts

          def top_level_eq_pos(segment: str) -> int:
              dp = db = dc = 0
              in_str = False
              esc = False
              for i, ch in enumerate(segment):
                  if in_str:
                      if esc:
                          esc = False
                      elif ch == '\\':
                          esc = True
                      elif ch == '"':
                          in_str = False
                      continue
                  if ch == '"':
                      in_str = True
                      continue
                  if ch == '(': dp += 1
                  elif ch == ')': dp -= 1
                  elif ch == '[': db += 1
                  elif ch == ']': db -= 1
                  elif ch == '{': dc += 1
                  elif ch == '}': dc -= 1
                  elif ch == '=' and dp == 0 and db == 0 and dc == 0:
                      prev_c = segment[i - 1] if i > 0 else ''
                      next_c = segment[i + 1] if i + 1 < len(segment) else ''
                      if prev_c not in ('=', '!', '<', '>') and next_c not in ('=', '>'):
                          return i
              return -1

          def patch_lyric_text_call(call_block: str, is_player: bool) -> tuple[str, bool]:
              m_head = re.match(r'^(\s*Text\s*\()', call_block)
              if not m_head:
                  return call_block, False
              close_paren = call_block.rfind(')')
              if close_paren <= m_head.end():
                  return call_block, False

              head = call_block[:m_head.end()]
              body = call_block[m_head.end():close_paren]
              tail = call_block[close_paren:]
              is_player_lit = "true" if is_player else "false"

              args = split_top_level_args(body)
              if not args:
                  return call_block, False

              has_color = False
              modified = False
              rebuilt_segments = []

              for idx_a, (_, _, seg) in enumerate(args):
                  stripped = seg.strip()
                  if not stripped:
                      rebuilt_segments.append(seg)
                      continue
                  lead_ws = seg[:len(seg) - len(seg.lstrip())]
                  trail_ws = seg[len(seg.rstrip()):]
                  eq = top_level_eq_pos(stripped)
                  if eq != -1:
                      pname = stripped[:eq].strip()
                      pval = stripped[eq + 1:].strip()
                      if pname == "text":
                          if not pval.startswith('"') and "vnCaptureAndStyleLyric" not in pval and "vnStyleLyricAnnotatedString" not in pval and "vnCaptureLyricText" not in pval:
                              pval = f"com.music.spotui.ui.screens.vnCaptureAndStyleLyric({pval}, isPlayer = {is_player_lit})"
                              modified = True
                          rebuilt_segments.append(f"{lead_ws}{pname} = {pval}{trail_ws}")
                      elif pname == "color":
                          has_color = True
                          if "vnPlayerInlineLyricColor" not in pval:
                              pval = f"com.music.spotui.ui.screens.vnPlayerInlineLyricColor({pval}, isPlayer = {is_player_lit})"
                              modified = True
                          rebuilt_segments.append(f"{lead_ws}{pname} = {pval}{trail_ws}")
                      elif pname == "style":
                          if "vnPlayerInlineLyricStyle" not in pval:
                              pval = f"com.music.spotui.ui.screens.vnPlayerInlineLyricStyle({pval}, isPlayer = {is_player_lit})"
                              modified = True
                          rebuilt_segments.append(f"{lead_ws}{pname} = {pval}{trail_ws}")
                      else:
                          rebuilt_segments.append(seg)
                  else:
                      if idx_a == 0 and not stripped.startswith('"') and "vnCaptureAndStyleLyric" not in stripped and "vnStyleLyricAnnotatedString" not in stripped and "vnCaptureLyricText" not in stripped:
                          pval = f"com.music.spotui.ui.screens.vnCaptureAndStyleLyric({stripped}, isPlayer = {is_player_lit})"
                          modified = True
                          rebuilt_segments.append(f"{lead_ws}{pval}{trail_ws}")
                      else:
                          rebuilt_segments.append(seg)

              new_body = ",".join(rebuilt_segments)
              if not has_color:
                  color_arg = f"color = com.music.spotui.ui.screens.vnPlayerInlineLyricColor(androidx.compose.material3.LocalContentColor.current, isPlayer = {is_player_lit})"
                  if new_body.strip():
                      m_trail = re.search(r'(,\s*)$', new_body)
                      if m_trail:
                          ws_after_comma = m_trail.group(1)[1:]
                          prefix = new_body[:m_trail.start()]
                          sep = ws_after_comma if "\n" in ws_after_comma else " "
                          new_body = f"{prefix},{sep}{color_arg}{ws_after_comma}"
                      else:
                          new_body = new_body.rstrip() + f", {color_arg}"
                  else:
                      new_body = color_arg
                  modified = True

              if not modified:
                  return call_block, False
              return f"{head}{new_body}{tail}", True

          def wrap_player_controls_lyric_block(src: str) -> str:
              if "VnPlayerOnlyLyricScope" in src:
                  return src
              lines = src.splitlines(keepends=True)

              for idx, line in enumerate(lines):
                  if re.search(r'(?:ChevronRight|KeyboardArrowRight|ArrowForwardIos|">"|"›")', line):
                      win_start = max(0, idx - 36)
                      win_end = min(len(lines), idx + 12)
                      win_txt = "".join(lines[win_start:win_end])
                      if re.search(r'\blyric', win_txt, re.IGNORECASE) and not re.search(r'FormatQuote|lyrics_button|openLyrics|Settings', win_txt, re.IGNORECASE):
                          for back in range(idx, max(-1, idx - 42), -1):
                              if re.search(r'\b(?:Row|Surface|Box|Column)\s*\(', lines[back]):
                                  p_cnt = 0
                                  open_l = None
                                  for j in range(back, min(len(lines), back + 16)):
                                      s_no_c = strip_line_strings_and_comments(lines[j])
                                      p_cnt += s_no_c.count("(") - s_no_c.count(")")
                                      if p_cnt <= 0 and "{" in s_no_c:
