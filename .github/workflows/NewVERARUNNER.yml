          }

          fun vnResolveSelectedLyricColor(): Color {
              val customArgb = VnFpsPref.lyricsCustomColorArgb
              val accentArgb = VnFpsPref.customAccentColorArgb
              val argb = when {
                  customArgb != 0L -> customArgb
                  accentArgb != 0L -> accentArgb
                  VnFpsPref.staticAppPrimaryArgb != 0L -> VnFpsPref.staticAppPrimaryArgb
                  else -> 0xFF7C4DFFL
              }
              return Color(argb)
          }

          fun vnHasCustomLyricColorEnabled(): Boolean =
              VnFpsPref.lyricsBeautifulEnabled || VnFpsPref.lyricsCustomColorArgb != 0L

          @Composable
          fun vnPlayerInlineLyricColor(original: Color, isPlayer: Boolean = true): Color {
              val effectivePlayer = isPlayer || LocalVnIsPlayerInlineLyric.current
              val hasCustomBg = effectivePlayer && VnFpsPref.playerKaraokeBgColorArgb != 0L
              val hasCustomActive = vnHasCustomLyricColorEnabled()
              if (!hasCustomBg && !hasCustomActive) return original

              val chosen = vnResolveSelectedLyricColor()
              val isDimBackground = original.isSpecified && original.alpha > 0.01f && original.alpha < 0.78f
              if (isDimBackground) {
                  return if (hasCustomBg) {
                      Color(VnFpsPref.playerKaraokeBgColorArgb).copy(alpha = 0.78f)
                  } else {
                      chosen.copy(alpha = 0.42f)
                  }
              }
              if (!hasCustomActive) return original
              val animatedActiveColor by animateColorAsState(
                  targetValue = chosen.copy(alpha = 1.0f),
                  animationSpec = tween(durationMillis = 260, easing = FastOutSlowInEasing),
                  label = "vn_karaoke_active_color"
              )
              return animatedActiveColor
          }

          @Composable
          fun vnPlayerInlineLyricStyle(style: TextStyle, isPlayer: Boolean = true): TextStyle {
              val effectivePlayer = isPlayer || LocalVnIsPlayerInlineLyric.current
              val hasCustomBg = effectivePlayer && VnFpsPref.playerKaraokeBgColorArgb != 0L
              val hasCustomActive = vnHasCustomLyricColorEnabled()
              if (!hasCustomBg && !hasCustomActive) return style

              var updated = style
              if (style.color.isSpecified) {
                  updated = updated.copy(color = vnPlayerInlineLyricColor(style.color, isPlayer = effectivePlayer))
              }
              if (style.brush != null && hasCustomActive) {
                  val activeChosen = vnResolveSelectedLyricColor().copy(alpha = 1.0f)
                  val bgTint = if (hasCustomBg) {
                      Color(VnFpsPref.playerKaraokeBgColorArgb).copy(alpha = 0.78f)
                  } else {
                      activeChosen.copy(alpha = 0.42f)
                  }
                  updated = updated.copy(brush = Brush.horizontalGradient(listOf(activeChosen, bgTint)))
              }
              return updated
          }

          @Composable
          fun vnStyleLyricAnnotatedString(raw: AnnotatedString, isPlayer: Boolean = true): AnnotatedString {
              val effectivePlayer = isPlayer || LocalVnIsPlayerInlineLyric.current
              val hasColorSpans = raw.spanStyles.any { it.item.color.isSpecified }
              val isLineActive = !hasColorSpans || raw.spanStyles.any { it.item.color.isSpecified && it.item.color.alpha >= 0.78f }
              VnFpsPref.captureLyricLine(raw.text, isActive = isLineActive)

              val hasCustomBg = effectivePlayer && VnFpsPref.playerKaraokeBgColorArgb != 0L
              val hasCustomActive = vnHasCustomLyricColorEnabled()
              if (!hasCustomBg && !hasCustomActive) return raw
              if (raw.spanStyles.isEmpty()) return raw

              val activeChosen = vnResolveSelectedLyricColor().copy(alpha = 1.0f)
              val bgTint = if (hasCustomBg) {
                  Color(VnFpsPref.playerKaraokeBgColorArgb).copy(alpha = 0.78f)
              } else {
                  activeChosen.copy(alpha = 0.42f)
              }

              return buildAnnotatedString {
                  append(raw.text)
                  raw.paragraphStyles.forEach { addStyle(it.item, it.start, it.end) }
                  raw.spanStyles.forEach { range ->
                      val span = range.item
                      val c = span.color
                      var styledSpan = span
                      if (span.brush != null && hasCustomActive) {
                          styledSpan = styledSpan.copy(
                              brush = Brush.horizontalGradient(listOf(activeChosen, bgTint))
                          )
                      } else if (c.isSpecified && c.alpha > 0.01f) {
                          val newColor = if (c.alpha < 0.78f) {
                              if (hasCustomBg || hasCustomActive) bgTint else c
                          } else {
                              if (hasCustomActive) activeChosen else c
                          }
                          styledSpan = styledSpan.copy(color = newColor)
                      }
                      addStyle(styledSpan, range.start, range.end)
                  }
              }
          }

