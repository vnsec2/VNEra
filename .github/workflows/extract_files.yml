name: Migrate VNEra (1.0.7 -> 1.0.9 -> vnera-2.3.1)

on:
  workflow_dispatch:
    inputs:
      clean_109_branch:
        description: "Το ακριβές όνομα του υπάρχοντος clean 1.0.9 branch σου"
        required: false
        default: "work/revera-1.0.9-clean"
  push:
    branches:
      - main
    paths:
      - "Revera-v1.0.7.zip"
      - "main/Revera-v1.0.7.zip"

permissions:
  contents: write

jobs:
  extract-compare-and-port:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main (ZIP source & vnpatches target)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _main_repo
          fetch-depth: 1

      - name: Checkout work/source-review (VNEra changes)
        uses: actions/checkout@v4
        with:
          ref: work/source-review
          path: _vnera_repo
          fetch-depth: 0

      - name: Checkout Existing Clean 1.0.9 Branch
        env:
          INPUT_109_BRANCH: ${{ github.event.inputs.clean_109_branch || 'work/revera-1.0.9-clean' }}
        run: |
          set -euo pipefail
          REMOTE_URL=$(git -C "$GITHUB_WORKSPACE/_main_repo" remote get-url origin)
          AUTH_HEADER=$(git -C "$GITHUB_WORKSPACE/_main_repo" config --get http.https://github.com/.extraheader || true)

          RESOLVED_109_BRANCH=""
          for cand in "$INPUT_109_BRANCH" "work/revera-1.0.9-clean" "revera-1.0.9-clean" "revera1.0.9clean" "revera-1.0.9" "1.0.9-clean"; do
            [ -n "$cand" ] || continue
            if git -c http.extraheader="$AUTH_HEADER" ls-remote --heads "$REMOTE_URL" "refs/heads/$cand" | grep -q "refs/heads/$cand$"; then
              RESOLVED_109_BRANCH="$cand"
              break
            fi
          done

          if [ -z "$RESOLVED_109_BRANCH" ]; then
            echo "ERROR: Δεν βρέθηκε το clean 1.0.9 branch ($INPUT_109_BRANCH). Διαθέσιμα branches:"
            git -c http.extraheader="$AUTH_HEADER" ls-remote --heads "$REMOTE_URL" | awk '{print " - " $2}' | sed 's|refs/heads/||'
            exit 1
          fi

          echo "Using existing clean 1.0.9 branch: $RESOLVED_109_BRANCH"
          echo "RESOLVED_109_BRANCH=$RESOLVED_109_BRANCH" >> "$GITHUB_ENV"

          rm -rf "$GITHUB_WORKSPACE/_clean_109_repo"
          git -c http.extraheader="$AUTH_HEADER" clone --depth 1 --branch "$RESOLVED_109_BRANCH" "$REMOTE_URL" "$GITHUB_WORKSPACE/_clean_109_repo"

      - name: Extract Revera 1.0.7 & Build work/revera-1.0.7-clean
        run: |
          set -euo pipefail
          python3 <<'PY'
          import shutil, zipfile
          from pathlib import Path

          main_dir = Path("_main_repo")
          zip_candidates = [
              main_dir / "Revera-v1.0.7.zip",
              main_dir / "main" / "Revera-v1.0.7.zip",
          ]
          zip_path = next((p for p in zip_candidates if p.is_file()), None)
          if zip_path is None:
              raise SystemExit("ERROR: Δεν βρέθηκε το Revera-v1.0.7.zip στο branch main.")

          extract_raw = Path("/tmp/revera_107_raw")
          clean_root = Path("/tmp/revera_107_clean_tree")
          shutil.rmtree(extract_raw, ignore_errors=True)
          shutil.rmtree(clean_root, ignore_errors=True)
          extract_raw.mkdir(parents=True)
          clean_root.mkdir(parents=True)

          with zipfile.ZipFile(zip_path, "r") as zf:
              zf.extractall(extract_raw)

          for junk in list(extract_raw.rglob("__MACOSX")) + list(extract_raw.rglob(".DS_Store")):
              if junk.is_dir():
                  shutil.rmtree(junk, ignore_errors=True)
              else:
                  junk.unlink(missing_ok=True)

          marker_files = ("settings.gradle.kts", "settings.gradle", "build.gradle.kts", "build.gradle")
          project_root = None
          for depth in range(0, 4):
              for p in sorted(extract_raw.rglob("*")):
                  if p.is_file() and p.name in marker_files and len(p.relative_to(extract_raw).parts) == depth + 1:
                      project_root = p.parent
                      break
              if project_root is not None:
                  break

          if project_root is None:
              entries = [e for e in extract_raw.iterdir()]
              project_root = entries[0] if len(entries) == 1 and entries[0].is_dir() else extract_raw

          for item in project_root.iterdir():
              if item.name in (".git", ".github"):
                  continue
              dest = clean_root / item.name
              if item.is_dir():
                  shutil.copytree(item, dest, symlinks=True)
              else:
                  shutil.copy2(item, dest)
          PY

          rm -rf /tmp/git_clean_107
          mkdir -p /tmp/git_clean_107
          cd /tmp/git_clean_107
          git init -b work/revera-1.0.7-clean
          git config user.name "VNEra Migration Bot"
          git config user.email "bot@vnera.local"

          cp -a /tmp/revera_107_clean_tree/. .
          git add -A
          git commit -q -m "Clean Revera 1.0.7 base (extracted from main/Revera-v1.0.7.zip)"

          REMOTE_URL=$(git -C "$GITHUB_WORKSPACE/_main_repo" remote get-url origin)
          AUTH_HEADER=$(git -C "$GITHUB_WORKSPACE/_main_repo" config --get http.https://github.com/.extraheader || true)
          git remote add origin "$REMOTE_URL"
          git -c http.extraheader="$AUTH_HEADER" push --force origin work/revera-1.0.7-clean

      - name: Build vnpatches.patch & 3-Way Port onto 1.0.9 (vnera-2.3.1)
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, shutil, subprocess
          from pathlib import Path

          ws = Path(os.environ["GITHUB_WORKSPACE"])
          clean_107 = Path("/tmp/revera_107_clean_tree")
          clean_109 = ws / "_clean_109_repo"
          vnera_src = ws / "_vnera_repo"
          work_repo = Path("/tmp/vnera_3way_merge")
          patch_out = Path("/tmp/vnpatches.patch")
          report_path = Path("/tmp/vnera-2.3.1-migration-report.md")

          shutil.rmtree(work_repo, ignore_errors=True)
          work_repo.mkdir(parents=True)

          def git(*args, check=True, capture=False):
              return subprocess.run(
                  ["git", *args],
                  cwd=work_repo,
                  check=check,
                  text=True,
                  capture_output=capture,
              )

          def replace_tree(src_dir: Path, skip_github: bool = True):
              for child in list(work_repo.iterdir()):
                  if child.name == ".git":
                      continue
                  if child.is_dir():
                      shutil.rmtree(child)
                  else:
                      child.unlink()
              for item in src_dir.iterdir():
                  if item.name == ".git":
                      continue
                  if skip_github and item.name == ".github":
                      continue
                  dest = work_repo / item.name
                  if item.is_dir():
                      shutil.copytree(item, dest, symlinks=True)
                  else:
                      shutil.copy2(item, dest)

          # 1. Κοινός πρόγονος: καθαρό 1.0.7
          git("init", "-b", "base-1.0.7")
          git("config", "user.name", "VNEra Migration Bot")
          git("config", "user.email", "bot@vnera.local")
          git("config", "merge.renames", "true")
          git("config", "diff.renames", "true")
          replace_tree(clean_107, skip_github=True)
          git("add", "-A")
          git("commit", "-q", "-m", "Base: Revera 1.0.7 clean")

          # 2. Οι δικές σου αλλαγές πάνω στο 1.0.7
          git("checkout", "-q", "-b", "vnera-source", "base-1.0.7")
          replace_tree(vnera_src, skip_github=True)
          git("add", "-A")
          git("commit", "-q", "-m", "VNEra changes from work/source-review")

          # Εξαγωγή του standalone patch αρχείου (vnpatches.patch) με ΜΟΝΟ τις αλλαγές σου
          patch_raw = subprocess.run(
              ["git", "diff", "--binary", "--full-index", "-M", "base-1.0.7", "vnera-source"],
              cwd=work_repo,
              check=True,
              capture_output=True,
          ).stdout
          patch_out.write_bytes(patch_raw)

          # 3. Το υπάρχον clean Revera 1.0.9 branch σου
          git("checkout", "-q", "-b", "clean-1.0.9", "base-1.0.7")
          replace_tree(clean_109, skip_github=True)
          git("add", "-A")
          git("commit", "-q", "-m", f"Upstream: {os.environ.get('RESOLVED_109_BRANCH', 'clean 1.0.9')}")

          # 4. Τελικό branch vnera-2.3.1 = clean-1.0.9 + 3-way merge(vnera-source)
          git("checkout", "-q", "-b", "vnera-2.3.1", "clean-1.0.9")
          if (vnera_src / ".github").is_dir():
              shutil.copytree(vnera_src / ".github", work_repo / ".github", symlinks=True, dirs_exist_ok=True)
              git("add", "-A")
              git("commit", "--allow-empty", "-q", "-m", "Keep VNEra workflows")

          git("merge", "--no-commit", "--no-ff", "vnera-source", check=False, capture=True)

          unmerged = [
              line.strip()
              for line in git("diff", "--name-only", "--diff-filter=U", capture=True).stdout.splitlines()
              if line.strip()
          ]
          status_lines = git("status", "--porcelain", capture=True).stdout.splitlines()
          status_map = {line[3:]: line[:2] for line in status_lines if len(line) > 3}

          resolved_overlaps = []
          overlap_details = []

          for rel_path in unmerged:
              code = status_map.get(rel_path, "UU")
              full_path = work_repo / rel_path

              if code == "UD":
                  git("rm", "-f", "--", rel_path)
                  resolved_overlaps.append(f"- `{rel_path}` (`UD`): Διαγράφηκε όπως στο VNEra.")
                  continue
              if code == "DU":
                  git("checkout", "--theirs", "--", rel_path)
                  git("add", "--", rel_path)
                  resolved_overlaps.append(f"- `{rel_path}` (`DU`): Διατηρήθηκε από το VNEra.")
                  continue
              if not full_path.exists():
                  continue

              raw_bytes = full_path.read_bytes()
              try:
                  text = raw_bytes.decode("utf-8")
              except UnicodeDecodeError:
                  git("checkout", "--theirs", "--", rel_path)
                  git("add", "--", rel_path)
                  resolved_overlaps.append(f"- `{rel_path}` (binary): Επιλέχθηκε η έκδοση VNEra.")
                  continue

              out_lines = []
              lines = text.splitlines(keepends=True)
              i = 0
              hunk_count = 0
              while i < len(lines):
                  if lines[i].startswith("<<<<<<< "):
                      hunk_count += 1
                      start_ln = i + 1
                      i += 1
                      ours_buf = []
                      theirs_buf = []
                      in_theirs = False
                      while i < len(lines) and not lines[i].startswith(">>>>>>> "):
                          if lines[i].startswith("======="):
                              in_theirs = True
                          elif not in_theirs:
                              ours_buf.append(lines[i])
                          else:
                              theirs_buf.append(lines[i])
                          i += 1
                      i += 1
                      out_lines.extend(theirs_buf)
                      resolved_overlaps.append(
                          f"- `{rel_path}` (γραμμή ~{start_ln}, hunk #{hunk_count})"
                      )
                      overlap_details.append(
                          f"### `{rel_path}` (γραμμή ~{start_ln}, hunk #{hunk_count})\n"
                          f"**Τι είχε το Revera 1.0.9:**\n```kotlin\n{''.join(ours_buf).rstrip()}\n```\n"
                          f"**Τι μπήκε από το VNEra:**\n```kotlin\n{''.join(theirs_buf).rstrip()}\n```\n"
                      )
                  else:
                      out_lines.append(lines[i])
                      i += 1

              full_path.write_text("".join(out_lines), encoding="utf-8")
              git("add", "--", rel_path)

          leftover = git("grep", "-n", "^<<<<<<< ", check=False, capture=True).stdout.strip()
          if leftover:
              raise SystemExit(f"ERROR: Εντοπίστηκαν conflict markers:\n{leftover}")

          git("commit", "-q", "-m", "Port VNEra changes from 1.0.7 onto clean Revera 1.0.9 (vnera-2.3.1)")

          # Επαλήθευση και των δύο πλευρών
          vnera_changed_files = set(
              git("diff", "--name-only", "base-1.0.7", "vnera-source", capture=True).stdout.splitlines()
          )
          upstream_109_changed_files = set(
              git("diff", "--name-only", "base-1.0.7", "clean-1.0.9", capture=True).stdout.splitlines()
          )
          only_109_files = sorted(upstream_109_changed_files - vnera_changed_files)
          only_vnera_files = sorted(vnera_changed_files - upstream_109_changed_files)
          both_touched_files = sorted(upstream_109_changed_files & vnera_changed_files)

          mismatched_109 = [
              f for f in only_109_files
              if git("diff", "--name-only", "clean-1.0.9", "vnera-2.3.1", "--", f, capture=True).stdout.strip()
          ]
          mismatched_vnera = [
              f for f in only_vnera_files
              if git("diff", "--name-only", "vnera-source", "vnera-2.3.1", "--", f, capture=True).stdout.strip()
          ]

          if mismatched_109 or mismatched_vnera:
              raise SystemExit(f"VERIFICATION FAILED! 1.0.9 mismatches: {mismatched_109}, VNEra mismatches: {mismatched_vnera}")

          report_lines = [
              "# Επαλήθευση Μεταφοράς `vnera-2.3.1` & `vnpatches.patch`",
              "",
              f"- **Βάση 1.0.9 που χρησιμοποιήθηκε:** `{os.environ.get('RESOLVED_109_BRANCH')}` (έμεινε ανέπαφη)",
              f"- **Αρχείο patch στο `main`:** `vnpatches.patch` ({patch_out.stat().st_size} bytes, {len(vnera_changed_files)} τροποποιημένα/νέα αρχεία)",
              f"- **Αρχεία που άλλαξε μόνο το Revera 1.0.9 (100% διατηρημένα):** `{len(only_109_files)}` (αστοχίες: `0`)",
              f"- **Αρχεία που άλλαξε μόνο το VNEra (100% μεταφερμένα):** `{len(only_vnera_files)}` (αστοχίες: `0`)",
              f"- **Αρχεία που τροποποιήθηκαν ΚΑΙ από τους δύο (συγχωνευμένα):** `{len(both_touched_files)}`",
              f"- **Επικαλυπτόμενα hunks στις ίδιες γραμμές:** `{len(resolved_overlaps)}`",
              "",
              "## Αρχεία που τροποποιήθηκαν ΚΑΙ από το 1.0.9 ΚΑΙ από το VNEra",
              "```text",
              *(both_touched_files or ["(Κανένα)"]),
              "```",
              "",
              "## Λεπτομέρειες Επικαλυπτόμενων Γραμμών (Side-by-Side)",
          ]
          if overlap_details:
              report_lines.extend(overlap_details)
          else:
              report_lines.append("- Κανένα! Δεν υπήρξε καμία σύγκρουση γραμμών ανάμεσα στο `1.0.9` και στο `VNEra`.")

          report_text = "\n".join(report_lines) + "\n"
          report_path.write_text(report_text, encoding="utf-8")

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_file:
              with open(summary_file, "a", encoding="utf-8") as sf:
                  sf.write(report_text)
          PY

      - name: Save vnpatches.patch to main (Without touching any other files)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/_main_repo"
          git config user.name "VNEra Migration Bot"
          git config user.email "bot@vnera.local"

          cp -f /tmp/vnpatches.patch ./vnpatches.patch
          git add vnpatches.patch

          if ! git diff --cached --quiet; then
            git commit -m "Update vnpatches.patch with VNEra custom changes"
            AUTH_HEADER=$(git config --get http.https://github.com/.extraheader || true)
            git -c http.extraheader="$AUTH_HEADER" pull --rebase origin main
            git -c http.extraheader="$AUTH_HEADER" push origin HEAD:main
            echo "Committed and pushed vnpatches.patch to main."
          else
            echo "vnpatches.patch in main is already up to date."
          fi

      - name: Push vnera-2.3.1 (Keeping other branches intact)
        run: |
          set -euo pipefail
          TARGET_BRANCH="vnera-2.3.1"
          if [ "$TARGET_BRANCH" = "main" ] || [ "$TARGET_BRANCH" = "master" ] || [ "$TARGET_BRANCH" = "work/source-review" ] || [ "$TARGET_BRANCH" = "$RESOLVED_109_BRANCH" ]; then
            echo "ERROR: Απαγορεύεται η εγγραφή σε προστατευμένο branch ($TARGET_BRANCH)."
            exit 1
          fi

          cd /tmp/vnera_3way_merge
          REMOTE_URL=$(git -C "$GITHUB_WORKSPACE/_main_repo" remote get-url origin)
          AUTH_HEADER=$(git -C "$GITHUB_WORKSPACE/_main_repo" config --get http.https://github.com/.extraheader || true)
          git remote add origin "$REMOTE_URL"
          git -c http.extraheader="$AUTH_HEADER" push --force origin "vnera-2.3.1:refs/heads/$TARGET_BRANCH"

      - name: Upload vnpatches.patch & Verification Report
        uses: actions/upload-artifact@v4
        with:
          name: vnera-2.3.1-patches-and-report
          path: |
            /tmp/vnpatches.patch
            /tmp/vnera-2.3.1-migration-report.md
          retention-days: 30
