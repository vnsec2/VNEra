          def ensure_imports(src: str, imports: list[str]) -> str:
              missing = [imp for imp in imports if imp not in src]
              if not missing:
                  return src
              block = "\n".join(f"import {imp}" for imp in missing)
              return re.sub(r'(?m)^(package\s+[^\r\n]+)', rf'\1\n{block}', src, count=1)

          def strip_line_strings_and_comments(line: str) -> str:
              s = re.sub(r'"(?:\\.|[^"\\])*"', '""', line)
              s = re.sub(r"'(?:\\.|[^'\\])'", "''", s)
              return s.split("//")[0]

          def hook_lazy_cols(src, register_fn="VnRegisterLyricsScrollState"):
              if register_fn in src: return src
              lines, out, i = src.splitlines(keepends=True), [], 0
              while i < len(lines):
                  m = re.match(r'^(\s*)LazyColumn\s*\(', lines[i])
                  if m:
                      clean_l = strip_line_strings_and_comments(lines[i])
                      block, paren = [lines[i]], clean_l.count("(") - clean_l.count(")")
                      while paren > 0 and i + 1 < len(lines):
                          i += 1
                          block.append(lines[i])
                          cl_next = strip_line_strings_and_comments(lines[i])
                          paren += cl_next.count("(") - cl_next.count(")")
                      ms = re.search(r'\bstate\s*=\s*([A-Za-z0-9_.]+)', "".join(block))
                      if ms: out.append(f"{m.group(1)}com.music.spotui.ui.screens.{register_fn}({ms.group(1)})\n")
