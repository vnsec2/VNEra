                  if any(w in kl for w in ("backup", "export", "import_export", "restore_settings", "export_settings")) or re.search(r'(?:Import\s*/\s*Export|Export settings|Import settings|Backup|Αντίγραφα ασφαλείας|Εξαγωγή ρυθμίσεων|Εισαγωγή ρυθμίσεων)', val, re.I):
                      backup_res_keys.add(k)

          backup_parts = [
              r'\bVnSettingsBackup\b',
              r'"[^"]*(?:Import\s*/\s*Export|Export settings|Import settings|Backup|Αντίγραφα ασφαλείας|Εξαγωγή ρυθμίσεων|Εισαγωγή ρυθμίσεων|Αντίγραφο ασφαλείας)[^"]*"'
          ] + [rf'\bR\.string\.{re.escape(k)}\b' for k in sorted(backup_res_keys)]
          backup_anchor_rx = "|".join(backup_parts)

          all_vnera_cards = [
              "com.music.spotui.ui.screens.VnAppearanceSettingsCard()",
              "com.music.spotui.ui.screens.VnPlaybackSettingsCard()",
              "com.music.spotui.ui.screens.VnLyricsSettingsCard()",
          ]

          LAZY_ITEM_CALLS = {"item", "items", "itemsIndexed", "stickyHeader"}
          INLINE_ITEM_PARENTS = {"Row", "Surface", "Card", "ElevatedCard", "OutlinedCard", "AlertDialog", "DropdownMenu", "Button", "OutlinedButton", "TextButton", "IconButton"}
          WRAPPER_CHILDREN = {"LazyColumn", "LazyRow", "Scaffold", "NavHost", "AnimatedContent", "Crossfade", "HorizontalPager", "VerticalPager"}

          def strip_comments_and_strings(lines: list[str]) -> list[str]:
              clean = []
              in_bc = False
              for raw in lines:
                  s = raw
                  if in_bc:
                      end_bc = s.find("*/")
                      if end_bc == -1:
                          clean.append("")
                          continue
                      s = s[end_bc + 2:]
                      in_bc = False
                  while "/*" in s:
                      st_bc = s.find("/*")
                      en_bc = s.find("*/", st_bc + 2)
                      if en_bc != -1:
                          s = s[:st_bc] + " " + s[en_bc + 2:]
                      else:
                          s = s[:st_bc]
                          in_bc = True
                          break
                  s = re.sub(r'"(?:\\.|[^"\\])*"', '""', s)
                  s = re.sub(r"'(?:\\.|[^'\\])'", "''", s)
                  s = s.split("//")[0]
                  clean.append(s)
              return clean

          def extract_layout_containers(lines: list[str]) -> list[dict]:
              n = len(lines)
              clean = strip_comments_and_strings(lines)
              containers: list[dict] = []

              fun_spans: list[tuple[int, int, str]] = []
              i = 0
              while i < n:
                  m_fun = re.search(r'\bfun\s+(?:<[^>]+>\s*)?(?:[A-Za-z0-9_.]+\.)?([A-Za-z0-9_]+)\s*\(', clean[i])
                  if not m_fun:
                      i += 1
                      continue
                  fun_name = m_fun.group(1)
                  p_depth = 0
                  saw_p = False
                  body_line = None
                  is_expr = False
                  for li in range(i, n):
                      for ch in clean[li]:
                          if not saw_p:
                              if ch == '(':
                                  saw_p = True
                                  p_depth = 1
                              continue
                          if p_depth > 0:
                              if ch == '(': p_depth += 1
                              elif ch == ')': p_depth -= 1
                          else:
                              if ch == '=': is_expr = True; break
                              if ch == '{': body_line = li; break
                      if is_expr or body_line is not None:
                          break
                  if is_expr or body_line is None:
                      i += 1
                      continue
                  b_depth = 0
                  end_line = body_line
                  for li in range(body_line, n):
                      b_depth += clean[li].count('{') - clean[li].count('}')
                      if b_depth <= 0:
                          end_line = li
                          break
                  fun_spans.append((i, end_line, fun_name))
                  i = end_line + 1

              def enclosing_fun(line_idx: int) -> tuple[str, int, int]:
                  best = ("", 0, n - 1)
                  for fs, fe, fn in fun_spans:
                      if fs <= line_idx <= fe:
                          best = (fn, fs, fe)
                  return best

              block_nodes: list[dict] = []
              for start_li in range(n):
                  for m_call in re.finditer(r'(?<![.\w])([A-Z][A-Za-z0-9_]*)\b', clean[start_li]):
                      kind = m_call.group(1)
                      call_col = m_call.end(1)
                      p_depth = 0
                      in_parens = False
                      header_end_li = start_li
                      open_brace_li = None
                      open_brace_col = None

                      for li in range(start_li, min(n, start_li + 30)):
                          s = clean[li]
                          c0 = call_col if li == start_li else 0
                          for ci in range(c0, len(s)):
                              ch = s[ci]
                              if in_parens:
                                  if ch == '(': p_depth += 1
                                  elif ch == ')':
                                      p_depth -= 1
                                      if p_depth == 0:
                                          in_parens = False
                                          header_end_li = li
                                  continue
                              if ch.isspace():
                                  continue
                              if ch == '(' and open_brace_li is None:
                                  in_parens = True
                                  p_depth = 1
                                  continue
                              if ch == '{':
                                  open_brace_li = li
                                  open_brace_col = ci
                                  break
                              open_brace_li = -1
                              break
                          if open_brace_li is not None:
                              break

                      if open_brace_li is None or open_brace_li < 0:
                          continue

                      b_depth = 0
                      close_brace_li = None
                      lazy_items: list[tuple[int, int, str]] = []
                      cur_item_start: int | None = None
                      cur_item_indent: str = ""
                      p_inner = 0
                      last_word = ""
                      last_word_li = open_brace_li

                      for li in range(open_brace_li, n):
                          s = clean[li]
                          c0 = open_brace_col if li == open_brace_li else 0
                          idx_c = c0
                          L = len(s)
                          while idx_c < L:
                              ch = s[idx_c]
                              if ch.isalpha() or ch == '_':
                                  j_c = idx_c + 1
                                  while j_c < L and (s[j_c].isalnum() or s[j_c] == '_'):
                                      j_c += 1
                                  if b_depth == 1 and p_inner == 0:
                                      last_word = s[idx_c:j_c]
                                      last_word_li = li
                                  idx_c = j_c
                                  continue
                              if ch == '(':
                                  if b_depth >= 1:
                                      p_inner += 1
                              elif ch == ')':
                                  if b_depth >= 1:
                                      p_inner = max(0, p_inner - 1)
                              elif ch == '{':
                                  if b_depth == 1 and p_inner == 0 and kind == "LazyColumn" and last_word in LAZY_ITEM_CALLS:
                                      cur_item_start = last_word_li
                                      cur_item_indent = re.match(r'^(\s*)', lines[last_word_li]).group(1)
                                  b_depth += 1
                                  if b_depth == 1:
                                      last_word = ""
                              elif ch == '}':
                                  b_depth -= 1
                                  if b_depth == 1 and cur_item_start is not None:
                                      lazy_items.append((cur_item_start, li, cur_item_indent))
                                      cur_item_start = None
                                  if b_depth == 0:
                                      close_brace_li = li
                                      break
                              idx_c += 1
                          if close_brace_li is not None:
                              break

                      if close_brace_li is None or close_brace_li <= open_brace_li:
                          continue

                      header_txt = "".join(clean[start_li:header_end_li + 1])
                      block_nodes.append({
                          "kind": kind,
                          "start_li": start_li,
                          "header_end_li": header_end_li,
                          "open_li": open_brace_li,
                          "close_li": close_brace_li,
                          "has_vscroll": "verticalScroll" in header_txt,
                          "base_indent": re.match(r'^(\s*)', lines[start_li]).group(1),
                          "lazy_items": lazy_items,
                      })

              for node in block_nodes:
                  if node["kind"] not in ("LazyColumn", "Column"):
                      continue
                  fn_name, fn_s, fn_e = enclosing_fun(node["start_li"])
                  ancestors = [
                      other for other in block_nodes
                      if other is not node
                      and other["start_li"] >= fn_s
                      and other["close_li"] <= fn_e
                      and other["start_li"] <= node["start_li"]
                      and other["close_li"] >= node["close_li"]
                  ]
                  descendants = [
                      other for other in block_nodes
                      if other is not node
                      and other["start_li"] > node["start_li"]
                      and other["close_li"] < node["close_li"]
                  ]
                  if node["kind"] == "Column":
                      if any(a["kind"] in INLINE_ITEM_PARENTS for a in ancestors):
                          continue
                      if any(d["kind"] in WRAPPER_CHILDREN for d in descendants):
                          continue
                  has_scroll_ancestor = any(a["kind"] == "LazyColumn" or a["has_vscroll"] for a in ancestors)
                  node["fun_name"] = fn_name
                  node["has_scroll_ancestor"] = has_scroll_ancestor
                  node["is_scrollable"] = (node["kind"] == "LazyColumn") or node["has_vscroll"] or has_scroll_ancestor
                  containers.append(node)

              return containers

          def insert_all_above_backup(lines: list[str], cont: dict, comp_calls: list[str]) -> list[str]:
              new_lines = list(lines)
              if not comp_calls:
                  return new_lines
              if cont["kind"] == "LazyColumn":
                  items = cont["lazy_items"]
                  if items:
                      target_idx = next(
                          (idx_it for idx_it, (s, e, _) in enumerate(items) if re.search(backup_anchor_rx, "".join(new_lines[s:e+1]), re.I)),
                          None
                      )
                      if target_idx is not None:
                          s_idx, e_idx, item_ind = items[target_idx]
                          if target_idx > 0:
                              ps, pe, pind = items[target_idx - 1]
                              prev_txt = "".join(new_lines[ps:pe+1])
                              if (pe - ps) <= 8 and re.search(r'(?:Backup|Αντίγραφα ασφαλείας|Import\s*/\s*Export|Εφαρμογή|App)', prev_txt, re.I) and not re.search(r'Switch|onClick|Button', prev_txt, re.I):
                                  s_idx, item_ind = ps, pind
                          ins_block = [f"{item_ind}item {{ {call} }}\n" for call in comp_calls]
                          new_lines[s_idx:s_idx] = ins_block
                          return new_lines
                      _, last_end, item_ind = items[-1]
                      ins_block = [f"{item_ind}item {{ {call} }}\n" for call in comp_calls]
                      new_lines[last_end + 1:last_end + 1] = ins_block
                      return new_lines
                  child_ind = cont["base_indent"] + "    "
                  ins_block = [f"{child_ind}item {{ {call} }}\n" for call in comp_calls]
                  new_lines[cont["close_li"]:cont["close_li"]] = ins_block
                  return new_lines
              else:
                  for li in range(cont["open_li"] + 1, cont["close_li"]):
                      if re.search(backup_anchor_rx, new_lines[li], re.I):
                          ins_li = li
                          for back in range(li - 1, max(cont["open_li"], li - 8), -1):
                              if re.match(r'^\s*(?:Text|Surface|Card|ElevatedCard|OutlinedCard|Row|Column)\s*\(', new_lines[back]):
                                  if re.search(r'(?:Backup|Αντίγραφα ασφαλείας|Import\s*/\s*Export|VnSettingsBackup)', new_lines[back], re.I):
                                      ins_li = back
                                  break
                          ind = re.match(r'^(\s*)', new_lines[ins_li]).group(1)
                          ins_block = [f"{ind}{call}\n" for call in comp_calls]
                          new_lines[ins_li:ins_li] = ins_block
                          return new_lines
                  child_ind = cont["base_indent"] + "    "
                  ins_block = [f"{child_ind}{call}\n" for call in comp_calls]
                  new_lines[cont["close_li"]:cont["close_li"]] = ins_block
                  return new_lines

          ui_kt_files = [
              p for p in sorted(Path("app/src/main/java").rglob("*.kt"))
              if p.name not in ("VnFrameRateManager.kt", "VnSettingsBackup.kt")
          ]

          def file_priority(p: Path) -> tuple[int, str]:
              if p.name == "SettingsScreen.kt":
                  return (0, str(p))
              if p.name == "ImmersiveSettingsScreen.kt":
                  return (1, str(p))
              if "Setting" in p.name:
                  return (2, str(p))
              return (3, str(p))

          ui_kt_files.sort(key=file_priority)

          placed_groups: set[str] = set()
          placed_at_backup_caller = False

          for kt_file in ui_kt_files:
              src_text = kt_file.read_text()
              if not re.search(r'\bVnSettingsBackup\s*\(', src_text):
                  continue
              if "VnAppearanceSettingsCard" in src_text:
                  placed_at_backup_caller = True
                  placed_groups.add("immersive" if "immersive" in str(kt_file).lower() else "standard")
                  continue

              lines = src_text.splitlines(keepends=True)
              clean_lines = strip_comments_and_strings(lines)
              call_indices = [idx for idx, cl in enumerate(clean_lines) if re.search(r'\bVnSettingsBackup\s*\(', cl)]
              if not call_indices:
                  continue

              containers = extract_layout_containers(lines)
              modified_this_file = False

              for call_li in sorted(call_indices, reverse=True):
                  enclosing_lazy = next(
                      (c for c in reversed(containers) if c["kind"] == "LazyColumn" and c["open_li"] < call_li < c["close_li"]),
                      None
                  )
                  if enclosing_lazy is not None:
                      items = enclosing_lazy["lazy_items"]
                      target_idx = next(
                          (idx_it for idx_it, (s, e, _) in enumerate(items) if s <= call_li <= e),
                          None
                      )
                      if target_idx is not None:
                          s_idx, _, item_ind = items[target_idx]
                          if target_idx > 0:
                              ps, pe, pind = items[target_idx - 1]
                              prev_txt = "".join(lines[ps:pe + 1])
                              if (pe - ps) <= 8 and re.search(r'(?:Backup|Αντίγραφα ασφαλείας|Import\s*/\s*Export|Εφαρμογή|App)', prev_txt, re.I) and not re.search(r'Switch|onClick|Button', prev_txt, re.I):
                                  s_idx, item_ind = ps, pind
                          ins_block = [f"{item_ind}item {{ {call} }}\n" for call in all_vnera_cards]
                          lines[s_idx:s_idx] = ins_block
                          modified_this_file = True
                          continue

                      item_line = next(
                          (back for back in range(call_li, enclosing_lazy["open_li"], -1)
                           if re.match(r'^\s*(?:item|items|itemsIndexed|stickyHeader)\b', clean_lines[back])),
                          None
                      )
                      if item_line is not None:
                          item_ind = re.match(r'^(\s*)', lines[item_line]).group(1)
                          ins_block = [f"{item_ind}item {{ {call} }}\n" for call in all_vnera_cards]
                          lines[item_line:item_line] = ins_block
                          modified_this_file = True
                          continue

                  enclosing_col = next(
                      (c for c in reversed(containers) if c["kind"] == "Column" and c["open_li"] < call_li < c["close_li"]),
                      None
                  )
                  if enclosing_col is not None:
                      ins_li = call_li
                      for back in range(call_li - 1, enclosing_col["open_li"], -1):
                          if re.match(r'^\s*Row\s*\(', clean_lines[back]):
                              ins_li = back
                              break
                      for back in range(ins_li - 1, max(enclosing_col["open_li"], ins_li - 8), -1):
                          if re.match(r'^\s*(?:Text|Surface|Card|ElevatedCard|OutlinedCard)\s*\(', clean_lines[back]):
                              if re.search(r'(?:Backup|Αντίγραφα ασφαλείας|Import\s*/\s*Export)', lines[back], re.I):
                                  ins_li = back
                              break
                      ind = re.match(r'^(\s*)', lines[ins_li]).group(1)
                      ins_block = [f"{ind}{call}\n" for call in all_vnera_cards]
                      lines[ins_li:ins_li] = ins_block
                      modified_this_file = True

              if modified_this_file:
                  kt_file.write_text("".join(lines))
                  placed_at_backup_caller = True
                  placed_groups.add("immersive" if "immersive" in str(kt_file).lower() else "standard")
                  print(f"Placed ALL VNEra settings cards directly above VnSettingsBackup() in {kt_file}")

          for target_group in ["standard", "immersive"]:
              if target_group in placed_groups:
                  continue
              for kt_file in ui_kt_files:
                  is_imm_file = "immersive" in str(kt_file).lower()
                  if (target_group == "immersive") != is_imm_file:
                      continue
                  src_text = kt_file.read_text()
                  if "VnAppearanceSettingsCard" in src_text:
                      placed_groups.add(target_group)
                      break
                  lines = src_text.splitlines(keepends=True)
                  containers = extract_layout_containers(lines)
                  scrollable_conts = [c for c in containers if c["is_scrollable"]]
                  backup_cont = next(
                      (c for c in reversed(scrollable_conts) if re.search(backup_anchor_rx, "".join(lines[c["start_li"]:c["close_li"] + 1]), re.I)),
                      None
                  )
                  if backup_cont is not None:
                      lines = insert_all_above_backup(lines, backup_cont, all_vnera_cards)
                      kt_file.write_text("".join(lines))
                      placed_groups.add(target_group)
                      print(f"Placed ALL VNEra settings cards above Backup/Export in {kt_file}")
                      break

          for target_group in ["standard", "immersive"]:
              if target_group in placed_groups:
                  continue
              for kt_file in ui_kt_files:
                  if "Setting" not in kt_file.name:
                      continue
                  is_imm_file = "immersive" in str(kt_file).lower()
                  if (target_group == "immersive") != is_imm_file:
                      continue
                  src_text = kt_file.read_text()
                  lines = src_text.splitlines(keepends=True)
                  containers = extract_layout_containers(lines)
                  scrollable_conts = [c for c in containers if c["is_scrollable"]]
                  if not scrollable_conts:
                      continue
                  main_cont = scrollable_conts[0]
                  lines = insert_all_above_backup(lines, main_cont, all_vnera_cards)
                  kt_file.write_text("".join(lines))
                  placed_groups.add(target_group)
                  print(f"Placed ALL VNEra settings cards in main Settings container of {kt_file}")
                  break

          for target_name in ["PlayerControls.kt", "ImmersivePlayer.kt"]:
              ap = next(Path("app/src/main/java").rglob(target_name), None)
              if ap is not None and ap.exists() and "vnAnimatedElement" not in ap.read_text():
                  c = [0]
                  an = re.sub(r'\bModifier\s*\.\s*fillMaxWidth\s*\(\s*\)', lambda m: (c.__setitem__(0, c[0]+1) or f"{m.group(0)}.vnAnimatedElement({c[0]})"), ap.read_text())
                  if c[0] > 0:
                      ap.write_text(ensure_imports(an, ["com.music.spotui.ui.screens.vnAnimatedElement"]))

          for sf in sorted(Path("app/src/main/java").rglob("*.kt")):
              ft = sf.read_text()
              if sf.name != "VnFrameRateManager.kt" and "onTrackPlaybackObserved" not in ft and '"Lossless"' in ft and "LocalContext.current" in ft and "@Composable" in ft:
                  lines = ft.splitlines(keepends=True)
                  for idx, l in enumerate(lines):
                      if '"Lossless"' in l:
                          w = "".join(lines[max(0, idx-25):min(len(lines), idx+15)])
                          mc = re.search(r'\bval\s+([A-Za-z0-9_]+)\s*=\s*LocalContext\.current\b', w)
                          mq = re.search(r'\bval\s+([A-Za-z0-9_]*(?:quality|Quality|format|Format|badge|Badge)[A-Za-z0-9_]*)\b', w)
                          mt = re.search(r'\b([A-Za-z0-9_]+)\.(?:title|name)\b', w)
                          ms = re.search(r'\b([A-Za-z0-9_]+)\.(source|provider|extension|sourceName|providerName)\b', w)
                          if mc and mq and mt:
                              src_expr = f"({ms.group(1)}.{ms.group(2)}?.toString().orEmpty())" if ms else '""'
                              for k in range(max(0, idx-25), idx+1):
                                  if re.search(rf'\bval\s+{re.escape(mq.group(1))}\b', lines[k]) and "=" in lines[k]:
                                      ind = re.match(r'^(\s*)', lines[k]).group(1)
                                      lines.insert(k+1, f'{ind}androidx.compose.runtime.LaunchedEffect({mt.group(1)}.id, {mq.group(1)}) {{ com.music.spotui.ui.screens.VnPlaybackMonitor.onTrackPlaybackObserved({mc.group(1)}, {mt.group(1)}.id.toString(), {mt.group(1)}.title.toString(), {src_expr}, {mq.group(1)}.toString()) }}\n')
                                      sf.write_text("".join(lines)); break
                          break

          bf = next(Path("app/src/main/java").rglob("VnSettingsBackup.kt"), Path("app/src/main/java/com/music/spotui/ui/screens/VnSettingsBackup.kt"))
          if bf.exists():
              bt = bf.read_text()
              bt = re.sub(r'\.toString\(\s*(?:2|4)\s*\)', '.toString()', bt)
              bt = re.sub(
                  r'(for\s*\(\s*\(\s*([A-Za-z0-9_]+)\s*,\s*([A-Za-z0-9_]+)\s*\)\s*in\s*[^)]+\)\s*\{)',
                  r'\1 if (com.music.spotui.ui.screens.VnFpsPref.isJunkBackupKey(\2.toString()) || (\3 is String && \3.length > 2048)) continue;',
                  bt
              )
              bt = re.sub(
                  r'(\.all\.forEach\s*\{\s*\(\s*([A-Za-z0-9_]+)\s*,\s*([A-Za-z0-9_]+)\s*\)\s*->)',
                  r'\1 if (com.music.spotui.ui.screens.VnFpsPref.isJunkBackupKey(\2.toString()) || (\3 is String && \3.length > 2048)) return@forEach;',
                  bt
              )
              cv = next((x for x in ["context", "ctx", "localContext", "appContext"] if re.search(rf'\b(?:val|var)\s+{x}\b|\b{x}\s*:\s*Context\b', bt)), None)
              if cv is None:
                  m_ctx = re.search(r'\b(?:val|var)\s+([A-Za-z_][A-Za-z0-9_]*)\s*=\s*LocalContext\.current', bt)
                  cv = m_ctx.group(1) if m_ctx else None
              if cv:
                  if "importAndParseBackupJson" not in bt and "onBackupImported" not in bt:
                      bt = re.sub(r'\bJSONObject\(\s*([A-Za-z0-9_]+)\s*\)', rf'com.music.spotui.ui.screens.VnFpsPref.importAndParseBackupJson({cv}, \1)', bt, count=1)
                  if "enrichBackupJson" not in bt:
                      m_json = re.search(r'\b([A-Za-z0-9_]*(?:json|backup|export|root|obj|payload)[A-Za-z0-9_]*\.toString\(\s*\))', bt, re.I)
                      if m_json:
                          bt = bt[:m_json.start()] + f'com.music.spotui.ui.screens.VnFpsPref.enrichBackupJson({cv}, {m_json.group(1)})' + bt[m_json.end():]

              if (not placed_at_backup_caller) and "VnAppearanceSettingsCard" not in bt:
                  lines_b = bt.splitlines(keepends=True)
                  cs_b = next((i for i, l in enumerate(lines_b) if "@Composable" in l), None)
                  col_b = next((i for i in range(cs_b, len(lines_b)) if re.search(r'\bColumn\b', lines_b[i])), None) if cs_b is not None else None
                  if col_b is not None:
                      open_brace_b = next((i for i in range(col_b, min(len(lines_b), col_b + 12)) if "{" in lines_b[i]), None)
                      if open_brace_b is not None:
                          ind_top = re.match(r'^(\s*)', lines_b[col_b]).group(1) + "    "
                          top_cards = "".join(f"{ind_top}{call}\n" for call in all_vnera_cards)
                          lines_b[open_brace_b] += top_cards
                          bt = "".join(lines_b)
                          print("Placed ALL VNEra settings cards at top of VnSettingsBackup.kt")
              bf.write_text(bt)

          gh = False
          for ap in sorted(Path("app/src/main/java").rglob("*Activity.kt")):
              at = ap.read_text()
              if "setContent" in at and "VnFrameRateGuard" not in at:
                  an, n = re.subn(r'(?m)^([ \t]*)(setContent(?:\([^)]*\))?\s*\{)\s*$', r'\1\2\n\1    com.music.spotui.ui.screens.VnFrameRateGuard()', at, count=1)
                  if n > 0: ap.write_text(an); gh = True; break
          if not gh and p2.exists() and "VnFrameRateGuard" not in p2.read_text():
              p2.write_text(re.sub(r'(?m)^([ \t]*fun\s+ImmersivePlayer\b[^{]*\{)\s*$', r'\1\n    com.music.spotui.ui.screens.VnFrameRateGuard()', p2.read_text(), count=1))
          PY

          python3 <<'PY'
          import re
          from pathlib import Path

          patched_any = False
          for kt_file in sorted(Path("app/src/main/java").rglob("*.kt")):
              if kt_file.name in ("VnFrameRateManager.kt", "VnSettingsBackup.kt"):
                  continue
              src = kt_file.read_text()
              if "leadLine" not in src and "focusLine" not in src:
                  continue

              orig = src

              src = re.sub(
                  r'// Where the panel is heading,[\s\S]*?val focusLine = if \(leadLine >= 0\) leadLine else activeRow',
                  '// Follow the actual timed line; predictive lead scrolling caused repeated target changes.\n    val focusLine = activeRow',
                  src
              )
              src = re.sub(
                  r'\bval\s+focusLine\s*=\s*if\s*\(\s*leadLine\s*>=\s*0\s*\)\s*leadLine\s+else\s+activeRow\b',
                  'val focusLine = activeRow',
                  src
              )

              def strip_lead_from_effect(m):
                  keys = [k.strip() for k in m.group(1).split(",") if k.strip()]
                  filtered = [k for k in keys if k != "leadLine"]
                  if not filtered:
                      filtered = ["focusLine"]
                  return f"LaunchedEffect({', '.join(filtered)})"

              src = re.sub(
                  r'LaunchedEffect\(([^)]*\bleadLine\b[^)]*)\)',
                  strip_lead_from_effect,
                  src
              )

              fallback_var = "focusLine" if "val focusLine" in src else "activeRow"
              src = re.sub(
                  r'(\b(?:animateScrollToItem|scrollToItem)\s*\(\s*(?:index\s*=\s*)?)leadLine\b',
                  rf'\g<1>{fallback_var}',
                  src
              )

              if src != orig:
                  kt_file.write_text(src)
                  patched_any = True
                  print(f"Patched lyrics scroll stability in {kt_file}")

          if patched_any:
              print("Lyrics scroll stability patches applied cleanly.")
          PY

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          EXTRA_FLAGS=""
          [ "$HAS_SDK_37" != "true" ] && EXTRA_FLAGS="-Pandroid.suppressUnsupportedCompileSdk=37"
          ./gradlew :app:assembleDebug $EXTRA_FLAGS -PappVersionName="$APP_VERSION" -PappVersionCode="$BUILD_VERSION_CODE" -Pabis=arm64-v8a -PupdateRepo=vnsec2/VNEra --no-daemon

      - name: Verify Compiled APK Package Name & Label
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT2=$(find "$SDK_ROOT/build-tools" -name aapt2 | sort -V | tail -n 1)
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          BADGING=$("$AAPT2" dump badging "$APK_FILE")
          echo "$BADGING" | grep -E "^(package:|application-label)"
          echo "$BADGING" | grep -q "package: name='app.vnera.player'" || { echo "ERROR: APK package is not app.vnera.player"; exit 1; }
          echo "$BADGING" | grep -q "application-label:'VNEra'" || { echo "ERROR: APK label is not VNEra"; exit 1; }

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VNEra-${{ env.APP_VERSION }}-Debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
