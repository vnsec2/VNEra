                  if m_shuffle_fn:
                      guard = (
                          "\n    val vnShuffleContext = androidx.compose.ui.platform.LocalContext.current\n"
                          "    androidx.compose.runtime.SideEffect { com.music.spotui.ui.screens.VnShuffleGuard.lastObservedShuffleOn = state.shuffle }\n"
                          "    androidx.compose.runtime.LaunchedEffect(state.shuffle, com.music.spotui.ui.screens.VnFpsPref.keepShuffleEnabled) {\n"
                          "        com.music.spotui.ui.screens.VnShuffleGuard.onShuffleStateChanged(vnShuffleContext, state.shuffle) { actions.toggleShuffle() }\n"
                          "    }\n"
                      )
                      src_shuffle = src_shuffle[:m_shuffle_fn.end()] + guard + src_shuffle[m_shuffle_fn.end():]
                      immersive_player.write_text(src_shuffle)
                      print("Patched shuffle state observer in ImmersivePlayer")

          extra_c = ", ".join(f"Color(0xFF{c})" for c in ["E53935","FF5722","FF9800","FFC107","00BFA5","00BCD4","3F51B5","7C4DFF","E040FB","FF4081","64FFDA","FFAB91","B388FF","ECEFF1"])
          for kf in sorted(Path("app/src/main/java").rglob("*.kt")):
              if kf.name == "VnFrameRateManager.kt": continue
              o = kf.read_text()
              u = re.sub(r'listOf\(((?:\s*Color\([^)]+\)\s*,?)+)\s*\)', lambda m: f"listOf({m.group(1).rstrip()}{'' if m.group(1).rstrip().endswith(',') else ','} {extra_c}\n)" if m.group(1).count("Color(") >= 3 and "0xFFE53935" not in m.group(1) else m.group(0), o)
              if u != o: kf.write_text(u)

          def patch_material_theme_accent(src: str) -> str:
              if "MaterialTheme(" not in src or "customAccentColorArgb" in src:
                  return src
              m = re.search(r'MaterialTheme\s*\(', src)
              if not m:
                  return src
              start_paren = m.end() - 1
              dp = 0
              in_str = False
              esc = False
              end_paren = -1
              for i in range(start_paren, len(src)):
                  ch = src[i]
                  if in_str:
                      if esc: esc = False
                      elif ch == '\\': esc = True
                      elif ch == '"': in_str = False
                      continue
                  if ch == '"':
                      in_str = True
                      continue
                  if ch == '(': dp += 1
                  elif ch == ')':
                      dp -= 1
                      if dp == 0:
                          end_paren = i
                          break
              if end_paren == -1:
                  return src
              inner = src[start_paren + 1:end_paren]
              args = split_top_level_args(inner)
              new_parts = []
              changed = False
              for idx_p, (_, _, part) in enumerate(args):
                  stripped = part.strip()
                  if not stripped:
                      new_parts.append(part)
                      continue
                  lead_ws = part[:len(part) - len(part.lstrip())]
                  trail_ws = part[len(part.rstrip()):]
                  m_cs = re.match(r'^colorScheme\s*=\s*(.+)$', stripped, re.DOTALL)
                  if m_cs:
                      expr = m_cs.group(1).strip()
                      wrapped = f"colorScheme = ({expr}).let {{ vnBaseScheme -> if (com.music.spotui.ui.screens.VnFpsPref.customAccentColorArgb != 0L) vnBaseScheme.copy(primary = androidx.compose.ui.graphics.Color(com.music.spotui.ui.screens.VnFpsPref.customAccentColorArgb), secondary = androidx.compose.ui.graphics.Color(com.music.spotui.ui.screens.VnFpsPref.customAccentColorArgb)) else vnBaseScheme }}"
                      new_parts.append(f"{lead_ws}{wrapped}{trail_ws}")
                      changed = True
                  elif idx_p == 0 and top_level_eq_pos(stripped) == -1:
                      wrapped = f"({stripped}).let {{ vnBaseScheme -> if (com.music.spotui.ui.screens.VnFpsPref.customAccentColorArgb != 0L) vnBaseScheme.copy(primary = androidx.compose.ui.graphics.Color(com.music.spotui.ui.screens.VnFpsPref.customAccentColorArgb), secondary = androidx.compose.ui.graphics.Color(com.music.spotui.ui.screens.VnFpsPref.customAccentColorArgb)) else vnBaseScheme }}"
                      new_parts.append(f"{lead_ws}{wrapped}{trail_ws}")
                      changed = True
                  else:
                      new_parts.append(part)
              if not changed:
                  return src
              return src[:start_paren + 1] + ",".join(new_parts) + src[end_paren:]

          for tf in sorted(Path("app/src/main/java").rglob("*.kt")):
