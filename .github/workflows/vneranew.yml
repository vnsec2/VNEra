          @Composable
          fun VnKeepSystemBarsHidden(hidden: Boolean) {
              val c = LocalContext.current
              val act = remember(c) { c.findActivity() }
              val view = LocalView.current
              val effectiveHidden = hidden || VnFpsPref.appFullscreenEnabled
              LaunchedEffect(act, view, effectiveHidden) {
                  if (effectiveHidden) {
                      VnFpsPref.setSystemBarsHidden(act, true, view)
                      view.post { VnFpsPref.setSystemBarsHidden(act, true, view) }
                      delay(120L)
                      VnFpsPref.setSystemBarsHidden(act, true, view)
                  } else {
                      VnFpsPref.setSystemBarsHidden(act, false, view)
                  }
              }
              DisposableEffect(act, view, effectiveHidden) {
                  val observer = ViewTreeObserver.OnWindowFocusChangeListener { hasFocus ->
                      if (hasFocus && (effectiveHidden || VnFpsPref.appFullscreenEnabled)) {
                          VnFpsPref.setSystemBarsHidden(act, true, view)
                      }
                  }
                  view.viewTreeObserver.addOnWindowFocusChangeListener(observer)
                  onDispose {
                      view.viewTreeObserver.removeOnWindowFocusChangeListener(observer)
                      if (!VnFpsPref.appFullscreenEnabled) {
                          VnFpsPref.setSystemBarsHidden(act, false, view)
                      }
                  }
              }
          }

          private fun vnExtractYoutubeVideoId(url: String): String {
              val patterns = listOf(
                  Regex("""(?:youtube\.com/watch\?.*?[&?]v=|music\.youtube\.com/watch\?.*?[&?]v=)([A-Za-z0-9_-]{11})"""),
                  Regex("""youtu\.be/([A-Za-z0-9_-]{11})"""),
                  Regex("""youtube\.com/(?:embed|shorts|v)/([A-Za-z0-9_-]{11})"""),
                  Regex("""youtube-nocookie\.com/embed/([A-Za-z0-9_-]{11})""")
              )
              for (rx in patterns) {
                  val m = rx.find(url)
                  if (m != null) return m.groupValues[1]
              }
              return ""
          }

          private fun vnIsDirectVideoStream(url: String): Boolean {
              val l = url.lowercase(Locale.ROOT)
              return l.endsWith(".mp4") || l.endsWith(".m3u8") || l.endsWith(".mpd") ||
                  l.endsWith(".webm") || l.endsWith(".mkv") || l.endsWith(".mov") ||
                  l.contains("googlevideo.com/videoplayback") ||
                  l.startsWith("content://") || l.startsWith("file://")
          }

          private fun vnBuildAdaptiveVideoHtml(videoUrl: String): String {
              val ytId = vnExtractYoutubeVideoId(videoUrl)
              val bodyContent = if (ytId.isNotEmpty()) {
                  """<iframe src="https://www.youtube-nocookie.com/embed/$ytId?autoplay=1&playsinline=1&rel=0&modestbranding=1&iv_load_policy=3" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen frameborder="0"></iframe>"""
              } else {
                  val safeSrc = videoUrl.replace("\"", "&quot;")
                  """<video src="$safeSrc" autoplay controls playsinline preload="auto"></video>"""
              }
              return """
                  <!DOCTYPE html>
                  <html>
                  <head>
                    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
                    <style>
                      html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
                      iframe, video { position:fixed; inset:0; width:100%; height:100%; border:0; object-fit:contain; background:#000; }
                    </style>
                  </head>
                  <body>$bodyContent</body>
                  </html>
              """.trimIndent()
          }

