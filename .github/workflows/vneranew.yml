                          if close_l is not None and close_l > open_l and (close_l - open_l) <= 55:
                              span_txt = "".join(lines[idx:close_l + 1])
                              if (
                                  re.search(r'\b(?:currentLyric|lyricLine|lyricText|activeLyric|syncedLyric|karaoke|lyrics|inlineLyric|currentLine|wordByWord|swept)\b', span_txt, re.I)
                                  and re.search(r'(?<![.\w])Text\s*\(', span_txt)
