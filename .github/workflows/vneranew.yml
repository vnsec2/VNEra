                              modifier = Modifier.padding(if (isLandscape) 10.dp else 14.dp),
                              verticalArrangement = Arrangement.spacedBy(10.dp)
                          ) {
                              Row(
                                  modifier = Modifier.fillMaxWidth(),
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.spacedBy(10.dp)
                              ) {
                                  Surface(
                                      shape = RoundedCornerShape(8.dp),
                                      color = accent.copy(alpha = 0.20f)
                                  ) {
                                      Text(
                                          text = "VIDEOCLIP",
                                          fontSize = 10.sp,
                                          fontWeight = FontWeight.ExtraBold,
                                          color = accent,
                                          modifier = Modifier.padding(horizontal = 8.dp, vertical = 4.dp)
                                      )
                                  }
                                  Text(
                                      text = title,
                                      style = MaterialTheme.typography.titleSmall,
                                      fontWeight = FontWeight.Bold,
                                      color = Color.White,
                                      maxLines = 1,
                                      modifier = Modifier.weight(1f)
                                  )
                                  IconButton(
                                      onClick = { VnFpsPref.closeVideoclipScreen() },
                                      modifier = Modifier.size(34.dp)
                                  ) {
                                      Icon(
                                          imageVector = Icons.Rounded.Close,
                                          contentDescription = "Κλείσιμο videoclip",
                                          tint = Color.White
                                      )
                                  }
                              }

                              Box(
                                  modifier = (
                                      if (isLandscape) Modifier.fillMaxWidth().weight(1f)
                                      else Modifier.fillMaxWidth().aspectRatio(16f / 9f)
                                  )
                                      .clip(RoundedCornerShape(16.dp))
                                      .background(Color.Black)
                              ) {
                                  AndroidView(
                                      factory = { ctx ->
                                          WebView(ctx).apply {
                                              setBackgroundColor(android.graphics.Color.BLACK)
                                              settings.javaScriptEnabled = true
                                              settings.mediaPlaybackRequiresUserGesture = false
                                              settings.domStorageEnabled = true
                                              settings.loadWithOverviewMode = true
                                              settings.useWideViewPort = true
                                              settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                                              webChromeClient = WebChromeClient()
                                              webViewClient = object : WebViewClient() {
                                                  override fun shouldOverrideUrlLoading(view: WebView?, url: String?): Boolean {
                                                      if (!url.isNullOrBlank() && (url.startsWith("vnd.") || url.startsWith("intent://"))) {
                                                          runCatching {
                                                              context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)))
                                                          }
                                                          return true
                                                      }
                                                      return false
                                                  }
                                              }
                                              tag = videoUrl
                                              if (useInlineHtml) {
                                                  loadDataWithBaseURL("https://www.youtube-nocookie.com", embedHtml, "text/html", "utf-8", null)
                                              } else {
                                                  loadUrl(videoUrl)
                                              }
                                          }
                                      },
                                      update = { wv ->
                                          if (wv.tag != videoUrl) {
                                              wv.tag = videoUrl
                                              if (useInlineHtml) {
                                                  wv.loadDataWithBaseURL("https://www.youtube-nocookie.com", embedHtml, "text/html", "utf-8", null)
                                              } else {
                                                  wv.loadUrl(videoUrl)
                                              }
                                          }
                                      },
                                      onRelease = { wv ->
                                          wv.stopLoading()
                                          wv.destroy()
                                      },
                                      modifier = Modifier.fillMaxSize()
                                  )
                              }
                          }
                      }
                  }
              }
          }

