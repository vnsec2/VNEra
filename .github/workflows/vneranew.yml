          object VnPlaybackMonitor {
              var activeAlertTitle by mutableStateOf<String?>(null)
              var activeAlertBody by mutableStateOf<String?>(null)
              private var lastKey = ""
              private var prevTitle = ""
              private var prevScore = -1
              private var prevLabel = ""
              private var lastOrderSig = ""

              fun dismissAlert() {
                  activeAlertTitle = null
                  activeAlertBody = null
              }

              fun qualityScore(label: String, kbps: Int = 0): Int {
                  val l = label.lowercase()
                  val tier = when {
                      listOf("hi-res", "hires", "24-bit", "24bit", "192", "96khz", "master", "mqa", "dsd").any { l.contains(it) } -> 500
                      listOf("lossless", "flac", "alac", "wav", "16-bit", "16bit", "44.1", "48khz").any { l.contains(it) } -> 400
                      listOf("high", "320", "256", "opus", "aac").any { l.contains(it) } -> 300
                      listOf("medium", "normal", "160", "128").any { l.contains(it) } -> 200
                      listOf("low", "96", "64", "48").any { l.contains(it) } || kbps > 0 ->
                          if (kbps >= 900) 450 else if (kbps >= 256) 300 else if (kbps >= 128) 200 else 100
                      else -> 0
                  }
                  return if (tier > 0) tier + (kbps.coerceIn(0, 999) / 10) else 0
              }

              private fun parseList(raw: Any?): List<String> {
                  val s = raw?.toString()?.trim().orEmpty()
                  if (s.isEmpty() || s == "[]" || s == "{}") return emptyList()
                  if (s.startsWith("[")) {
                      return runCatching {
                          val a = JSONArray(s)
                          (0 until a.length()).mapNotNull {
                              (a.opt(it) as? JSONObject)?.run {
                                  optString("id").ifBlank { optString("name").ifBlank { optString("title") } }
                              } ?: a.opt(it)?.toString()
                          }.map { it.trim() }.filter { it.isNotEmpty() }
                      }.getOrDefault(emptyList())
                  }
                  return s.split(",", ";", "|", "\n").map { it.trim() }.filter { it.isNotEmpty() }
              }

              private fun readOrders(c: Context): Pair<List<String>, List<String>> {
                  var src = emptyList<String>()
                  var ext = emptyList<String>()
                  runCatching {
                      File(c.applicationInfo.dataDir, "shared_prefs").listFiles()?.filter { it.name.endsWith(".xml") }?.forEach { f ->
                          if (f.name == "${VnFpsPref.PREFS_NAME}.xml") return@forEach
                          c.applicationContext.getSharedPreferences(f.name.removeSuffix(".xml"), Context.MODE_PRIVATE).all.forEach { (k, v) ->
                              val kl = k.lowercase()
                              val hasTag = listOf("order", "priority", "list", "enabled", "providers", "sources").any(kl::contains)
                              if (src.isEmpty() && (kl.contains("source") || kl.contains("provider")) && hasTag) {
                                  parseList(v).takeIf { it.size >= 2 }?.let { src = it }
                              }
                              if (ext.isEmpty() && kl.contains("extension") && hasTag) {
                                  parseList(v).takeIf { it.size >= 2 }?.let { ext = it }
                              }
                          }
                      }
                  }
                  return src to ext
              }

              private fun readProp(obj: Any?, vararg names: String): String {
                  if (obj == null) return ""
                  if (obj is Bundle) {
                      for (n in names) {
                          @Suppress("DEPRECATION")
                          val v = obj.get(n)?.toString()?.trim().orEmpty()
                          if (v.isNotEmpty() && v != "null") return v
                      }
                      return ""
                  }
                  if (obj is Map<*, *>) {
                      for (n in names) {
                          val v = obj[n]?.toString()?.trim().orEmpty()
                          if (v.isNotEmpty() && v != "null") return v
                      }
                      return ""
                  }
                  val cls = obj.javaClass
                  for (n in names) {
                      val cap = n.replaceFirstChar { it.uppercaseChar() }
                      val getter = runCatching { cls.methods.firstOrNull { it.parameterCount == 0 && (it.name == "get$cap" || it.name == n) } }.getOrNull()
                      if (getter != null) {
                          val v = runCatching { getter.invoke(obj)?.toString()?.trim().orEmpty() }.getOrDefault("")
                          if (v.isNotEmpty() && v != "null") return v
                      }
                      val field = runCatching {
                          generateSequence<Class<*>>(cls) { it.superclass }.mapNotNull { c ->
                              runCatching { c.getDeclaredField(n).apply { isAccessible = true } }.getOrNull()
                          }.firstOrNull()
                      }.getOrNull()
                      if (field != null) {
                          val v = runCatching { field.get(obj)?.toString()?.trim().orEmpty() }.getOrDefault("")
                          if (v.isNotEmpty() && v != "null") return v
                      }
                  }
                  return ""
              }

              private fun readExtrasBundle(obj: Any?): Bundle? {
                  if (obj == null) return null
                  if (obj is Bundle) return obj
                  val cls = obj.javaClass
                  val getter = runCatching { cls.methods.firstOrNull { it.parameterCount == 0 && (it.name == "getExtras" || it.name == "extras") } }.getOrNull()
                  if (getter != null) {
                      val res = runCatching { getter.invoke(obj) as? Bundle }.getOrNull()
                      if (res != null) return res
                  }
                  val field = runCatching {
                      generateSequence<Class<*>>(cls) { it.superclass }.mapNotNull { c ->
                          runCatching { c.getDeclaredField("extras").apply { isAccessible = true } }.getOrNull()
                      }.firstOrNull()
                  }.getOrNull()
                  return runCatching { field?.get(obj) as? Bundle }.getOrNull()
              }

              private fun normalizeCandidateVideoValue(raw: String, fromExplicitVideoKey: Boolean): String {
                  val t = raw.trim()
                  if (t.isEmpty()) return ""
                  if (fromExplicitVideoKey && Regex("""^[A-Za-z0-9_-]{11}$""").matches(t)) {
                      return "https://www.youtube.com/watch?v=$t"
                  }
                  if (!t.startsWith("http://", true) && !t.startsWith("https://", true) &&
                      !t.startsWith("content://", true) && !t.startsWith("file://", true)) return ""
                  if (fromExplicitVideoKey) return t
                  val l = t.lowercase(Locale.ROOT)
                  if (l.contains("youtube.com/watch") || l.contains("music.youtube.com/watch") ||
                      l.contains("youtu.be/") || l.contains("youtube.com/shorts") ||
                      l.contains("youtube.com/embed") || l.contains("youtube-nocookie.com/embed") ||
                      l.contains("vimeo.com/") || l.contains("dailymotion.com/") || l.contains("tiktok.com/") ||
                      l.endsWith(".mp4") || l.endsWith(".m3u8") || l.endsWith(".mpd") ||
                      l.endsWith(".webm") || l.endsWith(".mkv") || l.endsWith(".mov") ||
                      (l.contains("googlevideo.com/videoplayback") && l.contains("mime=video")) ||
                      l.contains("video") || l.contains("clip") || l.contains("/mv")) {
                      return t
                  }
                  return ""
              }

              private fun collectNestedObjects(roots: List<Any?>): List<Any> {
                  val result = ArrayList<Any>()
                  val visited = java.util.IdentityHashMap<Any, Boolean>()
                  val nestedKeys = arrayOf(
                      "track", "currentTrack", "song", "currentSong", "mediaItem", "mediaMetadata",
                      "video", "videoClip", "musicVideo", "canvas", "stream", "metadata", "item"
                  )
                  fun visit(obj: Any?, depth: Int) {
                      if (obj == null || depth > 3) return
                      if (obj is String || obj is Number || obj is Boolean) return
                      if (visited.put(obj, true) != null) return
                      result.add(obj)
                      readExtrasBundle(obj)?.let { visit(it, depth + 1) }
                      if (obj is Map<*, *>) {
                          obj.values.forEach { visit(it, depth + 1) }
                          return
                      }
                      val cls = obj.javaClass
                      if (cls.name.startsWith("android.") || cls.name.startsWith("java.")) return
                      for (nk in nestedKeys) {
                          val cap = nk.replaceFirstChar { it.uppercaseChar() }
                          val m = runCatching { cls.methods.firstOrNull { it.parameterCount == 0 && (it.name == "get$cap" || it.name == nk) } }.getOrNull()
                          val child = runCatching { m?.invoke(obj) }.getOrNull()
                          if (child != null) visit(child, depth + 1)
                      }
                  }
                  roots.forEach { visit(it, 0) }
                  return result
              }

              private fun extractVideoUrlFromCandidates(candidates: List<Any?>): String {
                  val urlRegex = Regex("""https?://[^\s"'<>\]\)]+""")
                  val explicitVideoProps = arrayOf(
                      "videoUrl", "videoUri", "clipUrl", "mvUrl", "musicVideoUrl",
                      "streamVideoUrl", "videoStreamUrl", "canvasUrl", "canvasVideoUrl",
                      "youtubeUrl", "ytUrl", "officialVideoUrl", "videoLink", "clipLink", "mvLink",
                      "video_url", "clip_url", "mv_url", "canvas_url", "youtube_url",
                      "videoId", "youtubeId", "youtubeVideoId", "ytVideoId", "ytId",
                      "mvId", "clipId", "canvasId", "video_id", "youtube_id",
                      "video", "clip", "mv", "canvas"
                  )
                  val genericUrlProps = arrayOf("mediaUrl", "streamUrl", "playUrl", "watchUrl", "url", "uri")
                  val allObjs = collectNestedObjects(candidates)
                  for (cand in allObjs) {
                      for (pn in explicitVideoProps) {
                          val v = readProp(cand, pn)
                          val norm = normalizeCandidateVideoValue(v, fromExplicitVideoKey = true)
                          if (norm.isNotEmpty()) return norm
                      }
                      for (pn in genericUrlProps) {
                          val v = readProp(cand, pn)
                          val norm = normalizeCandidateVideoValue(v, fromExplicitVideoKey = false)
                          if (norm.isNotEmpty()) return norm
                      }
                      val rawStr = cand.toString()
                      if (rawStr.contains("video", ignoreCase = true) || rawStr.contains("clip", ignoreCase = true) ||
                          rawStr.contains("mv", ignoreCase = true) || rawStr.contains("youtube", ignoreCase = true)) {
                          urlRegex.findAll(rawStr).mapNotNull {
                              normalizeCandidateVideoValue(it.value, fromExplicitVideoKey = false).takeIf { u -> u.isNotEmpty() }
                          }.firstOrNull()?.let { return it }
                      }
                  }
                  return ""
              }

              fun inspectAndReportAuto(vararg candidates: Any?) {
                  val c = VnFpsPref.resolveAppContext() ?: return
                  inspectAndReport(c, *candidates)
              }

              fun inspectAndReport(c: Context, vararg candidates: Any?) {
                  VnFpsPref.ensureInit(c)
                  var id = ""
                  var title = ""
                  var artist = ""
                  var source = ""
                  var quality = ""
                  var kbps = 0
                  val expanded = mutableListOf<Any?>()
                  for (cand in candidates) {
                      if (cand != null) {
                          expanded.add(cand)
                          readExtrasBundle(cand)?.let { expanded.add(it) }
                      }
                  }
                  val detectedVideoUrl = extractVideoUrlFromCandidates(expanded)
                  if (detectedVideoUrl.isNotEmpty()) {
                      VnFpsPref.updateVideoClipUrl(detectedVideoUrl)
                  }
                  for (cand in expanded) {
                      if (cand == null) continue
                      if (cand is String) {
                          if (qualityScore(cand) > 0 && quality.isEmpty()) quality = cand
                          else if (title.isEmpty() && cand.length in 2..120) title = cand
                          continue
                      }
                      if (id.isEmpty()) id = readProp(cand, "id", "mediaId", "trackId", "songId", "uri", "url")
                      if (title.isEmpty()) title = readProp(cand, "title", "name", "trackTitle", "songTitle")
                      if (artist.isEmpty()) artist = readProp(cand, "artist", "artistName", "artists", "subtitle", "author")
                      if (source.isEmpty()) source = readProp(cand, "source", "provider", "extension", "extensionId", "extensionName", "sourceName", "providerName", "plugin")
                      if (quality.isEmpty()) quality = readProp(cand, "quality", "audioQuality", "qualityLabel", "format", "codec", "mimeType", "streamQuality")
                      if (kbps == 0) {
                          val bStr = readProp(cand, "bitrate", "kbps", "audioBitrate", "bitRate")
                          val num = bStr.filter { it.isDigit() }.toIntOrNull() ?: 0
                          if (num > 0) kbps = if (num > 10_000) num / 1000 else num
                      }
                  }
                  if (title.isNotEmpty() || id.isNotEmpty()) {
                      VnFpsPref.onActiveTrackChanged(c, id, title, artist)
                      if (detectedVideoUrl.isNotEmpty()) {
                          VnFpsPref.updateVideoClipUrl(detectedVideoUrl)
                      }
                  }
                  val key = (id.ifBlank { title }).trim()
                  if (key.isNotEmpty() || quality.isNotEmpty() || kbps > 0) {
                      onTrackPlaybackObserved(c, key.ifBlank { "track_${title.hashCode()}" }, title, source, quality, kbps, artist)
                  } else {
                      checkOrderMismatchOnly(c)
                  }
              }

              fun checkOrderMismatchOnly(c: Context) {
                  VnFpsPref.ensureInit(c)
                  if (!VnFpsPref.playbackAlertsEnabled) return
                  val (srcOrder, extOrder) = readOrders(c)
                  if (srcOrder.size < 2 || extOrder.size < 2) return
                  val commonExt = extOrder.filter { e -> srcOrder.any { s -> s.equals(e, true) || s.contains(e, true) || e.contains(s, true) } }
                  val expSrc = srcOrder.filter { s -> commonExt.any { e -> s.equals(e, true) || s.contains(e, true) || e.contains(s, true) } }
                  if (commonExt.size >= 2 && expSrc.size == commonExt.size && commonExt.zip(expSrc).any { (e, s) -> !e.equals(s, true) && !e.contains(s, true) && !s.contains(e, true) }) {
                      val sig = "${commonExt.joinToString()}|${expSrc.joinToString()}"
                      if (sig != lastOrderSig) {
                          lastOrderSig = sig
                          activeAlertTitle = "Ειδοποίηση Αναπαραγωγής VNEra"
                          activeAlertBody = "• Λάθος σειρά επεκτάσεων: Η σειρά των επεκτάσεων (${commonExt.joinToString(" → ")}) δεν συμφωνεί με τις Πηγές Ήχου (${expSrc.joinToString(" → ")})."
                      }
                  }
              }

              fun onTrackPlaybackObserved(c: Context, key: String, title: String, source: String, quality: String, kbps: Int = 0, artist: String = "") {
                  VnFpsPref.ensureInit(c)
                  VnFpsPref.onActiveTrackChanged(c, key, title, artist)
                  val ck = key.trim()
                  val cs = source.trim()
                  val cq = quality.trim()
                  val score = qualityScore(cq, kbps)
                  val effectiveKey = "$ck|$cs|$score"
                  if (ck.isEmpty() || effectiveKey == lastKey) return
                  if (lastKey.substringBefore("|") != ck && lastKey.isNotEmpty()) {
                      VnFpsPref.resetLyricsCache()
                  }
                  lastKey = effectiveKey

                  val warnings = mutableListOf<String>()
                  val (srcOrder, extOrder) = readOrders(c)
                  if (srcOrder.isNotEmpty()) {
                      if (extOrder.isNotEmpty()) {
                          val commonExt = extOrder.filter { e -> srcOrder.any { s -> s.equals(e, true) || s.contains(e, true) || e.contains(s, true) } }
                          val expSrc = srcOrder.filter { s -> commonExt.any { e -> s.equals(e, true) || s.contains(e, true) || e.contains(s, true) } }
                          if (commonExt.size >= 2 && expSrc.size == commonExt.size && commonExt.zip(expSrc).any { (e, s) -> !e.equals(s, true) && !e.contains(s, true) && !s.contains(e, true) }) {
                              warnings.add("• Λάθος σειρά επεκτάσεων: Η σειρά των επεκτάσεων (${commonExt.joinToString(" → ")}) δεν συμφωνεί με τις Πηγές Ήχου (${expSrc.joinToString(" → ")}).")
                          }
                      }
                      if (cs.isNotEmpty()) {
                          val idx = srcOrder.indexOfFirst { it.equals(cs, true) || it.contains(cs, true) || cs.contains(it, true) }
                          if (idx > 0) {
                              warnings.add("• Εκτός σειράς πηγής ήχου: Το «${title.ifBlank { "Τρέχον" }}» μπήκε από «$cs» (θέση #${idx + 1}), ενώ προηγείται το «${srcOrder.first()}».")
                          }
                      }
                  }
                  if (prevScore > 0 && score > 0 && score < prevScore) {
                      warnings.add("• Χαμηλότερη ποιότητα ήχου: Το «${title.ifBlank { "Τρέχον τραγούδι" }}» παίζει σε «${cq.ifBlank { "${kbps}kbps" }}», χαμηλότερη από το προηγούμενο «${prevTitle.ifBlank { "Προηγούμενο" }}» («${prevLabel.ifBlank { "Υψηλότερη" }}»).")
                  }
                  if (score > 0) {
                      prevScore = score
                      prevLabel = cq.ifBlank { "${kbps}kbps" }
                      prevTitle = title
                  }
                  if (warnings.isNotEmpty() && VnFpsPref.playbackAlertsEnabled) {
                      activeAlertTitle = "Ειδοποίηση Αναπαραγωγής VNEra"
