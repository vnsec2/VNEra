              private tailrec fun findWindowFromParent(parent: ViewParent?): Window? = when (parent) {
                  is DialogWindowProvider -> parent.window
                  is View -> findWindowFromParent(parent.parent)
                  else -> null
              }

              private fun applySystemBarsToWindow(w: Window?, targetView: View?, hidden: Boolean) {
                  if (w == null) return
                  val v = targetView ?: w.decorView
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.P) {
                      w.attributes = w.attributes.apply {
                          layoutInDisplayCutoutMode = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                          } else {
                              WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES
                          }
                      }
                  }
                  WindowCompat.setDecorFitsSystemWindows(w, false)
                  val controller = WindowCompat.getInsetsController(w, v)
                  if (hidden) {
                      controller.systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                      controller.hide(WindowInsetsCompat.Type.systemBars())
                  } else {
                      controller.show(WindowInsetsCompat.Type.systemBars())
                  }
              }

              fun setSystemBarsHidden(act: Activity?, hidden: Boolean, view: View? = null) {
                  val effectiveHidden = hidden || appFullscreenEnabled
                  lyricsBarsHidden = effectiveHidden
                  val dialogWin = view?.let { findWindowFromParent(it.parent) }
                  val actWin = act?.window
                  if (dialogWin != null) {
                      applySystemBarsToWindow(dialogWin, view, effectiveHidden)
                  }
                  if (actWin != null && actWin !== dialogWin) {
                      applySystemBarsToWindow(actWin, actWin.decorView, effectiveHidden)
                  }
              }

              fun toggleSystemBars(act: Activity?, view: View? = null) {
                  if (appFullscreenEnabled) {
                      setSystemBarsHidden(act, true, view)
                      return
                  }
                  setSystemBarsHidden(act, !lyricsBarsHidden, view)
              }

