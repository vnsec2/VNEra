          def inject_all_shuffle_hooks(src: str) -> tuple[str, int]:
              count = 0
              out = src

              out, n1 = re.subn(
                  r'(\bonClick\s*=\s*)(onToggleShuffle|onShuffle)\b(?!\s*\()',
                  r'\1{ com.music.spotui.ui.screens.VnShuffleGuard.onUserToggleShuffle(); \2() }',
                  out
              )
              count += n1

              out, n2 = re.subn(
                  r'(\b(?:onClick|onToggleShuffle|onShuffle)\s*=\s*)([A-Za-z0-9_.]+)(?:::|\.)(toggleShuffle|onToggleShuffle|shuffleQueue|toggleQueueShuffle)\b(?!\s*\()',
                  r'\1{ com.music.spotui.ui.screens.VnShuffleGuard.onUserToggleShuffle(); \2.\3() }',
                  out
              )
              count += n2

              lines = out.splitlines(keepends=True)
              i = 0
              while i < len(lines):
                  m_lam = re.search(r'(\b(?:onClick|onToggleShuffle|onShuffle|clickable)\s*(?:=\s*)?\{)', lines[i])
                  if m_lam:
                      start_col = m_lam.end(1) - 1
                      b_depth = 0
                      end_li = None
                      for j in range(i, min(len(lines), i + 25)):
                          s_clean = strip_line_strings_and_comments(lines[j])
                          c0 = start_col if j == i else 0
                          for ch in s_clean[c0:]:
                              if ch == '{':
                                  b_depth += 1
                              elif ch == '}':
                                  b_depth -= 1
                                  if b_depth == 0:
                                      end_li = j
                                      break
                          if end_li is not None:
                              break
                      if end_li is not None:
                          lam_body = "".join(lines[i:end_li + 1])
                          if (
                              "VnShuffleGuard" not in lam_body
                              and re.search(r'\b(?:toggleShuffle|onToggleShuffle|onShuffle|shuffleQueue|setShuffle|toggleQueueShuffle)\s*\(', lam_body)
                          ):
                              pos = m_lam.end(1)
                              lines[i] = lines[i][:pos] + " com.music.spotui.ui.screens.VnShuffleGuard.onUserToggleShuffle();" + lines[i][pos:]
                              count += 1
                              i = end_li + 1
                              continue
                  i += 1
              out = "".join(lines)

              lines = out.splitlines(keepends=True)
              for idx, line in enumerate(lines):
                  if re.search(r'\bIcons\.[A-Za-z0-9_]+\.Shuffle(?:On)?\b', line):
                      hooked_this_icon = False
                      for back in range(idx, max(-1, idx - 19), -1):
                          win = "".join(lines[back:idx + 1])
                          if "VnShuffleGuard" in win:
                              hooked_this_icon = True
                              break
                          m_btn = re.search(r'(\b(?:onClick|clickable)\s*(?:=\s*)?\{)', lines[back])
                          if m_btn and win.count("IconButton") <= 1 and win.count("Surface") <= 1:
                              pos = m_btn.end(1)
                              lines[back] = lines[back][:pos] + " com.music.spotui.ui.screens.VnShuffleGuard.onUserToggleShuffle();" + lines[back][pos:]
                              count += 1
                              hooked_this_icon = True
                              break
                          m_ref = re.search(r'(\bonClick\s*=\s*)([A-Za-z0-9_.]+)\b(?!\s*[\(\{])', lines[back])
                          if m_ref and m_ref.group(2) not in ("true", "false", "null"):
                              fn_ref = m_ref.group(2)
                              lines[back] = lines[back][:m_ref.start()] + f"onClick = {{ com.music.spotui.ui.screens.VnShuffleGuard.onUserToggleShuffle(); {fn_ref}() }}" + lines[back][m_ref.end():]
                              count += 1
                              hooked_this_icon = True
                              break
                      if not hooked_this_icon:
                          for fwd in range(idx + 1, min(len(lines), idx + 12)):
                              win_f = "".join(lines[idx:fwd + 1])
                              if "VnShuffleGuard" in win_f:
                                  break
                              m_fbtn = re.search(r'(\bonClick\s*=\s*\{)', lines[fwd])
                              if m_fbtn:
                                  pos = m_fbtn.end(1)
                                  lines[fwd] = lines[fwd][:pos] + " com.music.spotui.ui.screens.VnShuffleGuard.onUserToggleShuffle();" + lines[fwd][pos:]
                                  count += 1
                                  break
                              m_fref = re.search(r'(\bonClick\s*=\s*)([A-Za-z0-9_.]+)\b(?!\s*[\(\{])', lines[fwd])
                              if m_fref and m_fref.group(2) not in ("true", "false", "null"):
                                  fn_ref = m_fref.group(2)
                                  lines[fwd] = lines[fwd][:m_fref.start()] + f"onClick = {{ com.music.spotui.ui.screens.VnShuffleGuard.onUserToggleShuffle(); {fn_ref}() }}" + lines[fwd][m_fref.end():]
                                  count += 1
                                  break
              out = "".join(lines)

              out, n5 = re.subn(
                  r'(?m)^([ \t]*(?:override\s+)?fun\s+(?:toggleShuffle|toggleQueueShuffle)\s*\([^)]*\)\s*(?::\s*[A-Za-z0-9_<>?]+\s*)?\{)',
                  r'\1\n        com.music.spotui.ui.screens.VnShuffleGuard.onUserToggleShuffle()',
