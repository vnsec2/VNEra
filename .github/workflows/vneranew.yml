          @Composable
          fun VnRememberPlayerPreviewListState(state: Any?) {
              VnRegisterLyricsScrollState(state)
              val listState = state as? LazyListState ?: return
              LaunchedEffect(listState.firstVisibleItemIndex, listState.firstVisibleItemScrollOffset) {
                  VnFpsPref.savedPlayerPreviewScrollIndex = listState.firstVisibleItemIndex
                  VnFpsPref.savedPlayerPreviewScrollOffset = listState.firstVisibleItemScrollOffset
              }
          }

          fun Modifier.vnFullscreenSlideContainer(isClosing: Boolean, matchPlayerBackground: Boolean = false): Modifier = composed {
              val screenHeightPx = with(LocalDensity.current) { LocalConfiguration.current.screenHeightDp.dp.toPx() }
              var isEntered by remember { mutableStateOf(false) }
              LaunchedEffect(Unit) { isEntered = true }

              val progress by animateFloatAsState(
                  targetValue = if (isEntered && !isClosing) 1f else 0f,
                  animationSpec = if (isClosing) {
                      tween(durationMillis = 360, easing = FastOutSlowInEasing)
                  } else {
                      spring(dampingRatio = 0.88f, stiffness = 260f)
                  },
                  label = "vn_fullscreen_smooth_transition"
              )
              val baseBg = if (matchPlayerBackground && VnFpsPref.playerBackgroundColorArgb != 0L) {
                  Color(VnFpsPref.playerBackgroundColorArgb)
              } else {
                  Color.Black
              }
              this
                  .graphicsLayer {
                      translationY = (1f - progress) * (screenHeightPx * 0.22f)
                      val s = 0.95f + (0.05f * progress)
                      scaleX = s
                      scaleY = s
                      alpha = progress.coerceIn(0f, 1f)
                  }
                  .background(baseBg.copy(alpha = progress.coerceIn(0f, 1f)))
          }

          fun Modifier.vnSmartLyricsSwipe(
              act: Activity?,
              isExpanded: Boolean,
              onExpandToFullscreen: (() -> Unit)? = null,
              onCollapseToPlayer: (() -> Unit)? = null
          ): Modifier = composed {
              val c = LocalContext.current
              val density = LocalDensity.current
              val thresholdPx = with(density) { 48.dp.toPx() }
              var accumDown by remember { mutableFloatStateOf(0f) }
              var accumUp by remember { mutableFloatStateOf(0f) }

              val nested = remember(act, isExpanded, thresholdPx) {
                  object : NestedScrollConnection {
                      override fun onPreScroll(available: Offset, source: NestedScrollSource): Offset {
                          if (source != NestedScrollSource.UserInput) return Offset.Zero
                          if (!VnFpsPref.isSwipeToExpandLyricsEnabled(c)) return Offset.Zero
                          if (available.y < 0f && accumDown > 0f) accumDown = (accumDown + available.y).coerceAtLeast(0f)
                          if (available.y > 0f && accumUp > 0f) accumUp = (accumUp - available.y).coerceAtLeast(0f)
                          return Offset.Zero
                      }

                      override fun onPostScroll(consumed: Offset, available: Offset, source: NestedScrollSource): Offset {
                          if (source != NestedScrollSource.UserInput) return Offset.Zero
                          if (!VnFpsPref.isSwipeToExpandLyricsEnabled(c)) return Offset.Zero
                          val listState = VnFpsPref.activeLyricsScrollState as? LazyListState
                          val atTop = listState == null || !listState.canScrollBackward
                          val atBottom = listState == null || !listState.canScrollForward

                          if (!isExpanded && available.y > 0f && atTop) {
                              accumDown += available.y
                              if (accumDown >= thresholdPx) {
                                  accumDown = 0f
                                  VnFpsPref.openLyricsFullscreen(act, onExpandToFullscreen)
                              }
                              return Offset(0f, available.y)
                          }

                          if (!isExpanded && available.y < 0f && atBottom) {
                              accumUp += -available.y
                              if (accumUp >= thresholdPx) {
                                  accumUp = 0f
                                  VnFpsPref.openLyricsFullscreen(act, onExpandToFullscreen)
                              }
                              return Offset(0f, available.y)
                          }
                          accumDown = 0f
                          accumUp = 0f
                          return Offset.Zero
                      }
                  }
              }

              this.nestedScroll(nested)
          }

          object VnShuffleGuard {
              var activeBannerMessage by mutableStateOf<String?>(null)
              var lockedOn by mutableStateOf(false)
              @Volatile var lastObservedShuffleOn = false
              @Volatile private var userTogglePending = false
              @Volatile private var userTargetState: Boolean? = null
              @Volatile private var manualOffHold = false
              @Volatile private var autoRestoreInFlight = false

              fun dismissBanner() { activeBannerMessage = null }

              fun onUserToggleShuffle(currentlyOn: Boolean = lastObservedShuffleOn) {
                  activeBannerMessage = null
                  autoRestoreInFlight = false
                  if (!userTogglePending) {
                      userTogglePending = true
                      val target = !currentlyOn
                      userTargetState = target
                      if (!target) {
                          lockedOn = false
                          manualOffHold = true
                          VnFpsPref.saveShuffleLock(null, false)
                      } else {
                          manualOffHold = false
                          val shouldLock = VnFpsPref.keepShuffleEnabled
                          lockedOn = shouldLock
                          VnFpsPref.saveShuffleLock(null, shouldLock)
                      }
                  }
              }

              fun syncFromPrefs(savedLockedOn: Boolean) {
                  if (!userTogglePending && !manualOffHold) {
                      lockedOn = savedLockedOn
                  }
              }

              fun onShuffleStateChanged(
                  c: Context,
                  isShuffleOn: Boolean,
                  reEnable: () -> Unit
              ) {
                  VnFpsPref.ensureInit(c)
                  val prevObserved = lastObservedShuffleOn
                  lastObservedShuffleOn = isShuffleOn

                  if (!VnFpsPref.keepShuffleEnabled) {
                      userTogglePending = false
                      userTargetState = null
                      manualOffHold = false
                      autoRestoreInFlight = false
                      if (lockedOn) {
                          lockedOn = false
                          VnFpsPref.saveShuffleLock(c, false)
                      }
                      return
                  }

                  if (userTogglePending) {
                      if (isShuffleOn != prevObserved || isShuffleOn == userTargetState) {
                          userTogglePending = false
                          userTargetState = null
                          if (isShuffleOn) {
                              manualOffHold = false
                              lockedOn = true
                              VnFpsPref.saveShuffleLock(c, true)
                          } else {
                              lockedOn = false
                              manualOffHold = true
                              VnFpsPref.saveShuffleLock(c, false)
                          }
                      }
                      return
                  }

                  if (isShuffleOn) {
                      manualOffHold = false
                      autoRestoreInFlight = false
                      if (!lockedOn) {
                          lockedOn = true
                          VnFpsPref.saveShuffleLock(c, true)
                      }
                      return
                  }

                  if (manualOffHold) {
                      if (lockedOn) {
                          lockedOn = false
                          VnFpsPref.saveShuffleLock(c, false)
                      }
                      return
                  }

                  if (lockedOn && !autoRestoreInFlight) {
                      autoRestoreInFlight = true
                      reEnable()
                      activeBannerMessage = "Επαναφέρθηκε η Τυχαία Σειρά (έκλεισε αυτόματα)"
                  }
              }
          }

