              }
          }

          @Composable
          fun VnFrameRateGuard() {
              val c = LocalContext.current
              val act = remember(c) { c.findActivity() }
              VnFpsPref.ensureInit(c)
              val fps = VnFpsPref.targetFps
              val pArgb = MaterialTheme.colorScheme.primary.toArgb().toLong()
              val bgArgb = MaterialTheme.colorScheme.background.toArgb().toLong()

              LaunchedEffect(c) {
                  VnFpsPref.init(c)
                  if (VnFpsPref.staticAppPrimaryArgb == 0L && pArgb != 0L) VnFpsPref.staticAppPrimaryArgb = pArgb
                  if (VnFpsPref.playerBackgroundColorArgb == 0L && bgArgb != 0L) VnFpsPref.playerBackgroundColorArgb = bgArgb
                  act?.let { applyWindowFrameRate(it, VnFpsPref.targetFps, true) }
                  for (waitMs in listOf(0L, 250L, 650L, 1400L, 2800L, 4500L)) {
                      if (waitMs > 0L) delay(waitMs)
                      VnShuffleGuard.restoreShuffleOnStartup(c)
                  }
              }

              LaunchedEffect(act, fps) {
                  act?.let { applyWindowFrameRate(it, fps, true) }
              }

              LaunchedEffect(c) {
                  val am = c.getSystemService(Context.AUDIO_SERVICE) as? AudioManager
                  while (true) {
                      val directStale = (SystemClock.elapsedRealtime() - VnFpsPref.lastDirectPlayingReportMs) > 2500L
                      if ((!VnFpsPref.hasDirectPlayerIsPlaying || directStale) && am != null) {
                          val playingNow = if (Build.VERSION.SDK_INT >= 26) {
                              val states = am.activePlaybackConfigurations.mapNotNull { cfg ->
                                  runCatching { cfg.javaClass.getMethod("getPlayerState").invoke(cfg) as? Int }.getOrNull()
                              }
                              if (states.isNotEmpty()) states.any { it == 2 } else am.isMusicActive
                          } else {
                              am.isMusicActive
                          }
                          if (VnFpsPref.isPlaybackPlaying != playingNow) {
                              VnFpsPref.isPlaybackPlaying = playingNow
                          }
                      }
                      delay(150L)
                  }
              }
          }
          EOF

          python3 <<'PY'
          import os, re
          from pathlib import Path

          root = Path(".")

          # 1. Update app/build.gradle.kts version to 2.1.5 and signing config
          gradle_file = root / "app/build.gradle.kts"
          if gradle_file.exists():
              g = gradle_file.read_text(encoding="utf-8")
              g = re.sub(r'versionCode\s*=\s*[^\n]+', 'versionCode = (System.getenv("BUILD_VERSION_CODE")?.toIntOrNull() ?: 215001)', g)
              g = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "2.1.5"', g)
              gradle_file.write_text(g, encoding="utf-8")

          # 2. Replace old version strings (2.1.x) across res & kotlin files with 2.1.5
          for p in root.rglob("*"):
              if p.is_file() and p.suffix in {".kt", ".xml"} and "_keystore_repo" not in p.parts:
                  txt = p.read_text(encoding="utf-8", errors="ignore")
                  new_txt = re.sub(r'\b2\.1\.[0-4]\b', '2.1.5', txt)
                  if new_txt != txt:
                      p.write_text(new_txt, encoding="utf-8")

          def ensure_import(src: str, imp: str) -> str:
              if imp in src:
                  return src
              m = re.search(r'^package\s+[^\n]+\n', src, re.M)
              if m:
                  return src[:m.end()] + f"import {imp}\n" + src[m.end():]
              return f"import {imp}\n" + src

          def find_matching_paren(s: str, open_idx: int) -> int:
              depth = 0
              i = open_idx
              n = len(s)
              in_str = False
              while i < n:
                  ch = s[i]
                  if ch == '"' and (i == 0 or s[i - 1] != '\\'):
                      in_str = not in_str
                  elif not in_str:
                      if ch == '(':
                          depth += 1
                      elif ch == ')':
                          depth -= 1
                          if depth == 0:
                              return i
                  i += 1
              return -1

          def find_matching_brace(s: str, open_idx: int) -> int:
              depth = 0
              i = open_idx
              n = len(s)
              in_str = False
              while i < n:
                  ch = s[i]
                  if ch == '"' and (i == 0 or s[i - 1] != '\\'):
                      in_str = not in_str
                  elif not in_str:
                      if ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return i
                  i += 1
              return -1

          # 3. Hook lyrics & player state across player/lyrics Kotlin files
          ui_root = root / "app/src/main/java/com/music/spotui"
          for kt in ui_root.rglob("*.kt"):
              if kt.name == "VnFrameRateManager.kt":
                  continue
              src = kt.read_text(encoding="utf-8")
              orig = src

              # Capture ordered lyrics lists when lyrics variables are read
              if any(k in kt.name.lower() for k in ("lyric", "player")):
                  src = ensure_import(src, "com.music.spotui.ui.screens.*")
                  # Capture lyrics list expressions like lyrics.forEach / items(lyrics) / syncedLyrics
                  src = re.sub(
                      r'\bitems\s*\(\s*([a-zA-Z0-9_.]+(?:[Ll]yric[a-zA-Z0-9_.]*|[Ll]ines))\s*\)',
                      r'items(\1.also { VnFpsPref.captureOrderedLyricsList(it) })',
                      src
                  )
                  # Scale lyric font sizes & capture text in Lyric files
                  if "lyric" in kt.name.lower():
                      src = re.sub(
                          r'\bText\s*\(\s*text\s*=\s*([^,\n]+)',
                          r'Text(text = vnStyleLyricTextAny(\1, isPlayer = true)',
                          src
                      )
                      src = re.sub(
                          r'(\b\d+(?:\.\d+)?\.sp)\b',
                          r'vnScalePlayerLyricSp(\1)',
                          src
                      )

              # Inject inline lyrics card into ImmersivePlayer.kt (and PlayerScreen.kt if present)
              if kt.name in {"ImmersivePlayer.kt", "PlayerScreen.kt"} and "VnPlayerInlineLyricsSection(" not in src:
                  src = ensure_import(src, "com.music.spotui.ui.screens.*")
                  # Insert right before PlayerControls( call or before closing of main player Column
                  m_ctrl = re.search(r'\bPlayerControls\s*\(', src)
                  if m_ctrl:
                      line_start = src.rfind('\n', 0, m_ctrl.start()) + 1
                      indent = re.match(r'[ \t]*', src[line_start:m_ctrl.start()]).group(0)
                      src = src[:line_start] + f"{indent}VnPlayerInlineLyricsSection()\n" + src[line_start:]

              # Inject VnVneraSettingsSection() into both ImmersiveSettingsScreen.kt and SettingsScreen.kt
              if kt.name in {"ImmersiveSettingsScreen.kt", "SettingsScreen.kt"} and "VnVneraSettingsSection()" not in src:
                  src = ensure_import(src, "com.music.spotui.ui.screens.*")
                  m_lazy = re.search(r'\bLazyColumn\s*\(', src)
                  if m_lazy:
                      p_end = find_matching_paren(src, m_lazy.end() - 1)
                      b_start = src.find('{', p_end) if p_end != -1 else -1
                      if b_start != -1:
                          src = src[:b_start + 1] + "\n        item { VnVneraSettingsSection() }\n" + src[b_start + 1:]
                  else:
                      m_col = re.search(r'\bColumn\s*\(', src)
                      if m_col:
                          p_end = find_matching_paren(src, m_col.end() - 1)
                          b_start = src.find('{', p_end) if p_end != -1 else -1
                          if b_start != -1:
                              src = src[:b_start + 1] + "\n        VnVneraSettingsSection()\n" + src[b_start + 1:]

              # Inject .vnAnimatedElement(idx) onto UI cards/surfaces in screens & immersive
              if ("/ui/" in kt.as_posix()) and "vnAnimatedElement(" not in src and "Dialog(" not in src:
                  anim_idx = 0
                  out = []
                  pos = 0
                  for m in re.finditer(r'\b(ElevatedCard|OutlinedCard|Card)\s*\(', src):
                      open_p = m.end() - 1
                      close_p = find_matching_paren(src, open_p)
                      if close_p == -1:
                          continue
                      args_str = src[open_p + 1:close_p]
                      if "vnAnimatedElement" in args_str:
                          continue
                      src = ensure_import(src, "com.music.spotui.ui.screens.vnAnimatedElement")
                      break

                  # Re-run cleanly after import insertion
                  pos = 0
                  out = []
                  for m in re.finditer(r'\b(ElevatedCard|OutlinedCard|Card)\s*\(', src):
                      open_p = m.end() - 1
                      close_p = find_matching_paren(src, open_p)
                      if close_p == -1:
                          continue
                      args_str = src[open_p + 1:close_p]
                      if "vnAnimatedElement" in args_str:
                          continue
                      out.append(src[pos:open_p + 1])
                      if re.search(r'\bmodifier\s*=', args_str):
                          patched_args = re.sub(
                              r'(\bmodifier\s*=\s*Modifier\b)',
                              rf'\1.vnAnimatedElement({anim_idx % 8})',
                              args_str,
                              count=1
                          )
                          if patched_args == args_str:
                              patched_args = re.sub(
                                  r'(\bmodifier\s*=\s*)',
                                  rf'\1Modifier.vnAnimatedElement({anim_idx % 8}).then(',
                                  args_str,
                                  count=1
                              ) + ")"
                      else:
                          sep = ", " if args_str.strip() else ""
                          patched_args = f"modifier = Modifier.vnAnimatedElement({anim_idx % 8}){sep}{args_str}"
                      out.append(patched_args)
                      pos = close_p
                      anim_idx += 1
                  out.append(src[pos:])
                  src = "".join(out)

              # Mount global VNEra guards in MainActivity.kt
              if kt.name == "MainActivity.kt" and "VnFrameRateGuard()" not in src:
                  src = ensure_import(src, "com.music.spotui.ui.screens.*")
                  m_sc = re.search(r'\bsetContent\s*\{', src)
                  if m_sc:
                      ins = m_sc.end()
                      guards = (
                          "\n            VnFrameRateGuard()\n"
                          "            VnFullscreenLyricsOverlay()\n"
                          "            VnShuffleNotificationBanner()\n"
                      )
                      src = src[:ins] + guards + src[ins:]

              if src != orig:
                  kt.write_text(src, encoding="utf-8")
                  print(f"Patched: {kt}")
          PY

      - name: Build VNEra 2.1.5 APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          [ -n "$APK_PATH" ] || { echo "ERROR: APK not generated"; exit 1; }
          cp -f "$APK_PATH" "dist/VNEra-2.1.5.apk"
          ls -lh "dist/VNEra-2.1.5.apk"

      - name: Upload VNEra 2.1.5 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VNEra-2.1.5
          path: dist/VNEra-2.1.5.apk
          if-no-files-found: error
