          object VnPlaybackMonitor {
              var activeAlertTitle by mutableStateOf<String?>(null)
              var activeAlertBody by mutableStateOf<String?>(null)
              private var lastKey = ""; private var prevTitle = ""; private var prevScore = -1; private var prevLabel = ""
              fun dismissAlert() { activeAlertTitle = null; activeAlertBody = null }

              fun qualityScore(label: String, kbps: Int = 0): Int {
                  val l = label.lowercase()
                  val tier = when {
                      listOf("hi-res", "hires", "24-bit", "24bit", "192", "96khz", "master", "mqa").any { l.contains(it) } -> 500
                      listOf("lossless", "flac", "alac", "wav", "16-bit", "16bit", "44.1", "48khz").any { l.contains(it) } -> 400
                      listOf("high", "320", "256").any { l.contains(it) } -> 300
                      listOf("medium", "normal", "160", "128").any { l.contains(it) } -> 200
                      listOf("low", "96", "64").any { l.contains(it) } || kbps > 0 -> if (kbps >= 900) 450 else if (kbps >= 256) 300 else if (kbps >= 128) 200 else 100
                      else -> 0
                  }
                  return if (tier > 0) tier + (kbps.coerceIn(0, 999) / 10) else 0
              }

              private fun parseList(raw: Any?): List<String> {
                  val s = raw?.toString()?.trim().orEmpty(); if (s.isEmpty() || s == "[]" || s == "{}") return emptyList()
                  if (s.startsWith("[")) return runCatching { val a = JSONArray(s); (0 until a.length()).mapNotNull { (a.opt(it) as? JSONObject)?.run { optString("id").ifBlank { optString("name") } } ?: a.opt(it)?.toString() }.map { it.trim() }.filter { it.isNotEmpty() } }.getOrDefault(emptyList())
                  return s.split(",", ";", "|", "\n").map { it.trim() }.filter { it.isNotEmpty() }
              }

              private fun readOrders(c: Context): Pair<List<String>, List<String>> {
                  var src = emptyList<String>(); var ext = emptyList<String>()
                  File(c.applicationInfo.dataDir, "shared_prefs").listFiles()?.filter { it.name.endsWith(".xml") }?.forEach { f ->
                      c.applicationContext.getSharedPreferences(f.name.removeSuffix(".xml"), Context.MODE_PRIVATE).all.forEach { (k, v) ->
                          val kl = k.lowercase(); val hasTag = listOf("order", "priority", "list", "enabled").any(kl::contains)
                          if (src.isEmpty() && (kl.contains("source") || kl.contains("provider")) && hasTag) parseList(v).takeIf { it.size >= 2 }?.let { src = it }
                          if (ext.isEmpty() && kl.contains("extension") && hasTag) parseList(v).takeIf { it.size >= 2 }?.let { ext = it }
                      }
                  }
                  return src to ext
              }

              fun onTrackPlaybackObserved(c: Context, key: String, title: String, source: String, quality: String, kbps: Int = 0) {
                  val ck = key.trim(); if (ck.isEmpty() || ck == lastKey) return
                  val cs = source.trim(); val cq = quality.trim(); val score = qualityScore(cq, kbps)
                  if (cs.isEmpty() && score == 0) return
                  lastKey = ck
                  val warnings = mutableListOf<String>()
                  val (srcOrder, extOrder) = readOrders(c)
                  if (srcOrder.isNotEmpty()) {
                      if (extOrder.isNotEmpty()) {
                          val commonExt = extOrder.filter { e -> srcOrder.any { s -> s.equals(e, true) || s.contains(e, true) || e.contains(s, true) } }
                          val expSrc = srcOrder.filter { s -> commonExt.any { e -> s.equals(e, true) || s.contains(e, true) || e.contains(s, true) } }
                          if (commonExt.size >= 2 && expSrc.size == commonExt.size && commonExt.zip(expSrc).any { (e, s) -> !e.equals(s, true) && !e.contains(s, true) && !s.contains(e, true) })
                              warnings.add("• Λάθος σειρά επεκτάσεων: Η σειρά των επεκτάσεων (${commonExt.joinToString(" → ")}) δεν συμφωνεί με τις Πηγές Ήχου (${expSrc.joinToString(" → ")}).")
                      }
                      if (cs.isNotEmpty()) {
                          val idx = srcOrder.indexOfFirst { it.equals(cs, true) || it.contains(cs, true) || cs.contains(it, true) }
                          if (idx > 0) warnings.add("• Εκτός σειράς πηγής ήχου: Το «${title.ifBlank { "Τρέχον" }}» μπήκε από «$cs» (θέση #${idx + 1}), ενώ προηγείται το «${srcOrder.first()}».")
                      }
                  }
                  if (prevScore > 0 && score > 0 && score < prevScore)
                      warnings.add("• Χαμηλότερη ποιότητα ήχου: Το «${title.ifBlank { "Τρέχον τραγούδι" }}» παίζει σε «${cq.ifBlank { "${kbps}kbps" }}», χαμηλότερη από το προηγούμενο «${prevTitle.ifBlank { "Προηγούμενο" }}» («${prevLabel.ifBlank { "Υψηλότερη" }}»).")
                  if (score > 0) { prevScore = score; prevLabel = cq.ifBlank { "${kbps}kbps" }; prevTitle = title }
                  if (warnings.isNotEmpty() && VnFpsPref.playbackAlertsEnabled) { activeAlertTitle = "Ειδοποίηση Αναπαραγωγής VNEra"; activeAlertBody = warnings.joinToString("\n\n") }
              }
          }

