          /**
           * Gestures για τα Fullscreen Lyrics:
           * - Αριστερή & δεξιά άκρη (22%): ελεύθερη κίνηση (scroll / δεξιά-αριστερά) χωρίς έξοδο.
           * - Μέση οθόνης (56%): tap για είσοδο/έξοδο από immersive fullscreen mode,
           *   και μόνο έντονο σύρσιμο προς τα κάτω (>130dp) για κλείσιμο.
           */
          fun Modifier.vnLyricsCenterGestures(
              activity: Activity?,
              onClose: (() -> Unit)? = null,
          ): Modifier = this
              .pointerInput(activity) {
                  detectTapGestures { offset ->
                      val w = size.width.toFloat()
                      if (w > 0f && offset.x in (w * 0.22f)..(w * 0.78f)) {
                          VnFpsPref.toggleSystemBars(activity)
                      }
                  }
              }
              .pointerInput(onClose) {
                  if (onClose == null) return@pointerInput
                  var dragY = 0f
                  var startedInCenter = false
                  detectVerticalDragGestures(
                      onDragStart = { startOffset ->
                          val w = size.width.toFloat()
                          startedInCenter = w > 0f && startOffset.x in (w * 0.22f)..(w * 0.78f)
                          dragY = 0f
                      },
                      onVerticalDrag = { _, dragAmount ->
                          if (startedInCenter) {
                              dragY += dragAmount
                          }
                      },
                      onDragEnd = {
                          if (startedInCenter && dragY > 130.dp.toPx()) {
                              onClose()
                          }
                          dragY = 0f
                          startedInCenter = false
                      },
                      onDragCancel = {
                          dragY = 0f
                          startedInCenter = false
                      },
                  )
              }

          @Composable
          fun VnFrameRateGuard() {
              val context = LocalContext.current
              val activity = remember(context) { context.findActivity() }
              val selectedFps = VnFpsPref.targetFps

              LaunchedEffect(context) {
                  VnFpsPref.init(context)
                  activity?.let { applyWindowFrameRate(it, VnFpsPref.targetFps, forceReset = true) }
              }

              LaunchedEffect(activity, selectedFps) {
                  activity?.let { applyWindowFrameRate(it, selectedFps, forceReset = true) }
              }

              DisposableEffect(activity) {
                  val act = activity ?: return@DisposableEffect onDispose {}
                  val decorView = act.window?.decorView
                  val app = act.application

                  val lifecycleCallbacks = object : Application.ActivityLifecycleCallbacks {
                      override fun onActivityCreated(a: Activity, b: Bundle?) {}
                      override fun onActivityStarted(a: Activity) {
                          if (a === act) applyWindowFrameRate(act, VnFpsPref.targetFps, forceReset = true)
                      }
                      override fun onActivityResumed(a: Activity) {
                          if (a === act) applyWindowFrameRate(act, VnFpsPref.targetFps, forceReset = true)
                      }
                      override fun onActivityPaused(a: Activity) {}
                      override fun onActivityStopped(a: Activity) {}
                      override fun onActivitySaveInstanceState(a: Activity, outState: Bundle) {}
                      override fun onActivityDestroyed(a: Activity) {}
                  }

                  val focusListener = ViewTreeObserver.OnWindowFocusChangeListener { hasFocus ->
                      if (hasFocus) {
                          applyWindowFrameRate(act, VnFpsPref.targetFps, forceReset = true)
                      }
                  }

                  app.registerActivityLifecycleCallbacks(lifecycleCallbacks)
                  decorView?.viewTreeObserver?.addOnWindowFocusChangeListener(focusListener)

                  onDispose {
                      app.unregisterActivityLifecycleCallbacks(lifecycleCallbacks)
                      decorView?.viewTreeObserver?.removeOnWindowFocusChangeListener(focusListener)
                  }
              }

              LaunchedEffect(activity, selectedFps) {
                  val act = activity ?: return@LaunchedEffect
                  while (true) {
                      delay(2_500L)
                      val wantHighFps = selectedFps == 0 || selectedFps >= 60
                      if (!wantHighFps) continue

                      val maxSupported = getSupportedRefreshRates(act).maxOrNull() ?: 60
                      if (maxSupported < 55) continue

                      var lastNanos = 0L
                      var slowFrames = 0
                      var samples = 0
                      val choreographer = Choreographer.getInstance()

                      val callback = object : Choreographer.FrameCallback {
                          override fun doFrame(frameTimeNanos: Long) {
                              if (lastNanos != 0L) {
                                  val deltaMs = (frameTimeNanos - lastNanos) / 1_000_000f
                                  if (deltaMs in 29.0f..41.0f) {
                                      slowFrames++
                                  }
                                  samples++
                              }
                              lastNanos = frameTimeNanos
                              if (samples < 4) {
                                  choreographer.postFrameCallback(this)
                              }
                          }
                      }
                      choreographer.postFrameCallback(callback)
                      delay(250L)

                      if (samples >= 3 && slowFrames >= 3) {
                          applyWindowFrameRate(act, selectedFps, forceReset = true)
                      }
                  }
              }
          }

