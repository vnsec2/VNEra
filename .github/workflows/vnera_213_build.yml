          # 10. Προσθήκη vnAnimatedElement σε βασικές κάρτες/στοιχεία UI
          for anim_target in [
              Path("app/src/main/java/com/music/spotui/ui/screens/SettingsScreen.kt"),
              Path("app/src/main/java/com/music/spotui/ui/immersive/pages/ImmersiveSettingsScreen.kt"),
