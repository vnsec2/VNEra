              fun isSwipeToExpandLyricsEnabled(c: Context): Boolean {
                  runCatching {
                      File(c.applicationInfo.dataDir, "shared_prefs").listFiles()?.filter { it.name.endsWith(".xml") }?.forEach { f ->
                          val all = c.applicationContext.getSharedPreferences(f.name.removeSuffix(".xml"), Context.MODE_PRIVATE).all
                          for ((k, v) in all) {
                              val kl = k.lowercase()
                              if ((kl.contains("swipe") && kl.contains("lyric")) || (kl.contains("expand") && kl.contains("lyric"))) {
                                  if (v is Boolean) return v
                              }
                          }
                      }
                  }
                  return true
              }

              fun setSystemBarsHidden(act: Activity?, hidden: Boolean) {
                  lyricsBarsHidden = hidden
                  val w = act?.window ?: return
                  WindowCompat.getInsetsController(w, w.decorView).apply {
                      if (hidden) {
                          systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          hide(WindowInsetsCompat.Type.systemBars())
                      } else {
                          show(WindowInsetsCompat.Type.systemBars())
                      }
                  }
              }
              fun toggleSystemBars(act: Activity?) = setSystemBarsHidden(act, !lyricsBarsHidden)

              fun exportAllPrefsJson(c: Context): JSONObject = JSONObject().also { all ->
                  File(c.applicationInfo.dataDir, "shared_prefs").listFiles()?.filter { it.name.endsWith(".xml") }?.forEach { f ->
                      val spName = f.name.removeSuffix(".xml")
                      val entries = JSONObject()
                      c.applicationContext.getSharedPreferences(spName, Context.MODE_PRIVATE).all.forEach { (k, v) ->
                          when (v) {
                              is Boolean -> entries.put(k, JSONObject().put("t", "b").put("v", v))
                              is Int -> entries.put(k, JSONObject().put("t", "i").put("v", v))
                              is Long -> entries.put(k, JSONObject().put("t", "l").put("v", v))
                              is Float -> entries.put(k, JSONObject().put("t", "f").put("v", v.toDouble()))
                              is String -> entries.put(k, JSONObject().put("t", "s").put("v", v))
                              is Set<*> -> entries.put(k, JSONObject().put("t", "set").put("v", JSONArray().apply { v.filterNotNull().forEach { put(it.toString()) } }))
                          }
                      }
                      all.put(spName, entries)
                  }
              }

              fun enrichBackupJson(c: Context, jsonStr: String): String = try {
                  JSONObject(jsonStr).put("__vnera_all_prefs__", exportAllPrefsJson(c)).toString(2).also { recordBackupAndExtractExtensions(c, it) }
              } catch (_: Exception) { recordBackupAndExtractExtensions(c, jsonStr); jsonStr }

              fun onBackupImported(c: Context, rawText: String): String {
                  recordBackupAndExtractExtensions(c, rawText)
                  try {
                      val root = JSONObject(rawText)
                      val allPrefs = root.optJSONObject("__vnera_all_prefs__")
                      if (allPrefs != null) {
                          allPrefs.keys().forEach { spName ->
                              val entries = allPrefs.optJSONObject(spName) ?: return@forEach
                              val ed = c.applicationContext.getSharedPreferences(spName, Context.MODE_PRIVATE).edit()
                              entries.keys().forEach { k ->
                                  if (k == KEY_LAST_BACKUP_JSON || k == KEY_LAST_BACKUP_EXTENSIONS || k == KEY_RESTORED_EXTENSIONS) return@forEach
                                  val item = entries.optJSONObject(k) ?: return@forEach
                                  when (item.optString("t")) {
                                      "b" -> ed.putBoolean(k, item.optBoolean("v"))
                                      "i" -> ed.putInt(k, item.optInt("v"))
                                      "l" -> ed.putLong(k, item.optLong("v"))
                                      "f" -> ed.putFloat(k, item.optDouble("v").toFloat())
                                      "s" -> ed.putString(k, item.optString("v"))
                                      "set" -> item.optJSONArray("v")?.let { arr -> ed.putStringSet(k, (0 until arr.length()).mapTo(LinkedHashSet()) { arr.optString(it) }) }
                                  }
                              }
                              ed.commit()
                          }
                      } else {
                          File(c.applicationInfo.dataDir, "shared_prefs").listFiles()?.filter { it.name.endsWith(".xml") }?.forEach { f ->
                              val sp = c.applicationContext.getSharedPreferences(f.name.removeSuffix(".xml"), Context.MODE_PRIVATE)
                              val existing = sp.all; val ed = sp.edit(); var mod = false
                              root.keys().forEach { k ->
                                  when (val cur = existing[k]) {
                                      is Boolean -> { ed.putBoolean(k, root.optBoolean(k, cur)); mod = true }
                                      is Int -> { ed.putInt(k, root.optInt(k, cur)); mod = true }
                                      is Long -> { ed.putLong(k, root.optLong(k, cur)); mod = true }
                                      is Float -> { ed.putFloat(k, root.optDouble(k, cur.toDouble()).toFloat()); mod = true }
                                      is String -> { ed.putString(k, root.optString(k, cur)); mod = true }
                                  }
                              }
                              if (mod) ed.commit()
                          }
                      }
                  } catch (_: Exception) {}
                  reload(c)
                  c.findActivity()?.let { act -> Handler(Looper.getMainLooper()).postDelayed({ if (!act.isFinishing && !act.isDestroyed) act.recreate() }, 350L) }
                  return rawText
              }

              fun recordBackupAndExtractExtensions(c: Context, raw: String) {
                  val ext = extractExtensionsFromBackup(raw).also { cachedExtensionsText = it }
                  prefs(c).edit().putString(KEY_LAST_BACKUP_JSON, raw).putString(KEY_LAST_BACKUP_EXTENSIONS, ext).commit()
              }

              private val ignoredSettingTokens = setOf(
                  "true", "false", "null", "[]", "{}", "auto", "default", "none", "high", "low", "medium",
                  "lossless", "normal", "enabled", "disabled", "order", "priority", "quality", "shuffle",
                  "repeat", "lyrics", "theme", "color", "fps", "anim", "backup", "cache", "timeout"
              )

              private fun isSystemSettingKey(key: String): Boolean {
                  val kl = key.lowercase()
                  return listOf(
                      "order", "priority", "quality", "audio", "theme", "color", "fps", "anim",
                      "shuffle", "repeat", "lyric", "player", "cache", "alert", "backup", "timeout",
                      "immersive", "swipe", "expand", "scale", "font", "mode", "pause", "equalizer",
                      "volume", "crossfade", "gapless", "normalize", "download", "wifi", "notification"
                  ).any { kl.contains(it) }
              }

              private fun formatExtEntry(name: String, url: String): String {
                  val cleanName = name.trim().trim('"', '\'', '-', ':', '|')
                  val cleanUrl = url.trim().trim('"', '\'')
                  if (cleanName.lowercase() in ignoredSettingTokens && cleanUrl.isEmpty()) return ""
                  if (cleanName.all { it.isDigit() || it == '.' } && cleanUrl.isEmpty()) return ""
                  return when {
                      cleanName.isNotEmpty() && cleanUrl.isNotEmpty() && !cleanName.equals(cleanUrl, true) -> "$cleanName - $cleanUrl"
                      cleanName.isNotEmpty() -> cleanName
                      cleanUrl.isNotEmpty() -> cleanUrl
                      else -> ""
                  }
              }

              private fun isRelevantExtUrl(u: String): Boolean {
                  val ul = u.lowercase()
                  if (!ul.startsWith("http://") && !ul.startsWith("https://")) return false
                  if (ul.contains("vnsec2/vnera") || ul.contains("revera.caruno.wtf")) return false
                  return true
              }

              fun extractExtensionsFromBackup(raw: String): String {
                  val trimmed = raw.trim()
                  if (trimmed.isEmpty()) return ""
                  val entries = LinkedHashMap<String, String>()
                  val urlRegex = Regex("""https?://[^\s"'<>\]\)]+""")

                  fun addEntry(name: String, url: String) {
                      val validUrl = if (isRelevantExtUrl(url)) url else ""
                      val formatted = formatExtEntry(name, validUrl)
                      if (formatted.isBlank()) return
                      val key = (validUrl.ifBlank { name.trim() }).lowercase()
                      val existing = entries[key]
                      if (existing == null || formatted.length > existing.length) {
                          entries[key] = formatted
                      }
                  }

                  fun extractObjectEntry(obj: JSONObject): Boolean {
                      if (obj.has("t") && obj.has("v") && obj.length() <= 3) return false
                      val nameKeys = listOf("extensionName", "pluginName", "addonName", "repoName", "displayName", "name", "title", "label")
                      val urlKeys = listOf("repoUrl", "repositoryUrl", "sourceUrl", "manifestUrl", "jsonUrl", "apkUrl", "downloadUrl", "url", "link", "uri", "href", "homepage", "repo")
                      var foundName = nameKeys.firstNotNullOfOrNull { k ->
                          obj.optString(k, "").trim().takeIf { it.isNotEmpty() && it.lowercase() !in ignoredSettingTokens }
                      }.orEmpty()
                      if (foundName.isEmpty()) {
                          val pkg = obj.optString("packageName", "").ifBlank { obj.optString("pkg", "") }.trim()
                          if (pkg.isNotEmpty() && pkg != "null") foundName = pkg
                      }
                      var foundUrl = urlKeys.firstNotNullOfOrNull { k ->
                          obj.optString(k, "").trim().takeIf { isRelevantExtUrl(it) }
                      }.orEmpty()
                      if (foundUrl.isEmpty()) {
                          foundUrl = urlRegex.find(obj.toString())?.value?.takeIf(::isRelevantExtUrl).orEmpty()
                      }
                      if (foundName.isNotEmpty() || foundUrl.isNotEmpty()) {
                          addEntry(foundName, foundUrl)
                          return true
                      }
                      return false
                  }

                  fun scan(node: Any?, hint: String = "") {
                      val hl = hint.lowercase()
                      if (hl == "__vnera_all_prefs__" || isSystemSettingKey(hl)) return
                      when (node) {
                          is JSONObject -> {
                              val isExtContext = listOf("extension", "addon", "plugin", "repositor", "repo", "installed").any { hl.contains(it) }
                              if (isExtContext && !node.has("t")) extractObjectEntry(node)
                              node.keys().forEach { k ->
                                  val kl = k.lowercase()
                                  if (kl == "__vnera_all_prefs__" || isSystemSettingKey(kl)) return@forEach
                                  val v = node.opt(k)
                                  val childIsExt = isExtContext || listOf("extension", "addon", "plugin", "repositor", "repo").any { kl.contains(it) }
                                  if (childIsExt) {
                                      when (v) {
                                          is JSONArray -> {
                                              for (i in 0 until v.length()) {
                                                  val el = v.opt(i)
                                                  if (el is JSONObject) extractObjectEntry(el)
                                                  else scan(el, k)
                                              }
                                          }
                                          is JSONObject -> {
                                              if (v.has("t") && v.has("v")) {
                                                  if (v.optString("t") in setOf("s", "set")) scan(v.opt("v"), k)
                                              } else if (!extractObjectEntry(v)) {
                                                  scan(v, k)
                                              }
                                          }
                                          is String -> scan(v, k)
                                      }
                                  } else {
                                      scan(v, k)
                                  }
                              }
                          }
                          is JSONArray -> {
                              for (i in 0 until node.length()) {
                                  val el = node.opt(i)
                                  if (el is JSONObject && listOf("extension", "addon", "plugin", "repositor", "repo").any { hl.contains(it) }) {
                                      extractObjectEntry(el)
                                  }
                                  scan(el, hint)
                              }
                          }
                          is String -> {
                              val s = node.trim()
                              if ((s.startsWith("{") || s.startsWith("[")) && s.length > 2) {
                                  runCatching {
                                      if (s.startsWith("{")) scan(JSONObject(s), hint)
                                      else scan(JSONArray(s), hint)
                                  }
                              } else if (listOf("extension", "addon", "plugin", "repositor", "repo").any { hl.contains(it) } && s.isNotEmpty() && s.lowercase() !in ignoredSettingTokens) {
                                  val u = urlRegex.find(s)?.value.orEmpty()
                                  val n = if (u.isNotEmpty()) s.replace(u, "").trim(' ', '-', ':', '|', '"', '\'') else s
                                  addEntry(n, u)
                              }
                          }
                      }
                  }

                  runCatching {
                      if (trimmed.startsWith("{")) scan(JSONObject(trimmed))
                      else if (trimmed.startsWith("[")) scan(JSONArray(trimmed))
                  }
                  if (entries.isEmpty()) {
                      trimmed.lines().forEach { line ->
                          val l = line.trim()
                          if (l.isEmpty() || l.startsWith("{") || l.startsWith("}")) return@forEach
                          val u = urlRegex.find(l)?.value?.takeIf(::isRelevantExtUrl).orEmpty()
                          val n = if (u.isNotEmpty()) l.replace(u, "").trim(' ', '-', ':', '|', '"', '\'') else l
                          if (u.isNotEmpty() || (!l.contains(":") && l.lowercase() !in ignoredSettingTokens)) {
                              addEntry(n, u)
                          }
                      }
                  }
                  return entries.values.joinToString("\n")
              }

              private fun collectInstalledExtensionsOnly(c: Context): LinkedHashSet<String> {
                  val collected = LinkedHashSet<String>()
                  runCatching {
                      File(c.filesDir.path).walkTopDown().maxDepth(4)
                          .filter { f ->
                              f.isFile &&
                              listOf("ext", "repo", "plugin", "addon").any { f.name.contains(it, true) || (f.parentFile?.name?.contains(it, true) == true) } &&
                              f.length() in 2..1_000_000
                          }
                          .forEach { f ->
                              val content = runCatching { f.readText() }.getOrDefault("")
                              if (content.trim().startsWith("{") || content.trim().startsWith("[")) {
                                  extractExtensionsFromBackup(content).lines().filter { it.isNotBlank() }.forEach(collected::add)
                              } else {
                                  val baseName = f.nameWithoutExtension.trim()
                                  if (baseName.isNotEmpty() && baseName.lowercase() !in ignoredSettingTokens) {
                                      collected.add(baseName)
                                  }
                              }
                          }
                  }
                  runCatching {
                      File(c.applicationInfo.dataDir, "shared_prefs").listFiles()?.filter { it.name.endsWith(".xml") }?.forEach { f ->
                          val spName = f.name.removeSuffix(".xml")
                          if (spName == PREFS_NAME) return@forEach
                          val all = c.applicationContext.getSharedPreferences(spName, Context.MODE_PRIVATE).all
                          for ((k, v) in all) {
                              val kl = k.lowercase()
                              if (isSystemSettingKey(kl)) continue
                              if (!listOf("extension", "addon", "plugin", "repositor", "repo").any { kl.contains(it) }) continue
                              when (v) {
                                  is String -> extractExtensionsFromBackup(v).lines().filter { it.isNotBlank() }.forEach(collected::add)
                                  is Set<*> -> v.filterNotNull().map { it.toString().trim() }.filter { it.isNotEmpty() && it.lowercase() !in ignoredSettingTokens }.forEach(collected::add)
                              }
                          }
                      }
                  }
                  prefs(c).getString(KEY_RESTORED_EXTENSIONS, "").orEmpty().lines().filter { it.isNotBlank() }.forEach(collected::add)
                  cachedExtensionsText.lines().filter { it.isNotBlank() }.forEach(collected::add)
                  return collected
              }

              fun copyExtensionsToClipboard(c: Context) {
                  init(c)
                  val collected = collectInstalledExtensionsOnly(c)
                  val text = collected.joinToString("\n")
                  if (text.isBlank()) {
                      Toast.makeText(c, "Δεν βρέθηκαν extensions για αντιγραφή", Toast.LENGTH_SHORT).show()
                      return
                  }
                  (c.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager).setPrimaryClip(ClipData.newPlainText("VNEra Extensions", text))
                  Toast.makeText(c, "Αντιγράφηκαν ${collected.size} extensions στο πρόχειρο", Toast.LENGTH_SHORT).show()
              }

              fun getClipboardText(c: Context): String = runCatching {
                  val cm = c.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cm.primaryClip?.getItemAt(0)?.coerceToText(c)?.toString().orEmpty()
              }.getOrDefault("")

              fun restoreExtensionsOnly(c: Context, rawInput: String): Int {
                  init(c)
                  val trimmed = rawInput.trim()
                  if (trimmed.isEmpty()) return 0
                  val parsedLines = if (trimmed.startsWith("{") || trimmed.startsWith("[")) {
                      extractExtensionsFromBackup(trimmed).lines().filter { it.isNotBlank() }
                  } else {
                      trimmed.lines().map { it.trim() }.filter { it.isNotEmpty() && it.lowercase() !in ignoredSettingTokens }
                  }
                  if (parsedLines.isEmpty()) return 0

                  val existing = collectInstalledExtensionsOnly(c)
                  existing.addAll(parsedLines)
                  val mergedText = existing.joinToString("\n")
                  cachedExtensionsText = mergedText
                  prefs(c).edit()
                      .putString(KEY_RESTORED_EXTENSIONS, mergedText)
                      .putString(KEY_LAST_BACKUP_EXTENSIONS, mergedText)
                      .apply()

                  val urlRegex = Regex("""https?://[^\s"'<>\]\)]+""")
                  val extObjects = JSONArray()
                  val extUrls = LinkedHashSet<String>()
                  val extNames = LinkedHashSet<String>()
                  parsedLines.forEach { line ->
                      val u = urlRegex.find(line)?.value.orEmpty()
                      val n = if (u.isNotEmpty()) line.replace(u, "").trim(' ', '-', ':', '|', '—') else line.trim()
                      if (u.isNotEmpty()) extUrls.add(u)
                      if (n.isNotEmpty()) extNames.add(n)
                      extObjects.put(JSONObject().apply {
                          if (n.isNotEmpty()) put("name", n)
                          if (u.isNotEmpty()) put("url", u)
                      })
                  }

                  runCatching {
                      val extDir = File(c.filesDir, "vnera_extensions").apply { mkdirs() }
                      File(extDir, "restored_extensions.json").writeText(extObjects.toString(2))
                  }

                  runCatching {
                      File(c.applicationInfo.dataDir, "shared_prefs").listFiles()?.filter { it.name.endsWith(".xml") }?.forEach { f ->
                          val spName = f.name.removeSuffix(".xml")
                          if (spName == PREFS_NAME) return@forEach
                          val sp = c.applicationContext.getSharedPreferences(spName, Context.MODE_PRIVATE)
                          val ed = sp.edit()
                          var modified = false
                          sp.all.forEach { (k, v) ->
                              val kl = k.lowercase()
                              if (isSystemSettingKey(kl)) return@forEach
                              if (!listOf("extension", "addon", "plugin", "repositor", "repo").any { kl.contains(it) }) return@forEach
                              when (v) {
                                  is Set<*> -> {
                                      val nextSet = LinkedHashSet<String>(v.filterNotNull().map { it.toString() })
                                      if (kl.contains("repo") || kl.contains("url")) nextSet.addAll(extUrls)
                                      else nextSet.addAll(extNames.ifEmpty { extUrls })
                                      ed.putStringSet(k, nextSet)
                                      modified = true
                                  }
                                  is String -> if (v.trim().startsWith("[")) {
                                      runCatching {
                                          val arr = JSONArray(v)
                                          for (i in 0 until extObjects.length()) arr.put(extObjects.getJSONObject(i))
                                          ed.putString(k, arr.toString())
                                          modified = true
                                      }
                                  }
                              }
                          }
                          if (modified) ed.apply()
                      }
                  }

                  return parsedLines.size
              }
          }

          fun vnCaptureLyricText(rawText: String, isActive: Boolean = true, fromPlayer: Boolean = false): String {
              VnFpsPref.captureLyricLine(rawText, isActive = isActive, fromPlayer = fromPlayer)
              return rawText
          }

          fun vnCaptureLyricTextWithColor(rawText: String, color: Color, fromPlayer: Boolean = false): String {
              val isHighlight = !color.isSpecified || color.alpha >= 0.78f
              VnFpsPref.captureLyricLine(rawText, isActive = isHighlight, fromPlayer = fromPlayer)
              return rawText
          }

          fun vnCaptureLyricText(rawText: AnnotatedString, isActive: Boolean = true, fromPlayer: Boolean = false): AnnotatedString {
              val hasActiveSpan = isActive && (rawText.spanStyles.isEmpty() || rawText.spanStyles.any { !it.item.color.isSpecified || it.item.color.alpha >= 0.78f })
              VnFpsPref.captureLyricLine(rawText.text, isActive = hasActiveSpan, fromPlayer = fromPlayer)
              return rawText
          }

          fun vnResolveSelectedLyricColor(): Color {
              val customArgb = VnFpsPref.lyricsCustomColorArgb
              val accentArgb = VnFpsPref.customAccentColorArgb
              val argb = when {
                  customArgb != 0L -> customArgb
                  accentArgb != 0L -> accentArgb
                  VnFpsPref.staticAppPrimaryArgb != 0L -> VnFpsPref.staticAppPrimaryArgb
                  else -> 0xFF7C4DFFL
              }
              return Color(argb)
          }

          fun vnPlayerInlineLyricColor(original: Color, isPlayer: Boolean = true): Color {
              if (!original.isSpecified || original.alpha <= 0.01f) return original
              val isDimBackground = original.alpha < 0.78f
              if (isPlayer && isDimBackground && VnFpsPref.playerKaraokeBgColorArgb != 0L) {
                  return Color(VnFpsPref.playerKaraokeBgColorArgb).copy(alpha = 0.72f)
              }
              if (!VnFpsPref.lyricsBeautifulEnabled) return original
              val chosen = vnResolveSelectedLyricColor()
              return if (isDimBackground) {
                  lerp(chosen, Color.White, 0.45f).copy(alpha = 0.48f)
              } else {
                  lerp(chosen, Color.White, 0.55f).copy(alpha = 1.0f)
              }
          }

          fun vnScalePlayerLyricSp(size: TextUnit): TextUnit {
              if (!size.isSpecified) return size
              val scale = VnFpsPref.playerLyricsFontScale.coerceIn(0.60f, 1.10f)
              return if (abs(scale - 1.0f) < 0.005f) size else (size.value * scale).sp
          }

          @Composable
          fun vnScalePlayerLyricTextStyle(baseStyle: TextStyle = LocalTextStyle.current): TextStyle {
              val c = LocalContext.current
              VnFpsPref.ensureInit(c)
              val scale = VnFpsPref.playerLyricsFontScale.coerceIn(0.60f, 1.10f)
              if (abs(scale - 1.0f) < 0.005f) return baseStyle
              val baseFontSize = if (baseStyle.fontSize.isSpecified) baseStyle.fontSize else 14.sp
              val baseLineHeight = if (baseStyle.lineHeight.isSpecified) baseStyle.lineHeight else (baseFontSize.value * 1.32f).sp
              return baseStyle.copy(
                  fontSize = (baseFontSize.value * scale).sp,
                  lineHeight = (baseLineHeight.value * scale).sp
              )
          }

          fun vnStyleLyricAnnotatedString(raw: AnnotatedString, isPlayer: Boolean = true): AnnotatedString {
              val hasActiveSpan = raw.spanStyles.isEmpty() || raw.spanStyles.any { !it.item.color.isSpecified || it.item.color.alpha >= 0.78f }
              VnFpsPref.captureLyricLine(raw.text, isActive = hasActiveSpan, fromPlayer = isPlayer)
              val hasCustomBg = isPlayer && VnFpsPref.playerKaraokeBgColorArgb != 0L
              val hasCustomActive = VnFpsPref.lyricsBeautifulEnabled
              val playerScale = VnFpsPref.playerLyricsFontScale.coerceIn(0.60f, 1.10f)
              val hasPlayerScale = isPlayer && abs(playerScale - 1.0f) >= 0.005f
              if (!hasCustomBg && !hasCustomActive && !hasPlayerScale) return raw
              if (raw.spanStyles.isEmpty()) return raw
              val bgTint = if (hasCustomBg) Color(VnFpsPref.playerKaraokeBgColorArgb).copy(alpha = 0.72f) else Color.Unspecified
              val activeChosen = vnResolveSelectedLyricColor()
              return buildAnnotatedString {
                  append(raw.text)
                  raw.paragraphStyles.forEach { addStyle(it.item, it.start, it.end) }
                  raw.spanStyles.forEach { range ->
                      val span = range.item
                      val c = span.color
                      val newColor = when {
                          !c.isSpecified || c.alpha <= 0.01f -> c
                          c.alpha < 0.78f -> when {
                              hasCustomBg -> bgTint
                              hasCustomActive -> lerp(activeChosen, Color.White, 0.45f).copy(alpha = 0.48f)
                              else -> c
                          }
                          hasCustomActive -> lerp(activeChosen, Color.White, 0.55f).copy(alpha = 1.0f)
                          else -> c
                      }
                      val newFontSize = if (hasPlayerScale && span.fontSize.isSpecified) {
                          (span.fontSize.value * playerScale).sp
                      } else {
                          span.fontSize
                      }
                      addStyle(span.copy(color = newColor, fontSize = newFontSize), range.start, range.end)
                  }
              }
          }

          fun vnStyleLyricTextAny(raw: String, isPlayer: Boolean = true): String {
              VnFpsPref.captureLyricLine(raw, isActive = true, fromPlayer = isPlayer)
              return raw
          }

          fun vnStyleLyricTextAny(raw: AnnotatedString, isPlayer: Boolean = true): AnnotatedString =
              vnStyleLyricAnnotatedString(raw, isPlayer = isPlayer)

          @Composable
          fun VnPlayerInlineLyricsBar(modifier: Modifier = Modifier) {
              val c = LocalContext.current
              val act = remember(c) { c.findActivity() }
              VnFpsPref.ensureInit(c)
              if (!VnFpsPref.playerInlineLyricsEnabled) return

              val recentlyRenderedNative = (SystemClock.elapsedRealtime() - VnFpsPref.lastNativePlayerLyricMs) in 0L..650L
              if (recentlyRenderedNative) return

              val lines = VnFpsPref.savedPlayerLyricLines
              val activeRaw = VnFpsPref.savedPlayerLyricText.trim()
              if (activeRaw.isEmpty() && lines.isEmpty()) return

              val activeIdx = remember(lines, activeRaw) {
                  if (activeRaw.isEmpty() || lines.isEmpty()) 0
                  else lines.indexOfFirst { it.equals(activeRaw, ignoreCase = true) }
                      .takeIf { it >= 0 }
                      ?: lines.indexOfFirst { it.contains(activeRaw, ignoreCase = true) || activeRaw.contains(it, ignoreCase = true) }
                          .coerceAtLeast(0)
              }
              val currentLine = activeRaw.ifBlank { lines.getOrNull(activeIdx).orEmpty() }
              if (currentLine.isBlank()) return
              val nextLine = if (lines.isNotEmpty() && activeIdx + 1 < lines.size) lines[activeIdx + 1] else ""

              val scale = VnFpsPref.playerLyricsFontScale.coerceIn(0.60f, 1.10f)
              val chosen = vnResolveSelectedLyricColor()
              val activeColor = if (VnFpsPref.lyricsBeautifulEnabled) {
                  lerp(chosen, Color.White, 0.55f)
              } else {
                  MaterialTheme.colorScheme.onSurface
              }
              val secondaryColor = if (VnFpsPref.playerKaraokeBgColorArgb != 0L) {
                  Color(VnFpsPref.playerKaraokeBgColorArgb).copy(alpha = 0.78f)
              } else if (VnFpsPref.lyricsBeautifulEnabled) {
                  lerp(chosen, Color.White, 0.45f).copy(alpha = 0.58f)
              } else {
                  MaterialTheme.colorScheme.onSurfaceVariant.copy(alpha = 0.68f)
              }

              Surface(
                  onClick = { VnFpsPref.openLyricsFullscreen(act) },
                  modifier = modifier
                      .fillMaxWidth()
                      .padding(horizontal = 16.dp, vertical = 6.dp)
                      .vnAnimatedElement(4),
                  shape = RoundedCornerShape(16.dp),
                  color = MaterialTheme.colorScheme.surfaceContainerHigh.copy(alpha = 0.62f)
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 14.dp, vertical = 10.dp),
                      verticalArrangement = Arrangement.spacedBy(3.dp)
                  ) {
                      Text(
                          text = currentLine,
                          style = MaterialTheme.typography.bodyMedium.copy(
                              fontSize = (15f * scale).sp,
                              lineHeight = (20f * scale).sp,
                              fontWeight = FontWeight.Bold
                          ),
                          color = activeColor,
                          maxLines = 2,
                          overflow = TextOverflow.Ellipsis
                      )
                      if (nextLine.isNotBlank()) {
                          Text(
                              text = nextLine,
                              style = MaterialTheme.typography.bodySmall.copy(
                                  fontSize = (12.5f * scale).sp,
                                  lineHeight = (16.5f * scale).sp,
                                  fontWeight = FontWeight.Medium
                              ),
                              color = secondaryColor,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis
                          )
                      }
                  }
              }
          }

