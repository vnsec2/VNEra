name: Build VNEra Debug APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main for Persistent Signing Key
        uses: actions/checkout@v4
        with:
          ref: main
          path: _keystore_repo

      - name: Prepare Persistent Debug Keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "_keystore_repo/.github/vnera-debug.keystore" ]; then
            mkdir -p "_keystore_repo/.github"
            keytool -genkeypair -v \
              -keystore "_keystore_repo/.github/vnera-debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=VNEra Debug,O=VNEra,C=GR"
            cd _keystore_repo
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/vnera-debug.keystore
            git commit -m "Add persistent keystore for seamless VNEra updates"
            git push || echo "Warning: Could not push keystore to main"
            cd ..
          fi
          cp -f "_keystore_repo/.github/vnera-debug.keystore" "$HOME/.android/debug.keystore"

      - name: Checkout source-review
        uses: actions/checkout@v4
        with:
          ref: work/source-review
          fetch-depth: 0

      - name: Merge VNEra Custom Changes onto Revera 1.0.8 Base
        run: |
          set -euo pipefail

          # 1. Backup Gradle wrapper, εικονιδίων και του δικού σου κώδικα (work/source-review)
          rm -rf /tmp/vnera_gradle /tmp/vnera_res /tmp/vnera_custom /tmp/revera_108 /tmp/revera_old /tmp/merge_repo
          mkdir -p /tmp/vnera_gradle /tmp/vnera_res /tmp/vnera_custom /tmp/revera_108 /tmp/revera_old

          [ -f "gradlew" ] && cp -f "gradlew" /tmp/vnera_gradle/
          [ -f "gradlew.bat" ] && cp -f "gradlew.bat" /tmp/vnera_gradle/
          if [ -d "gradle/wrapper" ]; then
            mkdir -p /tmp/vnera_gradle/wrapper
            cp -rf gradle/wrapper/* /tmp/vnera_gradle/wrapper/
          fi
          if [ -d "app/src/main/res" ]; then
            cp -rn app/src/main/res/mipmap* /tmp/vnera_res/ 2>/dev/null || true
            find app/src/main/res -maxdepth 2 -name "*ic_launcher*" -exec cp --parents -rn {} /tmp/vnera_res/ \; 2>/dev/null || true
          fi

          # Αντιγραφή του τρέχοντος VNEra tree (χωρίς μεγάλα archives)
          tar --exclude='.git' --exclude='.github' --exclude='_keystore_repo' --exclude='*.zip' -cf - . | tar -xf - -C /tmp/vnera_custom

          # 2. Λήψη Revera 1.0.8 και ιστορικού upstream για ακριβή εντοπισμό του παλιού base
          git remote add upstream https://revera.caruno.wtf/carunodev/Revera.git
          git fetch upstream +refs/heads/*:refs/remotes/upstream/* +refs/tags/*:refs/tags/* --prune

          git archive refs/tags/v1.0.8 | tar -x -C /tmp/revera_108
          GRADLE_SETTINGS=$(find /tmp/revera_108 -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1 || true)
          if [ -z "$GRADLE_SETTINGS" ]; then
            echo "ERROR: Δεν βρέθηκε Gradle root στο Revera v1.0.8"
            exit 1
          fi
          NEW_BASE_ROOT=$(dirname "$GRADLE_SETTINGS")
          echo "Revera 1.0.8 Gradle root: $NEW_BASE_ROOT"

          # 3. Εντοπισμός του ακριβούς commit/tag της Revera από το οποίο ξεκίνησε το work/source-review
          python3 <<'PY'
          import shutil
          import subprocess
          from pathlib import Path

          exts = {".kt", ".kts", ".xml", ".toml", ".properties", ".pro"}
          vnera_files = {
              str(p.relative_to("/tmp/vnera_custom")): p.read_bytes()
              for p in Path("/tmp/vnera_custom").rglob("*")
              if p.is_file() and p.suffix in exts and ".git" not in p.parts and ".github" not in p.parts
          }
          print(f"Comparing {len(vnera_files)} VNEra source files against upstream Revera revisions...")

          candidates = []
          tags = subprocess.check_output(["git", "tag", "-l", "v1.0.*"], text=True).splitlines()
          for t in sorted(tags):
              if t != "v1.0.8":
                  candidates.append((t, f"refs/tags/{t}"))

          # Έλεγχος και στα commits μεταξύ v1.0.6 και v1.0.8 μήπως το fork έγινε ενδιάμεσα
          if "v1.0.6" in tags:
              commits = subprocess.check_output(
                  ["git", "rev-list", "--first-parent", "refs/tags/v1.0.6..refs/tags/v1.0.8^"],
                  text=True,
              ).splitlines()
              for idx, c in enumerate(commits[:25]):
                  candidates.append((f"commit-{c[:8]}", c))

          best_label = "v1.0.7"
          best_ref = "refs/tags/v1.0.7"
          best_score = -1

          for label, ref in candidates:
              tmp_dir = Path("/tmp/rev_cand")
              if tmp_dir.exists():
                  shutil.rmtree(tmp_dir)
              tmp_dir.mkdir(parents=True, exist_ok=True)
              subprocess.run(f"git archive {ref} | tar -x -C {tmp_dir}", shell=True, check=True)
              base_dir = tmp_dir / "base" if (tmp_dir / "base").exists() else tmp_dir
              matches = 0
              for rel, data in vnera_files.items():
                  cand = base_dir / rel
                  if cand.exists() and cand.read_bytes() == data:
                      matches += 1
              print(f"Candidate {label}: {matches}/{len(vnera_files)} matching files")
              if matches > best_score:
                  best_score = matches
                  best_label = label
                  best_ref = ref

          print(f"SELECTED_OLD_BASE={best_label} ({best_score}/{len(vnera_files)} files matched)")
          Path("/tmp/best_base_ref.txt").write_text(best_ref)
          PY

          SELECTED_REF=$(cat /tmp/best_base_ref.txt)
          git archive "$SELECTED_REF" | tar -x -C /tmp/revera_old
          OLD_SETTINGS=$(find /tmp/revera_old -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1 || true)
          OLD_BASE_ROOT=$(dirname "${OLD_SETTINGS:-/tmp/revera_old/settings.gradle.kts}")

          # 4. 3-Way Git Merge: Εφαρμογή ΜΟΝΟ των δικών σου αλλαγών πάνω στη Revera 1.0.8
          git init /tmp/merge_repo
          cd /tmp/merge_repo
          git config user.name "VNEra Merge Bot"
          git config user.email "bot@vnera.local"

          # Commit 1: Ακριβής παλιά βάση Revera
          cp -a "$OLD_BASE_ROOT"/. .
          git add -A
          git commit -q -m "Old Revera base"

          # Commit 2 (branch vnera-custom): Ο δικός σου κώδικας VNEra
          git checkout -q -b vnera-custom
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp -a /tmp/vnera_custom/. .
          git add -A
          git commit -q -m "VNEra custom changes"

          # Branch revera-108 από Commit 1 -> Νέα βάση Revera 1.0.8
          git checkout -q -b revera-108 HEAD~1
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp -a "$NEW_BASE_ROOT"/. .
          git add -A
          git commit -q -m "Revera 1.0.8 base"

          # Εφαρμογή των δικών σου VNEra αλλαγών πάνω στη 1.0.8
          echo "=== Applying VNEra changes onto Revera 1.0.8 ==="
          git cherry-pick -X theirs vnera-custom

          echo "=== Summary of VNEra files merged onto 1.0.8 ==="
          git diff --stat HEAD~1 HEAD

          # 5. Επαναφορά στο workspace
          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name ".github" ! -name "_keystore_repo" -exec rm -rf {} +
          tar --exclude='.git' -cf - -C /tmp/merge_repo . | tar -xf - -C .

          # 6. Επαναφορά Gradle wrapper & εικονιδίων VNEra
          if [ ! -f "gradlew" ] && [ -f "/tmp/vnera_gradle/gradlew" ]; then
            cp -f /tmp/vnera_gradle/gradlew ./gradlew
            [ -f "/tmp/vnera_gradle/gradlew.bat" ] && cp -f /tmp/vnera_gradle/gradlew.bat ./gradlew.bat
            mkdir -p gradle/wrapper
            [ -f "/tmp/vnera_gradle/wrapper/gradle-wrapper.jar" ] && cp -f /tmp/vnera_gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
            if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ] && [ -f "/tmp/vnera_gradle/wrapper/gradle-wrapper.properties" ]; then
              cp -f /tmp/vnera_gradle/wrapper/gradle-wrapper.properties gradle/wrapper/
            fi
          fi
          chmod +x ./gradlew

          if [ -d "/tmp/vnera_res" ] && [ -d "app/src/main/res" ]; then
            cp -rf /tmp/vnera_res/mipmap* app/src/main/res/ 2>/dev/null || true
            if [ -d "/tmp/vnera_res/app/src/main/res" ]; then
              cp -rf /tmp/vnera_res/app/src/main/res/* app/src/main/res/ 2>/dev/null || true
            fi
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Link SDK 37 & Fix Versions & Apply Patches
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SUDO=""
          if command -v sudo >/dev/null 2>&1 && [ ! -w "$SDK_ROOT/platforms" ]; then
            SUDO="sudo"
          fi

          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            $SUDO ln -sfn "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"
          fi

          export HAS_SDK_37="false"
          if [ -d "$SDK_ROOT/platforms/android-37" ]; then
            export HAS_SDK_37="true"
          fi
          echo "HAS_SDK_37=$HAS_SDK_37" >> "$GITHUB_ENV"

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          has_sdk_37 = os.environ.get("HAS_SDK_37") == "true"
          print(f"HAS_SDK_37 = {has_sdk_37}")
          target_agp = '9.1.0' if has_sdk_37 else '8.7.2'

          # 1. Διόρθωση εκδόσεων Kotlin (2.2.20) & AGP (9.1.0)
          for cfg_path in [Path("gradle/libs.versions.toml"), Path("build.gradle.kts"), Path("settings.gradle.kts")]:
              if cfg_path.exists():
                  t = cfg_path.read_text()
                  t = t.replace('2.4.10', '2.2.20').replace('2.4.21', '2.2.20')
                  t = t.replace('9.4.1', target_agp)
                  if not has_sdk_37:
                      t = re.sub(r'(compileSdk|targetSdk)\s*=\s*"?37"?', r'\g<1> = "35"', t)
                  cfg_path.write_text(t)

          # 2. Ρύθμιση compileSdk / targetSdk μόνο αν λείπει το SDK 37
          if not has_sdk_37:
              for gradle_file in Path(".").rglob("*.gradle.kts"):
                  t = gradle_file.read_text()
                  t_new = re.sub(r'(compileSdk|targetSdk)\s*=\s*37', r'\g<1> = 35', t)
                  t_new = re.sub(r'(compileSdk|targetSdk)\.set\(37\)', r'\g<1>.set(35)', t_new)
                  if t != t_new:
                      gradle_file.write_text(t_new)

          # 3. Όνομα εφαρμογής VNEra σε όλα τα strings.xml
          for s_path in Path("app/src/main/res").rglob("strings.xml"):
              s_xml = s_path.read_text()
              s_xml_new = re.sub(r'<string name="app_name"[^>]*>.*?</string>', '<string name="app_name">VNEra</string>', s_xml)
              if s_xml != s_xml_new:
                  s_path.write_text(s_xml_new)
                  print(f"Updated app_name -> VNEra in {s_path}")

          # 4. Update Version, Unique ApplicationId, projectUrl & Packaging Excludes
          gradle = Path("app/build.gradle.kts")
          if gradle.exists():
              text = gradle.read_text()
              text = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "app.vnera.music"', text)
              text = re.sub(r'versionName\s*=\s*".*?"', 'versionName = "2.1.3"', text)
              text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 213', text)
              if "projectUrl" in text and not re.search(r'\b(val|var)\s+projectUrl\b', text):
                  text = re.sub(
                      r'(?m)^(\s*android\s*\{)',
                      r'val projectUrl = providers.gradleProperty("projectUrl").orElse("https://github.com/vnsec2/VNEra").get()\n\n\1',
                      text,
                      count=1,
                  )
              if "META-INF/versions/9/OSGI-INF/MANIFEST.MF" not in text:
                  text += '\nandroid {\n    packaging {\n        resources {\n            excludes += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"\n            excludes += "META-INF/versions/9/module-info.class"\n        }\n    }\n}\n'
              gradle.write_text(text)

          # 5. Compatibility guard για UpdateChecker.kt (μόνο αν λείπουν standalone constants)
          upd = Path("app/src/main/java/com/music/spotui/data/api/UpdateChecker.kt")
          if upd.exists():
              ut = upd.read_text()
              missing_consts = []
              if re.search(r'(?<![.\w])UPDATE_BASE_URL\b', ut) and not re.search(r'\bval\s+UPDATE_BASE_URL\b', ut):
                  missing_consts.append('private const val UPDATE_BASE_URL = "https://api.github.com/repos/vnsec2/VNEra"')
              if re.search(r'(?<![.\w])PROJECT_URL\b', ut) and not re.search(r'\bval\s+PROJECT_URL\b', ut):
                  missing_consts.append('private const val PROJECT_URL = "https://github.com/vnsec2/VNEra"')
              if missing_consts:
                  lines = ut.splitlines()
                  last_import_idx = max((i for i, l in enumerate(lines) if l.startswith("import ")), default=0)
                  lines.insert(last_import_idx + 1, "\n" + "\n".join(missing_consts))
                  upd.write_text("\n".join(lines) + "\n")
                  print("Injected missing UpdateChecker constants after imports")

          # 6. Fix CastMessage.kt expression-body return
          cast_msg = Path("app/src/main/java/com/music/spotui/cast/CastMessage.kt")
          if cast_msg.exists():
              lines = cast_msg.read_text().splitlines()
              target_idx = min(36, len(lines) - 1)
              if "return" in lines[target_idx]:
                  fun_idx = None
                  for i in range(target_idx, -1, -1):
                      if re.search(r'\bfun\b', lines[i]):
                          fun_idx = i
                          break
                  if fun_idx is not None:
                      paren = 0
                      eq_line = None
                      eq_col = None
                      for i in range(fun_idx, target_idx + 1):
                          line = lines[i]
                          for c_idx, ch in enumerate(line):
                              if ch == '(':
                                  paren += 1
                              elif ch == ')':
                                  paren -= 1
                              elif ch == '=' and paren == 0:
                                  prev_ch = line[c_idx - 1] if c_idx > 0 else ''
                                  next_ch = line[c_idx + 1] if c_idx + 1 < len(line) else ''
                                  if prev_ch not in ('=', '!', '<', '>') and next_ch not in ('=', '>'):
                                      eq_line = i
                                      eq_col = c_idx
                                      break
                          if eq_line is not None:
                              break

                      if eq_line is not None:
                          indent = re.match(r'^(\s*)', lines[fun_idx]).group(1)
                          brace = paren = bracket = 0
                          has_body = False
                          end_line = eq_line
                          for i in range(eq_line, len(lines)):
                              seg = lines[i][eq_col + 1:] if i == eq_line else lines[i]
                              code_part = seg.split('//')[0]
                              if code_part.strip():
                                  has_body = True
                              for ch in code_part:
                                  if ch == '{': brace += 1
                                  elif ch == '}': brace -= 1
                                  elif ch == '(': paren += 1
                                  elif ch == ')': paren -= 1
                                  elif ch == '[': bracket += 1
                                  elif ch == ']': bracket -= 1
                              if has_body and brace <= 0 and paren <= 0 and bracket <= 0 and i >= target_idx:
                                  nxt = lines[i + 1].lstrip() if i + 1 < len(lines) else ''
                                  if not nxt.startswith(('.', '?.', '?:', '&&', '||')):
                                      end_line = i
                                      break

                          before_eq = lines[eq_line][:eq_col].rstrip()
                          after_eq = lines[eq_line][eq_col + 1:].lstrip()
                          if after_eq:
                              lines[eq_line] = f"{before_eq} {{\n{indent}    return {after_eq}"
                          else:
                              lines[eq_line] = f"{before_eq} {{"
                              lines[eq_line + 1] = f"{indent}    return " + lines[eq_line + 1].lstrip()
                          lines[end_line] = lines[end_line] + f"\n{indent}}}"
                          cast_msg.write_text("\n".join(lines) + "\n")

          # 7. Lyrics Swipe Gestures
          lyrics_file = Path("app/src/main/java/com/music/spotui/ui/screens/LyricsScreen.kt")
          if lyrics_file.exists():
              src = lyrics_file.read_text()
              src_mod = re.sub(r'if\s*\(\s*drag\s*>\s*([^)]+)\)\s*onExpand\(\)', r'if (drag < -\1) onExpand()', src)
              src_mod = re.sub(r'if\s*\(\s*drag\s*<\s*-\s*([^)]+)\)\s*onClose\(\)', r'if (drag > \1) onClose()', src_mod)

              detector_import = "import androidx.compose.foundation.gestures.detectVerticalDragGestures"
              if detector_import not in src_mod and "import androidx.compose.foundation.gestures.detectTapGestures" in src_mod:
                  src_mod = src_mod.replace(
                      "import androidx.compose.foundation.gestures.detectTapGestures",
                      "import androidx.compose.foundation.gestures.detectTapGestures\n" + detector_import,
                      1,
                  )
              if "pointerInput" not in src_mod and "import androidx.compose.ui.input.pointer.pointerInput" not in src_mod:
                  src_mod = src_mod.replace(
                      detector_import,
                      detector_import + "\nimport androidx.compose.ui.input.pointer.pointerInput",
                      1,
                  )

              if "onExpand()" in src_mod and "pointerInput(onExpand)" not in src_mod:
                  src_mod = re.sub(
                      r'(\.clickable\([^)]*\)\s*\{\s*onExpand\(\)\s*\})',
                      r'''\1
                  .pointerInput(onExpand) {
                      var drag = 0f
                      detectVerticalDragGestures(
                          onVerticalDrag = { change, amount ->
                              drag += amount
                              change.consume()
                          },
                          onDragEnd = {
                              if (drag < -48.dp.toPx()) onExpand()
                              drag = 0f
                          },
                          onDragCancel = { drag = 0f },
                      )
                  }''',
                      src_mod,
                      count=1,
                  )

              if "onClose" in src_mod and "pointerInput(onClose)" not in src_mod:
                  src_mod = re.sub(
                      r'(\.height\(64\.dp\)(?:\.[a-zA-Z0-9_]+\([^()]*\))*)',
                      r'''\1
              .pointerInput(onClose) {
                  var drag = 0f
                  detectVerticalDragGestures(
                      onVerticalDrag = { change, amount ->
                          drag += amount
                          change.consume()
                      },
                      onDragEnd = {
                          if (drag > 48.dp.toPx()) onClose()
                          drag = 0f
                      },
                      onDragCancel = { drag = 0f },
                  )
              }''',
                      src_mod,
                      count=1,
                  )

              if src_mod != src:
                  lyrics_file.write_text(src_mod)

          # 8. Immersive Player fix
          p2 = Path("app/src/main/java/com/music/spotui/ui/immersive/player/ImmersivePlayer.kt")
          if p2.exists():
              s = p2.read_text()
              if "PointerEventPass" not in s and "import androidx.compose.ui.input.pointer.positionChange" in s:
                  s = s.replace(
                      "import androidx.compose.ui.input.pointer.positionChange",
                      "import androidx.compose.ui.input.pointer.positionChange\nimport androidx.compose.ui.input.pointer.PointerEventPass\nimport androidx.compose.ui.input.pointer.positionChangeIgnoreConsumed",
                      1,
                  )
              s = s.replace("awaitPointerEvent()", "awaitPointerEvent(PointerEventPass.Initial)").replace("change.positionChange().y", "change.positionChangeIgnoreConsumed().y").replace("76.dp.toPx()", "48.dp.toPx()")
              p2.write_text(s)
          PY

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          EXTRA_FLAGS=""
          if [ "$HAS_SDK_37" != "true" ]; then
            EXTRA_FLAGS="-Pandroid.suppressUnsupportedCompileSdk=37"
          fi
          ./gradlew :app:assembleDebug $EXTRA_FLAGS -PappVersionName="2.1.3" -PappVersionCode="213" -Pabis=arm64-v8a -PupdateRepo=vnsec2/VNEra --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VNEra-2.1.3-Debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
