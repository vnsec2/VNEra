                                  )
                                  for k in range(se + 1, be + 1):
                                      if ".fillMaxSize()" in lines[k]:
                                          lines[k] = lines[k].replace(
                                              ".fillMaxSize()",
                                              ".fillMaxSize().then(Modifier.vnFullscreenSlideContainer(vnClosingDown)).then(Modifier.vnSmartLyricsSwipe(vnLyricsActivity, isExpanded = true, onCollapseToPlayer = vnTriggerClose))",
                                              1
                                          )
                                          break
                                  s1 = "".join(lines)
                                  s1 = re.sub(r'(?m)^(package\s+[^\r\n]+)', r'\1\nimport com.music.spotui.ui.screens.findActivity\nimport com.music.spotui.ui.screens.vnFullscreenSlideContainer\nimport com.music.spotui.ui.screens.vnSmartLyricsSwipe\nimport kotlinx.coroutines.launch', s1, count=1)
                                  break
              if s1 != s0: lf.write_text(s1)

          # 3. ImmersiveLyricsPanel.kt: single button (ownerId = "immersive_panel", hidden if LyricsScreen is active)
          il = Path("app/src/main/java/com/music/spotui/ui/immersive/lyrics/ImmersiveLyricsPanel.kt")
          if il.exists():
              t0 = il.read_text()
              t1 = hook_lazy_cols(t0, "VnRegisterLyricsScrollState")
              if "vnSmartLyricsSwipe" not in t1 and ".fillMaxSize()" in t1:
                  lines = t1.splitlines(keepends=True)
                  for i in range(len(lines)):
                      if re.search(r'\bfun\s+ImmersiveLyricsPanel\b', lines[i]):
                          paren = 0; se = None
                          for j in range(i, min(i + 25, len(lines))):
                              paren += lines[j].count("(") - lines[j].count(")")
                              if paren <= 0 and "{" in lines[j]: se = j; break
                          if se is not None:
                              sig = "".join(lines[i:se+1])
                              has_expand = bool(re.search(r'\bonExpand\s*:', sig))
                              has_collapse = bool(re.search(r'\bonCollapse\s*:', sig))
                              has_close = bool(re.search(r'\bonClose\s*:', sig))
                              has_is_exp = re.search(r'\b(isExpanded|expanded|isFullscreen)\s*:', sig)
                              expand_expr = "onExpand()" if has_expand else ""
                              collapse_expr = "onCollapse()" if has_collapse else ("onClose()" if has_close else "")
                              is_fs_expr = f"({has_is_exp.group(1)} || com.music.spotui.ui.screens.VnFpsPref.lyricsFullscreenOpen)" if has_is_exp else "com.music.spotui.ui.screens.VnFpsPref.lyricsFullscreenOpen"
                              lines[se] += (
                                  "    com.music.spotui.ui.screens.VnLyricsFullscreenEffect()\n"
                                  "    val vnImmLyricsActivity = androidx.compose.ui.platform.LocalContext.current.findActivity()\n"
                                  "    var vnImmClosingDown by androidx.compose.runtime.remember { androidx.compose.runtime.mutableStateOf(false) }\n"
                                  "    val vnImmScope = androidx.compose.runtime.rememberCoroutineScope()\n"
                                  f"    val vnIsFullscreen = {is_fs_expr}\n"
                                  "    val vnOnOpenFs: () -> Unit = {\n"
                                  "        vnImmClosingDown = false\n"
                                  f"        com.music.spotui.ui.screens.VnFpsPref.openLyricsFullscreen(vnImmLyricsActivity) {{ {expand_expr} }}\n"
                                  "    }\n"
                                  "    val vnOnCloseFs: () -> Unit = {\n"
                                  "        if (!vnImmClosingDown) {\n"
                                  "            vnImmClosingDown = true\n"
                                  "            vnImmScope.launch {\n"
                                  "                kotlinx.coroutines.delay(220L)\n"
                                  f"                com.music.spotui.ui.screens.VnFpsPref.closeLyricsFullscreen(vnImmLyricsActivity) {{ {collapse_expr} }}\n"
                                  "                vnImmClosingDown = false\n"
                                  "            }\n"
                                  "        }\n"
                                  "    }\n"
                                  "    com.music.spotui.ui.screens.VnLyricsFullscreenButton(isFullscreen = vnIsFullscreen, ownerId = \"immersive_panel\", onClick = { if (vnIsFullscreen) vnOnCloseFs() else vnOnOpenFs() })\n"
                              )
                              for k in range(se + 1, len(lines)):
                                  if ".fillMaxSize()" in lines[k]:
                                      lines[k] = lines[k].replace(
                                          ".fillMaxSize()",
                                          ".fillMaxSize().then(if (vnIsFullscreen) Modifier.vnFullscreenSlideContainer(vnImmClosingDown) else Modifier).then(Modifier.vnSmartLyricsSwipe(vnImmLyricsActivity, isExpanded = vnIsFullscreen, onExpandToFullscreen = vnOnOpenFs, onCollapseToPlayer = vnOnCloseFs))",
                                          1
                                      )
                                      break
                              t1 = "".join(lines)
                              t1 = re.sub(r'(?m)^(package\s+[^\r\n]+)', r'\1\nimport com.music.spotui.ui.screens.findActivity\nimport com.music.spotui.ui.screens.vnFullscreenSlideContainer\nimport com.music.spotui.ui.screens.vnSmartLyricsSwipe\nimport kotlinx.coroutines.launch', t1, count=1)
                              break
              if t1 != t0: il.write_text(t1)

          # 4. Inline Player Lyrics: patch ALL Text(...) inside the player inline lyrics block so it NEVER resets to white
          def wrap_arg_call(call_src: str, param_name: str, wrapper_fn: str, default_expr: str | None = None) -> tuple[str, bool]:
              m = re.search(rf'\b{param_name}\s*=\s*', call_src)
              if not m:
                  if default_expr is not None:
                      close_idx = call_src.rfind(")")
                      if close_idx != -1:
                          before = call_src[:close_idx].rstrip()
                          comma = "" if before.endswith("(") or before.endswith(",") else ", "
                          return f"{before}{comma}{param_name} = {wrapper_fn}({default_expr}){call_src[close_idx:]}", True
                  return call_src, False
              start_val = m.end()
              if wrapper_fn in call_src[start_val:start_val + len(wrapper_fn) + 45]:
                  return call_src, False
              depth_p = depth_b = depth_c = 0
              end_val = len(call_src)
              for idx_c in range(start_val, len(call_src)):
                  ch = call_src[idx_c]
                  if ch == '(': depth_p += 1
                  elif ch == ')':
                      if depth_p == 0 and depth_b == 0 and depth_c == 0:
                          end_val = idx_c
                          break
                      depth_p -= 1
                  elif ch == '[': depth_b += 1
                  elif ch == ']': depth_b -= 1
                  elif ch == '{': depth_c += 1
                  elif ch == '}': depth_c -= 1
                  elif ch == ',' and depth_p == 0 and depth_b == 0 and depth_c == 0:
                      end_val = idx_c
                      break
              expr = call_src[start_val:end_val].strip()
              if not expr:
                  return call_src, False
              return f"{call_src[:start_val]}{wrapper_fn}({expr}){call_src[end_val:]}", True

          def patch_inline_player_lyrics(path: Path):
              if not path.exists() or path.name in ("VnFrameRateManager.kt", "LyricsScreen.kt", "ImmersiveLyricsPanel.kt"):
                  return
              src = path.read_text()
              if "vnPlayerInlineLyricColor" in src:
                  return
              lines = src.splitlines(keepends=True)
              changed = False
              for idx, line in enumerate(lines):
                  if re.search(r'(?:ChevronRight|KeyboardArrowRight|ArrowForwardIos|">"|"›")', line):
                      win_start = max(0, idx - 26)
                      win_end = min(len(lines), idx + 16)
                      win_txt = "".join(lines[win_start:win_end])
                      if re.search(r'\blyric', win_txt, re.IGNORECASE) and not re.search(r'FormatQuote|lyrics_button|openLyrics|Settings', win_txt, re.IGNORECASE):
                          k = win_start
                          while k < win_end:
                              if re.search(r'\bText\s*\(', lines[k]) and '">"' not in lines[k] and '"›"' not in lines[k]:
                                  p_cnt = 0
                                  t_end = k
                                  for j in range(k, min(len(lines), k + 18)):
                                      p_cnt += lines[j].count("(") - lines[j].count(")")
                                      if p_cnt <= 0:
                                          t_end = j
                                          break
                                  call_block = "".join(lines[k:t_end + 1])
                                  new_block, c0 = wrap_arg_call(
                                      call_block,
                                      "text",
                                      "com.music.spotui.ui.screens.vnPlayerInlineLyricText"
                                  )
                                  new_block, c1 = wrap_arg_call(
                                      new_block,
                                      "color",
                                      "com.music.spotui.ui.screens.vnPlayerInlineLyricColor",
                                      "androidx.compose.material3.LocalContentColor.current"
                                  )
                                  if "fontSize" in new_block:
                                      new_block, c2 = wrap_arg_call(new_block, "fontSize", "com.music.spotui.ui.screens.vnScaleLyricFontSize")
                                  elif "style" in new_block:
                                      new_block, c2 = wrap_arg_call(new_block, "style", "com.music.spotui.ui.screens.vnScaleLyricTextStyle")
                                  else:
                                      new_block, c2 = wrap_arg_call(
                                          new_block,
                                          "fontSize",
                                          "com.music.spotui.ui.screens.vnScaleLyricFontSize",
                                          "androidx.compose.ui.unit.TextUnit.Unspecified"
                                      )
                                  if c0 or c1 or c2:
                                      lines[k:t_end + 1] = [new_block]
                                      changed = True
                                      k = t_end + 1
                                      continue
                              k += 1
                          if changed:
                              break
              if changed:
                  path.write_text("".join(lines))
                  print(f"Patched inline player lyrics in {path}")

          for ui_kt in sorted(Path("app/src/main/java/com/music/spotui/ui").rglob("*.kt")):
              patch_inline_player_lyrics(ui_kt)

          # Track isPlaying state for animation pause/resume
          for ctrl_kt in sorted(Path("app/src/main/java/com/music/spotui/ui").rglob("*.kt")):
              if ctrl_kt.name == "VnFrameRateManager.kt":
                  continue
              ct = ctrl_kt.read_text()
              if "isPlaying" in ct and "VnFpsPref.isPlaybackPlaying" not in ct and "@Composable" in ct:
                  ct_new, n = re.subn(
                      r'(?m)^([ \t]*)(if\s*\(\s*isPlaying\s*\))',
                      r'\1com.music.spotui.ui.screens.VnFpsPref.isPlaybackPlaying = isPlaying\n\1\2',
                      ct,
                      count=1
                  )
                  if n > 0:
                      ctrl_kt.write_text(ct_new)

          extra_c = ", ".join(f"Color(0xFF{c})" for c in ["E53935","FF5722","FF9800","FFC107","00BFA5","00BCD4","3F51B5","7C4DFF","E040FB","FF4081","64FFDA","FFAB91","B388FF","ECEFF1"])
          for kf in sorted(Path("app/src/main/java/com/music/spotui").rglob("*.kt")):
              if kf.name == "VnFrameRateManager.kt": continue
              o = kf.read_text()
              u = re.sub(r'listOf\(((?:\s*Color\([^)]+\)\s*,?)+)\s*\)', lambda m: f"listOf({m.group(1).rstrip()}{'' if m.group(1).rstrip().endswith(',') else ','} {extra_c}\n)" if m.group(1).count("Color(") >= 3 and "0xFFE53935" not in m.group(1) else m.group(0), o)
              if u != o: kf.write_text(u)

          for tf in sorted(Path("app/src/main/java/com/music/spotui/ui/theme").rglob("*.kt")):
              tt = tf.read_text()
              if "MaterialTheme(" in tt and "customAccentColorArgb" not in tt:
                  tn, n = re.subn(r'MaterialTheme\s*\(\s*colorScheme\s*=\s*([A-Za-z0-9_]+)', r'MaterialTheme(\n        colorScheme = if (com.music.spotui.ui.screens.VnFpsPref.customAccentColorArgb != 0L) \1.copy(primary = androidx.compose.ui.graphics.Color(com.music.spotui.ui.screens.VnFpsPref.customAccentColorArgb), secondary = androidx.compose.ui.graphics.Color(com.music.spotui.ui.screens.VnFpsPref.customAccentColorArgb)) else \1', tt, count=1)
                  if n > 0: tf.write_text(tn)

          # 5. Inject VNEra settings cards ONLY into real Settings screens (ImmersiveSettingsScreen.kt & SettingsScreen.kt)
          settings_files = [
              Path("app/src/main/java/com/music/spotui/ui/immersive/pages/ImmersiveSettingsScreen.kt"),
              Path("app/src/main/java/com/music/spotui/ui/screens/SettingsScreen.kt"),
          ]

          res_map: dict[str, set[str]] = {"lyrics": set(), "appearance": set(), "playback": set()}
          for xml_f in Path("app/src/main/res").rglob("*.xml"):
              xt = xml_f.read_text(errors="ignore")
              for m in re.finditer(r'<string\s+name="([^"]+)"[^>]*>([^<]+)</string>', xt):
                  k, val = m.group(1), m.group(2)
                  if re.search(r'(?:Στίχοι|Lyrics|Προεπισκόπηση στίχων|Swipe to expand lyrics|Στοιχεία|Elements)', val, re.I):
                      res_map["lyrics"].add(k)
                  if re.search(r'(?:Εμφάνιση|Appearance|Χρώμα τόνου|Accent color|Dynamic color|Δυναμικό χρώμα|Θέμα|Theme)', val, re.I):
                      res_map["appearance"].add(k)
                  if re.search(r'(?:Αναπαραγωγή|Playback|Ποιότητα ήχου|Audio quality|Gapless|Normalization|Κανονικοποίηση)', val, re.I):
                      res_map["playback"].add(k)

          def build_cat_regex(literals: str, keys: set[str]) -> str:
              parts = [rf'"[^"]*(?:{literals})[^"]*"'] + [rf'\bR\.string\.{re.escape(k)}\b' for k in keys]
              return "|".join(parts)

          cat_configs = [
              (
                  "lyrics",
                  "VnLyricsSettingsCard",
                  build_cat_regex(r'Στίχοι|Lyrics|Προεπισκόπηση στίχων|Swipe to expand lyrics|Στοιχεία|Elements', res_map["lyrics"]),
                  "com.music.spotui.ui.screens.VnLyricsSettingsCard()"
              ),
              (
                  "appearance",
                  "VnAppearanceSettingsCard",
                  build_cat_regex(r'Εμφάνιση|Appearance|Χρώμα τόνου|Accent color|Dynamic color|Δυναμικό χρώμα|Θέμα|Theme', res_map["appearance"]),
                  "com.music.spotui.ui.screens.VnAppearanceSettingsCard()"
              ),
              (
                  "playback",
                  "VnPlaybackSettingsCard",
                  build_cat_regex(r'Αναπαραγωγή|Playback|Ποιότητα ήχου|Audio quality|Gapless|Normalization|Κανονικοποίηση', res_map["playback"]),
                  "com.music.spotui.ui.screens.VnPlaybackSettingsCard()"
              ),
          ]

          for sp_file in settings_files:
              if not sp_file.exists():
                  continue
              injected_here = {"lyrics": False, "appearance": False, "playback": False}
              for cat_name, marker, anchor_rx, comp_call in cat_configs:
                  st = sp_file.read_text()
                  if marker in st:
                      injected_here[cat_name] = True
                      continue
                  lines = st.splitlines(keepends=True)
                  for idx, line in enumerate(lines):
                      if line.lstrip().startswith(("//", "/*", "*", "import ", "package ", "fun ", "object ", "class ")):
                          continue
                      if re.search(anchor_rx, line, re.IGNORECASE):
                          for k in range(idx + 1, min(idx + 35, len(lines))):
                              ind_m = re.match(r'^(\s*)', lines[k])
                              ind = ind_m.group(1) if ind_m else "    "
                              if re.match(r'^\s*item\s*(?:\([^)]*\))?\s*\{', lines[k]):
                                  lines.insert(k, f"{ind}item {{ {comp_call} }}\n")
                                  sp_file.write_text("".join(lines))
                                  injected_here[cat_name] = True
                                  print(f"Injected {marker} into {cat_name} section of {sp_file}")
                                  break
                              if re.match(r'^\s*(?:Spacer|HorizontalDivider)\s*\(', lines[k]) and k + 1 < len(lines) and re.match(r'^\s*(?:Text|Settings|Immersive|Surface|Card|Column|Row)\b', lines[k + 1]):
                                  lines.insert(k + 1, f"{ind}{comp_call}\n")
                                  sp_file.write_text("".join(lines))
                                  injected_here[cat_name] = True
                                  print(f"Injected {marker} into {cat_name} column of {sp_file}")
                                  break
                          if injected_here[cat_name]:
                              break

              # Guarantee any category not matched in this Settings screen is placed right above VnSettingsBackup
              inc_lyr = "false" if injected_here["lyrics"] else "true"
              inc_app = "false" if injected_here["appearance"] else "true"
              inc_ply = "false" if injected_here["playback"] else "true"
              if any(v == "true" for v in (inc_lyr, inc_app, inc_ply)):
                  st = sp_file.read_text()
                  if "VnFpsSelectorCard" not in st:
                      lines = st.splitlines(keepends=True)
                      for i, l in enumerate(lines):
                          s_line = l.lstrip()
                          ind = l[:len(l) - len(s_line)]
                          if s_line.startswith(("import ", "package ", "//", "/*", "*", "fun ", "object ", "class ")):
                              continue
                          if re.match(r'^item\b.*\{.*\bVn(?:Settings)?Backup\w*', s_line):
                              lines.insert(i, f"{ind}item {{ com.music.spotui.ui.screens.VnFpsSelectorCard(includeLyrics = {inc_lyr}, includeAppearance = {inc_app}, includePlayback = {inc_ply}) }}\n")
                              sp_file.write_text("".join(lines))
                              print(f"Injected fallback VnFpsSelectorCard into {sp_file}")
                              break
                          if re.match(r'^(?:com\.music\.spotui\.ui\.screens\.)?Vn(?:Settings)?Backup(?:\.[A-Za-z0-9_]+|\w*)\s*\(', s_line):
                              lines.insert(i, f"{ind}com.music.spotui.ui.screens.VnFpsSelectorCard(includeLyrics = {inc_lyr}, includeAppearance = {inc_app}, includePlayback = {inc_ply})\n")
                              sp_file.write_text("".join(lines))
                              print(f"Injected fallback VnFpsSelectorCard into {sp_file}")
                              break

          for ap in [Path("app/src/main/java/com/music/spotui/ui/screens/SettingsScreen.kt"), Path("app/src/main/java/com/music/spotui/ui/immersive/pages/ImmersiveSettingsScreen.kt"), Path("app/src/main/java/com/music/spotui/ui/immersive/player/PlayerControls.kt")]:
              if ap.exists() and "vnAnimatedElement" not in ap.read_text():
                  c = [0]
                  an = re.sub(r'\bModifier\s*\.\s*fillMaxWidth\s*\(\s*\)', lambda m: (c.__setitem__(0, c[0]+1) or f"{m.group(0)}.vnAnimatedElement({c[0]})"), ap.read_text())
                  ap.write_text(re.sub(r'(?m)^(package\s+[^\r\n]+)', r'\1\nimport com.music.spotui.ui.screens.vnAnimatedElement', an, count=1))

          for sf in sorted(Path("app/src/main/java/com/music/spotui").rglob("*.kt")):
              ft = sf.read_text()
              if sf.name != "VnFrameRateManager.kt" and "onTrackPlaybackObserved" not in ft and '"Lossless"' in ft and "LocalContext.current" in ft and "@Composable" in ft:
                  lines = ft.splitlines(keepends=True)
                  for idx, l in enumerate(lines):
                      if '"Lossless"' in l:
                          w = "".join(lines[max(0, idx-25):min(len(lines), idx+15)])
                          mc = re.search(r'\bval\s+([A-Za-z0-9_]+)\s*=\s*LocalContext\.current\b', w)
                          mq = re.search(r'\bval\s+([A-Za-z0-9_]*(?:quality|Quality|format|Format|badge|Badge)[A-Za-z0-9_]*)\b', w)
                          mt = re.search(r'\b([A-Za-z0-9_]+)\.(?:title|name)\b', w)
                          ms = re.search(r'\b([A-Za-z0-9_]+)\.(?:source|provider|extension|sourceName|providerName)\b', w)
                          if mc and mq and mt:
                              for k in range(max(0, idx-25), idx+1):
                                  if re.search(rf'\bval\s+{re.escape(mq.group(1))}\b', lines[k]) and "=" in lines[k]:
                                      ind = re.match(r'^(\s*)', lines[k]).group(1)
                                      lines.insert(k+1, f'{ind}androidx.compose.runtime.LaunchedEffect({mt.group(1)}.id, {mq.group(1)}) {{ com.music.spotui.ui.screens.VnPlaybackMonitor.onTrackPlaybackObserved({mc.group(1)}, {mt.group(1)}.id.toString(), {mt.group(1)}.title.toString(), {f"{ms.group(1)}.source.orEmpty()" if ms else "\"\""}, {mq.group(1)}.toString()) }}\n')
                                      sf.write_text("".join(lines)); break
                          break

          bf = Path("app/src/main/java/com/music/spotui/ui/screens/VnSettingsBackup.kt")
          if bf.exists():
              bt = bf.read_text()
              cv = next((x for x in ["context", "ctx", "localContext", "appContext"] if re.search(rf'\b{x}\b', bt)), "context")
              if "onBackupImported" not in bt: bt = re.sub(r'\bJSONObject\(\s*([A-Za-z0-9_]+)\s*\)', rf'JSONObject(com.music.spotui.ui.screens.VnFpsPref.onBackupImported({cv}, \1))', bt, count=1)
              if "enrichBackupJson" not in bt: bt = re.sub(r'\b([A-Za-z0-9_]+\.toString\(\s*(?:2|4)?\s*\))', rf'com.music.spotui.ui.screens.VnFpsPref.enrichBackupJson({cv}, \1)', bt, count=1)
              if "VnCopyBackupExtensionsButton" not in bt:
                  lines = bt.splitlines(keepends=True)
                  cs = next((i for i, l in enumerate(lines) if "@Composable" in l), None)
                  col = next((i for i in range(cs, len(lines)) if re.search(r'\bColumn\b', lines[i])), None) if cs is not None else None
                  if col is not None:
                      d = 0; op = False
                      for i in range(col, len(lines)):
                          d += lines[i].count("{") - lines[i].count("}")
                          if "{" in lines[i]: op = True
                          if op and d <= 0:
                              lines.insert(i, re.match(r'^(\s*)', lines[i]).group(1) + "    com.music.spotui.ui.screens.VnCopyBackupExtensionsButton()\n")
                              bt = "".join(lines); break
              bf.write_text(bt)

          gh = False
          for ap in sorted(Path("app/src/main/java").rglob("*Activity.kt")):
              at = ap.read_text()
              if "setContent" in at and "VnFrameRateGuard" not in at:
                  an, n = re.subn(r'(?m)^([ \t]*)(setContent(?:\([^)]*\))?\s*\{)\s*$', r'\1\2\n\1    com.music.spotui.ui.screens.VnFrameRateGuard()', at, count=1)
                  if n > 0: ap.write_text(an); gh = True; break
          if not gh and p2.exists() and "VnFrameRateGuard" not in p2.read_text():
              p2.write_text(re.sub(r'(?m)^([ \t]*fun\s+ImmersivePlayer\b[^{]*\{)\s*$', r'\1\n    com.music.spotui.ui.screens.VnFrameRateGuard()', p2.read_text(), count=1))
          PY

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          EXTRA_FLAGS=""
          [ "$HAS_SDK_37" != "true" ] && EXTRA_FLAGS="-Pandroid.suppressUnsupportedCompileSdk=37"
          ./gradlew :app:assembleDebug $EXTRA_FLAGS -PappVersionName="2.1.4" -PappVersionCode="$BUILD_VERSION_CODE" -Pabis=arm64-v8a -PupdateRepo=vnsec2/VNEra --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VNEra-2.1.4-Debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
