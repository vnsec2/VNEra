                                  "    var vnImmClosingDown by androidx.compose.runtime.remember { androidx.compose.runtime.mutableStateOf(false) }\n"
                                  "    val vnImmScope = androidx.compose.runtime.rememberCoroutineScope()\n"
                                  f"    val vnIsFullscreen = {is_fs_expr}\n"
                                  "    val vnOnOpenFs: () -> Unit = {\n"
                                  "        vnImmClosingDown = false\n"
                                  f"        com.music.spotui.ui.screens.VnFpsPref.openLyricsFullscreen(vnImmLyricsActivity) {{ {expand_expr} }}\n"
                                  "    }\n"
                                  "    val vnOnCloseFs: () -> Unit = {\n"
                                  "        if (!vnImmClosingDown) {\n"
                                  "            vnImmClosingDown = true\n"
                                  "            vnImmScope.launch {\n"
                                  "                kotlinx.coroutines.delay(200L)\n"
                                  f"                com.music.spotui.ui.screens.VnFpsPref.closeLyricsFullscreen(vnImmLyricsActivity) {{ {collapse_expr} }}\n"
                                  "                vnImmClosingDown = false\n"
                                  "            }\n"
                                  "        }\n"
                                  "    }\n"
                              )
                              for k in range(se + 1, len(lines)):
                                  if ".fillMaxSize()" in lines[k]:
                                      lines[k] = lines[k].replace(
                                          ".fillMaxSize()",
                                          ".fillMaxSize().then(if (vnIsFullscreen) Modifier.vnFullscreenSlideContainer(vnImmClosingDown, matchPlayerBackground = true) else Modifier).then(Modifier.vnSmartLyricsSwipe(vnImmLyricsActivity, isExpanded = vnIsFullscreen, onExpandToFullscreen = vnOnOpenFs, onCollapseToPlayer = vnOnCloseFs))",
                                          1
                                      )
                                      ins_idx = find_composable_body_insert_idx(lines, k, len(lines) - 1)
                                      if ins_idx is not None:
                                          b_ind = re.match(r'^(\s*)', lines[ins_idx]).group(1) + "    "
                                          lines[ins_idx] += (
                                              f"{b_ind}androidx.compose.foundation.layout.Box("
                                              f"modifier = androidx.compose.ui.Modifier.fillMaxWidth().padding(top = 12.dp, end = 10.dp), "
                                              f"contentAlignment = androidx.compose.ui.Alignment.CenterEnd) {{ "
                                              f"com.music.spotui.ui.screens.VnLyricsFullscreenButton(isFullscreen = vnIsFullscreen, ownerId = \"immersive_panel\", onClick = {{ if (vnIsFullscreen) vnOnCloseFs() else vnOnOpenFs() }}) }}\n"
                                          )
                                      break
                              t1 = ensure_imports("".join(lines), [
                                  "androidx.compose.foundation.layout.fillMaxWidth",
                                  "androidx.compose.foundation.layout.padding",
                                  "androidx.compose.ui.unit.dp",
                                  "com.music.spotui.ui.screens.findActivity",
                                  "com.music.spotui.ui.screens.vnFullscreenSlideContainer",
                                  "com.music.spotui.ui.screens.vnSmartLyricsSwipe",
                                  "kotlinx.coroutines.launch",
                              ])
                              break
              if t1 != t0: il.write_text(t1)

          # 4. Inline & Word-by-Word Karaoke Player Lyrics ONLY (Text only, never BasicText)
          def wrap_arg_call(call_src: str, param_name: str, wrapper_fn: str, default_expr: str | None = None) -> tuple[str, bool]:
              m = re.search(rf'\b{param_name}\s*=\s*', call_src)
              if not m:
                  if default_expr is not None:
                      close_idx = call_src.rfind(")")
                      if close_idx != -1:
                          before = call_src[:close_idx].rstrip()
                          comma = "" if before.endswith("(") or before.endswith(",") else ", "
                          return f"{before}{comma}{param_name} = {wrapper_fn}({default_expr}){call_src[close_idx:]}", True
                  return call_src, False
              start_val = m.end()
              if wrapper_fn in call_src[start_val:start_val + len(wrapper_fn) + 55]:
                  return call_src, False
              depth_p = depth_b = depth_c = 0
              end_val = len(call_src)
              for idx_c in range(start_val, len(call_src)):
                  ch = call_src[idx_c]
                  if ch == '(': depth_p += 1
                  elif ch == ')':
                      if depth_p == 0 and depth_b == 0 and depth_c == 0:
                          end_val = idx_c
                          break
                      depth_p -= 1
                  elif ch == '[': depth_b += 1
                  elif ch == ']': depth_b -= 1
                  elif ch == '{': depth_c += 1
                  elif ch == '}': depth_c -= 1
                  elif ch == ',' and depth_p == 0 and depth_b == 0 and depth_c == 0:
                      end_val = idx_c
                      break
              expr = call_src[start_val:end_val].strip()
              if not expr:
                  return call_src, False
              return f"{call_src[:start_val]}{wrapper_fn}({expr}){call_src[end_val:]}", True

          def patch_lyric_text_call(call_block: str, is_karaoke_file: bool) -> tuple[str, bool]:
              if not re.match(r'^\s*Text\s*\(', call_block):
                  return call_block, False
              new_block = call_block
              c0 = c1 = c2 = False
              m_txt = re.search(r'\btext\s*=\s*([^,\)\n]+)', new_block)
              txt_expr = m_txt.group(1).strip() if m_txt else ""
              if is_karaoke_file:
                  if txt_expr and not txt_expr.startswith('"'):
                      new_block, c0 = wrap_arg_call(
                          new_block,
                          "text",
                          "com.music.spotui.ui.screens.vnStyleKaraokeText"
                      )
              else:
                  new_block, c0 = wrap_arg_call(
                      new_block,
                      "text",
                      "com.music.spotui.ui.screens.vnPlayerInlineLyricText"
                  )
              new_block, c1 = wrap_arg_call(
                  new_block,
                  "color",
                  "com.music.spotui.ui.screens.vnPlayerInlineLyricColor",
                  "androidx.compose.material3.LocalContentColor.current"
              )
              if "fontSize" in new_block:
                  new_block, c2 = wrap_arg_call(new_block, "fontSize", "com.music.spotui.ui.screens.vnScaleLyricFontSize")
              elif "style" in new_block:
                  new_block, c2 = wrap_arg_call(new_block, "style", "com.music.spotui.ui.screens.vnScaleLyricTextStyle")
              else:
                  new_block, c2 = wrap_arg_call(
                      new_block,
                      "fontSize",
                      "com.music.spotui.ui.screens.vnScaleLyricFontSize",
                      "androidx.compose.ui.unit.TextUnit.Unspecified"
                  )
              return new_block, (c0 or c1 or c2)

          def patch_inline_and_karaoke_lyrics(path: Path):
              if not path.exists() or path.name in ("VnFrameRateManager.kt", "LyricsScreen.kt", "LookPreview.kt"):
                  return
              is_karaoke_or_lyric_comp = bool(re.search(r'(?:Karaoke|WordByWord|SyncedLyric|SweptLyric|LyricLine|LyricPreview|InlineLyric)', path.name, re.I))
              is_player_ctrl = path.name == "PlayerControls.kt"
              if not is_karaoke_or_lyric_comp and not is_player_ctrl:
                  return

              src = path.read_text()
              if "vnPlayerInlineLyricColor" in src:
                  return
              changed = False

              if is_karaoke_or_lyric_comp:
                  target_prefix = "com.music.spotui.ui.screens.vnStyleKaraokeSpan(SpanStyle("
                  new_src, n_span = re.subn(r'(?<![.\w])SpanStyle\s*\(', target_prefix, src)
                  if n_span > 0:
                      out_chars = []
                      idx_s = 0
                      while idx_s < len(new_src):
                          pos = new_src.find(target_prefix, idx_s)
                          if pos == -1:
                              out_chars.append(new_src[idx_s:])
                              break
                          out_chars.append(new_src[idx_s:pos + len(target_prefix)])
                          scan_i = pos + len(target_prefix)
                          depth = 1
                          while scan_i < len(new_src) and depth > 0:
                              ch = new_src[scan_i]
                              if ch == '(': depth += 1
                              elif ch == ')': depth -= 1
                              out_chars.append(ch)
                              scan_i += 1
                          out_chars.append(')')
                          idx_s = scan_i
                      src = "".join(out_chars)
                      changed = True

              lines = src.splitlines(keepends=True)
              for idx, line in enumerate(lines):
                  near_chevron = is_player_ctrl and bool(re.search(r'(?:ChevronRight|KeyboardArrowRight|ArrowForwardIos|">"|"›")', line))
                  near_karaoke = is_karaoke_or_lyric_comp and bool(re.search(r'(?<![.\w])Text\s*\(', line))
                  if near_chevron or near_karaoke:
                      win_start = max(0, idx - 26) if near_chevron else idx
                      win_end = min(len(lines), idx + 16) if near_chevron else min(len(lines), idx + 1)
                      win_txt = "".join(lines[win_start:win_end])
                      if near_karaoke or (re.search(r'\blyric', win_txt, re.IGNORECASE) and not re.search(r'FormatQuote|lyrics_button|openLyrics|Settings', win_txt, re.IGNORECASE)):
                          k = win_start
                          while k < win_end:
                              if re.search(r'(?<![.\w])Text\s*\(', lines[k]) and '">"' not in lines[k] and '"›"' not in lines[k]:
                                  p_cnt = 0
                                  t_end = k
                                  for j in range(k, min(len(lines), k + 18)):
                                      p_cnt += lines[j].count("(") - lines[j].count(")")
                                      if p_cnt <= 0:
                                          t_end = j
                                          break
                                  call_block = "".join(lines[k:t_end + 1])
                                  new_block, did_patch = patch_lyric_text_call(call_block, is_karaoke_or_lyric_comp)
                                  if did_patch:
                                      lines[k:t_end + 1] = [new_block]
                                      changed = True
                                      k = t_end + 1
                                      continue
                              k += 1
                          if changed and near_chevron:
                              break
              if changed:
                  path.write_text("".join(lines))
                  print(f"Patched inline/karaoke player lyrics in {path}")

          for ui_kt in sorted(Path("app/src/main/java/com/music/spotui/ui").rglob("*.kt")):
              patch_inline_and_karaoke_lyrics(ui_kt)

          # Track isPlaying state & hook Shuffle Lock
          for ctrl_kt in sorted(Path("app/src/main/java/com/music/spotui").rglob("*.kt")):
              if ctrl_kt.name == "VnFrameRateManager.kt":
                  continue
              ct = ctrl_kt.read_text()
              orig_ct = ct
              if "isPlaying" in ct and "VnFpsPref.isPlaybackPlaying" not in ct and "@Composable" in ct:
                  ct, _ = re.subn(
                      r'(?m)^([ \t]*)(if\s*\(\s*isPlaying\s*\))',
                      r'\1com.music.spotui.ui.screens.VnFpsPref.isPlaybackPlaying = isPlaying\n\1\2',
                      ct,
                      count=1
                  )
              if re.search(r'\bfun\s+toggleShuffle\s*\(', ct) and "VnShuffleGuard" not in ct:
                  has_shuf_state = bool(re.search(r'\b(?:val|var)\s+shuffleModeEnabled\b', ct))
                  fallback_expr = "com.music.spotui.ui.screens.VnFpsPref.shuffleLockEnabled && com.music.spotui.ui.screens.VnShuffleGuard.shuffleLockedByUser"
                  cur_shuf_expr = f"runCatching {{ shuffleModeEnabled.value }}.getOrDefault({fallback_expr})" if has_shuf_state else fallback_expr
                  ct, _ = re.subn(
                      r'(fun\s+toggleShuffle\s*\([^{]*\{)',
                      rf'\1\n        val vnNextShuffle = !({cur_shuf_expr})\n        com.music.spotui.ui.screens.VnShuffleGuard.onUserExplicitShuffleToggle(vnNextShuffle)',
                      ct,
                      count=1
                  )
                  if "@Composable" in ct and "shuffleModeEnabled" in ct and "onShuffleStateObserved" not in ct:
                      ct, _ = re.subn(
                          r'(?m)^([ \t]*)(val\s+([A-Za-z0-9_]+)\s+by\s+[A-Za-z0-9_.]*shuffleModeEnabled\.collectAsState[^\n]*\n)',
                          r'\1\2\1androidx.compose.runtime.LaunchedEffect(\3) {\n\1    com.music.spotui.ui.screens.VnShuffleGuard.onShuffleStateObserved(\3) { toggleShuffle() }\n\1}\n',
                          ct,
                          count=1
                      )
              if ct != orig_ct:
                  ctrl_kt.write_text(ct)

          extra_c = ", ".join(f"Color(0xFF{c})" for c in ["E53935","FF5722","FF9800","FFC107","00BFA5","00BCD4","3F51B5","7C4DFF","E040FB","FF4081","64FFDA","FFAB91","B388FF","ECEFF1"])
          for kf in sorted(Path("app/src/main/java/com/music/spotui").rglob("*.kt")):
              if kf.name == "VnFrameRateManager.kt": continue
              o = kf.read_text()
              u = re.sub(r'listOf\(((?:\s*Color\([^)]+\)\s*,?)+)\s*\)', lambda m: f"listOf({m.group(1).rstrip()}{'' if m.group(1).rstrip().endswith(',') else ','} {extra_c}\n)" if m.group(1).count("Color(") >= 3 and "0xFFE53935" not in m.group(1) else m.group(0), o)
              if u != o: kf.write_text(u)

          for tf in sorted(Path("app/src/main/java/com/music/spotui/ui/theme").rglob("*.kt")):
              tt = tf.read_text()
              if "MaterialTheme(" in tt and "customAccentColorArgb" not in tt:
                  tn, n = re.subn(r'MaterialTheme\s*\(\s*colorScheme\s*=\s*([A-Za-z0-9_]+)', r'MaterialTheme(\n        colorScheme = if (com.music.spotui.ui.screens.VnFpsPref.customAccentColorArgb != 0L) \1.copy(primary = androidx.compose.ui.graphics.Color(com.music.spotui.ui.screens.VnFpsPref.customAccentColorArgb), secondary = androidx.compose.ui.graphics.Color(com.music.spotui.ui.screens.VnFpsPref.customAccentColorArgb)) else \1', tt, count=1)
                  if n > 0: tf.write_text(tn)

          # 5. Inject each VNEra settings card ONLY into verified @Composable / LazyListScope contexts
          all_settings_files = [
              p for p in sorted(Path("app/src/main/java/com/music/spotui/ui").rglob("*.kt"))
              if "Settings" in p.name and p.name not in ("VnSettingsBackup.kt", "VnFrameRateManager.kt")
          ]

          res_map: dict[str, set[str]] = {"lyrics": set(), "appearance": set(), "playback": set()}
          for xml_f in Path("app/src/main/res").rglob("*.xml"):
              xt = xml_f.read_text(errors="ignore")
              for m in re.finditer(r'<string\s+name="([^"]+)"[^>]*>([^<]+)</string>', xt):
                  k, val = m.group(1), m.group(2)
                  kl = k.lower()
                  if "lyric" in kl or re.search(r'(?:Στίχοι|Lyrics|Προεπισκόπηση στίχων|Swipe to expand lyrics|Λέξη προς λέξη|Καραόκε|Karaoke)', val, re.I):
                      res_map["lyrics"].add(k)
                  if any(w in kl for w in ("appearance", "theme", "accent", "dynamic_color")) or re.search(r'(?:Εμφάνιση|Appearance|Χρώμα τόνου|Accent color|Dynamic color|Δυναμικό χρώμα|Θέμα|Theme)', val, re.I):
                      res_map["appearance"].add(k)
                  if any(w in kl for w in ("playback", "audio", "quality", "gapless", "normaliz")) or re.search(r'(?:Αναπαραγωγή|Playback|Ποιότητα ήχου|Audio quality|Gapless|Normalization|Κανονικοποίηση)', val, re.I):
                      res_map["playback"].add(k)

          def build_cat_regex(literals: str, keys: set[str]) -> str:
              parts = [rf'"[^"]*(?:{literals})[^"]*"'] + [rf'\bR\.string\.{re.escape(k)}\b' for k in sorted(keys)]
              return "|".join(parts)

          cat_configs = [
              (
                  "lyrics",
                  "VnLyricsSettingsCard",
                  build_cat_regex(r'Στίχοι|Lyrics|Προεπισκόπηση στίχων|Swipe to expand lyrics|Λέξη προς λέξη|Καραόκε|Karaoke', res_map["lyrics"]),
                  "com.music.spotui.ui.screens.VnLyricsSettingsCard()"
              ),
              (
                  "appearance",
                  "VnAppearanceSettingsCard",
                  build_cat_regex(r'Εμφάνιση|Appearance|Χρώμα τόνου|Accent color|Dynamic color|Δυναμικό χρώμα|Θέμα|Theme', res_map["appearance"]),
                  "com.music.spotui.ui.screens.VnAppearanceSettingsCard()"
              ),
              (
                  "playback",
                  "VnPlaybackSettingsCard",
                  build_cat_regex(r'Αναπαραγωγή|Playback|Ποιότητα ήχου|Audio quality|Gapless|Normalization|Κανονικοποίηση', res_map["playback"]),
                  "com.music.spotui.ui.screens.VnPlaybackSettingsCard()"
              ),
          ]

          COMPOSABLE_CONTAINERS = {
              "Column", "Row", "Box", "BoxWithConstraints", "Surface", "Card", "ElevatedCard",
              "OutlinedCard", "Scaffold", "ModalBottomSheet", "DropdownMenu", "AnimatedVisibility",
              "AnimatedContent", "Crossfade", "CompositionLocalProvider", "ProvideTextStyle",
              "item", "items", "itemsIndexed", "stickyHeader", "if", "else", "when"
          }
          LAZY_CONTAINERS = {
              "LazyColumn", "LazyRow", "LazyVerticalGrid", "LazyHorizontalGrid"
          }

          def analyze_composable_scopes(lines: list[str]) -> dict[int, str]:
              """
              Returns a mapping: line_idx -> 'COMPOSABLE' | 'LAZY_LIST'
              ONLY for lines where a @Composable function call is 100% legal in Kotlin.
              Any line inside a non-@Composable function, clickable {}, onClick = {},
              remember {}, LaunchedEffect {}, forEach {}, etc. is excluded.
              """
              n = len(lines)
              clean_lines = []
              in_bc = False
              for raw in lines:
                  s = raw
                  if in_bc:
                      end_bc = s.find("*/")
                      if end_bc == -1:
                          clean_lines.append("")
                          continue
                      s = s[end_bc + 2:]
                      in_bc = False
                  while "/*" in s:
                      st_bc = s.find("/*")
                      en_bc = s.find("*/", st_bc + 2)
                      if en_bc != -1:
                          s = s[:st_bc] + " " + s[en_bc + 2:]
                      else:
                          s = s[:st_bc]
                          in_bc = True
                          break
                  s = s.split("//")[0]
                  s = re.sub(r'"(?:\\.|[^"\\])*"', '""', s)
                  s = re.sub(r"'(?:\\.|[^'\\])'", "''", s)
                  clean_lines.append(s)

              valid_points: dict[int, str] = {}

              # Find every @Composable fun declaration
              i = 0
              while i < n:
                  m_fun = re.search(r'\bfun\s+(?:<[^>]+>\s*)?(?:[A-Za-z0-9_.]+\.)?([A-Za-z0-9_]+)\s*\(', clean_lines[i])
                  if not m_fun:
                      i += 1
                      continue

                  # Verify @Composable annotation on preceding lines
                  has_composable_ann = "@Composable" in clean_lines[i]
                  if not has_composable_ann:
                      checked = 0
                      for back in range(i - 1, -1, -1):
                          bt = clean_lines[back].strip()
                          if not bt:
                              continue
                          if "@Composable" in bt:
                              has_composable_ann = True
                              break
                          if any(tok in bt for tok in ("}", "{", ";")) or re.match(r'^(?:fun|class|object|interface|val|var|package|import)\b', bt):
                              break
                          checked += 1
                          if checked >= 6:
                              break

                  # Find end of parameter list '(' ... ')'
                  p_depth = 0
                  saw_open_p = False
                  sig_end_line = i
                  body_open_line = None
                  body_open_col = None
                  is_expr_body = False
                  for li in range(i, n):
                      line_s = clean_lines[li]
                      for ci, ch in enumerate(line_s):
                          if not saw_open_p:
                              if ch == '(':
                                  saw_open_p = True
                                  p_depth = 1
                              continue
                          if p_depth > 0:
                              if ch == '(':
                                  p_depth += 1
                              elif ch == ')':
                                  p_depth -= 1
                          else:
                              if ch == '=':
                                  is_expr_body = True
                                  break
                              if ch == '{':
                                  body_open_line = li
                                  body_open_col = ci
                                  break
                      if is_expr_body or body_open_line is not None:
                          sig_end_line = li
                          break

                  if not has_composable_ann or is_expr_body or body_open_line is None:
                      i = sig_end_line + 1
                      continue

                  # Walk the @Composable function body tracking exact scope types
                  scope_stack: list[str] = ["COMPOSABLE"]
                  paren_depth = 0
                  bracket_depth = 0
                  last_ident = ""
                  saw_equals_at_zero = False
                  saw_arrow_at_zero = False

                  for li in range(body_open_line, n):
                      # Record validity at the START of line li (before tokens on line li mutate the stack)
                      if paren_depth == 0 and bracket_depth == 0 and scope_stack and "NON_COMPOSABLE" not in scope_stack:
                          valid_points[li] = scope_stack[-1]

                      line_s = clean_lines[li]
                      start_col = (body_open_col + 1) if li == body_open_line else 0
                      idx_c = start_col
                      L = len(line_s)
                      while idx_c < L:
                          ch = line_s[idx_c]
                          if ch.isalpha() or ch == '_':
                              j_c = idx_c + 1
                              while j_c < L and (line_s[j_c].isalnum() or line_s[j_c] in ('_', '.')):
                                  j_c += 1
                              ident = line_s[idx_c:j_c].split('.')[-1]
                              if paren_depth == 0 and bracket_depth == 0:
                                  if ident not in ("val", "var", "private", "internal", "public", "fun", "return"):
                                      last_ident = ident
                              idx_c = j_c
                              continue
                          if ch == '-' and idx_c + 1 < L and line_s[idx_c + 1] == '>':
                              if paren_depth == 0 and bracket_depth == 0:
                                  saw_arrow_at_zero = True
                              idx_c += 2
                              continue
                          if ch == '=':
                              prev_ch = line_s[idx_c - 1] if idx_c > 0 else ''
                              next_ch = line_s[idx_c + 1] if idx_c + 1 < L else ''
                              if prev_ch not in ('=', '!', '<', '>') and next_ch not in ('=', '>'):
                                  if paren_depth == 0 and bracket_depth == 0:
                                      saw_equals_at_zero = True
                              idx_c += 1
                              continue
                          if ch == ';':
                              if paren_depth == 0 and bracket_depth == 0:
                                  last_ident = ""
                                  saw_equals_at_zero = False
                                  saw_arrow_at_zero = False
                              idx_c += 1
                              continue
                          if ch == '(':
                              paren_depth += 1
                          elif ch == ')':
                              paren_depth = max(0, paren_depth - 1)
                          elif ch == '[':
                              bracket_depth += 1
                          elif ch == ']':
                              bracket_depth = max(0, bracket_depth - 1)
                          elif ch == '{':
                              if paren_depth != 0 or bracket_depth != 0:
                                  scope_stack.append("NON_COMPOSABLE")
                              elif saw_equals_at_zero:
                                  scope_stack.append("COMPOSABLE" if last_ident == "content" else "NON_COMPOSABLE")
                              elif last_ident in LAZY_CONTAINERS:
                                  scope_stack.append("LAZY_LIST")
                              elif last_ident in COMPOSABLE_CONTAINERS:
                                  scope_stack.append("COMPOSABLE")
                              elif saw_arrow_at_zero and scope_stack and scope_stack[-1] == "COMPOSABLE":
                                  scope_stack.append("COMPOSABLE")
                              else:
                                  scope_stack.append("NON_COMPOSABLE")
                              last_ident = ""
                              saw_equals_at_zero = False
                              saw_arrow_at_zero = False
                          elif ch == '}':
                              if scope_stack:
                                  scope_stack.pop()
                              if paren_depth == 0 and bracket_depth == 0:
                                  last_ident = ""
                                  saw_equals_at_zero = False
                                  saw_arrow_at_zero = False
                              if not scope_stack:
                                  break
                          idx_c += 1

                      if not scope_stack:
                          i = li + 1
                          break
                  else:
                      i = n

              return valid_points

          placed_globally: dict[str, bool] = {"lyrics": False, "appearance": False, "playback": False}

          for sp_file in all_settings_files:
              for cat_name, marker, anchor_rx, comp_call in cat_configs:
                  st = sp_file.read_text()
                  if marker in st:
                      placed_globally[cat_name] = True
                      continue
                  lines = st.splitlines(keepends=True)
                  valid_scopes = analyze_composable_scopes(lines)
                  if not valid_scopes:
                      continue

                  placed = False
                  for idx, line in enumerate(lines):
                      if idx not in valid_scopes:
                          continue
                      s_strip = line.lstrip()
                      if s_strip.startswith(("//", "/*", "*", "import ", "package ", "fun ", "object ", "class ")):
                          continue
                      near_before = "".join(lines[max(0, idx - 4):idx + 1])
                      if re.search(r'\b(?:CenterAligned|Large|Medium)?TopAppBar\b', near_before):
                          continue
                      if re.search(anchor_rx, line, re.IGNORECASE):
                          anchor_indent = len(line) - len(s_strip)
                          for k in range(idx + 1, min(idx + 60, len(lines))):
                              if k not in valid_scopes:
                                  continue
                              scope_kind = valid_scopes[k]
                              raw_k = lines[k]
                              clean_k = raw_k.split("//")[0]
                              ind_m = re.match(r'^(\s*)', raw_k)
                              ind = ind_m.group(1) if ind_m else "    "
                              ind_len = len(ind)

                              if scope_kind == "LAZY_LIST" and re.match(r'^\s*item\s*(?:\([^)]*\))?\s*\{', clean_k) and ind_len <= anchor_indent:
                                  lines.insert(k, f"{ind}item {{ {comp_call} }}\n")
                                  sp_file.write_text("".join(lines))
                                  placed = True
                                  placed_globally[cat_name] = True
                                  print(f"Injected {marker} into {cat_name} LazyColumn of {sp_file}")
                                  break
                              if re.match(r'^\s*\}\s*$', clean_k) and ind_len < anchor_indent:
                                  if scope_kind == "LAZY_LIST":
                                      lines.insert(k, f"{ind}    item {{ {comp_call} }}\n")
                                  else:
                                      lines.insert(k, f"{ind}    {comp_call}\n")
                                  sp_file.write_text("".join(lines))
                                  placed = True
                                  placed_globally[cat_name] = True
                                  print(f"Injected {marker} into {cat_name} section of {sp_file}")
                                  break
                          if placed:
                              break

          # Fallback: if any category wasn't placed in a dedicated @Composable section, append safely to main SettingsScreen / ImmersiveSettingsScreen
          unplaced = [cfg for cfg in cat_configs if not placed_globally[cfg[0]]]
          if unplaced:
              for main_name in ("SettingsScreen.kt", "ImmersiveSettingsScreen.kt"):
                  candidates = [p for p in all_settings_files if p.name == main_name]
                  if not candidates:
                      continue
                  mp = candidates[0]
                  for cat_name, marker, _, comp_call in unplaced:
                      st = mp.read_text()
                      if marker in st:
                          continue
                      lines = st.splitlines(keepends=True)
                      valid_scopes = analyze_composable_scopes(lines)
                      # Find the last closing brace inside a LAZY_LIST or top-level COMPOSABLE container
                      best_k = None
                      best_kind = None
                      for k in range(len(lines) - 1, -1, -1):
                          if k in valid_scopes and re.match(r'^\s*\}\s*$', lines[k].split("//")[0]):
                              if valid_scopes[k] == "LAZY_LIST":
                                  best_k, best_kind = k, "LAZY_LIST"
                                  break
                              elif best_k is None and valid_scopes[k] == "COMPOSABLE":
                                  best_k, best_kind = k, "COMPOSABLE"
                      if best_k is not None:
                          ind = re.match(r'^(\s*)', lines[best_k]).group(1)
                          if best_kind == "LAZY_LIST":
                              lines.insert(best_k, f"{ind}    item {{ {comp_call} }}\n")
                          else:
                              lines.insert(best_k, f"{ind}    {comp_call}\n")
                          mp.write_text("".join(lines))
                          print(f"Fallback injected {marker} into {mp}")

          for ap in [Path("app/src/main/java/com/music/spotui/ui/screens/SettingsScreen.kt"), Path("app/src/main/java/com/music/spotui/ui/immersive/pages/ImmersiveSettingsScreen.kt"), Path("app/src/main/java/com/music/spotui/ui/immersive/player/PlayerControls.kt")]:
              if ap.exists() and "vnAnimatedElement" not in ap.read_text():
                  c = [0]
                  an = re.sub(r'\bModifier\s*\.\s*fillMaxWidth\s*\(\s*\)', lambda m: (c.__setitem__(0, c[0]+1) or f"{m.group(0)}.vnAnimatedElement({c[0]})"), ap.read_text())
                  ap.write_text(ensure_imports(an, ["com.music.spotui.ui.screens.vnAnimatedElement"]))

          for sf in sorted(Path("app/src/main/java/com/music/spotui").rglob("*.kt")):
              ft = sf.read_text()
              if sf.name != "VnFrameRateManager.kt" and "onTrackPlaybackObserved" not in ft and '"Lossless"' in ft and "LocalContext.current" in ft and "@Composable" in ft:
                  lines = ft.splitlines(keepends=True)
                  for idx, l in enumerate(lines):
                      if '"Lossless"' in l:
                          w = "".join(lines[max(0, idx-25):min(len(lines), idx+15)])
                          mc = re.search(r'\bval\s+([A-Za-z0-9_]+)\s*=\s*LocalContext\.current\b', w)
                          mq = re.search(r'\bval\s+([A-Za-z0-9_]*(?:quality|Quality|format|Format|badge|Badge)[A-Za-z0-9_]*)\b', w)
                          mt = re.search(r'\b([A-Za-z0-9_]+)\.(?:title|name)\b', w)
                          ms = re.search(r'\b([A-Za-z0-9_]+)\.(source|provider|extension|sourceName|providerName)\b', w)
                          if mc and mq and mt:
                              src_expr = f"({ms.group(1)}.{ms.group(2)}?.toString().orEmpty())" if ms else '""'
                              for k in range(max(0, idx-25), idx+1):
                                  if re.search(rf'\bval\s+{re.escape(mq.group(1))}\b', lines[k]) and "=" in lines[k]:
                                      ind = re.match(r'^(\s*)', lines[k]).group(1)
                                      lines.insert(k+1, f'{ind}androidx.compose.runtime.LaunchedEffect({mt.group(1)}.id, {mq.group(1)}) {{ com.music.spotui.ui.screens.VnPlaybackMonitor.onTrackPlaybackObserved({mc.group(1)}, {mt.group(1)}.id.toString(), {mt.group(1)}.title.toString(), {src_expr}, {mq.group(1)}.toString()) }}\n')
                                      sf.write_text("".join(lines)); break
                          break

          bf = Path("app/src/main/java/com/music/spotui/ui/screens/VnSettingsBackup.kt")
          if bf.exists():
              bt = bf.read_text()
              cv = next((x for x in ["context", "ctx", "localContext", "appContext"] if re.search(rf'\b(?:val|var)\s+{x}\b|\b{x}\s*:\s*Context\b', bt)), None)
              if cv:
                  if "onBackupImported" not in bt:
                      bt = re.sub(r'\bJSONObject\(\s*([A-Za-z0-9_]+)\s*\)', rf'JSONObject(com.music.spotui.ui.screens.VnFpsPref.onBackupImported({cv}, \1))', bt, count=1)
                  if "enrichBackupJson" not in bt:
                      bt = re.sub(r'\b([A-Za-z0-9_]+\.toString\(\s*(?:2|4)?\s*\))', rf'com.music.spotui.ui.screens.VnFpsPref.enrichBackupJson({cv}, \1)', bt, count=1)
              if "VnCopyBackupExtensionsButton" not in bt:
                  lines = bt.splitlines(keepends=True)
                  cs = next((i for i, l in enumerate(lines) if "@Composable" in l), None)
                  col = next((i for i in range(cs, len(lines)) if re.search(r'\bColumn\b', lines[i])), None) if cs is not None else None
                  if col is not None:
                      d = 0; op = False
                      for i in range(col, len(lines)):
                          d += lines[i].count("{") - lines[i].count("}")
                          if "{" in lines[i]: op = True
                          if op and d <= 0:
                              lines.insert(i, re.match(r'^(\s*)', lines[i]).group(1) + "    com.music.spotui.ui.screens.VnCopyBackupExtensionsButton()\n")
                              bt = "".join(lines); break
              bf.write_text(bt)

          gh = False
          for ap in sorted(Path("app/src/main/java").rglob("*Activity.kt")):
              at = ap.read_text()
              if "setContent" in at and "VnFrameRateGuard" not in at:
                  an, n = re.subn(r'(?m)^([ \t]*)(setContent(?:\([^)]*\))?\s*\{)\s*$', r'\1\2\n\1    com.music.spotui.ui.screens.VnFrameRateGuard()', at, count=1)
                  if n > 0: ap.write_text(an); gh = True; break
          if not gh and p2.exists() and "VnFrameRateGuard" not in p2.read_text():
              p2.write_text(re.sub(r'(?m)^([ \t]*fun\s+ImmersivePlayer\b[^{]*\{)\s*$', r'\1\n    com.music.spotui.ui.screens.VnFrameRateGuard()', p2.read_text(), count=1))
          PY

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          EXTRA_FLAGS=""
          [ "$HAS_SDK_37" != "true" ] && EXTRA_FLAGS="-Pandroid.suppressUnsupportedCompileSdk=37"
          ./gradlew :app:assembleDebug $EXTRA_FLAGS -PappVersionName="2.1.4" -PappVersionCode="$BUILD_VERSION_CODE" -Pabis=arm64-v8a -PupdateRepo=vnsec2/VNEra --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VNEra-2.1.4-Debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
