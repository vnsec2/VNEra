name: VNEra 2.1.3 Ultimate Build (Debug)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Checkout main for Persistent Signing Key
        uses: actions/checkout@v4
        with:
          ref: main
          path: _keystore_repo

      - name: Prepare Persistent Debug Keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "_keystore_repo/.github/vnera-debug.keystore" ]; then
            mkdir -p "_keystore_repo/.github"
            keytool -genkeypair -v \
              -keystore "_keystore_repo/.github/vnera-debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=VNEra Debug,O=VNEra,C=GR"
            (
              cd _keystore_repo
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add .github/vnera-debug.keystore
              git commit -m "Add persistent keystore for seamless VNEra updates"
              git push || echo "Warning: Could not push keystore to main"
            )
          fi
          cp -f "_keystore_repo/.github/vnera-debug.keystore" "$HOME/.android/debug.keystore"
          rm -rf _keystore_repo

      - name: Checkout source-review
        uses: actions/checkout@v4
        with:
          ref: work/source-review
          fetch-depth: 0

      - name: Switch Base to Pure Revera 1.0.8
        shell: bash
        run: |
          set -euo pipefail
          # 1. Αποθήκευση Gradle wrapper πριν το reset (το Revera.git δεν περιέχει το gradlew binary)
          mkdir -p /tmp/vnera_gradle
          [ -f "gradlew" ] && cp -f "gradlew" /tmp/vnera_gradle/
          [ -f "gradlew.bat" ] && cp -f "gradlew.bat" /tmp/vnera_gradle/
          if [ -d "gradle/wrapper" ]; then
            mkdir -p /tmp/vnera_gradle/wrapper
            cp -rf gradle/wrapper/* /tmp/vnera_gradle/wrapper/
          fi

          # 2. Αποθήκευση εικονιδίων VNEra πριν την επαναφορά στη βάση 1.0.8
          mkdir -p /tmp/vnera_res
          if [ -d "app/src/main/res" ]; then
            cp -rn app/src/main/res/mipmap* /tmp/vnera_res/ 2>/dev/null || true
            find app/src/main/res -maxdepth 2 -name "*ic_launcher*" -exec cp --parents -rn {} /tmp/vnera_res/ \; 2>/dev/null || true
          fi

          git remote add upstream https://revera.caruno.wtf/carunodev/Revera.git
          git fetch upstream +refs/heads/*:refs/remotes/upstream/* +refs/tags/*:refs/tags/* --prune

          # 3. Καθαρή επαναφορά στον κώδικα του Revera 1.0.8
          git reset --hard refs/tags/v1.0.8

          # 4. Επαναφορά Gradle wrapper
          if [ ! -f "gradlew" ] && [ -f "/tmp/vnera_gradle/gradlew" ]; then
            cp -f /tmp/vnera_gradle/gradlew ./gradlew
            [ -f "/tmp/vnera_gradle/gradlew.bat" ] && cp -f /tmp/vnera_gradle/gradlew.bat ./gradlew.bat
            mkdir -p gradle/wrapper
            [ -f "/tmp/vnera_gradle/wrapper/gradle-wrapper.jar" ] && cp -f /tmp/vnera_gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
            if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ] && [ -f "/tmp/vnera_gradle/wrapper/gradle-wrapper.properties" ]; then
              cp -f /tmp/vnera_gradle/wrapper/gradle-wrapper.properties gradle/wrapper/
            fi
          fi
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x ./gradlew

          # 5. Επαναφορά εικονιδίων VNEra
          if [ -d "/tmp/vnera_res" ]; then
            cp -rf /tmp/vnera_res/mipmap* app/src/main/res/ 2>/dev/null || true
            if [ -d "/tmp/vnera_res/app/src/main/res" ]; then
              cp -rf /tmp/vnera_res/app/src/main/res/* app/src/main/res/ 2>/dev/null || true
            fi
          fi

      - name: Link SDK 37 & Fix Versions & Apply Patches
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SUDO=""
          if command -v sudo >/dev/null 2>&1 && [ ! -w "$SDK_ROOT/platforms" ]; then
            SUDO="sudo"
          fi

          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            $SUDO ln -sfn "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"
          fi

          export HAS_SDK_37="false"
          if [ -d "$SDK_ROOT/platforms/android-37" ]; then
            export HAS_SDK_37="true"
          fi
          echo "HAS_SDK_37=$HAS_SDK_37" >> "$GITHUB_ENV"

          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          has_sdk_37 = os.environ.get("HAS_SDK_37") == "true"
          print(f"HAS_SDK_37 = {has_sdk_37}")
          target_agp = '9.1.0' if has_sdk_37 else '8.7.2'

          # 1. Διόρθωση εκδόσεων Kotlin (2.2.20) & AGP (9.1.0)
          for cfg_path in [Path("gradle/libs.versions.toml"), Path("build.gradle.kts"), Path("settings.gradle.kts")]:
              if cfg_path.exists():
                  t = cfg_path.read_text()
                  t = t.replace('2.4.10', '2.2.20').replace('2.4.21', '2.2.20')
                  t = t.replace('9.4.1', target_agp)
                  if not has_sdk_37:
                      t = re.sub(r'(compileSdk|targetSdk)\s*=\s*"?37"?', r'\g<1> = "35"', t)
                  cfg_path.write_text(t)

          # 2. Ρύθμιση compileSdk / targetSdk μόνο αν λείπει το SDK 37
          if not has_sdk_37:
              for gradle_file in Path(".").rglob("*.gradle.kts"):
                  t = gradle_file.read_text()
                  t_new = re.sub(r'(compileSdk|targetSdk)\s*=\s*37', r'\g<1> = 35', t)
                  t_new = re.sub(r'(compileSdk|targetSdk)\.set\(37\)', r'\g<1>.set(35)', t_new)
                  if t != t_new:
                      gradle_file.write_text(t_new)

          # 3. Όνομα εφαρμογής VNEra στο strings.xml
          strings_xml = Path("app/src/main/res/values/strings.xml")
          if strings_xml.exists():
              s_xml = strings_xml.read_text()
              s_xml = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">VNEra</string>', s_xml)
              strings_xml.write_text(s_xml)

          # 4. Update Version, Unique ApplicationId & Packaging Excludes
          gradle = Path("app/build.gradle.kts")
          if gradle.exists():
              text = gradle.read_text()
              text = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "app.vnera.music"', text)
              text = re.sub(r'versionName\s*=\s*".*?"', 'versionName = "2.1.3"', text)
              text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 213', text)
              if "META-INF/versions/9/OSGI-INF/MANIFEST.MF" not in text:
                  text += '\nandroid {\n    packaging {\n        resources {\n            excludes += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"\n            excludes += "META-INF/versions/9/module-info.class"\n        }\n    }\n}\n'
              gradle.write_text(text)

          # 5. Fix CastMessage.kt expression-body return (αν υπάρχει στη 1.0.8)
          cast_msg = Path("app/src/main/java/com/music/spotui/cast/CastMessage.kt")
          if cast_msg.exists():
              lines = cast_msg.read_text().splitlines()
              target_idx = min(36, len(lines) - 1)
              if "return" in lines[target_idx]:
                  fun_idx = None
                  for i in range(target_idx, -1, -1):
                      if re.search(r'\bfun\b', lines[i]):
                          fun_idx = i
                          break
                  if fun_idx is not None:
                      paren = 0
                      eq_line = None
                      eq_col = None
                      for i in range(fun_idx, target_idx + 1):
                          line = lines[i]
                          for c_idx, ch in enumerate(line):
                              if ch == '(':
                                  paren += 1
                              elif ch == ')':
                                  paren -= 1
                              elif ch == '=' and paren == 0:
                                  prev_ch = line[c_idx - 1] if c_idx > 0 else ''
                                  next_ch = line[c_idx + 1] if c_idx + 1 < len(line) else ''
                                  if prev_ch not in ('=', '!', '<', '>') and next_ch not in ('=', '>'):
                                      eq_line = i
                                      eq_col = c_idx
                                      break
                          if eq_line is not None:
                              break

                      if eq_line is not None:
                          indent = re.match(r'^(\s*)', lines[fun_idx]).group(1)
                          brace = paren = bracket = 0
                          has_body = False
                          end_line = eq_line
                          for i in range(eq_line, len(lines)):
                              seg = lines[i][eq_col + 1:] if i == eq_line else lines[i]
                              code_part = seg.split('//')[0]
                              if code_part.strip():
                                  has_body = True
                              for ch in code_part:
                                  if ch == '{': brace += 1
                                  elif ch == '}': brace -= 1
                                  elif ch == '(': paren += 1
                                  elif ch == ')': paren -= 1
                                  elif ch == '[': bracket += 1
                                  elif ch == ']': bracket -= 1
                              if has_body and brace <= 0 and paren <= 0 and bracket <= 0 and i >= target_idx:
                                  nxt = lines[i + 1].lstrip() if i + 1 < len(lines) else ''
                                  if not nxt.startswith(('.', '?.', '?:', '&&', '||')):
                                      end_line = i
                                      break

                          before_eq = lines[eq_line][:eq_col].rstrip()
                          after_eq = lines[eq_line][eq_col + 1:].lstrip()
                          if after_eq:
                              lines[eq_line] = f"{before_eq} {{\n{indent}    return {after_eq}"
                          else:
                              lines[eq_line] = f"{before_eq} {{"
                              lines[eq_line + 1] = f"{indent}    return " + lines[eq_line + 1].lstrip()
                          lines[end_line] = lines[end_line] + f"\n{indent}}}"
                          cast_msg.write_text("\n".join(lines) + "\n")

          # 6. Lyrics Swipe Gestures στη 1.0.8:
          #    - Σύρσιμο από κάτω προς τα πάνω (drag αρνητικό) -> Άνοιγμα fullscreen (onExpand)
          #    - Σύρσιμο από πάνω προς τα κάτω (drag θετικό) -> Κλείσιμο fullscreen (onClose)
          for kt_name in ["LyricsScreen.kt", "PlayerScreen.kt"]:
              for kt_file in Path("app/src/main/java").rglob(kt_name):
                  src = kt_file.read_text()
                  print(f"=== Inspecting {kt_file} ===")
                  for idx, ln in enumerate(src.splitlines(), 1):
                      if any(k in ln for k in ["onExpand", "onClose", "detectVerticalDragGestures", "verticalDrag", "LyricsCard", "showLyrics"]):
                          print(f"  L{idx}: {ln.strip()}")

                  src_mod = re.sub(
                      r'if\s*\(\s*drag\s*>\s*([^)]+)\)\s*onExpand\(\)',
                      r'if (drag < -\1) onExpand()',
                      src,
                  )
                  src_mod = re.sub(
                      r'if\s*\(\s*drag\s*<\s*-\s*([^)]+)\)\s*onClose\(\)',
                      r'if (drag > \1) onClose()',
                      src_mod,
                  )

                  if kt_name == "LyricsScreen.kt":
                      detector_import = "import androidx.compose.foundation.gestures.detectVerticalDragGestures"
                      if detector_import not in src_mod and "import androidx.compose.foundation.gestures.detectTapGestures" in src_mod:
                          src_mod = src_mod.replace(
                              "import androidx.compose.foundation.gestures.detectTapGestures",
                              "import androidx.compose.foundation.gestures.detectTapGestures\n" + detector_import,
                              1,
                          )
                      if "pointerInput" not in src_mod and "import androidx.compose.ui.input.pointer.pointerInput" not in src_mod:
                          src_mod = src_mod.replace(
                              detector_import,
                              detector_import + "\nimport androidx.compose.ui.input.pointer.pointerInput",
                              1,
                          )

                      if "onExpand()" in src_mod and "pointerInput(onExpand)" not in src_mod:
                          src_mod = re.sub(
                              r'(\.clickable\([^)]*\)\s*\{\s*onExpand\(\)\s*\})',
                              r'''\1
                          .pointerInput(onExpand) {
                              var drag = 0f
                              detectVerticalDragGestures(
                                  onVerticalDrag = { change, amount ->
                                      drag += amount
                                      change.consume()
                                  },
                                  onDragEnd = {
                                      if (drag < -48.dp.toPx()) onExpand()
                                      drag = 0f
                                  },
                                  onDragCancel = { drag = 0f },
                              )
                          }''',
                              src_mod,
                              count=1,
                          )

                      if "onClose" in src_mod and "pointerInput(onClose)" not in src_mod:
                          src_mod = re.sub(
                              r'(\.height\(64\.dp\)[^\n]*)',
                              r'''\1
                      .pointerInput(onClose) {
                          var drag = 0f
                          detectVerticalDragGestures(
                              onVerticalDrag = { change, amount ->
                                  drag += amount
                                  change.consume()
                              },
                              onDragEnd = {
                                  if (drag > 48.dp.toPx()) onClose()
                                  drag = 0f
                              },
                              onDragCancel = { drag = 0f },
                          )
                      }''',
                              src_mod,
                              count=1,
                          )

                  if src_mod != src:
                      kt_file.write_text(src_mod)
                      print(f"Updated gestures in {kt_file}")

          # 7. Immersive Player fix
          p2 = Path("app/src/main/java/com/music/spotui/ui/immersive/player/ImmersivePlayer.kt")
          if p2.exists():
              s = p2.read_text()
              if "PointerEventPass" not in s and "import androidx.compose.ui.input.pointer.positionChange" in s:
                  s = s.replace(
                      "import androidx.compose.ui.input.pointer.positionChange",
                      "import androidx.compose.ui.input.pointer.positionChange\nimport androidx.compose.ui.input.pointer.PointerEventPass\nimport androidx.compose.ui.input.pointer.positionChangeIgnoreConsumed",
                      1,
                  )
              s = s.replace("awaitPointerEvent()", "awaitPointerEvent(PointerEventPass.Initial)").replace("change.positionChange().y", "change.positionChangeIgnoreConsumed().y").replace("76.dp.toPx()", "48.dp.toPx()")
              p2.write_text(s)
          PY

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          EXTRA_FLAGS=""
          if [ "${HAS_SDK_37:-false}" != "true" ]; then
            EXTRA_FLAGS="-x checkDebugAarMetadata"
          fi
          ./gradlew :app:assembleDebug $EXTRA_FLAGS -PappVersionName="2.1.3" -PappVersionCode="213" -Pabis=arm64-v8a -PupdateRepo=vnsec2/VNEra --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VNEra-2.1.3-Debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
