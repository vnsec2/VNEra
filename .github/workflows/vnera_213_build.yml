          # 4. Inline & Word-by-Word Karaoke Player Lyrics ONLY (Text only, never BasicText)
          def wrap_arg_call(call_src: str, param_name: str, wrapper_fn: str, default_expr: str | None = None) -> tuple[str, bool]:
              m = re.search(rf'\b{param_name}\s*=\s*', call_src)
              if not m:
                  if default_expr is not None:
                      close_idx = call_src.rfind(")")
                      if close_idx != -1:
                          before = call_src[:close_idx].rstrip()
                          comma = "" if before.endswith("(") or before.endswith(",") else ", "
                          return f"{before}{comma}{param_name} = {wrapper_fn}({default_expr}){call_src[close_idx:]}", True
                  return call_src, False
              start_val = m.end()
              if wrapper_fn in call_src[start_val:start_val + len(wrapper_fn) + 55]:
                  return call_src, False
              depth_p = depth_b = depth_c = 0
              end_val = len(call_src)
              for idx_c in range(start_val, len(call_src)):
                  ch = call_src[idx_c]
                  if ch == '(': depth_p += 1
                  elif ch == ')':
                      if depth_p == 0 and depth_b == 0 and depth_c == 0:
                          end_val = idx_c
                          break
                      depth_p -= 1
                  elif ch == '[': depth_b += 1
                  elif ch == ']': depth_b -= 1
                  elif ch == '{': depth_c += 1
                  elif ch == '}': depth_c -= 1
                  elif ch == ',' and depth_p == 0 and depth_b == 0 and depth_c == 0:
                      end_val = idx_c
                      break
              expr = call_src[start_val:end_val].strip()
              if not expr:
                  return call_src, False
              return f"{call_src[:start_val]}{wrapper_fn}({expr}){call_src[end_val:]}", True

          def patch_lyric_text_call(call_block: str, is_karaoke_file: bool) -> tuple[str, bool]:
              if not re.match(r'^\s*Text\s*\(', call_block):
                  return call_block, False
              new_block = call_block
              c0 = c1 = c2 = False
              m_txt = re.search(r'\btext\s*=\s*([^,\)\n]+)', new_block)
              txt_expr = m_txt.group(1).strip() if m_txt else ""
              if is_karaoke_file:
                  if txt_expr and not txt_expr.startswith('"'):
                      new_block, c0 = wrap_arg_call(
                          new_block,
                          "text",
                          "com.music.spotui.ui.screens.vnStyleKaraokeText"
                      )
              else:
                  new_block, c0 = wrap_arg_call(
                      new_block,
                      "text",
                      "com.music.spotui.ui.screens.vnPlayerInlineLyricText"
                  )
              new_block, c1 = wrap_arg_call(
                  new_block,
                  "color",
                  "com.music.spotui.ui.screens.vnPlayerInlineLyricColor",
                  "androidx.compose.material3.LocalContentColor.current"
              )
              if "fontSize" in new_block:
                  new_block, c2 = wrap_arg_call(new_block, "fontSize", "com.music.spotui.ui.screens.vnScaleLyricFontSize")
              elif "style" in new_block:
                  new_block, c2 = wrap_arg_call(new_block, "style", "com.music.spotui.ui.screens.vnScaleLyricTextStyle")
              else:
                  new_block, c2 = wrap_arg_call(
                      new_block,
                      "fontSize",
                      "com.music.spotui.ui.screens.vnScaleLyricFontSize",
                      "androidx.compose.ui.unit.TextUnit.Unspecified"
                  )
              return new_block, (c0 or c1 or c2)

          def patch_inline_and_karaoke_lyrics(path: Path):
              if not path.exists() or path.name in ("VnFrameRateManager.kt", "LyricsScreen.kt", "LookPreview.kt"):
                  return
              is_karaoke_or_lyric_comp = bool(re.search(r'(?:Karaoke|WordByWord|SyncedLyric|SweptLyric|LyricLine|LyricPreview|InlineLyric|ImmersiveLyrics)', path.name, re.I))
              is_player_ctrl = path.name == "PlayerControls.kt"
              if not is_karaoke_or_lyric_comp and not is_player_ctrl:
                  return

              src = path.read_text()
              if "vnPlayerInlineLyricColor" in src:
                  return
              changed = False

              if is_karaoke_or_lyric_comp:
                  target_prefix = "com.music.spotui.ui.screens.vnStyleKaraokeSpan(SpanStyle("
                  new_src, n_span = re.subn(r'(?<![.\w])SpanStyle\s*\(', target_prefix, src)
                  if n_span > 0:
                      out_chars = []
                      idx_s = 0
                      while idx_s < len(new_src):
                          pos = new_src.find(target_prefix, idx_s)
                          if pos == -1:
                              out_chars.append(new_src[idx_s:])
                              break
                          out_chars.append(new_src[idx_s:pos + len(target_prefix)])
                          scan_i = pos + len(target_prefix)
                          depth = 1
                          while scan_i < len(new_src) and depth > 0:
                              ch = new_src[scan_i]
                              if ch == '(': depth += 1
                              elif ch == ')': depth -= 1
                              out_chars.append(ch)
                              scan_i += 1
                          out_chars.append(')')
                          idx_s = scan_i
                      src = "".join(out_chars)
                      changed = True

              lines = src.splitlines(keepends=True)
              for idx, line in enumerate(lines):
                  near_chevron = is_player_ctrl and bool(re.search(r'(?:ChevronRight|KeyboardArrowRight|ArrowForwardIos|">"|"›")', line))
                  near_karaoke = is_karaoke_or_lyric_comp and bool(re.search(r'(?<![.\w])Text\s*\(', line))
                  if near_chevron or near_karaoke:
                      win_start = max(0, idx - 26) if near_chevron else idx
                      win_end = min(len(lines), idx + 16) if near_chevron else min(len(lines), idx + 1)
                      win_txt = "".join(lines[win_start:win_end])
                      if near_karaoke or (re.search(r'\blyric', win_txt, re.IGNORECASE) and not re.search(r'FormatQuote|lyrics_button|openLyrics|Settings', win_txt, re.IGNORECASE)):
                          k = win_start
                          while k < win_end:
                              if re.search(r'(?<![.\w])Text\s*\(', lines[k]) and '">"' not in lines[k] and '"›"' not in lines[k]:
                                  p_cnt = 0
                                  t_end = k
                                  for j in range(k, min(len(lines), k + 18)):
                                      p_cnt += lines[j].count("(") - lines[j].count(")")
                                      if p_cnt <= 0:
                                          t_end = j
                                          break
                                  call_block = "".join(lines[k:t_end + 1])
                                  new_block, did_patch = patch_lyric_text_call(call_block, is_karaoke_or_lyric_comp)
                                  if did_patch:
                                      lines[k:t_end + 1] = [new_block]
                                      changed = True
                                      k = t_end + 1
                                      continue
                              k += 1
                          if changed and near_chevron:
                              break
              if changed:
                  path.write_text("".join(lines))
                  print(f"Patched inline/karaoke player lyrics in {path}")

          for ui_kt in sorted(Path("app/src/main/java").rglob("*.kt")):
              patch_inline_and_karaoke_lyrics(ui_kt)

          # Track isPlaying state accurately (for pausing animations on pause) & hook Shuffle Memory/Lock
          for ctrl_kt in sorted(Path("app/src/main/java").rglob("*.kt")):
              if ctrl_kt.name == "VnFrameRateManager.kt":
                  continue
              ct = ctrl_kt.read_text()
              orig_ct = ct

              # A. Direct player isPlaying hooks (Player.Listener, ViewModel state, Player Composables)
              if "reportPlayerIsPlaying" not in ct:
                  # 1. Media3 Player.Listener.onIsPlayingChanged(isPlaying: Boolean)
                  ct, n_lis = re.subn(
                      r'(override\s+fun\s+onIsPlayingChanged\s*\(\s*([A-Za-z0-9_]+)\s*:\s*Boolean\s*\)\s*\{)',
                      r'\1\n        com.music.spotui.ui.screens.VnFpsPref.reportPlayerIsPlaying(\2)',
                      ct
                  )
                  # 2. Composable state collection: val isPlaying by ...collectAsState...
                  if n_lis == 0 and "@Composable" in ct:
                      ct, n_col = re.subn(
                          r'(?m)^([ \t]*)(val\s+(isPlaying)\s+by\s+[^\n]*collectAsState[^\n]*\n)',
                          r'\1\2\1androidx.compose.runtime.SideEffect { com.music.spotui.ui.screens.VnFpsPref.reportPlayerIsPlaying(\3) }\n',
                          ct
                      )
                      # 3. Composable parameter: fun PlayerControls(..., isPlaying: Boolean, ...)
                      if n_col == 0 and re.search(r'(?:Player|Controls|MiniPlayer)', ctrl_kt.name, re.I):
                          lines_p = ct.splitlines(keepends=True)
                          for idx_p, lp in enumerate(lines_p):
                              if re.search(r'\bfun\s+[A-Za-z0-9_]+\s*\(', lp):
                                  p_cnt = 0; se_p = None
                                  for j_p in range(idx_p, min(len(lines_p), idx_p + 25)):
                                      p_cnt += lines_p[j_p].count("(") - lines_p[j_p].count(")")
                                      if p_cnt <= 0 and "{" in lines_p[j_p]:
                                          se_p = j_p
                                          break
                                  if se_p is not None and re.search(r'\bisPlaying\s*:\s*Boolean\b', "".join(lines_p[idx_p:se_p + 1])):
                                      lines_p[se_p] += "    androidx.compose.runtime.SideEffect { com.music.spotui.ui.screens.VnFpsPref.reportPlayerIsPlaying(isPlaying) }\n"
                                      ct = "".join(lines_p)
                                      break

              # B. Shuffle toggle & user tap detection hooks
              if re.search(r'\bfun\s+(?:toggleShuffle|toggleShuffleMode|onShuffleClick)\s*\(', ct) and "onUserExplicitShuffleToggle" not in ct:
                  has_shuf_state = bool(re.search(r'\b(?:val|var)\s+(?:shuffleModeEnabled|isShuffleEnabled|shuffleEnabled)\b', ct))
                  shuf_var = next((v for v in ["shuffleModeEnabled", "isShuffleEnabled", "shuffleEnabled"] if re.search(rf'\b(?:val|var)\s+{v}\b', ct)), "shuffleModeEnabled")
                  fallback_expr = "com.music.spotui.ui.screens.VnFpsPref.shuffleLockEnabled && com.music.spotui.ui.screens.VnShuffleGuard.shuffleLockedByUser"
                  cur_shuf_expr = f"runCatching {{ {shuf_var}.value }}.getOrDefault({fallback_expr})" if has_shuf_state else fallback_expr
                  ct, _ = re.subn(
                      r'(fun\s+(?:toggleShuffle|toggleShuffleMode|onShuffleClick)\s*\([^{]*\{)',
                      rf'\1\n        val vnNextShuffle = !({cur_shuf_expr})\n        com.music.spotui.ui.screens.VnShuffleGuard.onUserExplicitShuffleToggle(vnNextShuffle)',
                      ct,
                      count=1
                  )

              # Mark user tap on Shuffle IconButtons so player resets are distinguished from manual off
              if "markUserShuffleInteraction" not in ct and re.search(r'Icons\.(?:Rounded|Outlined|Default|Filled)\.Shuffle', ct):
                  lines_s = ct.splitlines(keepends=True)
                  for idx_s, ls in enumerate(lines_s):
                      if re.search(r'Icons\.(?:Rounded|Outlined|Default|Filled)\.Shuffle', ls):
                          for back_s in range(idx_s, max(-1, idx_s - 14), -1):
                              if re.search(r'\bonClick\s*=\s*\{', lines_s[back_s]):
                                  lines_s[back_s] = re.sub(
                                      r'(\bonClick\s*=\s*\{)',
                                      r'\1 com.music.spotui.ui.screens.VnShuffleGuard.markUserShuffleInteraction();',
                                      lines_s[back_s],
                                      count=1
                                  )
                                  ct = "".join(lines_s)
                                  break
                          break

              # Observe shuffle state in Composables and re-enable when needed
              if "@Composable" in ct and re.search(r'(?:shuffleModeEnabled|isShuffleEnabled|shuffleEnabled)\.collectAsState', ct) and "observeShuffleState" not in ct:
                  toggle_fn = next((fn for fn in ["toggleShuffle", "toggleShuffleMode", "onShuffleClick"] if fn in ct), "toggleShuffle")
                  ct, _ = re.subn(
                      r'(?m)^([ \t]*)(val\s+([A-Za-z0-9_]+)\s+by\s+[A-Za-z0-9_.]*(?:shuffleModeEnabled|isShuffleEnabled|shuffleEnabled)\.collectAsState[^\n]*\n)',
                      rf'\1\2\1val vnShuffleCtx = androidx.compose.ui.platform.LocalContext.current\n\1androidx.compose.runtime.LaunchedEffect(\3) {{\n\1    com.music.spotui.ui.screens.VnShuffleGuard.observeShuffleState(vnShuffleCtx, \3) {{ {toggle_fn}() }}\n\1}}\n',
                      ct,
                      count=1
                  )

              if ct != orig_ct:
                  ctrl_kt.write_text(ct)

          extra_c = ", ".join(f"Color(0xFF{c})" for c in ["E53935","FF5722","FF9800","FFC107","00BFA5","00BCD4","3F51B5","7C4DFF","E040FB","FF4081","64FFDA","FFAB91","B388FF","ECEFF1"])
          for kf in sorted(Path("app/src/main/java").rglob("*.kt")):
              if kf.name == "VnFrameRateManager.kt": continue
              o = kf.read_text()
              u = re.sub(r'listOf\(((?:\s*Color\([^)]+\)\s*,?)+)\s*\)', lambda m: f"listOf({m.group(1).rstrip()}{'' if m.group(1).rstrip().endswith(',') else ','} {extra_c}\n)" if m.group(1).count("Color(") >= 3 and "0xFFE53935" not in m.group(1) else m.group(0), o)
              if u != o: kf.write_text(u)

          for tf in sorted(Path("app/src/main/java").rglob("*.kt")):
              if tf.name == "VnFrameRateManager.kt": continue
              tt = tf.read_text()
              if "MaterialTheme(" in tt and "customAccentColorArgb" not in tt:
                  tn, n = re.subn(r'MaterialTheme\s*\(\s*colorScheme\s*=\s*([A-Za-z0-9_]+)', r'MaterialTheme(\n        colorScheme = if (com.music.spotui.ui.screens.VnFpsPref.customAccentColorArgb != 0L) \1.copy(primary = androidx.compose.ui.graphics.Color(com.music.spotui.ui.screens.VnFpsPref.customAccentColorArgb), secondary = androidx.compose.ui.graphics.Color(com.music.spotui.ui.screens.VnFpsPref.customAccentColorArgb)) else \1', tt, count=1)
                  if n > 0: tf.write_text(tn)

          # 5. Universal Settings Card Injector (Revera 1.0.8 compatible):
          #    Never injects into outer wrapper Columns (0.dp height bug).
          #    Pass 1: Dedicated sub-pages (Appearance, Playback, Lyrics)
          #    Pass 2: App / Backup scrollable container
          #    Pass 3: Main SettingsScreen / ImmersiveSettingsScreen scrollable container
          res_map: dict[str, set[str]] = {"appearance": set(), "playback": set(), "lyrics": set(), "app": set()}
          for xml_f in Path("app/src/main/res").rglob("*.xml"):
              xt = xml_f.read_text(errors="ignore")
              for m in re.finditer(r'<string\s+name="([^"]+)"[^>]*>([^<]+)</string>', xt):
                  k, val = m.group(1), m.group(2)
                  kl = k.lower()
                  if any(w in kl for w in ("appearance", "theme", "accent", "dynamic_color", "display", "look", "color")) or re.search(r'(?:Εμφάνιση|Appearance|Χρώμα τόνου|Accent color|Dynamic color|Δυναμικό χρώμα|Θέμα|Theme|Γλώσσα|Language|Όψη|Look)', val, re.I):
                      res_map["appearance"].add(k)
                  if any(w in kl for w in ("playback", "audio", "quality", "gapless", "normaliz", "crossfade", "automix", "sound")) or re.search(r'(?:Αναπαραγωγή|Playback|Ποιότητα ήχου|Audio quality|Gapless|Normalization|Κανονικοποίηση|AutoMix|Μεταβάσεις|Ήχος|Sound)', val, re.I):
                      res_map["playback"].add(k)
                  if "lyric" in kl or re.search(r'(?:Στίχοι|Lyrics|Προεπισκόπηση στίχων|Swipe to expand lyrics|Λέξη προς λέξη|Καραόκε|Karaoke)', val, re.I):
                      res_map["lyrics"].add(k)
                  if any(w in kl for w in ("backup", "export", "import", "check_updates", "restart_player", "restore", "about", "general")) or re.search(r'(?:Import / Export|Export settings|Backup|Αντίγραφα ασφαλείας|Έλεγχος για ενημερώσεις|Επανεκκίνηση του player|Γενικά|General)', val, re.I):
                      res_map["app"].add(k)

          def build_cat_regex(literals: str, keys: set[str]) -> str:
              parts = [rf'"[^"]*(?:{literals})[^"]*"'] + [rf'\bR\.string\.{re.escape(k)}\b' for k in sorted(keys)]
              return "|".join(parts)

          cat_configs = [
              (
                  "appearance",
                  "VnAppearanceSettingsCard",
                  build_cat_regex(r'Εμφάνιση και γλώσσα|Appearance and language|Εμφάνιση|Appearance|Χρώμα τόνου|Accent color|Dynamic color|Δυναμικό χρώμα|Θέμα|Theme|Όψη|Look', res_map["appearance"]),
                  "com.music.spotui.ui.screens.VnAppearanceSettingsCard()"
              ),
              (
                  "playback",
                  "VnPlaybackSettingsCard",
                  build_cat_regex(r'Αναπαραγωγή|Playback|Ποιότητα ήχου|Audio quality|Gapless|Normalization|Κανονικοποίηση|AutoMix|Μεταβάσεις|Ήχος|Sound', res_map["playback"]),
                  "com.music.spotui.ui.screens.VnPlaybackSettingsCard()"
              ),
              (
                  "lyrics",
                  "VnLyricsSettingsCard",
                  build_cat_regex(r'Στίχοι|Lyrics|Προεπισκόπηση στίχων|Swipe to expand lyrics|Λέξη προς λέξη|Καραόκε|Karaoke', res_map["lyrics"]),
                  "com.music.spotui.ui.screens.VnLyricsSettingsCard()"
              ),
          ]
          app_fallback_rx = build_cat_regex(r'Import / Export|Export settings|Backup|Αντίγραφα ασφαλείας|Έλεγχος για ενημερώσεις|Επανεκκίνηση του player|VnSettingsBackup', res_map["app"])

          LAZY_ITEM_CALLS = {"item", "items", "itemsIndexed", "stickyHeader"}
          INLINE_ITEM_PARENTS = {"Row", "Surface", "Card", "ElevatedCard", "OutlinedCard", "AlertDialog", "DropdownMenu", "Button", "OutlinedButton", "TextButton", "IconButton"}
          WRAPPER_CHILDREN = {"LazyColumn", "LazyRow", "Scaffold", "NavHost", "AnimatedContent", "Crossfade", "HorizontalPager", "VerticalPager"}

          def strip_comments_and_strings(lines: list[str]) -> list[str]:
              clean = []
              in_bc = False
              for raw in lines:
                  s = raw
                  if in_bc:
                      end_bc = s.find("*/")
                      if end_bc == -1:
                          clean.append("")
                          continue
                      s = s[end_bc + 2:]
                      in_bc = False
                  while "/*" in s:
                      st_bc = s.find("/*")
                      en_bc = s.find("*/", st_bc + 2)
                      if en_bc != -1:
                          s = s[:st_bc] + " " + s[en_bc + 2:]
                      else:
                          s = s[:st_bc]
                          in_bc = True
                          break
                  s = s.split("//")[0]
                  s = re.sub(r'"(?:\\.|[^"\\])*"', '""', s)
                  s = re.sub(r"'(?:\\.|[^'\\])'", "''", s)
                  clean.append(s)
              return clean

          def extract_layout_containers(lines: list[str]) -> list[dict]:
              n = len(lines)
              clean = strip_comments_and_strings(lines)
              containers: list[dict] = []

              fun_spans: list[tuple[int, int, str]] = []
              i = 0
              while i < n:
                  m_fun = re.search(r'\bfun\s+(?:<[^>]+>\s*)?(?:[A-Za-z0-9_.]+\.)?([A-Za-z0-9_]+)\s*\(', clean[i])
                  if not m_fun:
                      i += 1
                      continue
                  fun_name = m_fun.group(1)
                  p_depth = 0
                  saw_p = False
                  body_line = None
                  is_expr = False
                  for li in range(i, n):
                      for ch in clean[li]:
                          if not saw_p:
                              if ch == '(':
                                  saw_p = True
                                  p_depth = 1
                              continue
                          if p_depth > 0:
                              if ch == '(': p_depth += 1
                              elif ch == ')': p_depth -= 1
                          else:
                              if ch == '=': is_expr = True; break
                              if ch == '{': body_line = li; break
                      if is_expr or body_line is not None:
                          break
                  if is_expr or body_line is None:
                      i += 1
                      continue
                  b_depth = 0
                  end_line = body_line
                  for li in range(body_line, n):
                      b_depth += clean[li].count('{') - clean[li].count('}')
                      if b_depth <= 0:
                          end_line = li
                          break
                  fun_spans.append((i, end_line, fun_name))
                  i = end_line + 1

              def enclosing_fun(line_idx: int) -> tuple[str, int, int]:
                  best = ("", 0, n - 1)
                  for fs, fe, fn in fun_spans:
                      if fs <= line_idx <= fe:
                          best = (fn, fs, fe)
                  return best

              block_nodes: list[dict] = []
              for start_li in range(n):
                  for m_call in re.finditer(r'(?<![.\w])([A-Z][A-Za-z0-9_]*)\b', clean[start_li]):
                      kind = m_call.group(1)
                      call_col = m_call.end(1)
                      p_depth = 0
                      in_parens = False
                      header_end_li = start_li
                      open_brace_li = None
                      open_brace_col = None

                      for li in range(start_li, min(n, start_li + 30)):
                          s = clean[li]
                          c0 = call_col if li == start_li else 0
                          for ci in range(c0, len(s)):
                              ch = s[ci]
                              if in_parens:
                                  if ch == '(': p_depth += 1
                                  elif ch == ')':
                                      p_depth -= 1
                                      if p_depth == 0:
                                          in_parens = False
                                          header_end_li = li
                                  continue
                              if ch.isspace():
                                  continue
                              if ch == '(' and open_brace_li is None:
                                  in_parens = True
                                  p_depth = 1
                                  continue
                              if ch == '{':
                                  open_brace_li = li
                                  open_brace_col = ci
                                  break
                              open_brace_li = -1
                              break
                          if open_brace_li is not None:
                              break

                      if open_brace_li is None or open_brace_li < 0:
                          continue

                      b_depth = 0
                      close_brace_li = None
                      lazy_items: list[tuple[int, int, str]] = []
                      cur_item_start: int | None = None
                      cur_item_indent: str = ""
                      p_inner = 0
                      last_word = ""
                      last_word_li = open_brace_li

                      for li in range(open_brace_li, n):
                          s = clean[li]
                          c0 = open_brace_col if li == open_brace_li else 0
                          idx_c = c0
                          L = len(s)
                          while idx_c < L:
                              ch = s[idx_c]
                              if ch.isalpha() or ch == '_':
                                  j_c = idx_c + 1
                                  while j_c < L and (s[j_c].isalnum() or s[j_c] == '_'):
                                      j_c += 1
                                  if b_depth == 1 and p_inner == 0:
                                      last_word = s[idx_c:j_c]
                                      last_word_li = li
                                  idx_c = j_c
                                  continue
                              if ch == '(':
                                  if b_depth >= 1:
                                      p_inner += 1
                              elif ch == ')':
                                  if b_depth >= 1:
                                      p_inner = max(0, p_inner - 1)
                              elif ch == '{':
                                  if b_depth == 1 and p_inner == 0 and kind == "LazyColumn" and last_word in LAZY_ITEM_CALLS:
                                      cur_item_start = last_word_li
                                      cur_item_indent = re.match(r'^(\s*)', lines[last_word_li]).group(1)
                                  b_depth += 1
                                  if b_depth == 1:
                                      last_word = ""
                              elif ch == '}':
                                  b_depth -= 1
                                  if b_depth == 1 and cur_item_start is not None:
                                      lazy_items.append((cur_item_start, li, cur_item_indent))
                                      cur_item_start = None
                                  if b_depth == 0:
                                      close_brace_li = li
                                      break
                              idx_c += 1
                          if close_brace_li is not None:
                              break

                      if close_brace_li is None or close_brace_li <= open_brace_li:
                          continue

                      header_txt = "".join(clean[start_li:header_end_li + 1])
                      block_nodes.append({
                          "kind": kind,
                          "start_li": start_li,
                          "header_end_li": header_end_li,
                          "open_li": open_brace_li,
                          "close_li": close_brace_li,
                          "has_vscroll": "verticalScroll" in header_txt,
                          "base_indent": re.match(r'^(\s*)', lines[start_li]).group(1),
                          "lazy_items": lazy_items,
                      })

              for node in block_nodes:
                  if node["kind"] not in ("LazyColumn", "Column"):
                      continue
                  fn_name, fn_s, fn_e = enclosing_fun(node["start_li"])
                  ancestors = [
                      other for other in block_nodes
                      if other is not node
                      and other["start_li"] >= fn_s
                      and other["close_li"] <= fn_e
                      and other["start_li"] <= node["start_li"]
                      and other["close_li"] >= node["close_li"]
                  ]
                  descendants = [
                      other for other in block_nodes
                      if other is not node
                      and other["start_li"] > node["start_li"]
                      and other["close_li"] < node["close_li"]
                  ]
                  if node["kind"] == "Column":
                      if any(a["kind"] in INLINE_ITEM_PARENTS for a in ancestors):
                          continue
                      if any(d["kind"] in WRAPPER_CHILDREN for d in descendants):
                          continue
                  has_scroll_ancestor = any(a["kind"] == "LazyColumn" or a["has_vscroll"] for a in ancestors)
                  node["fun_name"] = fn_name
                  node["has_scroll_ancestor"] = has_scroll_ancestor
                  node["is_scrollable"] = (node["kind"] == "LazyColumn") or node["has_vscroll"] or has_scroll_ancestor
                  containers.append(node)

              return containers

          def insert_into_container(lines: list[str], cont: dict, comp_call: str, before_backup: bool = False) -> list[str]:
              new_lines = list(lines)
              if cont["kind"] == "LazyColumn":
                  items = cont["lazy_items"]
                  if before_backup and items:
                      backup_item = next(((s, e, ind) for (s, e, ind) in items if "VnSettingsBackup" in "".join(new_lines[s:e+1])), None)
                      if backup_item is not None:
                          s_idx, _, item_ind = backup_item
                          new_lines.insert(s_idx, f"{item_ind}item {{ {comp_call} }}\n")
                          return new_lines
                  if items:
                      _, last_end, item_ind = items[-1]
                      new_lines.insert(last_end + 1, f"{item_ind}item {{ {comp_call} }}\n")
                      return new_lines
                  child_ind = cont["base_indent"] + "    "
                  new_lines.insert(cont["close_li"], f"{child_ind}item {{ {comp_call} }}\n")
                  return new_lines
              else:
                  if before_backup:
                      for li in range(cont["open_li"] + 1, cont["close_li"]):
                          if "VnSettingsBackup(" in new_lines[li]:
                              ind = re.match(r'^(\s*)', new_lines[li]).group(1)
                              new_lines.insert(li, f"{ind}{comp_call}\n")
                              return new_lines
                  child_ind = cont["base_indent"] + "    "
                  new_lines.insert(cont["close_li"], f"{child_ind}{comp_call}\n")
                  return new_lines

          ui_kt_files = [
              p for p in sorted(Path("app/src/main/java").rglob("*.kt"))
              if p.name not in ("VnFrameRateManager.kt", "VnSettingsBackup.kt")
          ]

          def file_priority(p: Path) -> tuple[int, str]:
              if p.name == "SettingsScreen.kt":
                  return (0, str(p))
              if p.name == "ImmersiveSettingsScreen.kt":
                  return (1, str(p))
              if "Setting" in p.name:
                  return (2, str(p))
              return (3, str(p))

          ui_kt_files.sort(key=file_priority)

          placed_standard: set[str] = set()
          placed_immersive: set[str] = set()

          # Pass 1: Match dedicated sub-page containers (Appearance, Playback, Lyrics)
          for kt_file in ui_kt_files:
              is_imm_file = "immersive" in str(kt_file).lower()
              placed_set = placed_immersive if is_imm_file else placed_standard

              for cat_name, marker, anchor_rx, comp_call in cat_configs:
                  if cat_name in placed_set:
                      continue
                  src_text = kt_file.read_text()
                  if marker in src_text:
                      placed_set.add(cat_name)
                      continue
                  lines = src_text.splitlines(keepends=True)
                  containers = extract_layout_containers(lines)
                  if not containers:
                      continue

                  best_cont = None
                  best_score = 0
                  for cont in containers:
                      if not cont["is_scrollable"] and not re.search(cat_name, cont["fun_name"], re.I):
                          continue
                      body_txt = "".join(lines[cont["start_li"]:cont["close_li"] + 1])
                      is_root_menu = (
                          bool(re.search(r'(?:Λογαριασμοί|Accounts)', body_txt, re.I)) and
                          bool(re.search(r'(?:Αποθηκευτικός χώρος|Storage)', body_txt, re.I)) and
                          bool(re.search(r'(?:Εφαρμογή|App)', body_txt, re.I))
                      )
                      if is_root_menu:
                          continue
                      score = 0
                      if re.search(cat_name, cont["fun_name"], re.I):
                          score += 15
                      matches = len(re.findall(anchor_rx, body_txt, re.I))
                      score += matches * 3
                      if cont["is_scrollable"]:
                          score += 6
                      is_outer = any(
                          other is not cont and other["start_li"] > cont["start_li"] and other["close_li"] < cont["close_li"]
                          for other in containers
                      )
                      if not is_outer:
                          score += 3
                      if score > best_score and matches > 0:
                          best_score = score
                          best_cont = cont

                  if best_cont is not None:
                      updated_lines = insert_into_container(lines, best_cont, comp_call, before_backup=False)
                      kt_file.write_text("".join(updated_lines))
                      placed_set.add(cat_name)
                      print(f"INJECTED {marker} into {kt_file} (fun={best_cont['fun_name']}, kind={best_cont['kind']}, lines={best_cont['start_li']+1}..{best_cont['close_li']+1})")

          # Pass 2: Any unplaced category goes into the scrollable App / Backup sub-page container
          for target_group, placed_set in [("standard", placed_standard), ("immersive", placed_immersive)]:
              missing_cats = [c for c in cat_configs if c[0] not in placed_set]
              if not missing_cats:
                  continue
              for kt_file in ui_kt_files:
                  is_imm_file = "immersive" in str(kt_file).lower()
                  if (target_group == "immersive") != is_imm_file:
                      continue
                  src_text = kt_file.read_text()
                  lines = src_text.splitlines(keepends=True)
                  containers = extract_layout_containers(lines)
                  scrollable_conts = [c for c in containers if c["is_scrollable"]]
                  app_cont = next(
                      (c for c in reversed(scrollable_conts) if re.search(app_fallback_rx, "".join(lines[c["start_li"]:c["close_li"] + 1]), re.I)),
                      None
                  )
                  if app_cont is not None:
                      for cat_name, marker, _, comp_call in missing_cats:
                          if marker not in "".join(lines):
                              lines = insert_into_container(lines, app_cont, comp_call, before_backup=True)
                              placed_set.add(cat_name)
                              print(f"FALLBACK-APP INJECTED {marker} into {kt_file} (fun={app_cont['fun_name']}, kind={app_cont['kind']})")
                      cur_joined = "".join(lines)
                      if "VnSettingsBackup(" not in cur_joined and "VnCopyBackupExtensionsButton" not in cur_joined:
                          lines = insert_into_container(lines, app_cont, "com.music.spotui.ui.screens.VnCopyBackupExtensionsButton()", before_backup=False)
                      kt_file.write_text("".join(lines))
                      break

          # Pass 3: Guaranteed Safety Net — if any category is still missing, inject into main SettingsScreen / ImmersiveSettingsScreen scrollable list
          for target_group, placed_set in [("standard", placed_standard), ("immersive", placed_immersive)]:
              missing_cats = [c for c in cat_configs if c[0] not in placed_set]
              for kt_file in ui_kt_files:
                  if "Setting" not in kt_file.name:
                      continue
                  is_imm_file = "immersive" in str(kt_file).lower()
                  if (target_group == "immersive") != is_imm_file:
                      continue
                  src_text = kt_file.read_text()
                  lines = src_text.splitlines(keepends=True)
                  containers = extract_layout_containers(lines)
                  scrollable_conts = [c for c in containers if c["is_scrollable"]]
                  if not scrollable_conts:
                      continue
                  main_cont = scrollable_conts[0]
                  did_modify = False
                  for cat_name, marker, _, comp_call in missing_cats:
                      if marker not in "".join(lines):
                          lines = insert_into_container(lines, main_cont, comp_call, before_backup=True)
                          placed_set.add(cat_name)
                          did_modify = True
                          print(f"SAFETY-MAIN INJECTED {marker} into {kt_file} (fun={main_cont['fun_name']}, kind={main_cont['kind']})")
                  cur_joined = "".join(lines)
                  if "VnSettingsBackup(" not in cur_joined and "VnCopyBackupExtensionsButton" not in cur_joined:
                      lines = insert_into_container(lines, main_cont, "com.music.spotui.ui.screens.VnCopyBackupExtensionsButton()", before_backup=False)
                      did_modify = True
                      print(f"SAFETY-MAIN INJECTED VnCopyBackupExtensionsButton into {kt_file}")
                  if did_modify:
                      kt_file.write_text("".join(lines))
                  break

          print(f"SETTINGS INJECTION SUMMARY -> standard={sorted(placed_standard)}, immersive={sorted(placed_immersive)}")

          for target_name in ["SettingsScreen.kt", "ImmersiveSettingsScreen.kt", "PlayerControls.kt", "ImmersivePlayer.kt"]:
              ap = next(Path("app/src/main/java").rglob(target_name), None)
              if ap is not None and ap.exists() and "vnAnimatedElement" not in ap.read_text():
                  c = [0]
                  an = re.sub(r'\bModifier\s*\.\s*fillMaxWidth\s*\(\s*\)', lambda m: (c.__setitem__(0, c[0]+1) or f"{m.group(0)}.vnAnimatedElement({c[0]})"), ap.read_text())
                  ap.write_text(ensure_imports(an, ["com.music.spotui.ui.screens.vnAnimatedElement"]))

          for sf in sorted(Path("app/src/main/java").rglob("*.kt")):
              ft = sf.read_text()
              if sf.name != "VnFrameRateManager.kt" and "onTrackPlaybackObserved" not in ft and '"Lossless"' in ft and "LocalContext.current" in ft and "@Composable" in ft:
                  lines = ft.splitlines(keepends=True)
                  for idx, l in enumerate(lines):
                      if '"Lossless"' in l:
                          w = "".join(lines[max(0, idx-25):min(len(lines), idx+15)])
                          mc = re.search(r'\bval\s+([A-Za-z0-9_]+)\s*=\s*LocalContext\.current\b', w)
                          mq = re.search(r'\bval\s+([A-Za-z0-9_]*(?:quality|Quality|format|Format|badge|Badge)[A-Za-z0-9_]*)\b', w)
                          mt = re.search(r'\b([A-Za-z0-9_]+)\.(?:title|name)\b', w)
                          ms = re.search(r'\b([A-Za-z0-9_]+)\.(source|provider|extension|sourceName|providerName)\b', w)
                          if mc and mq and mt:
                              src_expr = f"({ms.group(1)}.{ms.group(2)}?.toString().orEmpty())" if ms else '""'
                              for k in range(max(0, idx-25), idx+1):
                                  if re.search(rf'\bval\s+{re.escape(mq.group(1))}\b', lines[k]) and "=" in lines[k]:
                                      ind = re.match(r'^(\s*)', lines[k]).group(1)
                                      lines.insert(k+1, f'{ind}androidx.compose.runtime.LaunchedEffect({mt.group(1)}.id, {mq.group(1)}) {{ com.music.spotui.ui.screens.VnPlaybackMonitor.onTrackPlaybackObserved({mc.group(1)}, {mt.group(1)}.id.toString(), {mt.group(1)}.title.toString(), {src_expr}, {mq.group(1)}.toString()) }}\n')
                                      sf.write_text("".join(lines)); break
                          break

          bf = next(Path("app/src/main/java").rglob("VnSettingsBackup.kt"), Path("app/src/main/java/com/music/spotui/ui/screens/VnSettingsBackup.kt"))
          if bf.exists():
              bt = bf.read_text()
              cv = next((x for x in ["context", "ctx", "localContext", "appContext"] if re.search(rf'\b(?:val|var)\s+{x}\b|\b{x}\s*:\s*Context\b', bt)), None)
              if cv:
                  if "onBackupImported" not in bt:
                      bt = re.sub(r'\bJSONObject\(\s*([A-Za-z0-9_]+)\s*\)', rf'JSONObject(com.music.spotui.ui.screens.VnFpsPref.onBackupImported({cv}, \1))', bt, count=1)
                  if "enrichBackupJson" not in bt:
                      bt = re.sub(r'\b([A-Za-z0-9_]+\.toString\(\s*(?:2|4)?\s*\))', rf'com.music.spotui.ui.screens.VnFpsPref.enrichBackupJson({cv}, \1)', bt, count=1)
              if "VnCopyBackupExtensionsButton" not in bt:
                  lines = bt.splitlines(keepends=True)
                  cs = next((i for i, l in enumerate(lines) if "@Composable" in l), None)
                  col = next((i for i in range(cs, len(lines)) if re.search(r'\bColumn\b', lines[i])), None) if cs is not None else None
                  if col is not None:
                      d = 0; op = False
                      for i in range(col, len(lines)):
                          d += lines[i].count("{") - lines[i].count("}")
                          if "{" in lines[i]: op = True
                          if op and d <= 0:
                              safety_calls = []
                              for cat_name, marker, _, comp_call in cat_configs:
                                  if cat_name not in placed_standard and cat_name not in placed_immersive:
                                      safety_calls.append(f"    {comp_call}\n")
                              ind_b = re.match(r'^(\s*)', lines[i]).group(1)
                              for sc in safety_calls:
                                  lines.insert(i, ind_b + sc)
                                  i += 1
                              lines.insert(i, ind_b + "    com.music.spotui.ui.screens.VnCopyBackupExtensionsButton()\n")
                              bt = "".join(lines); break
              bf.write_text(bt)

          gh = False
          for ap in sorted(Path("app/src/main/java").rglob("*Activity.kt")):
              at = ap.read_text()
              if "setContent" in at and "VnFrameRateGuard" not in at:
                  an, n = re.subn(r'(?m)^([ \t]*)(setContent(?:\([^)]*\))?\s*\{)\s*$', r'\1\2\n\1    com.music.spotui.ui.screens.VnFrameRateGuard()', at, count=1)
                  if n > 0: ap.write_text(an); gh = True; break
          if not gh and p2.exists() and "VnFrameRateGuard" not in p2.read_text():
              p2.write_text(re.sub(r'(?m)^([ \t]*fun\s+ImmersivePlayer\b[^{]*\{)\s*$', r'\1\n    com.music.spotui.ui.screens.VnFrameRateGuard()', p2.read_text(), count=1))
          PY

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          EXTRA_FLAGS=""
          [ "$HAS_SDK_37" != "true" ] && EXTRA_FLAGS="-Pandroid.suppressUnsupportedCompileSdk=37"
          ./gradlew :app:assembleDebug $EXTRA_FLAGS -PappVersionName="2.1.4" -PappVersionCode="$BUILD_VERSION_CODE" -Pabis=arm64-v8a -PupdateRepo=vnsec2/VNEra --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VNEra-2.1.4-Debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
