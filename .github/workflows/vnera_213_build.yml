                  if n_imm > 0:
                      ilt_new = "import com.music.spotui.ui.screens.findActivity\nimport com.music.spotui.ui.screens.vnLyricsCenterGestures\n" + ilt_new
                      ilt_new = ilt_new.replace(
                          ".fillMaxSize()",
                          ".fillMaxSize().then(Modifier.vnLyricsCenterGestures(vnImmLyricsActivity, null))",
                          1,
                      )
                      imm_lyrics.write_text(ilt_new)
                      print("Hooked VnLyricsFullscreenEffect & vnLyricsCenterGestures into ImmersiveLyricsPanel.kt")

          # 8. Immersive Player fix
          p2 = Path("app/src/main/java/com/music/spotui/ui/immersive/player/ImmersivePlayer.kt")
          if p2.exists():
              s = p2.read_text()
              if "PointerEventPass" not in s and "import androidx.compose.ui.input.pointer.positionChange" in s:
                  s = s.replace(
                      "import androidx.compose.ui.input.pointer.positionChange",
                      "import androidx.compose.ui.input.pointer.positionChange\nimport androidx.compose.ui.input.pointer.PointerEventPass\nimport androidx.compose.ui.input.pointer.positionChangeIgnoreConsumed",
                      1,
                  )
              s = s.replace("awaitPointerEvent()", "awaitPointerEvent(PointerEventPass.Initial)").replace("change.positionChange().y", "change.positionChangeIgnoreConsumed().y").replace("76.dp.toPx()", "48.dp.toPx()")
              p2.write_text(s)

          # 9. Βελτίωση VnSettingsBackup.kt:
          #    - Εξαγωγή & Restore ΟΛΩΝ των SharedPreferences αρχείων (Απόκρυψη DJ κ.λπ.)
          #    - Αποθήκευση τελευταίου backup για αντιγραφή Extensions στο Clipboard
          #    - Reload προτιμήσεων + recreate Activity μετά το restore
          backup_file = Path("app/src/main/java/com/music/spotui/ui/screens/VnSettingsBackup.kt")
          if backup_file.exists():
              bt = backup_file.read_text()
              bt_mod = bt

              if "onBackupImported" not in bt_mod:
                  bt_mod = re.sub(
                      r'\bJSONObject\(\s*([A-Za-z0-9_]+)\s*\)',
                      r'JSONObject(com.music.spotui.ui.screens.VnFpsPref.onBackupImported(context, \1))',
                      bt_mod,
                      count=1,
                  )

              if "enrichBackupJson" not in bt_mod:
                  bt_mod = re.sub(
                      r'\b([A-Za-z0-9_]+\.toString\(\s*(?:2|4)?\s*\))',
                      r'com.music.spotui.ui.screens.VnFpsPref.enrichBackupJson(context, \1)',
                      bt_mod,
                      count=1,
                  )

              if "VnFpsPref.reload" not in bt_mod:
                  bt_mod = re.sub(
                      r'(\.(?:commit|apply)\(\))',
                      r'\1; com.music.spotui.ui.screens.VnFpsPref.reload(context)',
                      bt_mod,
                  )
                  bt_mod = re.sub(
                      r'(Toast\.makeText\([^;]+(?:επαναφ|restore|εισαγ|import|φορτ)[^;]+\)\.show\(\))',
                      r'\1; (context as? android.app.Activity)?.recreate()',
                      bt_mod,
                      flags=re.IGNORECASE,
                  )

              if "VnCopyBackupExtensionsButton" not in bt_mod:
                  lines = bt_mod.splitlines(keepends=True)
                  inserted = False
                  for idx in range(len(lines) - 1, -1, -1):
                      if re.match(r'^\s*\}\s*$', lines[idx]) and idx > 15:
                          prev_block = "".join(lines[max(0, idx - 8):idx])
                          if "Button" in prev_block or "Row" in prev_block:
                              indent = re.match(r'^(\s*)', lines[idx]).group(1)
                              lines.insert(idx, f"{indent}com.music.spotui.ui.screens.VnCopyBackupExtensionsButton()\n")
                              inserted = True
                              break
                  if inserted:
                      bt_mod = "".join(lines)
                      print("Hooked VnCopyBackupExtensionsButton into VnSettingsBackup.kt")

              if bt_mod != bt:
                  backup_file.write_text(bt_mod)

          # 10. Σύνδεση VnFpsSelectorCard πάνω από το VnSettingsBackup σε όλα τα UI αρχεία που το καλούν
          for ui_file in sorted(Path("app/src/main/java/com/music/spotui/ui").rglob("*.kt")):
              if ui_file.name in ("VnSettingsBackup.kt", "VnFrameRateManager.kt"):
                  continue
              st = ui_file.read_text()
              if "VnFpsSelectorCard" in st:
                  continue
              lines = st.splitlines(keepends=True)
              changed = False
              for i, line in enumerate(lines):
                  stripped = line.lstrip()
                  indent = line[:len(line) - len(stripped)]
                  if stripped.startswith(("import ", "package ", "//", "/*", "*", "fun ", "object ", "class ")):
                      continue
                  if re.match(r'^item\b.*\{.*\bVn(?:Settings)?Backup\w*', stripped):
                      lines.insert(i, f"{indent}item {{ com.music.spotui.ui.screens.VnFpsSelectorCard() }}\n")
                      changed = True
                      break
                  if re.match(r'^(?:com\.music\.spotui\.ui\.screens\.)?Vn(?:Settings)?Backup(?:\.[A-Za-z0-9_]+|\w*)\s*\(', stripped):
                      lines.insert(i, f"{indent}com.music.spotui.ui.screens.VnFpsSelectorCard()\n")
                      changed = True
                      break
              if changed:
                  ui_file.write_text("".join(lines))
                  print(f"Hooked VnFpsSelectorCard into {ui_file}")

          guard_hooked = False
          for act_path in sorted(Path("app/src/main/java").rglob("*Activity.kt")):
              at = act_path.read_text()
              if "setContent" in at and "VnFrameRateGuard" not in at:
                  at_new, n = re.subn(
                      r'(?m)^([ \t]*)(setContent(?:\([^)]*\))?\s*\{)\s*$',
                      r'\1\2\n\1    com.music.spotui.ui.screens.VnFrameRateGuard()',
                      at,
                      count=1,
                  )
                  if n > 0:
                      act_path.write_text(at_new)
                      print(f"Hooked VnFrameRateGuard into {act_path}")
                      guard_hooked = True
                      break

          if not guard_hooked and p2.exists():
              it = p2.read_text()
              if "VnFrameRateGuard" not in it:
                  it_new, n = re.subn(
                      r'(?m)^([ \t]*fun\s+ImmersivePlayer\b[^{]*\{)\s*$',
                      r'\1\n    com.music.spotui.ui.screens.VnFrameRateGuard()',
                      it,
                      count=1,
                  )
                  if n > 0:
                      p2.write_text(it_new)
                      print("Hooked VnFrameRateGuard into ImmersivePlayer.kt")
          PY

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          EXTRA_FLAGS=""
          if [ "$HAS_SDK_37" != "true" ]; then
            EXTRA_FLAGS="-Pandroid.suppressUnsupportedCompileSdk=37"
          fi
          ./gradlew :app:assembleDebug $EXTRA_FLAGS -PappVersionName="2.1.4" -PappVersionCode="$BUILD_VERSION_CODE" -Pabis=arm64-v8a -PupdateRepo=vnsec2/VNEra --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VNEra-2.1.4-Debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
