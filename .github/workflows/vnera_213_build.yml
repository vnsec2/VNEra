              text = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "app.vnera.music"', text)
              text = re.sub(r'versionName\s*=\s*".*?"', 'versionName = "2.1.4"', text)
              text = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {build_vcode}', text)
              if "projectUrl" in text and not re.search(r'\b(val|var)\s+projectUrl\b', text):
                  text = re.sub(
                      r'(?m)^(\s*android\s*\{)',
                      r'val projectUrl = providers.gradleProperty("projectUrl").orElse("https://github.com/vnsec2/VNEra").get()\n\n\1',
                      text,
                      count=1,
                  )
              if "vnera-debug.keystore" not in text:
                  text += '''
          android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = file("vnera-debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          }
          '''
              if "META-INF/versions/9/OSGI-INF/MANIFEST.MF" not in text:
                  text += '\nandroid {\n    packaging {\n        resources {\n            excludes += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"\n            excludes += "META-INF/versions/9/module-info.class"\n        }\n    }\n}\n'
              gradle.write_text(text)

          # 5. Compatibility guard για UpdateChecker.kt
          upd = Path("app/src/main/java/com/music/spotui/data/api/UpdateChecker.kt")
          if upd.exists():
              ut = upd.read_text()
              missing_consts = []
              if re.search(r'(?<![.\w])UPDATE_BASE_URL\b', ut) and not re.search(r'\bval\s+UPDATE_BASE_URL\b', ut):
                  missing_consts.append('private const val UPDATE_BASE_URL = "https://api.github.com/repos/vnsec2/VNEra"')
              if re.search(r'(?<![.\w])PROJECT_URL\b', ut) and not re.search(r'\bval\s+PROJECT_URL\b', ut):
                  missing_consts.append('private const val PROJECT_URL = "https://github.com/vnsec2/VNEra"')
              if missing_consts:
                  lines = ut.splitlines()
                  last_import_idx = max((i for i, l in enumerate(lines) if l.startswith("import ")), default=0)
                  lines.insert(last_import_idx + 1, "\n" + "\n".join(missing_consts))
                  upd.write_text("\n".join(lines) + "\n")
                  print("Injected missing UpdateChecker constants after imports")

          # 6. Fix CastMessage.kt expression-body return
          cast_msg = Path("app/src/main/java/com/music/spotui/cast/CastMessage.kt")
          if cast_msg.exists():
              lines = cast_msg.read_text().splitlines()
              target_idx = min(36, len(lines) - 1)
              if "return" in lines[target_idx]:
                  fun_idx = None
                  for i in range(target_idx, -1, -1):
                      if re.search(r'\bfun\b', lines[i]):
                          fun_idx = i
                          break
                  if fun_idx is not None:
                      paren = 0
                      eq_line = None
                      eq_col = None
                      for i in range(fun_idx, target_idx + 1):
                          line = lines[i]
                          for c_idx, ch in enumerate(line):
                              if ch == '(':
                                  paren += 1
                              elif ch == ')':
                                  paren -= 1
                              elif ch == '=' and paren == 0:
                                  prev_ch = line[c_idx - 1] if c_idx > 0 else ''
                                  next_ch = line[c_idx + 1] if c_idx + 1 < len(line) else ''
                                  if prev_ch not in ('=', '!', '<', '>') and next_ch not in ('=', '>'):
                                      eq_line = i
                                      eq_col = c_idx
                                      break
                          if eq_line is not None:
                              break

                      if eq_line is not None:
                          indent = re.match(r'^(\s*)', lines[fun_idx]).group(1)
                          brace = paren = bracket = 0
                          has_body = False
                          end_line = eq_line
                          for i in range(eq_line, len(lines)):
                              seg = lines[i][eq_col + 1:] if i == eq_line else lines[i]
                              code_part = seg.split('//')[0]
                              if code_part.strip():
                                  has_body = True
                              for ch in code_part:
                                  if ch == '{': brace += 1
                                  elif ch == '}': brace -= 1
                                  elif ch == '(': paren += 1
                                  elif ch == ')': paren -= 1
                                  elif ch == '[': bracket += 1
                                  elif ch == ']': bracket -= 1
                              if has_body and brace <= 0 and paren <= 0 and bracket <= 0 and i >= target_idx:
                                  nxt = lines[i + 1].lstrip() if i + 1 < len(lines) else ''
                                  if not nxt.startswith(('.', '?.', '?:', '&&', '||')):
                                      end_line = i
                                      break

                          before_eq = lines[eq_line][:eq_col].rstrip()
                          after_eq = lines[eq_line][eq_col + 1:].lstrip()
                          if after_eq:
                              lines[eq_line] = f"{before_eq} {{\n{indent}    return {after_eq}"
                          else:
                              lines[eq_line] = f"{before_eq} {{"
                              lines[eq_line + 1] = f"{indent}    return " + lines[eq_line + 1].lstrip()
                          lines[end_line] = lines[end_line] + f"\n{indent}}}"
                          cast_msg.write_text("\n".join(lines) + "\n")

          def hook_lazy_column_states(src: str) -> str:
              if "VnRegisterLyricsScrollState" in src:
                  return src
              lines = src.splitlines(keepends=True)
              out = []
              i = 0
              while i < len(lines):
                  m = re.match(r'^(\s*)LazyColumn\s*\(', lines[i])
                  if m:
                      indent = m.group(1)
                      block = [lines[i]]
                      paren = lines[i].count("(") - lines[i].count(")")
                      while paren > 0 and i + 1 < len(lines):
                          i += 1
                          block.append(lines[i])
                          paren += lines[i].count("(") - lines[i].count(")")
                      call_txt = "".join(block)
                      ms = re.search(r'\bstate\s*=\s*([A-Za-z0-9_.]+)', call_txt)
                      if ms:
                          out.append(f"{indent}com.music.spotui.ui.screens.VnRegisterLyricsScrollState({ms.group(1)})\n")
                      out.extend(block)
                  else:
                      out.append(lines[i])
                  i += 1
              return "".join(out)

          def boost_fullscreen_dismiss_thresholds(code_block: str) -> str:
              # Αύξηση ΟΛΩΝ των κατωφλίων vertical swipe/fling (dp.toPx & fraction) στα 300.dp ώστε να μη φεύγει με λίγο σύρσιμο
              def _raise_dp(m):
                  val = int(m.group(1))
                  if 20 <= val <= 240:
                      return "300.dp.toPx()"
                  return m.group(0)
              code_block = re.sub(r'\b(\d{2,3})\.dp\.toPx\(\)', _raise_dp, code_block)
              code_block = re.sub(r'\b0\.[1-3]\d*f\b', '0.48f', code_block)
              return code_block

          # 7. Fullscreen Lyrics Gestures (πολύ μεγαλύτερο σύρσιμο εξόδου) + Red-Edge Scrolling (LyricsScreen.kt)
          lyrics_file = Path("app/src/main/java/com/music/spotui/ui/screens/LyricsScreen.kt")
          if lyrics_file.exists():
              src = lyrics_file.read_text()
              src_mod = hook_lazy_column_states(src)

              if "vnLyricsCenterGestures" not in src_mod:
                  lines = src_mod.splitlines(keepends=True)
                  i = 0
                  while i < len(lines):
                      if re.search(r'\bfun\s+[A-Za-z0-9_]+\s*\(', lines[i]):
                          sig_end = None
                          paren = 0
                          for j in range(i, min(i + 25, len(lines))):
                              paren += lines[j].count("(") - lines[j].count(")")
                              if paren <= 0 and "{" in lines[j]:
                                  sig_end = j
                                  break
                          if sig_end is not None:
                              sig_text = "".join(lines[i:sig_end + 1])
                              if re.search(r'\bonClose\s*:\s*\(\)\s*->\s*Unit', sig_text):
                                  depth = 0
                                  body_end = None
                                  for k in range(sig_end, len(lines)):
                                      depth += lines[k].count("{") - lines[k].count("}")
                                      if depth <= 0:
                                          body_end = k
                                          break
                                  if body_end is not None:
                                      body_text = "".join(lines[sig_end:body_end + 1])
                                      # Ενίσχυση κατωφλίων εξόδου σε ΚΑΘΕ composable του LyricsScreen που δέχεται onClose
                                      boosted_body = boost_fullscreen_dismiss_thresholds(body_text)
                                      boosted_lines = boosted_body.splitlines(keepends=True)
                                      lines[sig_end:body_end + 1] = boosted_lines
                                      body_end = sig_end + len(boosted_lines) - 1

                                      if ".fillMaxSize()" in boosted_body and "vnLyricsCenterGestures" not in boosted_body:
                                          lines[sig_end] = (
                                              lines[sig_end]
                                              + "    com.music.spotui.ui.screens.VnLyricsFullscreenEffect()\n"
                                              + "    val vnLyricsActivity = androidx.compose.ui.platform.LocalContext.current.findActivity()\n"
                                          )
                                          hooked = False
                                          for k in range(sig_end + 1, body_end + 1):
                                              if not hooked and ".fillMaxSize()" in lines[k]:
                                                  lines[k] = lines[k].replace(
                                                      ".fillMaxSize()",
                                                      ".fillMaxSize().then(Modifier.vnLyricsCenterGestures(vnLyricsActivity, onClose))",
                                                      1,
                                                  )
                                                  hooked = True
                                              if "indication = null" in lines[k] and "onClick = onClose" in lines[k]:
                                                  lines[k] = lines[k].replace(
                                                      "onClick = onClose",
                                                      "onClick = { com.music.spotui.ui.screens.VnFpsPref.toggleSystemBars(vnLyricsActivity) }",
                                                  )
                                          print("Hooked Red-Edge Scroll + 300dp Fullscreen Exit Threshold into LyricsScreen.kt")
                                      i = body_end + 1
                                      continue
                      i += 1
                  src_mod = "".join(lines)

              if src_mod != src:
                  lyrics_file.write_text(src_mod)

          # Υποστήριξη Red-Edge Scrolling & 300dp threshold και στο ImmersiveLyricsPanel.kt (ΧΩΡΙΣ 2ο VolumePill!)
          imm_lyrics = Path("app/src/main/java/com/music/spotui/ui/immersive/lyrics/ImmersiveLyricsPanel.kt")
          if imm_lyrics.exists():
