name: Build VNEra Debug APK (Revera 1.0.8 Base)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout main for Persistent Signing Key
        uses: actions/checkout@v4
        with:
          ref: main
          path: _keystore_repo
          fetch-depth: 0

      - name: Prepare Persistent Debug Keystore
        run: |
          mkdir -p "$HOME/.android"
          FOUND_KS=$(find _keystore_repo -maxdepth 4 -name "vnera-debug.keystore" -o -name "debug.keystore" | head -n 1)
          if [ -n "$FOUND_KS" ] && [ -f "$FOUND_KS" ]; then
            echo "Found persistent keystore at $FOUND_KS"
            cp -f "$FOUND_KS" /tmp/vnera-debug.keystore
          else
            echo "Generating new persistent debug keystore..."
            keytool -genkeypair -v \
              -keystore /tmp/vnera-debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp -f /tmp/vnera-debug.keystore "$HOME/.android/debug.keystore"

      - name: Checkout source-review
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge VNEra Custom Changes onto Revera 1.0.8 Base
        run: |
          set -e
          git config user.name "VNEra CI"
          git config user.email "ci@vnera.local"

          # Αποθήκευση Gradle wrapper & custom resources από το repo πριν το merge
          mkdir -p /tmp/vnera_gradle/wrapper /tmp/vnera_res
          [ -f "gradlew" ] && cp -f gradlew /tmp/vnera_gradle/
          [ -f "gradlew.bat" ] && cp -f gradlew.bat /tmp/vnera_gradle/
          [ -f "gradle/wrapper/gradle-wrapper.jar" ] && cp -f gradle/wrapper/gradle-wrapper.jar /tmp/vnera_gradle/wrapper/
          [ -f "gradle/wrapper/gradle-wrapper.properties" ] && cp -f gradle/wrapper/gradle-wrapper.properties /tmp/vnera_gradle/wrapper/
          if [ -d "app/src/main/res" ]; then
            cp -rn app/src/main/res/* /tmp/vnera_res/ 2>/dev/null || true
          fi

          git branch -f vnera-custom HEAD

          rm -rf /tmp/revera_108 /tmp/merge_repo
          mkdir -p /tmp/revera_108 /tmp/merge_repo

          # Λήψη Revera 1.0.8 Base
          if git rev-parse --verify origin/revera-1.0.8 >/dev/null 2>&1; then
            git archive origin/revera-1.0.8 | tar -x -C /tmp/revera_108
          elif [ -d "Revera-1.0.8" ]; then
            cp -a Revera-1.0.8/. /tmp/revera_108/
          else
            curl -L -s "https://github.com/ReveraMusic/Revera/archive/refs/tags/1.0.8.tar.gz" -o /tmp/rev108.tar.gz || \
            curl -L -s "https://github.com/ReveraMusic/Revera/archive/refs/tags/v1.0.8.tar.gz" -o /tmp/rev108.tar.gz || true
            if [ -s /tmp/rev108.tar.gz ] && tar -tzf /tmp/rev108.tar.gz >/dev/null 2>&1; then
              tar -xzf /tmp/rev108.tar.gz -C /tmp/revera_108 --strip-components=1
            else
              echo "Using current workspace base tree..."
              tar --exclude='.git' --exclude='_keystore_repo' -cf - . | tar -xf - -C /tmp/revera_108
            fi
          fi

          NEW_BASE_ROOT="/tmp/revera_108"
          [ -f "/tmp/revera_108/settings.gradle.kts" ] || NEW_BASE_ROOT=$(find /tmp/revera_108 -maxdepth 3 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          [ -z "$NEW_BASE_ROOT" ] && NEW_BASE_ROOT="/tmp/revera_108"

          git clone -q . /tmp/merge_repo
          cd /tmp/merge_repo
          git config user.name "VNEra CI"
          git config user.email "ci@vnera.local"

          git checkout -q -b revera-108 master
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp -a "$NEW_BASE_ROOT"/. .
          git add -A && git commit -q -m "Revera 1.0.8 base"

          git cherry-pick -X theirs vnera-custom || {
            git diff --name-only --diff-filter=U | xargs -r git checkout --theirs --
            git add -A
            git commit -q --no-edit
          }
          git diff --stat HEAD~1 HEAD

          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name ".github" ! -name "_keystore_repo" -exec rm -rf {} +
          tar --exclude='.git' -cf - -C /tmp/merge_repo . | tar -xf - -C .

          mkdir -p app
          cp -f "/tmp/vnera-debug.keystore" "app/vnera-debug.keystore"

          if [ ! -f "gradlew" ] && [ -f "/tmp/vnera_gradle/gradlew" ]; then
            cp -f /tmp/vnera_gradle/gradlew ./gradlew
            [ -f "/tmp/vnera_gradle/gradlew.bat" ] && cp -f /tmp/vnera_gradle/gradlew.bat ./gradlew.bat
            mkdir -p gradle/wrapper
            [ -f "/tmp/vnera_gradle/wrapper/gradle-wrapper.jar" ] && cp -f /tmp/vnera_gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
            [ ! -f "gradle/wrapper/gradle-wrapper.properties" ] && [ -f "/tmp/vnera_gradle/wrapper/gradle-wrapper.properties" ] && cp -f /tmp/vnera_gradle/wrapper/gradle-wrapper.properties gradle/wrapper/
          fi
          chmod +x ./gradlew

          if [ -d "/tmp/vnera_res" ] && [ -d "app/src/main/res" ]; then
            cp -rn /tmp/vnera_res/* app/src/main/res/ 2>/dev/null || true
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Link SDK 37 & Fix Versions & Apply Patches
        run: |
          set -e
          # 1. Link / Ensure Android SDK platform-37 & build-tools
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME/platforms" ]; then
            LATEST_PLAT=$(ls -1 "$ANDROID_HOME/platforms" | sort -V | tail -n 1)
            if [ -n "$LATEST_PLAT" ] && [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
              ln -s "$ANDROID_HOME/platforms/$LATEST_PLAT" "$ANDROID_HOME/platforms/android-37" || true
            fi
          fi

          # 2. Apply Kotlin & UI Patches (Inline Player Lyrics Color/Size + Vignette + Native Settings UI + FPS/Backup)
          python3 <<'PY'
          import re
          from pathlib import Path

          # A. Δημιουργία VnFrameRateManager.kt με:
          #    - 120Hz / Max Refresh Rate management
          #    - Ρυθμίσεις χρώματος & μεγέθους inline στίχων του Player (ΜΟΝΟ για το inline bar)
          #    - Νέα ρύθμιση Βινιετάρισμα (Vignette) για την εικόνα του Player (0% - 100%)
          #    - Native Settings UI Composables χωρίς εξωτερικό ξένο card
          #    - JSON Backup / Restore extensions
          mgr_path = Path("app/src/main/java/com/music/spotui/ui/screens/VnFrameRateManager.kt")
          mgr_path.parent.mkdir(parents=True, exist_ok=True)
          mgr_code = '''package com.music.spotui.ui.screens

          import android.app.Activity
          import android.content.Context
          import android.content.ContextWrapper
          import android.os.Build
          import android.view.Display
          import android.view.WindowManager
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.horizontalScroll
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.rounded.Check
          import androidx.compose.material.icons.rounded.ContentCopy
          import androidx.compose.material.icons.rounded.Refresh
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.composed
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.drawWithContent
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.toArgb
          import androidx.compose.ui.platform.LocalClipboardManager
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.AnnotatedString
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import org.json.JSONObject
          import kotlin.math.roundToInt

          object VnFpsPref {
              private const val PREFS = "vnera_custom_prefs"

              var targetFps by mutableIntStateOf(0) // 0 = Max/Auto, 60, 90, 120
              var lyricsColorEnabled by mutableStateOf(false)
              var lyricsColorArgb by mutableIntStateOf(0xFF64B5F6.toInt())
              var lyricsFontScale by mutableFloatStateOf(1.0f)

              // Βινιετάρισμα (Vignette) εικόνας Player
              var playerVignetteEnabled by mutableStateOf(false)
              var playerVignetteIntensity by mutableFloatStateOf(0.55f)

              private var loaded = false

              fun ensureLoaded(context: Context) {
                  if (loaded) return
                  val sp = context.applicationContext.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  targetFps = sp.getInt("target_fps", 0)
                  lyricsColorEnabled = sp.getBoolean("lyrics_color_enabled", false)
                  lyricsColorArgb = sp.getInt("lyrics_color_argb", 0xFF64B5F6.toInt())
                  lyricsFontScale = sp.getFloat("lyrics_font_scale", 1.0f).coerceIn(0.75f, 1.75f)
                  playerVignetteEnabled = sp.getBoolean("player_vignette_enabled", false)
                  playerVignetteIntensity = sp.getFloat("player_vignette_intensity", 0.55f).coerceIn(0f, 1f)
                  loaded = true
              }

              fun save(context: Context) {
                  val sp = context.applicationContext.getSharedPreferences(PREFS, Context.MODE_PRIVATE)
                  sp.edit()
                      .putInt("target_fps", targetFps)
                      .putBoolean("lyrics_color_enabled", lyricsColorEnabled)
                      .putInt("lyrics_color_argb", lyricsColorArgb)
                      .putFloat("lyrics_font_scale", lyricsFontScale.coerceIn(0.75f, 1.75f))
                      .putBoolean("player_vignette_enabled", playerVignetteEnabled)
                      .putFloat("player_vignette_intensity", playerVignetteIntensity.coerceIn(0f, 1f))
                      .apply()
              }

              fun enrichBackupJson(context: Context, rawJson: String): String {
                  ensureLoaded(context)
                  return try {
                      val obj = JSONObject(rawJson)
                      val vn = JSONObject().apply {
                          put("target_fps", targetFps)
                          put("lyrics_color_enabled", lyricsColorEnabled)
                          put("lyrics_color_argb", lyricsColorArgb)
                          put("lyrics_font_scale", lyricsFontScale.toDouble())
                          put("player_vignette_enabled", playerVignetteEnabled)
                          put("player_vignette_intensity", playerVignetteIntensity.toDouble())
                      }
                      obj.put("vnera_extensions", vn)
                      obj.toString(2)
                  } catch (_: Exception) {
                      rawJson
                  }
              }

              fun restoreFromBackupJson(context: Context, rawJson: String) {
                  try {
                      val obj = JSONObject(rawJson)
                      val vn = obj.optJSONObject("vnera_extensions") ?: return
                      if (vn.has("target_fps")) targetFps = vn.getInt("target_fps")
                      if (vn.has("lyrics_color_enabled")) lyricsColorEnabled = vn.getBoolean("lyrics_color_enabled")
                      if (vn.has("lyrics_color_argb")) lyricsColorArgb = vn.getInt("lyrics_color_argb")
                      if (vn.has("lyrics_font_scale")) lyricsFontScale = vn.getDouble("lyrics_font_scale").toFloat().coerceIn(0.75f, 1.75f)
                      if (vn.has("player_vignette_enabled")) playerVignetteEnabled = vn.getBoolean("player_vignette_enabled")
                      if (vn.has("player_vignette_intensity")) playerVignetteIntensity = vn.getDouble("player_vignette_intensity").toFloat().coerceIn(0f, 1f)
                      save(context)
                  } catch (_: Exception) {
                  }
              }
          }

          fun vnPlayerInlineLyricColor(defaultColor: Color): Color {
              return if (VnFpsPref.lyricsColorEnabled) Color(VnFpsPref.lyricsColorArgb) else defaultColor
          }

          fun Modifier.vnPlayerArtworkVignette(): Modifier = composed {
              val ctx = LocalContext.current
              VnFpsPref.ensureLoaded(ctx)
              val enabled = VnFpsPref.playerVignetteEnabled
              val intensity = VnFpsPref.playerVignetteIntensity.coerceIn(0f, 1f)
              if (!enabled || intensity <= 0.01f) return@composed this

              this.drawWithContent {
                  drawContent()
                  val maxDim = maxOf(size.width, size.height)
                  if (maxDim > 0f) {
                      val centerAlpha = (intensity * 0.06f).coerceIn(0f, 0.22f)
                      val midAlpha = (intensity * 0.42f).coerceIn(0f, 0.78f)
                      val edgeAlpha = (intensity * 0.94f).coerceIn(0f, 0.97f)
                      drawRect(
                          brush = Brush.radialGradient(
                              0.0f to Color.Black.copy(alpha = centerAlpha),
                              0.46f to Color.Black.copy(alpha = midAlpha * 0.42f),
                              0.76f to Color.Black.copy(alpha = midAlpha),
                              1.0f to Color.Black.copy(alpha = edgeAlpha),
                              center = center,
                              radius = (maxDim * 0.70f).coerceAtLeast(1f)
                          )
                      )
                  }
              }
          }

          private tailrec fun Context.findActivity(): Activity? = when (this) {
              is Activity -> this
              is ContextWrapper -> baseContext.findActivity()
              else -> null
          }

          @Composable
          fun VnFrameRateGuard() {
              val context = LocalContext.current
              VnFpsPref.ensureLoaded(context)
              val target = VnFpsPref.targetFps
              LaunchedEffect(target) {
                  val activity = context.findActivity() ?: return@LaunchedEffect
                  val window = activity.window ?: return@LaunchedEffect
                  val wm = activity.getSystemService(Context.WINDOW_SERVICE) as? WindowManager
                  val display: Display? = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                      activity.display
                  } else {
                      @Suppress("DEPRECATION")
                      wm?.defaultDisplay
                  }
                  val modes = display?.supportedModes ?: return@LaunchedEffect
                  val chosenMode = if (target <= 0) {
                      modes.maxByOrNull { it.refreshRate }
                  } else {
                      modes.minByOrNull { kotlin.math.abs(it.refreshRate - target.toFloat()) }
                  }
                  if (chosenMode != null) {
                      val lp = window.attributes
                      if (lp.preferredDisplayModeId != chosenMode.modeId) {
                          lp.preferredDisplayModeId = chosenMode.modeId
                          window.attributes = lp
                      }
                  }
              }
          }

          /**
           * Native UI ρυθμίσεις για τους inline στίχους του Player (κατηγορία «Στίχοι»)
           * Χρησιμοποιεί τα standard Material 3 list rows & controls της εφαρμογής χωρίς εξωτερικό ξένο card.
           */
          @Composable
          fun VnPlayerInlineLyricsNativeSettings() {
              val context = LocalContext.current
              VnFpsPref.ensureLoaded(context)

              val presetColors = listOf(
                  0xFFFFFFFF.toInt(), // Λευκό
                  0xFF64B5F6.toInt(), // Γαλάζιο
                  0xFF81C784.toInt(), // Πράσινο
                  0xFFFFD54F.toInt(), // Χρυσό
                  0xFFFF8A65.toInt(), // Κοραλλί
                  0xFFBA68C8.toInt(), // Μωβ
                  0xFFF06292.toInt(), // Ροζ
                  0xFF4DD0E1.toInt()  // Τυρκουάζ
              )

              Column(modifier = Modifier.fillMaxWidth()) {
                  HorizontalDivider(
                      modifier = Modifier.padding(vertical = 8.dp),
                      color = MaterialTheme.colorScheme.outlineVariant.copy(alpha = 0.4f)
                  )

                  // 1. Toggle: Προσαρμοσμένο χρώμα στίχων στον Player
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .clickable {
                              VnFpsPref.lyricsColorEnabled = !VnFpsPref.lyricsColorEnabled
                              VnFpsPref.save(context)
                          }
                          .padding(horizontal = 16.dp, vertical = 12.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column(modifier = Modifier.weight(1f).padding(end = 12.dp)) {
                          Text(
                              text = "Χρώμα στίχων στον Player",
                              style = MaterialTheme.typography.titleMedium,
                              color = MaterialTheme.colorScheme.onSurface
                          )
                          Spacer(modifier = Modifier.height(2.dp))
                          Text(
                              text = "Αλλάζει το χρώμα μόνο της γραμμής στίχων μέσα στην οθόνη αναπαραγωγής",
                              style = MaterialTheme.typography.bodyMedium,
                              color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }
                      Switch(
                          checked = VnFpsPref.lyricsColorEnabled,
                          onCheckedChange = {
                              VnFpsPref.lyricsColorEnabled = it
                              VnFpsPref.save(context)
                          }
                      )
                  }

                  // 2. Επιλογή χρώματος (Swatches)
                  if (VnFpsPref.lyricsColorEnabled) {
                      Row(
                          modifier = Modifier
                              .fillMaxWidth()
                              .horizontalScroll(rememberScrollState())
                              .padding(horizontal = 16.dp, vertical = 8.dp),
                          horizontalArrangement = Arrangement.spacedBy(12.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          presetColors.forEach { argb ->
                              val selected = VnFpsPref.lyricsColorArgb == argb
                              val swatchColor = Color(argb)
                              Box(
                                  modifier = Modifier
                                      .size(34.dp)
                                      .clip(CircleShape)
                                      .background(swatchColor)
                                      .border(
                                          width = if (selected) 2.5.dp else 1.dp,
                                          color = if (selected) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.outline.copy(alpha = 0.5f),
                                          shape = CircleShape
                                      )
                                      .clickable {
                                          VnFpsPref.lyricsColorArgb = argb
                                          VnFpsPref.save(context)
                                      },
                                  contentAlignment = Alignment.Center
                              ) {
                                  if (selected) {
                                      Icon(
                                          imageVector = Icons.Rounded.Check,
                                          contentDescription = null,
                                          tint = if (argb == 0xFFFFFFFF.toInt() || argb == 0xFFFFD54F.toInt()) Color.Black else Color.White,
                                          modifier = Modifier.size(18.dp)
                                      )
                                  }
                              }
                          }
                      }
                  }

                  // 3. Slider: Μέγεθος γραμματοσειράς στίχων στον Player (μόνο για το inline bar, με auto-fit box)
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 16.dp, vertical = 10.dp)
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Column(modifier = Modifier.weight(1f)) {
                              Text(
                                  text = "Μέγεθος στίχων στον Player",
                                  style = MaterialTheme.typography.titleMedium,
                                  color = MaterialTheme.colorScheme.onSurface
                              )
                              Text(
                                  text = "Προσαρμόζει μόνο το κείμενο στίχων στον player και μεγαλώνει αυτόματα το πλαίσιό του",
                                  style = MaterialTheme.typography.bodyMedium,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant
                              )
                          }
                          Text(
                              text = "${(VnFpsPref.lyricsFontScale * 100).roundToInt()}%",
                              style = MaterialTheme.typography.labelLarge,
                              fontWeight = FontWeight.SemiBold,
                              color = MaterialTheme.colorScheme.primary
                          )
                          if (kotlin.math.abs(VnFpsPref.lyricsFontScale - 1.0f) > 0.02f) {
                              IconButton(
                                  onClick = {
                                      VnFpsPref.lyricsFontScale = 1.0f
                                      VnFpsPref.save(context)
                                  },
                                  modifier = Modifier.size(32.dp)
                              ) {
                                  Icon(
                                      imageVector = Icons.Rounded.Refresh,
                                      contentDescription = "Επαναφορά",
                                      modifier = Modifier.size(18.dp),
                                      tint = MaterialTheme.colorScheme.onSurfaceVariant
                                  )
                              }
                          }
                      }
                      Slider(
                          value = VnFpsPref.lyricsFontScale,
                          onValueChange = {
                              VnFpsPref.lyricsFontScale = (it * 20f).roundToInt() / 20f
                              VnFpsPref.save(context)
                          },
                          valueRange = 0.75f..1.75f,
                          modifier = Modifier.fillMaxWidth()
                      )
                  }
              }
          }

          /**
           * Native UI ρύθμιση: Βινιετάρισμα (Vignette) στις άκρες της εικόνας του Player (κατηγορία «Αναπαραγωγή / Player»)
           */
          @Composable
          fun VnPlayerVignetteNativeSettings() {
              val context = LocalContext.current
              VnFpsPref.ensureLoaded(context)

              Column(modifier = Modifier.fillMaxWidth()) {
                  HorizontalDivider(
                      modifier = Modifier.padding(vertical = 8.dp),
                      color = MaterialTheme.colorScheme.outlineVariant.copy(alpha = 0.4f)
                  )

                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .clickable {
                              VnFpsPref.playerVignetteEnabled = !VnFpsPref.playerVignetteEnabled
                              VnFpsPref.save(context)
                          }
                          .padding(horizontal = 16.dp, vertical = 12.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column(modifier = Modifier.weight(1f).padding(end = 12.dp)) {
                          Text(
                              text = "Βινιετάρισμα εικόνας Player",
                              style = MaterialTheme.typography.titleMedium,
                              color = MaterialTheme.colorScheme.onSurface
                          )
                          Spacer(modifier = Modifier.height(2.dp))
                          Text(
                              text = "Μειώνει ομαλά τη φωτεινότητα στις άκρες της εικόνας όταν παίζει μουσική",
                              style = MaterialTheme.typography.bodyMedium,
                              color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }
                      Switch(
                          checked = VnFpsPref.playerVignetteEnabled,
                          onCheckedChange = {
                              VnFpsPref.playerVignetteEnabled = it
                              VnFpsPref.save(context)
                          }
                      )
                  }

                  if (VnFpsPref.playerVignetteEnabled) {
                      Column(
                          modifier = Modifier
                              .fillMaxWidth()
                              .padding(horizontal = 16.dp, vertical = 8.dp)
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(
                                  text = "Ένταση βινιεταρίσματος",
                                  style = MaterialTheme.typography.bodyLarge,
                                  color = MaterialTheme.colorScheme.onSurface
                              )
                              Text(
                                  text = "${(VnFpsPref.playerVignetteIntensity * 100).roundToInt()}%",
                                  style = MaterialTheme.typography.labelLarge,
                                  fontWeight = FontWeight.SemiBold,
                                  color = MaterialTheme.colorScheme.primary
                              )
                          }
                          Slider(
                              value = VnFpsPref.playerVignetteIntensity,
                              onValueChange = {
                                  VnFpsPref.playerVignetteIntensity = (it * 20f).roundToInt() / 20f
                                  VnFpsPref.save(context)
                              },
                              valueRange = 0.05f..1.0f,
                              modifier = Modifier.fillMaxWidth()
                          )
                      }
                  }
              }
          }

          @Composable
          fun VnFpsSelectorCard(
              includeLyricsStyleCard: Boolean = false,
              includeVignetteCard: Boolean = false
          ) {
              val context = LocalContext.current
              VnFpsPref.ensureLoaded(context)
              val options = listOf(0 to "Max", 60 to "60 Hz", 90 to "90 Hz", 120 to "120 Hz")

              Column(modifier = Modifier.fillMaxWidth()) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 16.dp, vertical = 12.dp)
                  ) {
                      Text(
                          text = "Ρυθμός ανανέωσης οθόνης (FPS)",
                          style = MaterialTheme.typography.titleMedium,
                          color = MaterialTheme.colorScheme.onSurface
                      )
                      Spacer(modifier = Modifier.height(2.dp))
                      Text(
                          text = "Επιλογή μέγιστου ή σταθερού ρυθμού ανανέωσης οθόνης",
                          style = MaterialTheme.typography.bodyMedium,
                          color = MaterialTheme.colorScheme.onSurfaceVariant
                      )
                      Spacer(modifier = Modifier.height(10.dp))
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          options.forEach { (fps, label) ->
                              val selected = VnFpsPref.targetFps == fps
                              FilterChip(
                                  selected = selected,
                                  onClick = {
                                      VnFpsPref.targetFps = fps
                                      VnFpsPref.save(context)
                                  },
                                  label = { Text(label) }
                              )
                          }
                      }
                  }
                  if (includeVignetteCard) {
                      VnPlayerVignetteNativeSettings()
                  }
                  if (includeLyricsStyleCard) {
                      VnPlayerInlineLyricsNativeSettings()
                  }
              }
          }

          @Composable
          fun VnCopyBackupExtensionsButton() {
              val context = LocalContext.current
              @Suppress("DEPRECATION")
              val clipboard = LocalClipboardManager.current
              var copied by remember { mutableStateOf(false) }

              OutlinedButton(
                  onClick = {
                      val json = VnFpsPref.enrichBackupJson(context, "{}")
                      clipboard.setText(AnnotatedString(json))
                      copied = true
                  },
                  modifier = Modifier
                      .fillMaxWidth()
                      .padding(horizontal = 16.dp, vertical = 6.dp)
              ) {
                  Icon(
                      imageVector = if (copied) Icons.Rounded.Check else Icons.Rounded.ContentCopy,
                      contentDescription = null,
                      modifier = Modifier.size(18.dp)
                  )
                  Spacer(modifier = Modifier.width(8.dp))
                  Text(if (copied) "Αντιγράφηκαν οι ρυθμίσεις VNEra" else "Αντιγραφή ρυθμίσεων VNEra (JSON)")
              }
          }
          '''
          mgr_path.write_text(mgr_code)

          # Helper για σωστό κλείσιμο παρενθέσεων κλήσης Kotlin Composable (π.χ. Text(...) / AsyncImage(...))
          def find_call_end(src: str, open_paren_idx: int) -> int:
              depth = 0
              in_str = False
              esc = False
              for i in range(open_paren_idx, len(src)):
                  ch = src[i]
                  if in_str:
                      if esc:
                          esc = False
                      elif ch == "\\":
                          esc = True
                      elif ch == '"':
                          in_str = False
                      continue
                  if ch == '"':
                      in_str = True
                  elif ch == "(":
                      depth += 1
                  elif ch == ")":
                      depth -= 1
                      if depth == 0:
                          return i
              return -1

          # B. Patch στα inline lyrics του Player (PlayerControls.kt & ImmersivePlayer.kt):
          #    1) Αλλάζει το χρώμα ΜΟΝΟ του Text της γραμμής στίχων του player
          #    2) Αλλάζει το fontSize/lineHeight ΜΟΝΟ αυτού του Text
          #    3) Μετατρέπει σταθερό .height(XX.dp) του περιβάλλοντος Box/Row σε .heightIn(min = XX.dp)
          #       ώστε το πλαίσιο να μεγαλώνει σωστά και να μην κόβεται το κείμενο.
          for rel_p in [
              "app/src/main/java/com/music/spotui/ui/immersive/player/PlayerControls.kt",
              "app/src/main/java/com/music/spotui/ui/immersive/player/ImmersivePlayer.kt",
          ]:
              fp = Path(rel_p)
              if not fp.exists():
                  continue
              txt = fp.read_text()
              orig_txt = txt

              # Βρίσκουμε όλα τα Text(...) που εμφανίζουν τρέχοντα στίχο στον player
              # (αποκλείουμε τίτλο τραγουδιού, καλλιτέχνη, bitrate/lossless, χρόνους)
              lyric_hint_re = re.compile(r'\b(?:currentLyric\w*|activeLyric\w*|lyricLine\w*|syncedLyric\w*|inlineLyric\w*|lyricText\w*)\b', re.IGNORECASE)
              exclude_re = re.compile(r'\b(?:title|artist|album|duration|position|lossless|kbps|khz|quality|chapter|subtitle)\b', re.IGNORECASE)

              pos = 0
              patched_any_lyric = False
              while True:
                  m = re.search(r'\bText\s*\(', txt[pos:])
                  if not m:
                      break
                  call_start = pos + m.start()
                  open_p = pos + m.end() - 1
                  close_p = find_call_end(txt, open_p)
                  if close_p == -1:
                      pos = open_p + 1
                      continue

                  call_body = txt[open_p + 1:close_p]
                  # Ελέγχουμε αν το Text αφορά τον inline στίχο (είτε από μεταβλητή lyric είτε δίπλα σε ChevronRight / KeyboardArrowRight)
                  ctx_before = txt[max(0, call_start - 350):call_start]
                  ctx_after = txt[close_p + 1:min(len(txt), close_p + 350)]
                  is_lyric_text = (
                      bool(lyric_hint_re.search(call_body))
                      or (
                          ("lyric" in (ctx_before + ctx_after).lower())
                          and not exclude_re.search(call_body)
                      )
                  )

                  if is_lyric_text and "vnPlayerInlineLyricColor" not in call_body:
                      new_body = call_body

                      # 1. Χρώμα: αντικατάσταση explicit `color = ...` ή προσθήκη `color = vnPlayerInlineLyricColor(...)`
                      if re.search(r'\bcolor\s*=', new_body):
                          new_body = re.sub(
                              r'(\bcolor\s*=\s*)([^,\n)]+(?:\([^)]*\))?)',
                              r'\1com.music.spotui.ui.screens.vnPlayerInlineLyricColor(\2)',
                              new_body,
                              count=1
                          )
                      else:
                          new_body = new_body.rstrip() + ",\n        color = com.music.spotui.ui.screens.vnPlayerInlineLyricColor(androidx.compose.material3.LocalContentColor.current)"

                      # 2. Μέγεθος γραμματοσειράς: πολλαπλασιασμός του fontSize (και lineHeight αν υπάρχει) με VnFpsPref.lyricsFontScale
                      if re.search(r'\bfontSize\s*=', new_body):
                          new_body = re.sub(
                              r'(\bfontSize\s*=\s*)(\d+(?:\.\d+)?\.sp)',
                              r'\1(\2 * com.music.spotui.ui.screens.VnFpsPref.lyricsFontScale)',
                              new_body,
                              count=1
                          )
                      else:
                          new_body = new_body.rstrip() + ",\n        fontSize = (14.sp * com.music.spotui.ui.screens.VnFpsPref.lyricsFontScale)"

                      if re.search(r'\blineHeight\s*=', new_body):
                          new_body = re.sub(
                              r'(\blineHeight\s*=\s*)(\d+(?:\.\d+)?\.sp)',
                              r'\1(\2 * com.music.spotui.ui.screens.VnFpsPref.lyricsFontScale)',
                              new_body,
                              count=1
                          )

                      # 3. Επιτρέπουμε 2 γραμμές όταν μεγαλώνει πολύ (> 1.15x) ώστε να μην κόβεται ποτέ
                      if re.search(r'\bmaxLines\s*=', new_body):
                          new_body = re.sub(
                              r'(\bmaxLines\s*=\s*)\d+',
                              r'\1(if (com.music.spotui.ui.screens.VnFpsPref.lyricsFontScale > 1.15f) 2 else 1)',
                              new_body,
                              count=1
                          )

                      # 4. Διόρθωση του περιβάλλοντος Box / Row (450 chars πριν το Text) ώστε να μεγαλώνει ομαλά χωρίς clipping
                      box_window = txt[max(0, call_start - 450):call_start]
                      fixed_box_window = re.sub(
                          r'\.height\(\s*(\d+(?:\.\d+)?\.dp)\s*\)',
                          r'.heightIn(min = \1).wrapContentHeight(align = androidx.compose.ui.Alignment.CenterVertically)',
                          box_window
                      )
                      if fixed_box_window != box_window:
                          txt = txt[:max(0, call_start - 450)] + fixed_box_window + txt[call_start:]
                          delta = len(fixed_box_window) - len(box_window)
                          open_p += delta
                          close_p += delta

                      txt = txt[:open_p + 1] + new_body + txt[close_p:]
                      patched_any_lyric = True
                      pos = open_p + 1 + len(new_body) + 1
                      continue

                  pos = close_p + 1

              # C. Προσθήκη .vnPlayerArtworkVignette() στις εικόνες / εξώφυλλα του Player
              pos = 0
              patched_vignette = False
              art_kw_re = re.compile(r'\b(?:artwork\w*|cover\w*|albumArt\w*|artUri\w*|bgImage\w*|background\w*|imageUrl\w*|thumbnail\w*)\b', re.IGNORECASE)
              while True:
                  m = re.search(r'\b(?:AsyncImage|SubcomposeAsyncImage|Image)\s*\(', txt[pos:])
                  if not m:
                      break
                  open_p = pos + m.end() - 1
                  close_p = find_call_end(txt, open_p)
                  if close_p == -1:
                      pos = open_p + 1
                      continue
                  call_body = txt[open_p + 1:close_p]
                  # Αποκλείουμε μικρά εικονίδια (Icons.* ή small size 12..36.dp)
                  is_small_icon = bool(re.search(r'\bIcons\.|\.size\(\s*(?:1\d|2\d|3[0-6])\.dp\s*\)', call_body))
                  if not is_small_icon and art_kw_re.search(call_body) and "vnPlayerArtworkVignette" not in call_body:
                      if re.search(r'\bmodifier\s*=\s*Modifier\b', call_body):
                          new_body = re.sub(
                              r'(\bmodifier\s*=\s*Modifier\b)',
                              r'\1.vnPlayerArtworkVignette()',
                              call_body,
                              count=1
                          )
                      elif re.search(r'\bmodifier\s*=', call_body):
                          new_body = re.sub(
                              r'(\bmodifier\s*=\s*)([^\n,]+)',
                              r'\1(\2).vnPlayerArtworkVignette()',
                              call_body,
                              count=1
                          )
                      else:
                          new_body = call_body.rstrip() + ",\n        modifier = Modifier.vnPlayerArtworkVignette()"

                      if new_body != call_body:
                          txt = txt[:open_p + 1] + new_body + txt[close_p:]
                          patched_vignette = True
                          pos = open_p + 1 + len(new_body) + 1
                          continue
                  pos = close_p + 1

              if txt != orig_txt:
                  if "import com.music.spotui.ui.screens.vnPlayerArtworkVignette" not in txt and "vnPlayerArtworkVignette" in txt:
                      txt = re.sub(r'(^package\s+[^\n]+\n)', r'\1import com.music.spotui.ui.screens.vnPlayerArtworkVignette\n', txt, count=1)
                  fp.write_text(txt)
                  print(f"Patched {rel_p}: inlineLyrics={patched_any_lyric}, vignette={patched_vignette}")

          # D. Ενσωμάτωση ρυθμίσεων στο native UI της εφαρμογής (SettingsScreen.kt & ImmersiveSettingsScreen.kt):
          #    - Ρύθμιση χρώματος & μεγέθους στίχων στην κατηγορία «Στίχοι» (Lyrics)
          #    - Ρύθμιση βινιεταρίσματος στην κατηγορία «Αναπαραγωγή» (Player / Playback)
          lyrics_res_keys = set()
          player_res_keys = set()
          for xml_file in Path("app/src/main/res").rglob("*.xml"):
              xtxt = xml_file.read_text(errors="replace")
              for m in re.finditer(r'<string\s+name="([^"]+)"[^>]*>\s*(Lyrics|Στίχοι)\s*</string>', xtxt, re.IGNORECASE):
                  lyrics_res_keys.add(m.group(1))
              for m in re.finditer(r'<string\s+name="([^"]+)"[^>]*>\s*(Player|Playback|Αναπαραγωγή)\s*</string>', xtxt, re.IGNORECASE):
                  player_res_keys.add(m.group(1))

          lyrics_pattern = r'(?:"(?:Lyrics|Στίχοι)"' + (''.join(f'|R\\.string\\.{re.escape(k)}' for k in lyrics_res_keys)) + r')'
          player_pattern = r'(?:"(?:Player|Playback|Αναπαραγωγή)"' + (''.join(f'|R\\.string\\.{re.escape(k)}' for k in player_res_keys)) + r')'

          injected_lyrics_ui = False
          injected_vignette_ui = False

          def inject_into_settings_category(src: str, cat_regex: str, composable_call: str) -> tuple[str, bool]:
              lines = src.splitlines(keepends=True)
              # 1. Αναζήτηση σε Tab list (ScrollableTabRow) για να βρούμε το index της κατηγορίας
              tab_titles = []
              for i, l in enumerate(lines):
                  if re.search(r'\b(?:Tab|LeadingIconTab)\s*\(', l) or "tabs" in l.lower():
                      pass
              # Αναζήτηση λίστας tabs π.χ. listOf(stringResource(R.string.general), ..., stringResource(R.string.lyrics), ...)
              for i, l in enumerate(lines):
                  if "listOf(" in l:
                      block = "".join(lines[i:min(len(lines), i + 25)])
                      if re.search(cat_regex, block):
                          # Βρίσκουμε ποιο στοιχείο της λίστας αντιστοιχεί στην κατηγορία
                          items_raw = re.findall(r'(?:stringResource\([^)]+\)|"[^"]+")', block)
                          target_idx = None
                          for idx_item, it_str in enumerate(items_raw):
                              if re.search(cat_regex, it_str):
                                  target_idx = idx_item
                                  break
                          if target_idx is not None:
                              # Ψάχνουμε `when (selectedTabIndex)` ή `when (selectedTab)` παρακάτω
                              for j in range(i, min(len(lines), i + 120)):
                                  if re.search(r'\bwhen\s*\(\s*\w*(?:Tab|Index|Category|Section)\w*\s*\)', lines[j]):
                                      # Βρίσκουμε το branch `target_idx -> {`
                                      for k in range(j + 1, min(len(lines), j + 150)):
                                          if re.match(rf'^\s*{target_idx}\s*->\s*\{{', lines[k]):
                                              # Εντοπίζουμε το κλείσιμο `}` αυτού του branch και εισάγουμε πριν από αυτό
                                              depth = 0
                                              opened = False
                                              for b in range(k, len(lines)):
                                                  depth += lines[b].count("{") - lines[b].count("}")
                                                  if "{" in lines[b]:
                                                      opened = True
                                                  if opened and depth <= 0:
                                                      ind = re.match(r'^(\s*)', lines[b]).group(1) + "    "
                                                      # Αν είμαστε μέσα σε LazyColumn, τυλίγουμε σε item { ... }
                                                      ctx_lazy = "".join(lines[max(0, j - 15):k])
                                                      if "LazyColumn" in ctx_lazy:
                                                          lines.insert(b, f"{ind}item {{ {composable_call} }}\n")
                                                      else:
                                                          lines.insert(b, f"{ind}{composable_call}\n")
                                                      return "".join(lines), True

              # 2. Fallback: αναζήτηση header/section με το όνομα της κατηγορίας (π.χ. SettingsSection("Στίχοι") { ... })
              for i, l in enumerate(lines):
                  if re.search(cat_regex, l):
                      for k in range(i, min(len(lines), i + 15)):
                          if "{" in lines[k]:
                              depth = 0
                              opened = False
                              for b in range(k, len(lines)):
                                  depth += lines[b].count("{") - lines[b].count("}")
                                  if "{" in lines[b]:
                                      opened = True
                                  if opened and depth <= 0:
                                      ind = re.match(r'^(\s*)', lines[b]).group(1) + "    "
                                      ctx_lazy = "".join(lines[max(0, b - 40):b])
                                      if re.search(r'\bitem\s*\{', ctx_lazy):
                                          lines.insert(b, f"{ind}item {{ {composable_call} }}\n")
                                      else:
                                          lines.insert(b, f"{ind}{composable_call}\n")
                                      return "".join(lines), True
              return src, False

          for sf in sorted(Path("app/src/main/java/com/music/spotui/ui").rglob("*Settings*.kt")):
              stxt = sf.read_text()
              changed = False
              if "VnPlayerInlineLyricsNativeSettings" not in stxt:
                  stxt2, ok1 = inject_into_settings_category(
                      stxt,
                      lyrics_pattern,
                      "com.music.spotui.ui.screens.VnPlayerInlineLyricsNativeSettings()"
                  )
                  if ok1:
                      stxt = stxt2
                      injected_lyrics_ui = True
                      changed = True
                      print(f"Injected Lyrics settings into Lyrics category in {sf}")

              if "VnPlayerVignetteNativeSettings" not in stxt:
                  stxt2, ok2 = inject_into_settings_category(
                      stxt,
                      player_pattern,
                      "com.music.spotui.ui.screens.VnPlayerVignetteNativeSettings()"
                  )
                  if ok2:
                      stxt = stxt2
                      injected_vignette_ui = True
                      changed = True
                      print(f"Injected Player Vignette settings into Player category in {sf}")

              if changed:
                  sf.write_text(stxt)

          # E. Backup & Restore extensions + FPS selector (με fallback αν δεν βρέθηκε κάποια καρτέλα)
          for bf in sorted(Path("app/src/main/java/com/music/spotui/ui").rglob("*Backup*.kt")):
              bt = bf.read_text()
              if "restoreFromBackupJson" not in bt:
                  bt = re.sub(
                      r'(\b(?:val|var)\s+([A-Za-z0-9_]+)\s*=\s*[^;\n]*(?:readText|readLines|bufferedReader|decodeToString)[^\n]*\n)',
                      r'\1                com.music.spotui.ui.screens.VnFpsPref.restoreFromBackupJson(context, \2)\n',
                      bt,
                      count=1
                  )
              if "enrichBackupJson" not in bt:
                  bt = re.sub(
                      r'\b([A-Za-z0-9_]+\.toString\(\s*(?:2|4)?\s*\))',
                      r'com.music.spotui.ui.screens.VnFpsPref.enrichBackupJson(context, \1)',
                      bt,
                      count=1
                  )
              if "VnCopyBackupExtensionsButton" not in bt:
                  lines = bt.splitlines(keepends=True)
                  cs = next((i for i, l in enumerate(lines) if "@Composable" in l), None)
                  col = next((i for i in range(cs, len(lines)) if re.search(r'\bColumn\b', lines[i])), None) if cs is not None else None
                  if col is not None:
                      d = 0
                      op = False
                      for i in range(col, len(lines)):
                          d += lines[i].count("{") - lines[i].count("}")
                          if "{" in lines[i]:
                              op = True
                          if op and d <= 0:
                              lines.insert(i, re.match(r'^(\s*)', lines[i]).group(1) + "    com.music.spotui.ui.screens.VnCopyBackupExtensionsButton()\n")
                              bt = "".join(lines)
                              break
              bf.write_text(bt)

          inc_lyrics_flag = "false" if injected_lyrics_ui else "true"
          inc_vignette_flag = "false" if injected_vignette_ui else "true"
          for uf in sorted(Path("app/src/main/java/com/music/spotui/ui").rglob("*.kt")):
              if uf.name in ("VnSettingsBackup.kt", "VnFrameRateManager.kt") or "VnFpsSelectorCard" in uf.read_text():
                  continue
              lines, ch = uf.read_text().splitlines(keepends=True), False
              for i, l in enumerate(lines):
                  st = l.lstrip()
                  ind = l[:len(l) - len(st)]
                  if st.startswith(("import ", "package ", "//", "/*", "*", "fun ", "object ", "class ")):
                      continue
                  if re.match(r'^item\b.*\{.*\bVn(?:Settings)?Backup\w*', st):
                      lines.insert(i, f"{ind}item {{ com.music.spotui.ui.screens.VnFpsSelectorCard(includeLyricsStyleCard = {inc_lyrics_flag}, includeVignetteCard = {inc_vignette_flag}) }}\n")
                      ch = True
                      break
                  if re.match(r'^(?:com\.music\.spotui\.ui\.screens\.)?Vn(?:Settings)?Backup(?:\.[A-Za-z0-9_]+|\w*)\s*\(', st):
                      lines.insert(i, f"{ind}com.music.spotui.ui.screens.VnFpsSelectorCard(includeLyricsStyleCard = {inc_lyrics_flag}, includeVignetteCard = {inc_vignette_flag})\n")
                      ch = True
                      break
              if ch:
                  uf.write_text("".join(lines))

          # F. Ενεργοποίηση VnFrameRateGuard στο Activity
          gh = False
          for ap in sorted(Path("app/src/main/java").rglob("*Activity.kt")):
              at = ap.read_text()
              if "setContent" in at and "VnFrameRateGuard" not in at:
                  an, n = re.subn(
                      r'(?m)^([ \t]*)(setContent(?:\([^)]*\))?\s*\{)\s*$',
                      r'\1\2\n\1    com.music.spotui.ui.screens.VnFrameRateGuard()',
                      at,
                      count=1
                  )
                  if n > 0:
                      ap.write_text(an)
                      gh = True
                      break
          p2 = Path("app/src/main/java/com/music/spotui/ui/immersive/player/ImmersivePlayer.kt")
          if not gh and p2.exists() and "VnFrameRateGuard" not in p2.read_text():
              p2.write_text(re.sub(
                  r'(?m)^([ \t]*fun\s+ImmersivePlayer\b[^{]*\{)\s*$',
                  r'\1\n    com.music.spotui.ui.screens.VnFrameRateGuard()',
                  p2.read_text(),
                  count=1
              ))
          PY

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VNEra-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
