name: VNEra 2.1.3 - Revera 1.0.8 port and Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION_NAME: 2.1.3
  APP_VERSION_CODE: 213

jobs:
  port-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Revera 1.0.7 and 1.0.8
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/caruno-git/Revera.git
          git fetch --no-tags upstream refs/tags/v1.0.7:refs/tags/v1.0.7
          git fetch --no-tags upstream refs/tags/v1.0.8:refs/tags/v1.0.8

      - name: Port Revera 1.0.8 changes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          import tempfile
          import re

          paths = [
              "app/src/main/java/com/music/spotui/data/preferences/SettingsPref.kt",
              "app/src/main/java/com/music/spotui/ui/components/AddSongsScreen.kt",
              "app/src/main/java/com/music/spotui/ui/components/QueueDiscovery.kt",
              "app/src/main/java/com/music/spotui/ui/immersive/lyrics/ImmersiveQueuePanel.kt",
              "app/src/main/java/com/music/spotui/ui/immersive/pages/ImmersiveSettingsScreen.kt",
              "app/src/main/java/com/music/spotui/ui/immersive/player/ImmersivePlayer.kt",
              "app/src/main/java/com/music/spotui/ui/screens/QueueScreen.kt",
              "app/src/main/java/com/music/spotui/ui/screens/SettingsSearch.kt",
              "app/src/main/res/values-ru/player_chrome_options.xml",
              "app/src/main/res/values-ru/strings.xml",
              "app/src/main/res/values/player_chrome_options.xml",
              "app/src/main/res/values/strings.xml",
              "app/src/test/java/com/music/spotui/ui/components/QueueDiscoveryTest.kt",
              "automix/build.gradle.kts",
              "engine-android/src/main/kotlin/app/myspoti/engine/android/Media3DrmPlayer.kt",
              "engine/src/commonMain/kotlin/app/myspoti/engine/Resolver.kt",
          ]

          def git_show(ref, path):
              return subprocess.check_output(["git", "show", f"{ref}:base/{path}"])

          for name in paths:
              target = Path(name)
              if not target.is_file(): continue
              try:
                  ours = target.read_bytes()
                  base = git_show("v1.0.7", name)
                  upstream = git_show("v1.0.8", name)
                  with tempfile.TemporaryDirectory() as tmp:
                      tmp = Path(tmp)
                      o, b, u = tmp/"ours", tmp/"base", tmp/"upstream"
                      o.write_bytes(ours)
                      b.write_bytes(base)
                      u.write_bytes(upstream)
                      res = subprocess.run(["git", "merge-file", "-p", str(o), str(b), str(u)], stdout=subprocess.PIPE)
                      target.write_bytes(res.stdout)
              except Exception as e:
                  pass

          gradle = Path("app/build.gradle.kts")
          if gradle.exists():
              text = gradle.read_text()
              text = text.replace('onnxruntime-android:1.23.2', 'onnxruntime-android:1.32.0')
              text = re.sub(r'versionName\s*=\s*".*?"', 'versionName = "2.1.3"', text)
              text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 213', text)
              gradle.write_text(text)

          p = Path("app/src/main/java/com/music/spotui/ui/screens/LyricsScreen.kt")
          if p.exists():
              s = p.read_text()
              needed = ["import androidx.compose.foundation.gestures.awaitEachGesture", "import androidx.compose.foundation.gestures.awaitFirstDown", "import androidx.compose.ui.input.pointer.PointerEventPass", "import androidx.compose.ui.input.pointer.positionChangeIgnoreConsumed"]
              for imp in needed:
                  if imp not in s: s = s.replace("import androidx.compose.ui.input.pointer.pointerInput", "import androidx.compose.ui.input.pointer.pointerInput\\n" + imp, 1)
              s = re.sub(r'\.pointerInput\(onExpand\)\s*\{.*?onDragCancel = \{ drag = 0f \},\s*\}', '.lyricsVerticalSwipe(threshold = 48.dp, direction = 1, onSwipe = onExpand)', s, flags=re.DOTALL)
              s = re.sub(r'\.pointerInput\(onClose\)\s*\{.*?onDragCancel = \{ drag = 0f \},\s*\}', '.lyricsVerticalSwipe(threshold = 48.dp, direction = -1, onSwipe = onClose)', s, flags=re.DOTALL)
              helper = "\\nprivate fun Modifier.lyricsVerticalSwipe(threshold: androidx.compose.ui.unit.Dp, direction: Int, onSwipe: () -> Unit): Modifier = pointerInput(threshold, direction, onSwipe) { awaitEachGesture { val down = awaitFirstDown(requireUnconsumed = false); var total = 0f; var fired = false; while (!fired) { val event = awaitPointerEvent(PointerEventPass.Initial); val change = event.changes.firstOrNull { it.id == down.id } ?: break; total += change.positionChangeIgnoreConsumed().y; if (total * direction >= threshold.toPx()) { change.consume(); onSwipe(); fired = true }; if (!change.pressed) break } } }\\n"
              marker = "/** The inline card's layout node, so the full screen can grow out of it and fold back into it. */"
              if "lyricsVerticalSwipe" not in s and marker in s: s = s.replace(marker, helper + marker, 1)
              p.write_text(s)

          p2 = Path("app/src/main/java/com/music/spotui/ui/immersive/player/ImmersivePlayer.kt")
          if p2.exists():
              s = p2.read_text()
              if "PointerEventPass" not in s: s = s.replace("import androidx.compose.ui.input.pointer.positionChange", "import androidx.compose.ui.input.pointer.positionChange\\nimport androidx.compose.ui.input.pointer.PointerEventPass\\nimport androidx.compose.ui.input.pointer.positionChangeIgnoreConsumed", 1)
              s = s.replace("awaitPointerEvent()", "awaitPointerEvent(PointerEventPass.Initial)").replace("change.positionChange().y", "change.positionChangeIgnoreConsumed().y").replace("76.dp.toPx()", "48.dp.toPx()")
              p2.write_text(s)
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v3
        
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: |
          ./gradlew :app:assembleRelease \
            -PappVersionName="$APP_VERSION_NAME" \
            -PappVersionCode="$APP_VERSION_CODE" \
            -Pabis=arm64-v8a \
            -PupdateRepo=vnsec2/VNEra \
            --no-daemon

      - name: Commit version updates and port changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Bump to 2.1.3 and port Revera 1.0.8 features"
            git push origin HEAD:main
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VNEra-2.1.3-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
