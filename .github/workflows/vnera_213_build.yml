                  t = p.read_text().replace("2.4.10", "2.2.20").replace("2.4.21", "2.2.20").replace("9.4.1", target_agp)
                  if not has_sdk_37:
                      t = re.sub(r'(compileSdk|targetSdk)\s*=\s*"?37"?', r'\g<1> = "35"', t)
                  p.write_text(t)

          if not has_sdk_37:
              for gf in Path(".").rglob("*.gradle.kts"):
                  t = gf.read_text()
                  tn = re.sub(r'(compileSdk|targetSdk)\.set\(37\)', r'\g<1>.set(35)', re.sub(r'(compileSdk|targetSdk)\s*=\s*37', r'\g<1> = 35', t))
                  if t != tn: gf.write_text(tn)

          for sp in Path("app/src/main/res").rglob("strings.xml"):
              sx = sp.read_text()
              sxn = re.sub(r'<string name="app_name"[^>]*>.*?</string>', '<string name="app_name">VNEra</string>', sx)
              if sx != sxn: sp.write_text(sxn)

          gradle = Path("app/build.gradle.kts")
          if gradle.exists():
              t = gradle.read_text()
              t = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "app.vnera.music"', t)
              t = re.sub(r'versionName\s*=\s*".*?"', 'versionName = "2.1.4"', t)
              t = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {build_vcode}', t)
              if "projectUrl" in t and not re.search(r'\b(val|var)\s+projectUrl\b', t):
                  t = re.sub(r'(?m)^(\s*android\s*\{)', r'val projectUrl = providers.gradleProperty("projectUrl").orElse("https://github.com/vnsec2/VNEra").get()\n\n\1', t, count=1)
              if "vnera-debug.keystore" not in t:
                  t += '\nandroid {\n    signingConfigs { getByName("debug") { storeFile = file("vnera-debug.keystore"); storePassword = "android"; keyAlias = "androiddebugkey"; keyPassword = "android" } }\n    buildTypes { getByName("debug") { signingConfig = signingConfigs.getByName("debug") } }\n}\n'
              if "META-INF/versions/9/OSGI-INF/MANIFEST.MF" not in t:
                  t += '\nandroid { packaging { resources { excludes += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"; excludes += "META-INF/versions/9/module-info.class" } } }\n'
              gradle.write_text(t)

          upd = Path("app/src/main/java/com/music/spotui/data/api/UpdateChecker.kt")
          if upd.exists():
              ut = upd.read_text()
              mc = []
              if re.search(r'(?<![.\w])UPDATE_BASE_URL\b', ut) and not re.search(r'\bval\s+UPDATE_BASE_URL\b', ut):
                  mc.append('private const val UPDATE_BASE_URL = "https://api.github.com/repos/vnsec2/VNEra"')
              if re.search(r'(?<![.\w])PROJECT_URL\b', ut) and not re.search(r'\bval\s+PROJECT_URL\b', ut):
                  mc.append('private const val PROJECT_URL = "https://github.com/vnsec2/VNEra"')
              if mc:
                  lines = ut.splitlines()
                  idx = max((i for i, l in enumerate(lines) if l.startswith("import ")), default=0)
                  lines.insert(idx + 1, "\n" + "\n".join(mc))
                  upd.write_text("\n".join(lines) + "\n")

          cast_msg = Path("app/src/main/java/com/music/spotui/cast/CastMessage.kt")
          if cast_msg.exists():
              lines = cast_msg.read_text().splitlines()
              ti = min(36, len(lines) - 1)
              if "return" in lines[ti]:
                  fi = next((i for i in range(ti, -1, -1) if re.search(r'\bfun\b', lines[i])), None)
                  if fi is not None:
                      paren = 0; eq_l = eq_c = None
                      for i in range(fi, ti + 1):
                          for ci, ch in enumerate(lines[i]):
                              if ch == '(': paren += 1
                              elif ch == ')': paren -= 1
                              elif ch == '=' and paren == 0 and (lines[i][ci-1:ci] not in ('=','!','<','>')) and (lines[i][ci+1:ci+2] not in ('=','>')):
                                  eq_l, eq_c = i, ci; break
