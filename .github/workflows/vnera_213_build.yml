          fun Modifier.vnAnimatedElement(phaseIndex: Int = 0): Modifier = composed {
              val c = LocalContext.current
              VnFpsPref.ensureInit(c)
              if (!VnFpsPref.elementAnimEnabled) return@composed this
              val mode = VnFpsPref.elementAnimMode
              val shouldPause = VnFpsPref.elementAnimPauseOnPause && !VnFpsPref.isPlaybackPlaying
              var elapsedSec by remember { mutableFloatStateOf((phaseIndex % 6) * 0.65f) }

              LaunchedEffect(VnFpsPref.elementAnimEnabled, shouldPause, mode) {
                  if (shouldPause) return@LaunchedEffect
                  var lastNanos = 0L
                  while (true) {
                      withFrameNanos { now ->
                          if (lastNanos != 0L) {
                              val dt = ((now - lastNanos) / 1_000_000_000f).coerceIn(0f, 0.05f)
                              elapsedSec += dt
                          }
                          lastNanos = now
                      }
                  }
              }

              val period = when (mode) { 1 -> 8.5f; 2 -> 7.0f; else -> 9.5f }
              val angle = (elapsedSec / period) * (2f * PI.toFloat())
              val wave = sin(angle)
              val wave2 = cos(angle * 0.85f)
              val scale = 0.974f + 0.010f * wave2

              graphicsLayer {
                  val maxTx = (size.width * (1f - scale) * 0.42f).coerceAtMost(2.5.dp.toPx())
                  val maxTy = (size.height * (1f - scale) * 0.42f).coerceAtMost(2.5.dp.toPx())
                  scaleX = scale
                  scaleY = scale
                  when (mode) {
                      1 -> translationY = wave * maxTy
                      2 -> {
                          translationX = wave * maxTx
                          translationY = -wave2 * maxTy
                          rotationZ = wave * 0.55f
                      }
                      else -> {
                          translationY = wave * maxTy
                          rotationY = wave * 1.6f
                          rotationX = -wave2 * 1.0f
                          cameraDistance = 18f * density
                      }
                  }
              }
          }

          @Composable
          fun VnFrameRateGuard() {
              val c = LocalContext.current; val act = remember(c) { c.findActivity() }
              VnFpsPref.ensureInit(c)
              val fps = VnFpsPref.targetFps
              val pArgb = MaterialTheme.colorScheme.primary.toArgb().toLong()
              val bgArgb = MaterialTheme.colorScheme.background.toArgb().toLong()
              LaunchedEffect(c) {
                  VnFpsPref.init(c)
                  if (VnFpsPref.staticAppPrimaryArgb == 0L && pArgb != 0L) VnFpsPref.staticAppPrimaryArgb = pArgb
                  if (VnFpsPref.playerBackgroundColorArgb == 0L && bgArgb != 0L) VnFpsPref.playerBackgroundColorArgb = bgArgb
                  act?.let { applyWindowFrameRate(it, VnFpsPref.targetFps, true) }
              }
              LaunchedEffect(act, fps) { act?.let { applyWindowFrameRate(it, fps, true) } }
              LaunchedEffect(c) {
                  val am = c.getSystemService(Context.AUDIO_SERVICE) as? AudioManager
                  while (true) {
                      delay(350L)
                      if (am != null) VnFpsPref.isPlaybackPlaying = am.isMusicActive
                  }
              }
              DisposableEffect(act) {
                  val a = act ?: return@DisposableEffect onDispose {}
                  val cb = object : Application.ActivityLifecycleCallbacks {
                      override fun onActivityCreated(x: Activity, b: Bundle?) {}
                      override fun onActivityStarted(x: Activity) { if (x === a) applyWindowFrameRate(a, VnFpsPref.targetFps, true) }
                      override fun onActivityResumed(x: Activity) { if (x === a) applyWindowFrameRate(a, VnFpsPref.targetFps, true) }
                      override fun onActivityPaused(x: Activity) {}
                      override fun onActivityStopped(x: Activity) {}
                      override fun onActivitySaveInstanceState(x: Activity, o: Bundle) {}
                      override fun onActivityDestroyed(x: Activity) {}
                  }
                  val fl = ViewTreeObserver.OnWindowFocusChangeListener { if (it) applyWindowFrameRate(a, VnFpsPref.targetFps, true) }
                  a.application.registerActivityLifecycleCallbacks(cb); a.window?.decorView?.viewTreeObserver?.addOnWindowFocusChangeListener(fl)
                  onDispose { a.application.unregisterActivityLifecycleCallbacks(cb); a.window?.decorView?.viewTreeObserver?.removeOnWindowFocusChangeListener(fl) }
              }
              LaunchedEffect(act, fps) {
                  val a = act ?: return@LaunchedEffect
                  while (true) {
                      delay(2500L)
                      if ((fps != 0 && fps < 60) || (getSupportedRefreshRates(a).maxOrNull() ?: 60) < 55) continue
                      var last = 0L; var slow = 0; var n = 0; val ch = Choreographer.getInstance()
                      ch.postFrameCallback(object : Choreographer.FrameCallback {
                          override fun doFrame(t: Long) { if (last != 0L) { if ((t - last) / 1_000_000f in 29f..41f) slow++; n++ }; last = t; if (n < 4) ch.postFrameCallback(this) }
                      })
                      delay(250L)
                      if (n >= 3 && slow >= 3) applyWindowFrameRate(a, fps, true)
                  }
              }
              VnPlaybackMonitorDialog()
              VnShuffleNotificationBanner()
          }

