                  imm_scroll_arg = m_imm_scroll.group(1) if m_imm_scroll else "null"
                  ilt_new, n_imm = re.subn(
                      r'(@Composable\s+(?:internal\s+|private\s+|public\s+)?fun\s+ImmersiveLyricsPanel\b[^{]*\{)',
                      r'\1\n    com.music.spotui.ui.screens.VnLyricsFullscreenEffect()\n    val vnImmLyricsActivity = androidx.compose.ui.platform.LocalContext.current.findActivity()',
                      ilt,
                      count=1,
                  )
                  if n_imm > 0:
                      ilt_new = re.sub(
                          r'(?m)^(package\s+[^\r\n]+)',
                          r'\1\nimport com.music.spotui.ui.screens.findActivity\nimport com.music.spotui.ui.screens.vnLyricsCenterGestures',
                          ilt_new,
                          count=1,
                      )
                      ilt_new = ilt_new.replace(
                          ".fillMaxSize()",
                          f".fillMaxSize().then(Modifier.vnLyricsCenterGestures(vnImmLyricsActivity, null, {imm_scroll_arg}))",
                          1,
                      )
                      imm_lyrics.write_text(ilt_new)
                      print(f"Hooked Red-Edge Scroll ({imm_scroll_arg}) into ImmersiveLyricsPanel.kt")

          # 8. Immersive Player fix (μην κλείνει το sheet όταν σκρολάρουμε στις κόκκινες άκρες + VolumePill)
          p2 = Path("app/src/main/java/com/music/spotui/ui/immersive/player/ImmersivePlayer.kt")
          if p2.exists():
              s = p2.read_text()
              if "PointerEventPass" not in s and "import androidx.compose.ui.input.pointer.positionChange" in s:
                  s = s.replace(
                      "import androidx.compose.ui.input.pointer.positionChange",
                      "import androidx.compose.ui.input.pointer.positionChange\nimport androidx.compose.ui.input.pointer.PointerEventPass\nimport androidx.compose.ui.input.pointer.positionChangeIgnoreConsumed",
                      1,
                  )
              s = (
                  s.replace("awaitPointerEvent()", "awaitPointerEvent(PointerEventPass.Initial)")
                  .replace("change.positionChange().y", "change.positionChangeIgnoreConsumed().y")
                  .replace("76.dp.toPx()", "48.dp.toPx()")
              )
              if "isLyricsEdgeDragging" not in s:
                  s = re.sub(
                      r'\b([A-Za-z0-9_]+)\s*>\s*48\.dp\.toPx\(\)',
                      r'(!com.music.spotui.ui.screens.VnFpsPref.isLyricsEdgeDragging && \1 > 48.dp.toPx())',
                      s,
                  )
              if "VnFullscreenVolumePill" not in s:
                  p2_lines = s.splitlines(keepends=True)
                  for idx, l in enumerate(p2_lines):
                      if re.search(r'\bfun\s+ImmersivePlayer\b', l):
                          sig_end = next((j for j in range(idx, min(idx + 25, len(p2_lines))) if "{" in p2_lines[j]), None)
                          if sig_end is not None:
                              depth = 0
                              body_end = None
                              for k in range(sig_end, len(p2_lines)):
                                  depth += p2_lines[k].count("{") - p2_lines[k].count("}")
                                  if depth <= 0:
                                      body_end = k
                                      break
                              if body_end is not None and inject_into_first_box(
                                  p2_lines,
                                  sig_end,
                                  body_end,
                                  "com.music.spotui.ui.screens.VnFullscreenVolumePill()",
                              ):
                                  s = "".join(p2_lines)
                                  print("Hooked VnFullscreenVolumePill into ImmersivePlayer.kt")
                          break
              p2.write_text(s)

          # 9. Επέκταση χρωμάτων σε όσες ρυθμίσεις/αρχεία έχουν λίστες χρωμάτων + εφαρμογή custom accent color στο Theme
          extra_colors_str = ", ".join([
              "Color(0xFFE53935)", "Color(0xFFFF5722)", "Color(0xFFFF9800)",
              "Color(0xFFFFC107)", "Color(0xFF00BFA5)", "Color(0xFF00BCD4)",
              "Color(0xFF3F51B5)", "Color(0xFF7C4DFF)", "Color(0xFFE040FB)",
              "Color(0xFFFF4081)", "Color(0xFF64FFDA)", "Color(0xFFFFAB91)",
              "Color(0xFFB388FF)", "Color(0xFFECEFF1)"
          ])
          for kt_file in sorted(Path("app/src/main/java/com/music/spotui").rglob("*.kt")):
              if kt_file.name == "VnFrameRateManager.kt":
                  continue
              orig = kt_file.read_text()
              def _expand_colors(m):
                  body = m.group(1)
                  if body.count("Color(") >= 3 and "0xFFE53935" not in body:
                      stripped = body.rstrip()
                      sep = "" if stripped.endswith(",") else ","
                      return f"listOf({stripped}{sep} {extra_colors_str}\n)"
                  return m.group(0)
              updated = re.sub(r'listOf\(((?:\s*Color\([^)]+\)\s*,?)+)\s*\)', _expand_colors, orig)
              if updated != orig:
                  kt_file.write_text(updated)
                  print(f"Expanded color palette in {kt_file}")

          for theme_file in sorted(Path("app/src/main/java/com/music/spotui/ui/theme").rglob("*.kt")):
              tt = theme_file.read_text()
              if "MaterialTheme(" in tt and "customAccentColorArgb" not in tt:
                  tt_new, n_th = re.subn(
                      r'MaterialTheme\s*\(\s*colorScheme\s*=\s*([A-Za-z0-9_]+)',
                      r'MaterialTheme(\n        colorScheme = if (com.music.spotui.ui.screens.VnFpsPref.customAccentColorArgb != 0L) \1.copy(primary = androidx.compose.ui.graphics.Color(com.music.spotui.ui.screens.VnFpsPref.customAccentColorArgb), secondary = androidx.compose.ui.graphics.Color(com.music.spotui.ui.screens.VnFpsPref.customAccentColorArgb)) else \1',
                      tt,
                      count=1,
                  )
                  if n_th > 0:
                      theme_file.write_text(tt_new)
                      print(f"Hooked custom accent color into {theme_file}")

          # 10. Προσθήκη vnAnimatedElement σε βασικές κάρτες/στοιχεία UI
          for anim_target in [
              Path("app/src/main/java/com/music/spotui/ui/screens/SettingsScreen.kt"),
              Path("app/src/main/java/com/music/spotui/ui/immersive/pages/ImmersiveSettingsScreen.kt"),
              Path("app/src/main/java/com/music/spotui/ui/immersive/player/PlayerControls.kt"),
          ]:
              if anim_target.exists():
                  at = anim_target.read_text()
                  if "vnAnimatedElement" not in at:
                      counter = [1]
                      def _add_anim(m):
                          idx = counter[0]
                          counter[0] += 1
                          return f"{m.group(0)}.vnAnimatedElement({idx})"
                      at_new = re.sub(r'\bModifier\s*\.\s*fillMaxWidth\s*\(\s*\)', _add_anim, at)
                      if at_new != at:
                          at_new = re.sub(
                              r'(?m)^(package\s+[^\r\n]+)',
                              r'\1\nimport com.music.spotui.ui.screens.vnAnimatedElement',
                              at_new,
                              count=1,
                          )
                          anim_target.write_text(at_new)
                          print(f"Hooked vnAnimatedElement into {anim_target}")

          # 11. Σύνδεση VnPlaybackMonitor με την αναπαραγωγή (έλεγχος σειράς επεκτάσεων & ποιότητας)
          player_state_file = Path("app/src/main/java/com/music/spotui/ui/immersive/player/PlayerState.kt")
          if player_state_file.exists():
              pst = player_state_file.read_text()
              print("PlayerState.kt found; scanning fields for VnPlaybackMonitor bridge")

          # Αναζήτηση σημείου όπου ενημερώνεται το τρέχον κομμάτι / ποιότητα / πηγή για reporting στο VnPlaybackMonitor
          for scan_file in sorted(Path("app/src/main/java/com/music/spotui").rglob("*.kt")):
              if scan_file.name == "VnFrameRateManager.kt":
                  continue
              ft = scan_file.read_text()
              if "onTrackPlaybackObserved" in ft:
                  continue
              # Αν το αρχείο εμφανίζει/διαχειρίζεται το badge ποιότητας ("Lossless") μαζί με title/source
              if '"Lossless"' in ft and "LocalContext.current" in ft and "@Composable" in ft:
                  lines = ft.splitlines(keepends=True)
                  for idx, l in enumerate(lines):
                      if '"Lossless"' in l:
                          # Εύρεση του πλησιέστερου context & quality variable
                          window_txt = "".join(lines[max(0, idx - 25):min(len(lines), idx + 15)])
                          m_ctx = re.search(r'\bval\s+([A-Za-z0-9_]+)\s*=\s*LocalContext\.current\b', window_txt)
                          m_q = re.search(r'\bval\s+([A-Za-z0-9_]*(?:quality|Quality|format|Format|badge|Badge)[A-Za-z0-9_]*)\b', window_txt)
                          m_t = re.search(r'\b([A-Za-z0-9_]+)\.(?:title|name)\b', window_txt)
                          m_s = re.search(r'\b([A-Za-z0-9_]+)\.(?:source|provider|extension|sourceName|providerName)\b', window_txt)
                          if m_ctx and m_q and m_t:
                              ctx_n = m_ctx.group(1)
                              q_n = m_q.group(1)
                              t_obj = m_t.group(1)
                              s_expr = f"{m_s.group(1)}.source.orEmpty()" if m_s else '""'
                              # Βρίσκουμε το τέλος της δήλωσης val q_n = ...
                              for k in range(max(0, idx - 25), idx + 1):
                                  if re.search(rf'\bval\s+{re.escape(q_n)}\b', lines[k]) and "=" in lines[k]:
                                      indent = re.match(r'^(\s*)', lines[k]).group(1)
                                      lines.insert(
                                          k + 1,
                                          f'{indent}androidx.compose.runtime.LaunchedEffect({t_obj}.id, {q_n}) {{ com.music.spotui.ui.screens.VnPlaybackMonitor.onTrackPlaybackObserved({ctx_n}, {t_obj}.id.toString(), {t_obj}.title.toString(), {s_expr}, {q_n}.toString()) }}\n',
                                      )
                                      scan_file.write_text("".join(lines))
                                      print(f"Hooked VnPlaybackMonitor into {scan_file}")
                                      break
                          break

          # 12. Βελτίωση VnSettingsBackup.kt (Full Export/Restore + κουμπί Αντιγραφής Extensions στο Column)
          backup_file = Path("app/src/main/java/com/music/spotui/ui/screens/VnSettingsBackup.kt")
          if backup_file.exists():
              bt = backup_file.read_text()
              bt_mod = bt

              ctx_var = "context"
              for cand in ["context", "ctx", "localContext", "appContext"]:
                  if re.search(rf'\b{cand}\b', bt_mod):
                      ctx_var = cand
                      break

              if "onBackupImported" not in bt_mod:
                  bt_mod = re.sub(
                      r'\bJSONObject\(\s*([A-Za-z0-9_]+)\s*\)',
                      rf'JSONObject(com.music.spotui.ui.screens.VnFpsPref.onBackupImported({ctx_var}, \1))',
                      bt_mod,
                      count=1,
                  )

              if "enrichBackupJson" not in bt_mod:
                  bt_mod = re.sub(
                      r'\b([A-Za-z0-9_]+\.toString\(\s*(?:2|4)?\s*\))',
                      rf'com.music.spotui.ui.screens.VnFpsPref.enrichBackupJson({ctx_var}, \1)',
                      bt_mod,
                      count=1,
                  )

              if "VnCopyBackupExtensionsButton" not in bt_mod:
                  lines = bt_mod.splitlines(keepends=True)
                  comp_start = next((idx for idx, l in enumerate(lines) if "@Composable" in l), None)
                  if comp_start is not None:
                      col_start = next(
                          (idx for idx in range(comp_start, len(lines)) if re.search(r'\bColumn\b', lines[idx])),
                          None,
                      )
                      if col_start is not None:
                          depth = 0
                          opened = False
                          for idx in range(col_start, len(lines)):
                              depth += lines[idx].count("{") - lines[idx].count("}")
                              if "{" in lines[idx]:
                                  opened = True
                              if opened and depth <= 0:
                                  indent = re.match(r'^(\s*)', lines[idx]).group(1) + "    "
                                  lines.insert(
                                      idx,
                                      f"{indent}com.music.spotui.ui.screens.VnCopyBackupExtensionsButton()\n",
                                  )
                                  bt_mod = "".join(lines)
                                  print(f"Hooked VnCopyBackupExtensionsButton into VnSettingsBackup.kt at line {idx + 1}")
                                  break

              if bt_mod != bt:
                  backup_file.write_text(bt_mod)

          # 13. Σύνδεση VnFpsSelectorCard πάνω από το VnSettingsBackup σε όλα τα UI αρχεία που το καλούν
          for ui_file in sorted(Path("app/src/main/java/com/music/spotui/ui").rglob("*.kt")):
              if ui_file.name in ("VnSettingsBackup.kt", "VnFrameRateManager.kt"):
                  continue
              st = ui_file.read_text()
              if "VnFpsSelectorCard" in st:
                  continue
              lines = st.splitlines(keepends=True)
              changed = False
              for i, line in enumerate(lines):
                  stripped = line.lstrip()
                  indent = line[:len(line) - len(stripped)]
                  if stripped.startswith(("import ", "package ", "//", "/*", "*", "fun ", "object ", "class ")):
                      continue
                  if re.match(r'^item\b.*\{.*\bVn(?:Settings)?Backup\w*', stripped):
                      lines.insert(i, f"{indent}item {{ com.music.spotui.ui.screens.VnFpsSelectorCard() }}\n")
                      changed = True
                      break
                  if re.match(r'^(?:com\.music\.spotui\.ui\.screens\.)?Vn(?:Settings)?Backup(?:\.[A-Za-z0-9_]+|\w*)\s*\(', stripped):
                      lines.insert(i, f"{indent}com.music.spotui.ui.screens.VnFpsSelectorCard()\n")
                      changed = True
                      break
              if changed:
                  ui_file.write_text("".join(lines))
                  print(f"Hooked VnFpsSelectorCard into {ui_file}")

          guard_hooked = False
          for act_path in sorted(Path("app/src/main/java").rglob("*Activity.kt")):
              at = act_path.read_text()
              if "setContent" in at and "VnFrameRateGuard" not in at:
                  at_new, n = re.subn(
                      r'(?m)^([ \t]*)(setContent(?:\([^)]*\))?\s*\{)\s*$',
                      r'\1\2\n\1    com.music.spotui.ui.screens.VnFrameRateGuard()',
                      at,
                      count=1,
                  )
                  if n > 0:
                      act_path.write_text(at_new)
                      print(f"Hooked VnFrameRateGuard into {act_path}")
                      guard_hooked = True
                      break

          if not guard_hooked and p2.exists():
              it = p2.read_text()
              if "VnFrameRateGuard" not in it:
                  it_new, n = re.subn(
                      r'(?m)^([ \t]*fun\s+ImmersivePlayer\b[^{]*\{)\s*$',
                      r'\1\n    com.music.spotui.ui.screens.VnFrameRateGuard()',
                      it,
                      count=1,
                  )
                  if n > 0:
                      p2.write_text(it_new)
                      print("Hooked VnFrameRateGuard into ImmersivePlayer.kt")
          PY

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          EXTRA_FLAGS=""
          if [ "$HAS_SDK_37" != "true" ]; then
            EXTRA_FLAGS="-Pandroid.suppressUnsupportedCompileSdk=37"
          fi
          ./gradlew :app:assembleDebug $EXTRA_FLAGS -PappVersionName="2.1.4" -PappVersionCode="$BUILD_VERSION_CODE" -Pabis=arm64-v8a -PupdateRepo=vnsec2/VNEra --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VNEra-2.1.4-Debug
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 14
