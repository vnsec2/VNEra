          @Composable
          fun VnFullscreenLyricsOverlay(fromImmersivePanel: Boolean = false) {
              val c = LocalContext.current
              val act = remember(c) { c.findActivity() }
              VnFpsPref.ensureInit(c)

              if (!VnFpsPref.lyricsFullscreenOpen) return
              if (!fromImmersivePanel && VnFpsPref.immersivePanelActive) return

              var isClosing by remember { mutableStateOf(false) }
              val scope = rememberCoroutineScope()
              val enterProgress = remember { Animatable(0f) }

              LaunchedEffect(Unit) {
                  enterProgress.animateTo(
                      targetValue = 1f,
                      animationSpec = tween(durationMillis = 320, easing = FastOutSlowInEasing)
                  )
              }

              val closeOverlay: () -> Unit = {
                  if (!isClosing) {
                      isClosing = true
                      scope.launch {
                          enterProgress.animateTo(
                              targetValue = 0f,
                              animationSpec = tween(durationMillis = 240, easing = FastOutSlowInEasing)
                          )
                          VnFpsPref.closeLyricsFullscreen(act)
                          isClosing = false
                      }
                  }
              }

              LaunchedEffect(VnFpsPref.lyricsImmersiveEnabled) {
                  VnFpsPref.setSystemBarsHidden(act, VnFpsPref.lyricsImmersiveEnabled)
              }
              DisposableEffect(Unit) {
                  onDispose {
                      VnFpsPref.setSystemBarsHidden(act, false)
                  }
              }

              Dialog(
                  onDismissRequest = closeOverlay,
                  properties = DialogProperties(
                      usePlatformDefaultWidth = false,
                      decorFitsSystemWindows = false
                  )
              ) {
                  val parentView = LocalView.current.parent
                  SideEffect {
                      runCatching {
                          val win = parentView?.javaClass?.getMethod("getWindow")?.invoke(parentView) as? Window
                          win?.setWindowAnimations(0)
                          win?.setDimAmount(0f)
                      }
                  }

                  BackHandler(onBack = closeOverlay)
                  val lines = VnFpsPref.savedPlayerLyricLines
                  val activeText = VnFpsPref.savedPlayerLyricText
                  val listState = rememberLazyListState()
                  val accentColor = vnResolveSelectedLyricColor()
                  val fontScale = VnFpsPref.lyricsFontScale.coerceIn(0.70f, 1.70f)
                  val screenHeightPx = with(LocalDensity.current) { LocalConfiguration.current.screenHeightDp.dp.toPx() }
                  val p = enterProgress.value.coerceIn(0f, 1f)

                  val activeIdx = remember(lines, activeText, VnFpsPref.savedPlayerActiveLineIndex) {
                      val explicit = VnFpsPref.savedPlayerActiveLineIndex
                      if (explicit in lines.indices) explicit
                      else {
                          val target = activeText.trim()
                          if (target.isEmpty() || lines.isEmpty()) -1
                          else lines.indexOfFirst { it.equals(target, ignoreCase = true) }
                              .takeIf { it >= 0 }
                              ?: lines.indexOfFirst { it.contains(target, ignoreCase = true) || target.contains(it, ignoreCase = true) }
                      }
                  }

                  LaunchedEffect(activeIdx) {
                      if (activeIdx >= 0 && activeIdx < lines.size) {
                          delay(75L)
                          if (!listState.isScrollInProgress) {
                              val info = listState.layoutInfo
                              val vpH = (info.viewportEndOffset - info.viewportStartOffset).coerceAtLeast(0)
                              val itemH = info.visibleItemsInfo.firstOrNull { it.index == activeIdx }?.size
                                  ?: info.visibleItemsInfo.firstOrNull()?.size
                                  ?: 84
                              val centerOffset = ((vpH - itemH) / 2).coerceAtLeast(0)
                              runCatching {
                                  listState.animateScrollToItem(index = activeIdx, scrollOffset = -centerOffset)
                              }
                          }
                      }
                  }

                  Box(
                      modifier = Modifier
                          .fillMaxSize()
                          .background(Color.Black.copy(alpha = p))
                          .graphicsLayer {
                              translationY = (1f - p) * screenHeightPx * 0.24f
                              alpha = p
                              val s = 0.96f + 0.04f * p
                              scaleX = s
                              scaleY = s
                          }
                          .vnSmartLyricsSwipe(
                              act = act,
                              isExpanded = true,
                              onCollapseToPlayer = closeOverlay
                          )
                          .statusBarsPadding()
                          .navigationBarsPadding()
                  ) {
                      if (lines.isNotEmpty()) {
                          LazyColumn(
                              state = listState,
                              modifier = Modifier
                                  .fillMaxSize()
                                  .padding(horizontal = 24.dp),
                              contentPadding = PaddingValues(top = 84.dp, bottom = 120.dp),
                              verticalArrangement = Arrangement.spacedBy(20.dp)
                          ) {
                              itemsIndexed(lines, key = { idx, line -> "${idx}_${line.hashCode()}" }) { idx, line ->
                                  val isCurrent = idx == activeIdx
                                  val targetColor = when {
                                      isCurrent && VnFpsPref.lyricsBeautifulEnabled -> lerp(accentColor, Color.White, 0.55f)
                                      isCurrent -> Color.White
                                      VnFpsPref.lyricsBeautifulEnabled -> lerp(accentColor, Color.White, 0.45f).copy(alpha = 0.45f)
                                      else -> Color.White.copy(alpha = 0.42f)
                                  }
                                  val animatedColor by animateColorAsState(
                                      targetValue = targetColor,
                                      animationSpec = tween(durationMillis = 260, easing = FastOutSlowInEasing),
                                      label = "vn_fs_lyric_color"
                                  )
                                  val animatedScale by animateFloatAsState(
                                      targetValue = if (isCurrent) 1.03f else 0.98f,
                                      animationSpec = tween(durationMillis = 260, easing = FastOutSlowInEasing),
                                      label = "vn_fs_lyric_scale"
                                  )
                                  Text(
                                      text = line,
                                      style = MaterialTheme.typography.headlineSmall.copy(
                                          fontSize = (22f * fontScale).sp,
                                          lineHeight = (30f * fontScale).sp,
                                          fontWeight = FontWeight.SemiBold
                                      ),
                                      color = animatedColor,
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .graphicsLayer {
                                              scaleX = animatedScale
                                              scaleY = animatedScale
                                              transformOrigin = TransformOrigin(0f, 0.5f)
                                          }
                                  )
                              }
                          }
                      } else {
                          Box(
                              modifier = Modifier
                                  .fillMaxSize()
                                  .padding(horizontal = 28.dp),
                              contentAlignment = Alignment.Center
                          ) {
                              Text(
                                  text = activeText.ifBlank { "Δεν υπάρχουν διαθέσιμοι στίχοι για αυτό το κομμάτι" },
                                  style = MaterialTheme.typography.headlineSmall.copy(
                                      fontSize = (22f * fontScale).sp,
                                      lineHeight = (30f * fontScale).sp,
                                      fontWeight = FontWeight.SemiBold
                                  ),
                                  color = if (VnFpsPref.lyricsBeautifulEnabled) lerp(accentColor, Color.White, 0.55f) else Color.White,
                                  textAlign = TextAlign.Center
                              )
                          }
                      }

                      Row(
                          modifier = Modifier
                              .align(Alignment.TopEnd)
                              .padding(top = 14.dp, end = 16.dp)
                              .zIndex(99f),
                          horizontalArrangement = Arrangement.spacedBy(8.dp),
                          verticalAlignment = Alignment.CenterVertically
                      ) {
                          Surface(
                              onClick = { VnFpsPref.updateLyricsFontScale(c, fontScale - 0.10f) },
                              shape = CircleShape,
                              color = Color.Black.copy(alpha = 0.72f),
                              border = BorderStroke(1.dp, Color.White.copy(alpha = 0.34f))
                          ) {
                              Text("A−", color = Color.White, fontWeight = FontWeight.Bold, modifier = Modifier.padding(horizontal = 10.dp, vertical = 8.dp))
                          }
                          Surface(
                              onClick = { VnFpsPref.updateLyricsFontScale(c, fontScale + 0.10f) },
                              shape = CircleShape,
                              color = Color.Black.copy(alpha = 0.72f),
                              border = BorderStroke(1.dp, Color.White.copy(alpha = 0.34f))
                          ) {
                              Text("A+", color = Color.White, fontWeight = FontWeight.Bold, modifier = Modifier.padding(horizontal = 10.dp, vertical = 8.dp))
                          }
                          VnLyricsFullscreenButton(
                              isFullscreen = true,
                              ownerId = "overlay_fullscreen",
                              onClick = closeOverlay
                          )
                      }
                  }
              }
          }

          @Composable
          fun VnRegisterLyricsScrollState(state: Any?) {
              val s = state as? ScrollableState ?: return
              DisposableEffect(s) {
