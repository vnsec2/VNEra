          tailrec fun Context.findActivity(): Activity? = when (this) { is Activity -> this; is ContextWrapper -> baseContext.findActivity(); else -> null }
          @Suppress("DEPRECATION") private fun Activity.currentDisplay(): Display? = if (Build.VERSION.SDK_INT >= 30) display ?: windowManager?.defaultDisplay else windowManager?.defaultDisplay

          fun getSupportedRefreshRates(act: Activity): List<Int> {
              val d = act.currentDisplay() ?: return listOf(60, 120); val m = d.mode
              return d.supportedModes.filter { it.physicalWidth == m.physicalWidth && it.physicalHeight == m.physicalHeight }.map { it.refreshRate.roundToInt() }.distinct().sorted()
          }

          fun applyWindowFrameRate(act: Activity, targetFps: Int, forceReset: Boolean = false) {
              val w = act.window ?: return; val d = act.currentDisplay() ?: return; val m = d.mode
              val modes = d.supportedModes.filter { it.physicalWidth == m.physicalWidth && it.physicalHeight == m.physicalHeight }
              val hz = if (targetFps <= 0) modes.maxOfOrNull { it.refreshRate } ?: m.refreshRate else targetFps.toFloat()
              val best = modes.minByOrNull { abs(it.refreshRate - hz) }
              if (forceReset) w.attributes = w.attributes.apply { preferredDisplayModeId = 0; preferredRefreshRate = 0f }
              w.attributes = w.attributes.apply {
                  preferredDisplayModeId = if (best != null && abs(best.refreshRate - hz) <= 2f) best.modeId else 0
                  preferredRefreshRate = hz
              }
              if (Build.VERSION.SDK_INT >= 35) {
                  runCatching {
                      View::class.java.getMethod("setRequestedFrameRate", Float::class.javaPrimitiveType)
                          .invoke(w.decorView, hz)
                  }
              }
              w.decorView.postInvalidateOnAnimation()
          }

          @Composable
          fun VnLyricsFullscreenEffect() {
              val c = LocalContext.current; val act = remember(c) { c.findActivity() }
              VnFpsPref.ensureInit(c)
