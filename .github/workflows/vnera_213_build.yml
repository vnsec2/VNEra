name: Build VNEra 2.1.5 APK

on:
  workflow_dispatch:
  push:
    branches:
      - work/source-review

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main for persistent keystore
        uses: actions/checkout@v4
        with:
          ref: main
          path: _keystore_repo
          fetch-depth: 1

      - name: Ensure persistent VNEra keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "_keystore_repo/.github/vnera-debug.keystore" ]; then
            mkdir -p "_keystore_repo/.github"
            keytool -genkeypair -v \
              -keystore "_keystore_repo/.github/vnera-debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=VNEra Debug,O=VNEra,C=GR"
            cd _keystore_repo
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/vnera-debug.keystore
            git commit -m "Add persistent keystore for seamless VNEra updates"
            git push || echo "Warning: Could not push keystore to main"
            cd ..
          fi
          cp -f "_keystore_repo/.github/vnera-debug.keystore" "$HOME/.android/debug.keystore"
          cp -f "_keystore_repo/.github/vnera-debug.keystore" "/tmp/vnera-debug.keystore"

      - name: Checkout VNEra source
        uses: actions/checkout@v4
        with:
          ref: work/source-review
          fetch-depth: 0

      - name: Merge VNEra customizations onto Revera v1.0.8
        run: |
          set -euo pipefail
          rm -rf /tmp/vnera_gradle /tmp/vnera_res /tmp/vnera_custom /tmp/revera_108 /tmp/revera_old /tmp/merge_repo
          mkdir -p /tmp/vnera_gradle /tmp/vnera_res /tmp/vnera_custom /tmp/revera_108 /tmp/revera_old

          [ -f "gradlew" ] && cp -f "gradlew" /tmp/vnera_gradle/
          [ -f "gradlew.bat" ] && cp -f "gradlew.bat" /tmp/vnera_gradle/
          if [ -d "gradle/wrapper" ]; then
            mkdir -p /tmp/vnera_gradle/wrapper
            cp -rf gradle/wrapper/* /tmp/vnera_gradle/wrapper/
          fi
          if [ -d "app/src/main/res" ]; then
            cp -rn app/src/main/res/mipmap* /tmp/vnera_res/ 2>/dev/null || true
            find app/src/main/res -maxdepth 2 -name "*ic_launcher*" -exec cp --parents -rn {} /tmp/vnera_res/ \; 2>/dev/null || true
          fi

          tar --exclude='.git' --exclude='.github' --exclude='_keystore_repo' --exclude='*.zip' -cf - . | tar -xf - -C /tmp/vnera_custom

          git remote add upstream https://revera.caruno.wtf/carunodev/Revera.git
          git fetch upstream +refs/heads/*:refs/remotes/upstream/* +refs/tags/*:refs/tags/* --prune

          git archive refs/tags/v1.0.8 | tar -x -C /tmp/revera_108
          NEW_SETTINGS=$(find /tmp/revera_108 -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          [ -n "$NEW_SETTINGS" ] || { echo "ERROR: Δεν βρέθηκε Gradle root στο Revera v1.0.8"; exit 1; }
          NEW_BASE_ROOT=$(dirname "$NEW_SETTINGS")

          python3 <<'PY'
          import shutil, subprocess
          from pathlib import Path

          exts = {".kt", ".kts", ".xml", ".toml", ".properties", ".pro"}
          vnera_files = {
              str(p.relative_to("/tmp/vnera_custom")): p.read_bytes()
              for p in Path("/tmp/vnera_custom").rglob("*")
              if p.is_file() and p.suffix in exts and ".git" not in p.parts and ".github" not in p.parts
          }
          tags = [t for t in sorted(subprocess.check_output(["git", "tag", "-l", "v1.0.*"], text=True).splitlines()) if t != "v1.0.8"]
          best_label, best_ref, best_score = "v1.0.7", "refs/tags/v1.0.7", -1
          for t in tags:
              tmp_dir = Path("/tmp/rev_cand")
              shutil.rmtree(tmp_dir, ignore_errors=True)
              tmp_dir.mkdir(parents=True)
              subprocess.run(f"git archive refs/tags/{t} | tar -x -C {tmp_dir}", shell=True, check=True)
              base_dir = tmp_dir / "base" if (tmp_dir / "base").exists() else tmp_dir
              matches = sum(1 for rel, data in vnera_files.items() if (base_dir / rel).exists() and (base_dir / rel).read_bytes() == data)
              if matches > best_score:
                  best_label, best_ref, best_score = t, f"refs/tags/{t}", matches
          print(f"SELECTED_OLD_BASE={best_label} ({best_score}/{len(vnera_files)} files matched)")
          Path("/tmp/best_base_ref.txt").write_text(best_ref)
          PY

          git archive "$(cat /tmp/best_base_ref.txt)" | tar -x -C /tmp/revera_old
          OLD_SETTINGS=$(find /tmp/revera_old -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1 || true)
          OLD_BASE_ROOT=$(dirname "${OLD_SETTINGS:-/tmp/revera_old/settings.gradle.kts}")

          git init /tmp/merge_repo
          cd /tmp/merge_repo
          git config user.name "VNEra Merge Bot"
          git config user.email "bot@vnera.local"

          cp -a "$OLD_BASE_ROOT"/. .
          git add -A && git commit -q -m "Old Revera base"

          git checkout -q -b vnera-custom
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp -a /tmp/vnera_custom/. .
          git add -A && git commit -q -m "VNEra custom changes"

          git checkout -q -b revera-108 master
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp -a "$NEW_BASE_ROOT"/. .
          git add -A && git commit -q -m "Revera 1.0.8 base"

          git cherry-pick -X theirs vnera-custom || {
            git diff --name-only --diff-filter=U | xargs -r git checkout --theirs --
            git add -A
            git commit -q --no-edit
          }
          git diff --stat HEAD~1 HEAD

          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name ".github" ! -name "_keystore_repo" -exec rm -rf {} +
          tar --exclude='.git' -cf - -C /tmp/merge_repo . | tar -xf - -C .

          mkdir -p app
          cp -f "/tmp/vnera-debug.keystore" "app/vnera-debug.keystore"

          if [ ! -f "gradlew" ] && [ -f "/tmp/vnera_gradle/gradlew" ]; then
            cp -f /tmp/vnera_gradle/gradlew ./gradlew
            [ -f "/tmp/vnera_gradle/gradlew.bat" ] && cp -f /tmp/vnera_gradle/gradlew.bat ./gradlew.bat
            mkdir -p gradle/wrapper
            [ -f "/tmp/vnera_gradle/wrapper/gradle-wrapper.jar" ] && cp -f /tmp/vnera_gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
            [ ! -f "gradle/wrapper/gradle-wrapper.properties" ] && [ -f "/tmp/vnera_gradle/wrapper/gradle-wrapper.properties" ] && cp -f /tmp/vnera_gradle/wrapper/gradle-wrapper.properties gradle/wrapper/
          fi
          chmod +x ./gradlew

          if [ -d "/tmp/vnera_res" ] && [ -d "app/src/main/res" ]; then
            cp -rf /tmp/vnera_res/mipmap* app/src/main/res/ 2>/dev/null || true
            [ -d "/tmp/vnera_res/app/src/main/res" ] && cp -rf /tmp/vnera_res/app/src/main/res/* app/src/main/res/ 2>/dev/null || true
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Apply VNEra 2.1.5 fixes (Animations, Player Lyrics, Scale Setting)
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SUDO=""; command -v sudo >/dev/null 2>&1 && [ ! -w "$SDK_ROOT/platforms" ] && SUDO="sudo"
          [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ] && $SUDO ln -sfn "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"

          export HAS_SDK_37="false"
          [ -d "$SDK_ROOT/platforms/android-37" ] && export HAS_SDK_37="true"
          export BUILD_VERSION_CODE=$((215000 + ${GITHUB_RUN_NUMBER:-1}))
          echo "HAS_SDK_37=$HAS_SDK_37" >> "$GITHUB_ENV"
          echo "BUILD_VERSION_CODE=$BUILD_VERSION_CODE" >> "$GITHUB_ENV"

          mkdir -p app/src/main/java/com/music/spotui/ui/screens
          cat <<'EOF' > app/src/main/java/com/music/spotui/ui/screens/VnFrameRateManager.kt
          package com.music.spotui.ui.screens

          import android.app.*
          import android.content.*
          import android.media.AudioManager
          import android.os.*
          import android.view.*
          import android.widget.Toast
          import androidx.activity.compose.BackHandler
          import androidx.compose.animation.AnimatedVisibility
          import androidx.compose.animation.animateColorAsState
          import androidx.compose.animation.core.*
          import androidx.compose.animation.fadeIn
          import androidx.compose.animation.fadeOut
          import androidx.compose.animation.slideInVertically
          import androidx.compose.animation.slideOutVertically
          import androidx.compose.foundation.*
          import androidx.compose.foundation.gestures.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyListState
          import androidx.compose.foundation.lazy.itemsIndexed
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.foundation.shape.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.rounded.Check
          import androidx.compose.material.icons.rounded.Fullscreen
          import androidx.compose.material.icons.rounded.FullscreenExit
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.*
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.graphics.lerp
          import androidx.compose.ui.input.nestedscroll.*
          import androidx.compose.ui.input.pointer.*
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.platform.LocalView
          import androidx.compose.ui.text.AnnotatedString
          import androidx.compose.ui.text.TextStyle
          import androidx.compose.ui.text.buildAnnotatedString
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.*
          import androidx.compose.ui.window.Dialog
          import androidx.compose.ui.window.DialogProperties
          import androidx.compose.ui.window.Popup
          import androidx.compose.ui.window.PopupProperties
          import androidx.core.view.*
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import org.json.*
          import java.io.File
          import java.lang.ref.WeakReference
          import java.lang.reflect.Proxy
          import kotlin.math.*

          object VnFpsPref {
              const val PREFS_NAME = "vnera_display_prefs"
              const val KEY_TARGET_FPS = "target_fps"
              const val KEY_LYRICS_IMMERSIVE = "lyrics_immersive_fullscreen"
              const val KEY_CUSTOM_COLOR = "custom_accent_color_argb"
              const val KEY_ANIM_ENABLED = "element_animation_enabled"
              const val KEY_ANIM_MODE = "element_animation_mode"
              const val KEY_ANIM_PAUSE_ON_PAUSE = "element_animation_pause_on_playback_pause"
              const val KEY_PLAYBACK_ALERTS = "playback_quality_order_alerts"
              const val KEY_KEEP_SHUFFLE = "keep_shuffle_enabled"
              const val KEY_REMEMBER_SHUFFLE = "remember_shuffle_enabled"
              const val KEY_REMEMBERED_SHUFFLE_STATE = "remembered_shuffle_state"
              const val KEY_LAST_BACKUP_JSON = "last_loaded_backup_json"
              const val KEY_LAST_BACKUP_EXTENSIONS = "last_loaded_backup_extensions"
              const val KEY_RESTORED_EXTENSIONS = "restored_extensions_list"
              const val KEY_LYRICS_BEAUTIFUL = "lyrics_beautiful_enabled"
              const val KEY_LYRICS_COLOR = "lyrics_custom_color_argb"
              const val KEY_PLAYER_KARAOKE_BG_COLOR = "player_karaoke_bg_color_argb"
              const val KEY_LYRICS_FONT_SCALE = "lyrics_font_scale"
              const val KEY_PLAYER_LYRICS_FONT_SCALE = "player_lyrics_font_scale"
              const val KEY_PLAYER_INLINE_LYRICS = "player_inline_lyrics_enabled"

              @Volatile private var initialized = false
              @Volatile var appCtx: Context? = null
              private var prefListener: SharedPreferences.OnSharedPreferenceChangeListener? = null

              var targetFps by mutableIntStateOf(0); private set
              var lyricsImmersiveEnabled by mutableStateOf(true); private set
              var lyricsBarsHidden by mutableStateOf(false)
              var lyricsFullscreenOpen by mutableStateOf(false)
              var nativeLyricsScreenActive by mutableStateOf(false)
              var immersivePanelActive by mutableStateOf(false)
              var onExternalOpenLyrics: (() -> Unit)? = null
              var onExternalCloseLyrics: (() -> Unit)? = null

              var activeLyricsScrollState: ScrollableState? = null
              var savedPlayerLyricText by mutableStateOf("")
              var savedPlayerLyricLines by mutableStateOf<List<String>>(emptyList())
              var savedPlayerActiveLineIndex by mutableIntStateOf(-1)
              var savedPlayerPreviewScrollIndex by mutableIntStateOf(0)
              var savedPlayerPreviewScrollOffset by mutableIntStateOf(0)
              var playerBackgroundColorArgb by mutableLongStateOf(0L)

              @Volatile private var canonicalLyricsLocked = false
              @Volatile private var lastActiveLineChangeMs = 0L

              var customAccentColorArgb by mutableLongStateOf(0L); private set
              var elementAnimEnabled by mutableStateOf(true); private set
              var elementAnimMode by mutableIntStateOf(1); private set
              var elementAnimPauseOnPause by mutableStateOf(true); private set
              var isPlaybackPlaying by mutableStateOf(false)
              @Volatile var hasDirectPlayerIsPlaying = false
              @Volatile var lastDirectPlayingReportMs = 0L
              var playbackAlertsEnabled by mutableStateOf(true); private set
              var keepShuffleEnabled by mutableStateOf(false); private set
              var rememberedShuffleState by mutableStateOf(false); private set
              val isShuffleMemoryActive: Boolean get() = keepShuffleEnabled
              val shuffleLockEnabled: Boolean get() = keepShuffleEnabled
              var cachedExtensionsText by mutableStateOf(""); private set
              var lyricsBeautifulEnabled by mutableStateOf(false); private set
              var lyricsCustomColorArgb by mutableLongStateOf(0L); private set
              var playerKaraokeBgColorArgb by mutableLongStateOf(0L); private set
              var lyricsFontScale by mutableFloatStateOf(1.0f); private set
              var playerLyricsFontScale by mutableFloatStateOf(1.0f); private set
              var playerInlineLyricsEnabled by mutableStateOf(true); private set
              var staticAppPrimaryArgb by mutableLongStateOf(0L)

              val extraColorPalette = listOf(
                  "Αυτόματο" to 0L, "Crimson" to 0xFFE53935L, "Coral" to 0xFFFF5722L, "Amber" to 0xFFFF9800L,
                  "Gold" to 0xFFFFC107L, "Lime" to 0xFFAEEA00L, "Emerald" to 0xFF00C853L, "Mint" to 0xFF00BFA5L,
                  "Cyan" to 0xFF00BCD4L, "Sky" to 0xFF29B6F6L, "Royal" to 0xFF2979FFL, "Indigo" to 0xFF3F51B5L,
                  "Violet" to 0xFF7C4DFFL, "Lavender" to 0xFFB388FFL, "Magenta" to 0xFFE040FBL, "Rose" to 0xFFFF4081L,
                  "Peach" to 0xFFFFAB91L, "Silver" to 0xFFCFD8DCL
              )

              fun resolveAppContext(): Context? {
                  appCtx?.let { return it }
                  return runCatching {
                      val app = Class.forName("android.app.ActivityThread")
                          .getMethod("currentApplication")
                          .invoke(null) as? Context
                      val ac = app?.applicationContext
                      if (ac != null) appCtx = ac
                      ac
                  }.getOrNull()
              }

              private fun prefs(c: Context): SharedPreferences {
                  val ac = c.applicationContext ?: c
                  if (appCtx == null) appCtx = ac
                  return ac.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
              }

              private fun persistShuffleBackupFile(c: Context?, keep: Boolean, remembered: Boolean) {
                  val ac = (c?.applicationContext ?: resolveAppContext()) ?: return
                  runCatching {
                      File(ac.filesDir, "vnera_shuffle_state.dat").writeText("${if (keep) 1 else 0}:${if (remembered) 1 else 0}")
                  }
              }

              private fun readShuffleBackupFile(c: Context): Pair<Boolean, Boolean>? {
                  val ac = c.applicationContext ?: c
                  return runCatching {
                      val f = File(ac.filesDir, "vnera_shuffle_state.dat")
                      if (!f.exists()) return null
                      val parts = f.readText().trim().split(":")
                      if (parts.size >= 2) (parts[0] == "1") to (parts[1] == "1") else null
                  }.getOrNull()
              }

              private fun loadFromPrefs(sp: SharedPreferences, c: Context? = null) {
                  targetFps = sp.getInt(KEY_TARGET_FPS, 0)
                  lyricsImmersiveEnabled = sp.getBoolean(KEY_LYRICS_IMMERSIVE, true)
                  customAccentColorArgb = sp.getLong(KEY_CUSTOM_COLOR, 0L)
                  elementAnimEnabled = sp.getBoolean(KEY_ANIM_ENABLED, true)
                  elementAnimMode = sp.getInt(KEY_ANIM_MODE, 1).coerceIn(1, 3)
                  elementAnimPauseOnPause = sp.getBoolean(KEY_ANIM_PAUSE_ON_PAUSE, true)
                  playbackAlertsEnabled = sp.getBoolean(KEY_PLAYBACK_ALERTS, true)
                  val legacyRemember = sp.getBoolean(KEY_REMEMBER_SHUFFLE, false)
                  var keep = sp.getBoolean(KEY_KEEP_SHUFFLE, false) || legacyRemember
                  var rem = sp.getBoolean(KEY_REMEMBERED_SHUFFLE_STATE, false)
                  val ctx = c ?: resolveAppContext()
                  if (ctx != null) {
                      readShuffleBackupFile(ctx)?.let { (fKeep, fRem) ->
                          if (fKeep && !keep) keep = true
                          if (fKeep && fRem && !rem) rem = true
                      }
                  }
                  keepShuffleEnabled = keep
                  rememberedShuffleState = rem
                  VnShuffleGuard.syncFromPrefs(keep && rem)
                  cachedExtensionsText = sp.getString(KEY_LAST_BACKUP_EXTENSIONS, "").orEmpty()
                  lyricsBeautifulEnabled = sp.getBoolean(KEY_LYRICS_BEAUTIFUL, false)
                  lyricsCustomColorArgb = sp.getLong(KEY_LYRICS_COLOR, 0L)
                  playerKaraokeBgColorArgb = sp.getLong(KEY_PLAYER_KARAOKE_BG_COLOR, 0L)
                  lyricsFontScale = sp.getFloat(KEY_LYRICS_FONT_SCALE, 1.0f).coerceIn(0.70f, 1.70f)
                  playerLyricsFontScale = sp.getFloat(KEY_PLAYER_LYRICS_FONT_SCALE, 1.0f).coerceIn(0.60f, 1.40f)
                  playerInlineLyricsEnabled = sp.getBoolean(KEY_PLAYER_INLINE_LYRICS, true)
              }

              fun ensureInit(c: Context) {
                  val sp = prefs(c)
                  if (!initialized) {
                      synchronized(this) {
                          if (!initialized) {
                              loadFromPrefs(sp, c)
                              val listener = SharedPreferences.OnSharedPreferenceChangeListener { shared, _ ->
                                  loadFromPrefs(shared, c)
                              }
                              prefListener = listener
                              sp.registerOnSharedPreferenceChangeListener(listener)
                              initialized = true
                          }
                      }
                  }
              }

              fun init(c: Context) {
                  ensureInit(c)
                  loadFromPrefs(prefs(c), c)
              }

              fun reportPlayerIsPlaying(playing: Boolean) {
                  hasDirectPlayerIsPlaying = true
                  lastDirectPlayingReportMs = SystemClock.elapsedRealtime()
                  if (isPlaybackPlaying != playing) {
                      isPlaybackPlaying = playing
                  }
              }

              fun reload(c: Context) { init(c); c.findActivity()?.let { applyWindowFrameRate(it, targetFps, true) } }
              fun update(c: Context, fps: Int) { targetFps = fps; prefs(c).edit().putInt(KEY_TARGET_FPS, fps).apply(); c.findActivity()?.let { applyWindowFrameRate(it, fps, true) } }
              fun updateLyricsImmersive(c: Context, en: Boolean) { lyricsImmersiveEnabled = en; prefs(c).edit().putBoolean(KEY_LYRICS_IMMERSIVE, en).apply() }
              fun updatePlayerInlineLyrics(c: Context, en: Boolean) { playerInlineLyricsEnabled = en; prefs(c).edit().putBoolean(KEY_PLAYER_INLINE_LYRICS, en).apply() }
              fun updateCustomColor(c: Context, argb: Long) { customAccentColorArgb = argb; prefs(c).edit().putLong(KEY_CUSTOM_COLOR, argb).apply() }
              fun updateElementAnim(c: Context, en: Boolean, mode: Int = elementAnimMode) {
                  val m = mode.coerceIn(1, 3); elementAnimEnabled = en; elementAnimMode = m
                  prefs(c).edit().putBoolean(KEY_ANIM_ENABLED, en).putInt(KEY_ANIM_MODE, m).apply()
              }
              fun updateElementAnimPauseOnPause(c: Context, pause: Boolean) {
                  elementAnimPauseOnPause = pause
                  prefs(c).edit().putBoolean(KEY_ANIM_PAUSE_ON_PAUSE, pause).apply()
              }
              fun updatePlaybackAlerts(c: Context, en: Boolean) { playbackAlertsEnabled = en; prefs(c).edit().putBoolean(KEY_PLAYBACK_ALERTS, en).apply() }

              fun updateKeepShuffle(c: Context, en: Boolean) {
                  keepShuffleEnabled = en
                  val shouldRemember = if (en) {
                      !VnShuffleGuard.explicitlyDisabledByUser
                  } else {
                      false
                  }
                  rememberedShuffleState = shouldRemember
                  prefs(c).edit()
                      .putBoolean(KEY_KEEP_SHUFFLE, en)
                      .putBoolean(KEY_REMEMBER_SHUFFLE, false)
                      .putBoolean(KEY_REMEMBERED_SHUFFLE_STATE, shouldRemember)
                      .commit()
                  persistShuffleBackupFile(c, en, shouldRemember)
                  if (en && shouldRemember) {
                      VnShuffleGuard.syncNativeShufflePrefs(c, true)
                  }
                  VnShuffleGuard.onSettingChanged(en, shouldRemember)
              }

              fun saveRememberedShuffleState(c: Context?, state: Boolean) {
                  rememberedShuffleState = state
                  val ctx = c ?: resolveAppContext()
                  ctx?.let {
                      prefs(it).edit().putBoolean(KEY_REMEMBERED_SHUFFLE_STATE, state).commit()
                      persistShuffleBackupFile(it, keepShuffleEnabled, state)
                      if (keepShuffleEnabled && state) {
                          VnShuffleGuard.syncNativeShufflePrefs(it, true)
                      }
                  }
              }

              fun updateLyricsBeautiful(c: Context, en: Boolean) { lyricsBeautifulEnabled = en; prefs(c).edit().putBoolean(KEY_LYRICS_BEAUTIFUL, en).apply() }
              fun updateLyricsCustomColor(c: Context, argb: Long) { lyricsCustomColorArgb = argb; prefs(c).edit().putLong(KEY_LYRICS_COLOR, argb).apply() }
              fun updatePlayerKaraokeBgColor(c: Context, argb: Long) { playerKaraokeBgColorArgb = argb; prefs(c).edit().putLong(KEY_PLAYER_KARAOKE_BG_COLOR, argb).apply() }
              fun updateLyricsFontScale(c: Context, scale: Float) {
                  val s = ((scale * 20f).roundToInt() / 20f).coerceIn(0.70f, 1.70f)
                  lyricsFontScale = s
                  prefs(c).edit().putFloat(KEY_LYRICS_FONT_SCALE, s).apply()
              }
              fun updatePlayerLyricsFontScale(c: Context, scale: Float) {
                  val s = ((scale * 20f).roundToInt() / 20f).coerceIn(0.60f, 1.40f)
                  playerLyricsFontScale = s
                  prefs(c).edit().putFloat(KEY_PLAYER_LYRICS_FONT_SCALE, s).apply()
              }

              fun resetLyricsCache() {
                  savedPlayerLyricText = ""
                  savedPlayerLyricLines = emptyList()
                  savedPlayerActiveLineIndex = -1
                  canonicalLyricsLocked = false
                  lastActiveLineChangeMs = 0L
              }

              fun captureOrderedLyricsList(items: List<*>, activeIndex: Int = -1) {
                  if (items.isEmpty()) return
                  val extracted = items.mapNotNull { item ->
                      when (item) {
                          null -> null
                          is String -> item.trim().takeIf { it.isNotEmpty() }
                          else -> {
                              val cls = item.javaClass
                              listOf("text", "lyric", "line", "content", "words", "value").firstNotNullOfOrNull { prop ->
                                  val cap = prop.replaceFirstChar { it.uppercaseChar() }
                                  val m = runCatching { cls.methods.firstOrNull { it.parameterCount == 0 && (it.name == "get$cap" || it.name == prop) } }.getOrNull()
                                  runCatching { m?.invoke(item)?.toString()?.trim() }.getOrNull()?.takeIf { it.isNotEmpty() && it != "null" }
                              }
                          }
                      }
                  }
                  if (extracted.isNotEmpty() && extracted != savedPlayerLyricLines) {
                      savedPlayerLyricLines = extracted
                      canonicalLyricsLocked = extracted.size >= 2
                  }
                  if (activeIndex in extracted.indices) {
                      savedPlayerActiveLineIndex = activeIndex
                      val activeStr = extracted[activeIndex]
                      if (activeStr != savedPlayerLyricText) {
                          savedPlayerLyricText = activeStr
                          lastActiveLineChangeMs = SystemClock.elapsedRealtime()
                      }
                  }
              }

              fun captureLyricLine(rawText: String, isActive: Boolean = true) {
                  val t = rawText.trim()
                  val generic = setOf(
                      "", "στίχοι", "lyrics", "no lyrics", "δεν υπάρχουν στίχοι", "...",
                      "εμφάνιση", "αναπαραγωγή", "εφαρμογή", "αυτόματο", "αυτόματη"
                  )
                  if (t.lowercase() in generic || t.length < 2) return

                  val lines = rawText.lines().map { it.trim() }.filter { it.isNotEmpty() }
                  if (lines.size > 1) {
                      if (savedPlayerLyricLines != lines) {
                          savedPlayerLyricLines = lines
                          canonicalLyricsLocked = true
                      }
                      return
                  }

                  val single = lines.firstOrNull() ?: return
                  if (!canonicalLyricsLocked) {
                      val cur = savedPlayerLyricLines
                      if (single !in cur) {
                          val next = cur.toMutableList()
                          next.add(single)
                          if (next.size > 250) next.removeAt(0)
                          savedPlayerLyricLines = next
                      }
                  }

                  if (isActive && single != savedPlayerLyricText) {
                      val now = SystemClock.elapsedRealtime()
                      val curLines = savedPlayerLyricLines
                      val newIdx = if (curLines.isNotEmpty()) curLines.indexOfFirst { it.equals(single, ignoreCase = true) } else -1
                      val oldIdx = if (curLines.isNotEmpty() && savedPlayerLyricText.isNotEmpty()) curLines.indexOfFirst { it.equals(savedPlayerLyricText, ignoreCase = true) } else -1
                      val isFrameJitter = oldIdx >= 0 && newIdx >= 0 && newIdx != oldIdx + 1 && (now - lastActiveLineChangeMs) < 180L
                      if (!isFrameJitter) {
                          savedPlayerLyricText = single
                          if (newIdx >= 0) savedPlayerActiveLineIndex = newIdx
                          lastActiveLineChangeMs = now
                      }
                  }
              }

              fun openLyricsFullscreen(act: Activity?, onExpand: (() -> Unit)? = null) {
                  lyricsFullscreenOpen = true
                  if (lyricsImmersiveEnabled) setSystemBarsHidden(act, true)
                  runCatching { onExpand?.invoke() }
                  runCatching { onExternalOpenLyrics?.invoke() }
              }

              fun closeLyricsFullscreen(act: Activity?, onCollapse: (() -> Unit)? = null) {
                  lyricsFullscreenOpen = false
                  setSystemBarsHidden(act, false)
                  runCatching { onCollapse?.invoke() }
                  runCatching { onExternalCloseLyrics?.invoke() }
              }

              fun isSwipeToExpandLyricsEnabled(c: Context): Boolean {
                  runCatching {
                      File(c.applicationInfo.dataDir, "shared_prefs").listFiles()?.filter { it.name.endsWith(".xml") }?.forEach { f ->
                          val all = c.applicationContext.getSharedPreferences(f.name.removeSuffix(".xml"), Context.MODE_PRIVATE).all
                          for ((k, v) in all) {
                              val kl = k.lowercase()
                              if ((kl.contains("swipe") && kl.contains("lyric")) || (kl.contains("expand") && kl.contains("lyric"))) {
                                  if (v is Boolean) return v
                              }
                          }
                      }
                  }
                  return true
              }

              fun setSystemBarsHidden(act: Activity?, hidden: Boolean) {
                  lyricsBarsHidden = hidden
                  val w = act?.window ?: return
                  WindowCompat.getInsetsController(w, w.decorView).apply {
                      if (hidden) {
                          systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          hide(WindowInsetsCompat.Type.systemBars())
                      } else {
                          show(WindowInsetsCompat.Type.systemBars())
                      }
                  }
              }
              fun toggleSystemBars(act: Activity?) = setSystemBarsHidden(act, !lyricsBarsHidden)

              fun exportAllPrefsJson(c: Context): JSONObject = JSONObject().also { all ->
                  File(c.applicationInfo.dataDir, "shared_prefs").listFiles()?.filter { it.name.endsWith(".xml") }?.forEach { f ->
                      val spName = f.name.removeSuffix(".xml")
                      val entries = JSONObject()
                      c.applicationContext.getSharedPreferences(spName, Context.MODE_PRIVATE).all.forEach { (k, v) ->
                          when (v) {
                              is Boolean -> entries.put(k, JSONObject().put("t", "b").put("v", v))
                              is Int -> entries.put(k, JSONObject().put("t", "i").put("v", v))
                              is Long -> entries.put(k, JSONObject().put("t", "l").put("v", v))
                              is Float -> entries.put(k, JSONObject().put("t", "f").put("v", v.toDouble()))
                              is String -> entries.put(k, JSONObject().put("t", "s").put("v", v))
                              is Set<*> -> entries.put(k, JSONObject().put("t", "set").put("v", JSONArray().apply { v.filterNotNull().forEach { put(it.toString()) } }))
                          }
                      }
                      all.put(spName, entries)
                  }
              }

              fun enrichBackupJson(c: Context, jsonStr: String): String = try {
                  JSONObject(jsonStr).put("__vnera_all_prefs__", exportAllPrefsJson(c)).toString(2).also { recordBackupAndExtractExtensions(c, it) }
              } catch (_: Exception) { recordBackupAndExtractExtensions(c, jsonStr); jsonStr }

              fun onBackupImported(c: Context, rawText: String): String {
                  recordBackupAndExtractExtensions(c, rawText)
                  try {
                      val root = JSONObject(rawText)
                      val allPrefs = root.optJSONObject("__vnera_all_prefs__")
                      if (allPrefs != null) {
                          allPrefs.keys().forEach { spName ->
                              val entries = allPrefs.optJSONObject(spName) ?: return@forEach
                              val ed = c.applicationContext.getSharedPreferences(spName, Context.MODE_PRIVATE).edit()
                              entries.keys().forEach { k ->
                                  if (k == KEY_LAST_BACKUP_JSON || k == KEY_LAST_BACKUP_EXTENSIONS || k == KEY_RESTORED_EXTENSIONS) return@forEach
                                  val item = entries.optJSONObject(k) ?: return@forEach
                                  when (item.optString("t")) {
                                      "b" -> ed.putBoolean(k, item.optBoolean("v"))
                                      "i" -> ed.putInt(k, item.optInt("v"))
                                      "l" -> ed.putLong(k, item.optLong("v"))
                                      "f" -> ed.putFloat(k, item.optDouble("v").toFloat())
                                      "s" -> ed.putString(k, item.optString("v"))
                                      "set" -> item.optJSONArray("v")?.let { arr -> ed.putStringSet(k, (0 until arr.length()).mapTo(LinkedHashSet()) { arr.optString(it) }) }
                                  }
                              }
                              ed.commit()
                          }
                      }
                  } catch (_: Exception) {}
                  reload(c)
                  c.findActivity()?.let { act -> Handler(Looper.getMainLooper()).postDelayed({ if (!act.isFinishing && !act.isDestroyed) act.recreate() }, 350L) }
                  return rawText
              }

              fun recordBackupAndExtractExtensions(c: Context, raw: String) {
                  val ext = extractExtensionsFromBackup(raw).also { cachedExtensionsText = it }
                  prefs(c).edit().putString(KEY_LAST_BACKUP_JSON, raw).putString(KEY_LAST_BACKUP_EXTENSIONS, ext).commit()
              }

              private val ignoredSettingTokens = setOf(
                  "true", "false", "null", "[]", "{}", "auto", "default", "none", "high", "low", "medium",
                  "lossless", "normal", "enabled", "disabled", "order", "priority", "quality", "shuffle",
                  "repeat", "lyrics", "theme", "color", "fps", "anim", "backup", "cache", "timeout"
              )

              private fun isSystemSettingKey(key: String): Boolean {
                  val kl = key.lowercase()
                  return listOf(
                      "order", "priority", "quality", "audio", "theme", "color", "fps", "anim",
                      "shuffle", "repeat", "lyric", "player", "cache", "alert", "backup", "timeout",
                      "immersive", "swipe", "expand", "scale", "font", "mode", "pause", "equalizer",
                      "volume", "crossfade", "gapless", "normalize", "download", "wifi", "notification"
                  ).any { kl.contains(it) }
              }

              private fun formatExtEntry(name: String, url: String): String {
                  val cleanName = name.trim().trim('"', '\'', '-', ':', '|')
                  val cleanUrl = url.trim().trim('"', '\'')
                  if (cleanName.lowercase() in ignoredSettingTokens && cleanUrl.isEmpty()) return ""
                  if (cleanName.all { it.isDigit() || it == '.' } && cleanUrl.isEmpty()) return ""
                  return when {
                      cleanName.isNotEmpty() && cleanUrl.isNotEmpty() && !cleanName.equals(cleanUrl, true) -> "$cleanName - $cleanUrl"
                      cleanName.isNotEmpty() -> cleanName
                      cleanUrl.isNotEmpty() -> cleanUrl
                      else -> ""
                  }
              }

              private fun isRelevantExtUrl(u: String): Boolean {
                  val ul = u.lowercase()
                  if (!ul.startsWith("http://") && !ul.startsWith("https://")) return false
                  if (ul.contains("vnsec2/vnera") || ul.contains("revera.caruno.wtf")) return false
                  return true
              }

              fun extractExtensionsFromBackup(raw: String): String {
                  val trimmed = raw.trim()
                  if (trimmed.isEmpty()) return ""
                  val entries = LinkedHashMap<String, String>()
                  val urlRegex = Regex("""https?://[^\s"'<>\]\)]+""")
                  fun addEntry(name: String, url: String) {
                      val validUrl = if (isRelevantExtUrl(url)) url else ""
                      val formatted = formatExtEntry(name, validUrl)
                      if (formatted.isBlank()) return
                      val key = (validUrl.ifBlank { name.trim() }).lowercase()
                      val existing = entries[key]
                      if (existing == null || formatted.length > existing.length) entries[key] = formatted
                  }
                  fun extractObjectEntry(obj: JSONObject): Boolean {
                      if (obj.has("t") && obj.has("v") && obj.length() <= 3) return false
                      val nameKeys = listOf("extensionName", "pluginName", "addonName", "repoName", "displayName", "name", "title", "label")
                      val urlKeys = listOf("repoUrl", "repositoryUrl", "sourceUrl", "manifestUrl", "jsonUrl", "apkUrl", "downloadUrl", "url", "link", "uri", "href", "homepage", "repo")
                      var foundName = nameKeys.firstNotNullOfOrNull { k ->
                          obj.optString(k, "").trim().takeIf { it.isNotEmpty() && it.lowercase() !in ignoredSettingTokens }
                      }.orEmpty()
                      if (foundName.isEmpty()) {
                          val pkg = obj.optString("packageName", "").ifBlank { obj.optString("pkg", "") }.trim()
                          if (pkg.isNotEmpty() && pkg != "null") foundName = pkg
                      }
                      var foundUrl = urlKeys.firstNotNullOfOrNull { k ->
                          obj.optString(k, "").trim().takeIf { isRelevantExtUrl(it) }
                      }.orEmpty()
                      if (foundUrl.isEmpty()) {
                          foundUrl = urlRegex.find(obj.toString())?.value?.takeIf(::isRelevantExtUrl).orEmpty()
                      }
                      if (foundName.isNotEmpty() || foundUrl.isNotEmpty()) {
                          addEntry(foundName, foundUrl)
                          return true
                      }
                      return false
                  }
                  fun scan(node: Any?, hint: String = "") {
                      val hl = hint.lowercase()
                      if (hl == "__vnera_all_prefs__" || isSystemSettingKey(hl)) return
                      when (node) {
                          is JSONObject -> {
                              val isExtContext = listOf("extension", "addon", "plugin", "repositor", "repo", "installed").any { hl.contains(it) }
                              if (isExtContext && !node.has("t")) extractObjectEntry(node)
                              node.keys().forEach { k ->
                                  val kl = k.lowercase()
                                  if (kl == "__vnera_all_prefs__" || isSystemSettingKey(kl)) return@forEach
                                  scan(node.opt(k), k)
                              }
                          }
                          is JSONArray -> for (i in 0 until node.length()) scan(node.opt(i), hint)
                          is String -> {
                              val s = node.trim()
                              if ((s.startsWith("{") || s.startsWith("[")) && s.length > 2) {
                                  runCatching {
                                      if (s.startsWith("{")) scan(JSONObject(s), hint) else scan(JSONArray(s), hint)
                                  }
                              }
                          }
                      }
                  }
                  runCatching {
                      if (trimmed.startsWith("{")) scan(JSONObject(trimmed))
                      else if (trimmed.startsWith("[")) scan(JSONArray(trimmed))
                  }
                  return entries.values.joinToString("\n")
              }
          }

          fun vnCaptureLyricText(rawText: String, isActive: Boolean = true): String {
              VnFpsPref.captureLyricLine(rawText, isActive = isActive)
              return rawText
          }

          fun vnCaptureLyricTextWithColor(rawText: String, color: Color): String {
              val isHighlight = !color.isSpecified || color.alpha >= 0.78f
              VnFpsPref.captureLyricLine(rawText, isActive = isHighlight)
              return rawText
          }

          fun vnCaptureLyricText(rawText: AnnotatedString, isActive: Boolean = true): AnnotatedString {
              val hasActiveSpan = isActive && (rawText.spanStyles.isEmpty() || rawText.spanStyles.any { !it.item.color.isSpecified || it.item.color.alpha >= 0.78f })
              VnFpsPref.captureLyricLine(rawText.text, isActive = hasActiveSpan)
              return rawText
          }

          fun vnResolveSelectedLyricColor(): Color {
              val customArgb = VnFpsPref.lyricsCustomColorArgb
              val accentArgb = VnFpsPref.customAccentColorArgb
              val argb = when {
                  customArgb != 0L -> customArgb
                  accentArgb != 0L -> accentArgb
                  VnFpsPref.staticAppPrimaryArgb != 0L -> VnFpsPref.staticAppPrimaryArgb
                  else -> 0xFF7C4DFFL
              }
              return Color(argb)
          }

          fun vnPlayerInlineLyricColor(original: Color, isPlayer: Boolean = true): Color {
              if (!original.isSpecified || original.alpha <= 0.01f) return original
              val isDimBackground = original.alpha < 0.78f
              if (isPlayer && isDimBackground && VnFpsPref.playerKaraokeBgColorArgb != 0L) {
                  return Color(VnFpsPref.playerKaraokeBgColorArgb).copy(alpha = 0.72f)
              }
              if (!VnFpsPref.lyricsBeautifulEnabled) return original
              val chosen = vnResolveSelectedLyricColor()
              return if (isDimBackground) {
                  lerp(chosen, Color.White, 0.45f).copy(alpha = 0.48f)
              } else {
                  lerp(chosen, Color.White, 0.55f).copy(alpha = 1.0f)
              }
          }

          fun vnScalePlayerLyricSp(size: TextUnit): TextUnit {
              if (!size.isSpecified) return size
              val scale = VnFpsPref.playerLyricsFontScale.coerceIn(0.60f, 1.40f)
              return if (abs(scale - 1.0f) < 0.005f) size else (size.value * scale).sp
          }

          @Composable
          fun vnScalePlayerLyricTextStyle(baseStyle: TextStyle = LocalTextStyle.current): TextStyle {
              val c = LocalContext.current
              VnFpsPref.ensureInit(c)
              val scale = VnFpsPref.playerLyricsFontScale.coerceIn(0.60f, 1.40f)
              if (abs(scale - 1.0f) < 0.005f) return baseStyle
              val baseFontSize = if (baseStyle.fontSize.isSpecified) baseStyle.fontSize else 15.sp
              val baseLineHeight = if (baseStyle.lineHeight.isSpecified) baseStyle.lineHeight else (baseFontSize.value * 1.32f).sp
              return baseStyle.copy(
                  fontSize = (baseFontSize.value * scale).sp,
                  lineHeight = (baseLineHeight.value * scale).sp
              )
          }

          fun vnStyleLyricAnnotatedString(raw: AnnotatedString, isPlayer: Boolean = true): AnnotatedString {
              val hasActiveSpan = raw.spanStyles.isEmpty() || raw.spanStyles.any { !it.item.color.isSpecified || it.item.color.alpha >= 0.78f }
              VnFpsPref.captureLyricLine(raw.text, isActive = hasActiveSpan)
              val hasCustomBg = isPlayer && VnFpsPref.playerKaraokeBgColorArgb != 0L
              val hasCustomActive = VnFpsPref.lyricsBeautifulEnabled
              val playerScale = VnFpsPref.playerLyricsFontScale.coerceIn(0.60f, 1.40f)
              val hasPlayerScale = isPlayer && abs(playerScale - 1.0f) >= 0.005f
              if (!hasCustomBg && !hasCustomActive && !hasPlayerScale) return raw
              if (raw.spanStyles.isEmpty()) return raw
              val bgTint = if (hasCustomBg) Color(VnFpsPref.playerKaraokeBgColorArgb).copy(alpha = 0.72f) else Color.Unspecified
              val activeChosen = vnResolveSelectedLyricColor()
              return buildAnnotatedString {
                  append(raw.text)
                  raw.paragraphStyles.forEach { addStyle(it.item, it.start, it.end) }
                  raw.spanStyles.forEach { range ->
                      val span = range.item
                      val c = span.color
                      val newColor = when {
                          !c.isSpecified || c.alpha <= 0.01f -> c
                          c.alpha < 0.78f -> when {
                              hasCustomBg -> bgTint
                              hasCustomActive -> lerp(activeChosen, Color.White, 0.45f).copy(alpha = 0.48f)
                              else -> c
                          }
                          hasCustomActive -> lerp(activeChosen, Color.White, 0.55f).copy(alpha = 1.0f)
                          else -> c
                      }
                      val newFontSize = if (hasPlayerScale && span.fontSize.isSpecified) {
                          (span.fontSize.value * playerScale).sp
                      } else {
                          span.fontSize
                      }
                      addStyle(span.copy(color = newColor, fontSize = newFontSize), range.start, range.end)
                  }
              }
          }

          fun vnStyleLyricTextAny(raw: String, isPlayer: Boolean = true): String {
              VnFpsPref.captureLyricLine(raw, isActive = true)
              return raw
          }

          fun vnStyleLyricTextAny(raw: AnnotatedString, isPlayer: Boolean = true): AnnotatedString =
              vnStyleLyricAnnotatedString(raw, isPlayer = isPlayer)

          @Composable
          fun VnPlayerInlineLyricsSection(modifier: Modifier = Modifier) {
              val c = LocalContext.current
              val act = remember(c) { c.findActivity() }
              VnFpsPref.ensureInit(c)
              if (!VnFpsPref.playerInlineLyricsEnabled) return

              val lines = VnFpsPref.savedPlayerLyricLines
              val activeText = VnFpsPref.savedPlayerLyricText
              val scale = VnFpsPref.playerLyricsFontScale.coerceIn(0.60f, 1.40f)
              val accentColor = vnResolveSelectedLyricColor()
              val listState = rememberLazyListState()

              val activeIdx = remember(lines, activeText, VnFpsPref.savedPlayerActiveLineIndex) {
                  val explicit = VnFpsPref.savedPlayerActiveLineIndex
                  if (explicit in lines.indices) explicit
                  else {
                      val target = activeText.trim()
                      if (target.isEmpty() || lines.isEmpty()) -1
                      else lines.indexOfFirst { it.equals(target, ignoreCase = true) }
                          .takeIf { it >= 0 }
                          ?: lines.indexOfFirst { it.contains(target, ignoreCase = true) || target.contains(it, ignoreCase = true) }
                  }
              }

              LaunchedEffect(activeIdx, lines.size) {
                  if (activeIdx in lines.indices && !listState.isScrollInProgress) {
                      runCatching {
                          listState.animateScrollToItem(index = (activeIdx - 1).coerceAtLeast(0))
                      }
                  }
              }

              val cardBg = if (VnFpsPref.playerKaraokeBgColorArgb != 0L) {
                  Color(VnFpsPref.playerKaraokeBgColorArgb).copy(alpha = 0.28f)
              } else {
                  Color.White.copy(alpha = 0.08f)
              }

              Surface(
                  modifier = modifier
                      .fillMaxWidth()
                      .padding(horizontal = 16.dp, vertical = 6.dp)
                      .vnAnimatedElement(2)
                      .vnSmartLyricsSwipe(
                          act = act,
                          isExpanded = false,
                          onExpandToFullscreen = { VnFpsPref.openLyricsFullscreen(act) }
                      ),
                  shape = RoundedCornerShape(20.dp),
                  color = cardBg,
                  border = BorderStroke(1.dp, Color.White.copy(alpha = 0.14f))
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(horizontal = 14.dp, vertical = 10.dp),
                      verticalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          Text(
                              text = "Στίχοι (${(scale * 100).roundToInt()}%)",
                              style = MaterialTheme.typography.labelMedium,
                              fontWeight = FontWeight.Bold,
                              color = Color.White.copy(alpha = 0.85f)
                          )
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              horizontalArrangement = Arrangement.spacedBy(6.dp)
                          ) {
                              Surface(
                                  onClick = { VnFpsPref.updatePlayerLyricsFontScale(c, scale - 0.05f) },
                                  shape = CircleShape,
                                  color = Color.White.copy(alpha = 0.12f)
                              ) {
                                  Text(
                                      text = "A−",
                                      style = MaterialTheme.typography.labelSmall,
                                      fontWeight = FontWeight.Bold,
                                      color = Color.White,
                                      modifier = Modifier.padding(horizontal = 8.dp, vertical = 4.dp)
                                  )
                              }
                              Surface(
                                  onClick = { VnFpsPref.updatePlayerLyricsFontScale(c, scale + 0.05f) },
                                  shape = CircleShape,
                                  color = Color.White.copy(alpha = 0.12f)
                              ) {
                                  Text(
                                      text = "A+",
                                      style = MaterialTheme.typography.labelSmall,
                                      fontWeight = FontWeight.Bold,
                                      color = Color.White,
                                      modifier = Modifier.padding(horizontal = 8.dp, vertical = 4.dp)
                                  )
                              }
                              VnLyricsFullscreenButton(
                                  isFullscreen = false,
                                  ownerId = "player_inline",
                                  onClick = {}
                              )
                          }
                      }

                      if (lines.isNotEmpty()) {
                          LazyColumn(
                              state = listState,
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .heightIn(min = 76.dp, max = 148.dp)
                                  .clickable { VnFpsPref.openLyricsFullscreen(act) },
                              verticalArrangement = Arrangement.spacedBy(6.dp)
                          ) {
                              itemsIndexed(lines, key = { idx, line -> "${idx}_${line.hashCode()}" }) { idx, line ->
                                  val isCurrent = idx == activeIdx
                                  val lineColor = when {
                                      isCurrent && VnFpsPref.lyricsBeautifulEnabled -> lerp(accentColor, Color.White, 0.55f)
                                      isCurrent -> Color.White
                                      VnFpsPref.lyricsBeautifulEnabled -> lerp(accentColor, Color.White, 0.45f).copy(alpha = 0.52f)
                                      else -> Color.White.copy(alpha = 0.52f)
                                  }
                                  Text(
                                      text = line,
                                      style = MaterialTheme.typography.bodyLarge.copy(
                                          fontSize = (16f * scale).sp,
                                          lineHeight = (22f * scale).sp,
                                          fontWeight = if (isCurrent) FontWeight.Bold else FontWeight.Medium
                                      ),
                                      color = lineColor,
                                      maxLines = 2,
                                      overflow = TextOverflow.Ellipsis,
                                      modifier = Modifier.fillMaxWidth()
                                  )
                              }
                          }
                      } else {
                          Text(
                              text = activeText.ifBlank { "Δεν υπάρχουν διαθέσιμοι στίχοι για το τρέχον κομμάτι" },
                              style = MaterialTheme.typography.bodyMedium.copy(
                                  fontSize = (15f * scale).sp,
                                  lineHeight = (20f * scale).sp,
                                  fontWeight = FontWeight.Medium
                              ),
                              color = Color.White.copy(alpha = 0.72f),
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .clickable { VnFpsPref.openLyricsFullscreen(act) }
                                  .padding(vertical = 8.dp)
                          )
                      }
                  }
              }
          }

