      - name: Link SDK 37 & Fix Versions & Apply Patches
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SUDO=""; command -v sudo >/dev/null 2>&1 && [ ! -w "$SDK_ROOT/platforms" ] && SUDO="sudo"
          [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ] && $SUDO ln -sfn "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"

          export HAS_SDK_37="false"
          [ -d "$SDK_ROOT/platforms/android-37" ] && export HAS_SDK_37="true"
          export BUILD_VERSION_CODE=$((214000 + ${GITHUB_RUN_NUMBER:-1}))
          echo "HAS_SDK_37=$HAS_SDK_37" >> "$GITHUB_ENV"
          echo "BUILD_VERSION_CODE=$BUILD_VERSION_CODE" >> "$GITHUB_ENV"

          mkdir -p app/src/main/java/com/music/spotui/ui/screens
          cat <<'EOF' > app/src/main/java/com/music/spotui/ui/screens/VnFrameRateManager.kt
          package com.music.spotui.ui.screens

          import android.app.*
          import android.content.*
          import android.media.AudioManager
          import android.os.*
          import android.view.*
          import android.widget.Toast
          import androidx.compose.animation.*
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.*
          import androidx.compose.foundation.gestures.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyListState
          import androidx.compose.foundation.shape.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.rounded.Fullscreen
          import androidx.compose.material.icons.rounded.FullscreenExit
          import androidx.compose.material.icons.rounded.Shuffle
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.*
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.input.nestedscroll.*
          import androidx.compose.ui.input.pointer.*
          import androidx.compose.ui.platform.LocalConfiguration
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.text.*
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.*
          import androidx.core.view.*
          import kotlinx.coroutines.delay
          import org.json.*
          import java.io.File
          import kotlin.math.*

          object VnFpsPref {
              const val PREFS_NAME = "vnera_display_prefs"
              const val KEY_TARGET_FPS = "target_fps"
              const val KEY_LYRICS_IMMERSIVE = "lyrics_immersive_fullscreen"
              const val KEY_CUSTOM_COLOR = "custom_accent_color_argb"
              const val KEY_ANIM_ENABLED = "element_animation_enabled"
              const val KEY_ANIM_MODE = "element_animation_mode"
              const val KEY_ANIM_PAUSE_ON_PAUSE = "element_animation_pause_on_playback_pause"
              const val KEY_PLAYBACK_ALERTS = "playback_quality_order_alerts"
              const val KEY_SHUFFLE_GUARD = "playback_shuffle_guard_enabled"
              const val KEY_LAST_BACKUP_JSON = "last_loaded_backup_json"
              const val KEY_LAST_BACKUP_EXTENSIONS = "last_loaded_backup_extensions"
              const val KEY_RESTORED_EXTENSIONS = "vnera_restored_extensions_list"
              const val KEY_LYRICS_BEAUTIFUL = "lyrics_beautiful_enabled"
              const val KEY_LYRICS_COLOR = "lyrics_custom_color_argb"
              const val KEY_LYRICS_FONT_SCALE = "lyrics_font_scale"

              var targetFps by mutableIntStateOf(0); private set
              var lyricsImmersiveEnabled by mutableStateOf(true); private set
              var lyricsBarsHidden by mutableStateOf(false)
              var isBlackFullscreenMode by mutableStateOf(false)
              var lyricsViewVisibleCount by mutableIntStateOf(0)

              var activeLyricsScrollState: ScrollableState? = null
              var savedPlayerLyricText by mutableStateOf("")
              var savedPlayerPreviewScrollIndex by mutableIntStateOf(0)
              var savedPlayerPreviewScrollOffset by mutableIntStateOf(0)

              var customAccentColorArgb by mutableLongStateOf(0L); private set
              var elementAnimEnabled by mutableStateOf(false); private set
              var elementAnimMode by mutableIntStateOf(1); private set
              var elementAnimPauseOnPause by mutableStateOf(true); private set
              var isPlaybackPlaying by mutableStateOf(true)
              var playbackAlertsEnabled by mutableStateOf(true); private set
              var shuffleGuardEnabled by mutableStateOf(false); private set
              var cachedExtensionsText by mutableStateOf(""); private set
              var lyricsBeautifulEnabled by mutableStateOf(false); private set
              var lyricsCustomColorArgb by mutableLongStateOf(0L); private set
              var lyricsFontScale by mutableFloatStateOf(1.0f); private set
              var staticAppPrimaryArgb by mutableLongStateOf(0L)

              val extraColorPalette = listOf(
                  "Αυτόματη" to 0L, "Crimson" to 0xFFE53935L, "Coral" to 0xFFFF5722L, "Amber" to 0xFFFF9800L,
                  "Gold" to 0xFFFFC107L, "Lime" to 0xFFAEEA00L, "Emerald" to 0xFF00C853L, "Mint" to 0xFF00BFA5L,
                  "Cyan" to 0xFF00BCD4L, "Sky" to 0xFF29B6F6L, "Royal" to 0xFF2979FFL, "Indigo" to 0xFF3F51B5L,
                  "Violet" to 0xFF7C4DFFL, "Lavender" to 0xFFB388FFL, "Magenta" to 0xFFE040FBL, "Rose" to 0xFFFF4081L,
                  "Peach" to 0xFFFFAB91L, "Silver" to 0xFFCFD8DCL
              )

              private val blockedSettingPrefixes = listOf(
                  "target_fps", "lyrics_", "custom_accent", "element_animation",
                  "playback_", "last_loaded_backup", "vnera_", "theme", "accent",
                  "dynamic_color", "oled", "shuffle", "repeat", "equalizer", "crossfade", "gapless"
              )

              private fun prefs(c: Context) = c.applicationContext.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)

              fun init(c: Context) = prefs(c).run {
                  targetFps = getInt(KEY_TARGET_FPS, 0)
                  lyricsImmersiveEnabled = getBoolean(KEY_LYRICS_IMMERSIVE, true)
                  customAccentColorArgb = getLong(KEY_CUSTOM_COLOR, 0L)
                  elementAnimEnabled = getBoolean(KEY_ANIM_ENABLED, false)
                  elementAnimMode = getInt(KEY_ANIM_MODE, 1).coerceIn(1, 3)
                  elementAnimPauseOnPause = getBoolean(KEY_ANIM_PAUSE_ON_PAUSE, true)
                  playbackAlertsEnabled = getBoolean(KEY_PLAYBACK_ALERTS, true)
                  shuffleGuardEnabled = getBoolean(KEY_SHUFFLE_GUARD, false)
                  cachedExtensionsText = getString(KEY_LAST_BACKUP_EXTENSIONS, "").orEmpty()
                  lyricsBeautifulEnabled = getBoolean(KEY_LYRICS_BEAUTIFUL, false)
                  lyricsCustomColorArgb = getLong(KEY_LYRICS_COLOR, 0L)
                  lyricsFontScale = getFloat(KEY_LYRICS_FONT_SCALE, 1.0f).coerceIn(0.70f, 1.70f)
              }

              fun reload(c: Context) { init(c); c.findActivity()?.let { applyWindowFrameRate(it, targetFps, true) } }
              fun update(c: Context, fps: Int) { targetFps = fps; prefs(c).edit().putInt(KEY_TARGET_FPS, fps).apply(); c.findActivity()?.let { applyWindowFrameRate(it, fps, true) } }
              fun updateLyricsImmersive(c: Context, en: Boolean) { lyricsImmersiveEnabled = en; prefs(c).edit().putBoolean(KEY_LYRICS_IMMERSIVE, en).apply() }
              fun updateCustomColor(c: Context, argb: Long) { customAccentColorArgb = argb; prefs(c).edit().putLong(KEY_CUSTOM_COLOR, argb).apply() }
              fun updateElementAnim(c: Context, en: Boolean, mode: Int = elementAnimMode) {
                  val m = mode.coerceIn(1, 3); elementAnimEnabled = en; elementAnimMode = m
                  prefs(c).edit().putBoolean(KEY_ANIM_ENABLED, en).putInt(KEY_ANIM_MODE, m).apply()
              }
              fun updateElementAnimPauseOnPause(c: Context, pause: Boolean) {
                  elementAnimPauseOnPause = pause
                  prefs(c).edit().putBoolean(KEY_ANIM_PAUSE_ON_PAUSE, pause).apply()
              }
              fun updatePlaybackAlerts(c: Context, en: Boolean) { playbackAlertsEnabled = en; prefs(c).edit().putBoolean(KEY_PLAYBACK_ALERTS, en).apply() }
              fun updateShuffleGuard(c: Context, en: Boolean) {
                  shuffleGuardEnabled = en
                  prefs(c).edit().putBoolean(KEY_SHUFFLE_GUARD, en).apply()
                  if (!en) VnShuffleGuard.reset()
              }
              fun updateLyricsBeautiful(c: Context, en: Boolean) { lyricsBeautifulEnabled = en; prefs(c).edit().putBoolean(KEY_LYRICS_BEAUTIFUL, en).apply() }
              fun updateLyricsCustomColor(c: Context, argb: Long) { lyricsCustomColorArgb = argb; prefs(c).edit().putLong(KEY_LYRICS_COLOR, argb).apply() }
              fun updateLyricsFontScale(c: Context, scale: Float) {
                  val s = ((scale * 20f).roundToInt() / 20f).coerceIn(0.70f, 1.70f)
                  lyricsFontScale = s
                  prefs(c).edit().putFloat(KEY_LYRICS_FONT_SCALE, s).apply()
              }

              fun openBlackLyricsFullscreen(act: Activity?) {
                  isBlackFullscreenMode = true
                  if (lyricsImmersiveEnabled) setSystemBarsHidden(act, true)
              }

              fun closeBlackLyricsFullscreen(act: Activity?) {
                  isBlackFullscreenMode = false
                  setSystemBarsHidden(act, false)
              }

              fun setSystemBarsHidden(act: Activity?, hidden: Boolean) {
                  lyricsBarsHidden = hidden
                  val w = act?.window ?: return
                  WindowCompat.getInsetsController(w, w.decorView).apply {
                      if (hidden) {
                          systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                          hide(WindowInsetsCompat.Type.systemBars())
                      } else {
                          show(WindowInsetsCompat.Type.systemBars())
                      }
                  }
              }
              fun toggleSystemBars(act: Activity?) = setSystemBarsHidden(act, !lyricsBarsHidden)

              fun exportAllPrefsJson(c: Context): JSONObject = JSONObject().also { all ->
                  File(c.applicationInfo.dataDir, "shared_prefs").listFiles()?.filter { it.name.endsWith(".xml") }?.forEach { f ->
                      val spName = f.name.removeSuffix(".xml")
                      val entries = JSONObject()
                      c.applicationContext.getSharedPreferences(spName, Context.MODE_PRIVATE).all.forEach { (k, v) ->
                          when (v) {
                              is Boolean -> entries.put(k, JSONObject().put("t", "b").put("v", v))
                              is Int -> entries.put(k, JSONObject().put("t", "i").put("v", v))
                              is Long -> entries.put(k, JSONObject().put("t", "l").put("v", v))
                              is Float -> entries.put(k, JSONObject().put("t", "f").put("v", v.toDouble()))
                              is String -> entries.put(k, JSONObject().put("t", "s").put("v", v))
                              is Set<*> -> entries.put(k, JSONObject().put("t", "set").put("v", JSONArray().apply { v.filterNotNull().forEach { put(it.toString()) } }))
                          }
                      }
                      all.put(spName, entries)
                  }
              }

              fun enrichBackupJson(c: Context, jsonStr: String): String = try {
                  JSONObject(jsonStr).put("__vnera_all_prefs__", exportAllPrefsJson(c)).toString(2).also { recordBackupAndExtractExtensions(c, it) }
              } catch (_: Exception) { recordBackupAndExtractExtensions(c, jsonStr); jsonStr }

              fun onBackupImported(c: Context, rawText: String): String {
                  recordBackupAndExtractExtensions(c, rawText)
                  try {
                      val root = JSONObject(rawText)
                      val allPrefs = root.optJSONObject("__vnera_all_prefs__")
                      if (allPrefs != null) {
                          allPrefs.keys().forEach { spName ->
                              val entries = allPrefs.optJSONObject(spName) ?: return@forEach
                              val ed = c.applicationContext.getSharedPreferences(spName, Context.MODE_PRIVATE).edit()
                              entries.keys().forEach { k ->
                                  if (k == KEY_LAST_BACKUP_JSON || k == KEY_LAST_BACKUP_EXTENSIONS) return@forEach
                                  val item = entries.optJSONObject(k) ?: return@forEach
                                  when (item.optString("t")) {
                                      "b" -> ed.putBoolean(k, item.optBoolean("v"))
                                      "i" -> ed.putInt(k, item.optInt("v"))
                                      "l" -> ed.putLong(k, item.optLong("v"))
                                      "f" -> ed.putFloat(k, item.optDouble("v").toFloat())
                                      "s" -> ed.putString(k, item.optString("v"))
                                      "set" -> item.optJSONArray("v")?.let { arr -> ed.putStringSet(k, (0 until arr.length()).mapTo(LinkedHashSet()) { arr.optString(it) }) }
                                  }
                              }
                              ed.commit()
                          }
                      }
                  } catch (_: Exception) {}
                  reload(c)
                  c.findActivity()?.let { act -> Handler(Looper.getMainLooper()).postDelayed({ if (!act.isFinishing && !act.isDestroyed) act.recreate() }, 350L) }
                  return rawText
              }

              fun recordBackupAndExtractExtensions(c: Context, raw: String) {
                  val ext = extractExtensionsOnly(raw).also { cachedExtensionsText = it }
                  prefs(c).edit().putString(KEY_LAST_BACKUP_JSON, raw).putString(KEY_LAST_BACKUP_EXTENSIONS, ext).commit()
              }

              private fun isBlockedKey(key: String): Boolean {
                  val kl = key.lowercase().trim()
                  return blockedSettingPrefixes.any { kl.startsWith(it) || kl == it }
              }

              private fun formatExtEntry(name: String, url: String): String {
                  val cleanName = name.trim()
                  val cleanUrl = url.trim()
                  if (cleanName.isNotEmpty() && isBlockedKey(cleanName)) return ""
                  return when {
                      cleanName.isNotEmpty() && cleanUrl.isNotEmpty() && !cleanName.equals(cleanUrl, true) -> "$cleanName - $cleanUrl"
                      cleanName.isNotEmpty() -> cleanName
                      cleanUrl.isNotEmpty() -> cleanUrl
                      else -> ""
                  }
              }

              private fun isRelevantExtUrl(u: String): Boolean {
                  val ul = u.lowercase()
                  if (!ul.startsWith("http://") && !ul.startsWith("https://")) return false
                  if (ul.contains("vnsec2/vnera") || ul.contains("revera.caruno.wtf") || ul.contains("lrclib.net")) return false
                  return true
              }

              fun extractExtensionsOnly(raw: String): String {
                  val trimmed = raw.trim()
                  if (trimmed.isEmpty()) return ""
                  val entries = LinkedHashMap<String, String>()
                  val urlRegex = Regex("""https?://[^\s"'<>\]\)]+""")

                  fun addEntry(name: String, url: String) {
                      val formatted = formatExtEntry(name, if (isRelevantExtUrl(url)) url else "")
                      if (formatted.isBlank()) return
                      val key = (url.ifBlank { name }).lowercase()
                      val existing = entries[key]
                      if (existing == null || formatted.length > existing.length) entries[key] = formatted
                  }

                  fun extractObjectEntry(obj: JSONObject): Boolean {
                      val nameKeys = listOf("name", "title", "label", "extensionName", "pluginName", "addonName", "repoName", "displayName")
                      val urlKeys = listOf("url", "repoUrl", "repositoryUrl", "sourceUrl", "link", "manifestUrl", "jsonUrl", "apkUrl", "downloadUrl", "uri", "href", "homepage", "repo")
                      var foundName = nameKeys.firstNotNullOfOrNull { k -> obj.optString(k, "").trim().takeIf { it.isNotEmpty() && it != "null" && !isBlockedKey(it) } }.orEmpty()
                      if (foundName.isEmpty()) {
                          val idVal = obj.optString("id", "").trim()
                          if (idVal.isNotEmpty() && idVal != "null" && !idVal.startsWith("http") && !isBlockedKey(idVal)) foundName = idVal
                      }
                      var foundUrl = urlKeys.firstNotNullOfOrNull { k -> obj.optString(k, "").trim().takeIf { isRelevantExtUrl(it) } }.orEmpty()
                      if (foundUrl.isEmpty()) foundUrl = urlRegex.find(obj.toString())?.value?.takeIf(::isRelevantExtUrl).orEmpty()
                      if (foundName.isNotEmpty() || foundUrl.isNotEmpty()) {
                          addEntry(foundName, foundUrl)
                          return true
                      }
                      return false
                  }

                  fun scan(node: Any?, hint: String = "") {
                      when (node) {
                          is JSONObject -> {
                              val hl = hint.lowercase()
                              if (hl == PREFS_NAME || isBlockedKey(hl)) return
                              val isExtContext = listOf("extension", "addon", "plugin", "repo").any { hl.contains(it) }
                              if (isExtContext && !node.has("t")) extractObjectEntry(node)
                              node.keys().forEach { k ->
                                  if (k == PREFS_NAME || isBlockedKey(k)) return@forEach
                                  val v = node.opt(k)
                                  val kl = k.lowercase()
                                  val childIsExt = isExtContext || listOf("extension", "addon", "plugin", "repo").any { kl.contains(it) }
                                  if (childIsExt) {
                                      when (v) {
                                          is JSONArray -> {
                                              for (i in 0 until v.length()) {
                                                  val el = v.opt(i)
                                                  if (el is JSONObject) extractObjectEntry(el) else scan(el, k)
                                              }
                                          }
                                          is JSONObject -> {
                                              if (v.has("t") && v.has("v")) scan(v.opt("v"), k)
                                              else if (!extractObjectEntry(v)) scan(v, k)
                                          }
                                          is String -> scan(v, k)
                                      }
                                  } else {
                                      scan(v, k)
                                  }
                              }
                          }
                          is JSONArray -> {
                              for (i in 0 until node.length()) {
                                  val el = node.opt(i)
                                  if (el is JSONObject && listOf("extension", "addon", "plugin", "repo").any { hint.lowercase().contains(it) }) extractObjectEntry(el)
                                  scan(el, hint)
                              }
                          }
                          is String -> {
                              val s = node.trim()
                              if ((s.startsWith("{") || s.startsWith("[")) && s.length > 2) {
                                  runCatching {
                                      if (s.startsWith("{")) scan(JSONObject(s), hint) else scan(JSONArray(s), hint)
                                  }
                              } else if (listOf("extension", "addon", "plugin", "repo").any { hint.lowercase().contains(it) } && s.isNotEmpty() && s !in setOf("[]", "{}", "true", "false", "null") && !isBlockedKey(s)) {
                                  val u = urlRegex.find(s)?.value.orEmpty()
                                  val n = if (u.isNotEmpty()) s.replace(u, "").trim(' ', '-', ':', '|', '"', '\'') else s
                                  addEntry(n, u)
                              }
                          }
                      }
                  }

                  runCatching {
                      when {
                          trimmed.startsWith("{") -> scan(JSONObject(trimmed))
                          trimmed.startsWith("[") -> scan(JSONArray(trimmed))
                          else -> {
                              trimmed.lines().map { it.trim() }.filter { it.isNotEmpty() }.forEach { line ->
                                  val u = urlRegex.find(line)?.value.orEmpty()
                                  val n = if (u.isNotEmpty()) line.replace(u, "").trim(' ', '-', ':', '|') else line
                                  addEntry(n, u)
                              }
                          }
                      }
                  }
                  return entries.values.joinToString("\n")
              }

              fun copyExtensionsToClipboard(c: Context) {
                  init(c)
                  val collected = LinkedHashSet<String>()
                  // 1. Scan only extension-related SharedPreferences (never system settings)
                  runCatching {
                      File(c.applicationInfo.dataDir, "shared_prefs").listFiles()
                          ?.filter { it.name.endsWith(".xml") && it.name != "$PREFS_NAME.xml" }
                          ?.forEach { f ->
                              val sp = c.applicationContext.getSharedPreferences(f.name.removeSuffix(".xml"), Context.MODE_PRIVATE)
                              val obj = JSONObject()
                              sp.all.forEach { (k, v) ->
                                  val kl = k.lowercase()
                                  if (!isBlockedKey(kl) && listOf("extension", "addon", "plugin", "repo").any { kl.contains(it) }) {
                                      when (v) {
                                          is String -> obj.put(k, v)
                                          is Set<*> -> obj.put(k, JSONArray(v.filterNotNull().toList()))
                                      }
                                  }
                              }
                              if (obj.length() > 0) {
                                  extractExtensionsOnly(obj.toString()).lines().filter { it.isNotBlank() }.forEach(collected::add)
                              }
                          }
                  }
                  // 2. Scan extension files/folders in filesDir
                  runCatching {
                      File(c.filesDir.path).walkTopDown().maxDepth(3)
                          .filter { it.isFile && (it.name.contains("ext", true) || it.name.contains("repo", true) || it.name.contains("plugin", true)) && it.length() in 2..500_000 }
                          .forEach { f ->
                              extractExtensionsOnly(f.readText()).lines().filter { it.isNotBlank() }.forEach(collected::add)
                          }
                  }
                  // 3. Previously restored or backed up extensions
                  prefs(c).getString(KEY_RESTORED_EXTENSIONS, "").orEmpty().lines().filter { it.isNotBlank() }.forEach(collected::add)
                  cachedExtensionsText.lines().filter { it.isNotBlank() }.forEach(collected::add)

                  val text = collected.joinToString("\n")
                  if (text.isBlank()) {
                      Toast.makeText(c, "Δεν βρέθηκαν extensions ή links", Toast.LENGTH_SHORT).show()
                      return
                  }
                  (c.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager).setPrimaryClip(ClipData.newPlainText("VNEra Extensions", text))
                  Toast.makeText(c, "Αντιγράφηκαν ${collected.size} extensions (όνομα & link) στο πρόχειρο", Toast.LENGTH_SHORT).show()
              }

              fun restoreExtensionsOnly(c: Context, rawInput: String): Int {
                  val extracted = extractExtensionsOnly(rawInput)
                  val lines = extracted.lines().map { it.trim() }.filter { it.isNotEmpty() }
                  if (lines.isEmpty()) return 0

                  val urlRegex = Regex("""https?://[^\s"'<>\]\)]+""")
                  val urls = lines.mapNotNull { urlRegex.find(it)?.value }.distinct()
                  val names = lines.map { line ->
                      val u = urlRegex.find(line)?.value.orEmpty()
                      if (u.isNotEmpty()) line.replace(u, "").trim(' ', '-', ':', '|') else line
                  }.filter { it.isNotEmpty() }.distinct()

                  // Save in VNEra restored extensions list
                  val existingSaved = prefs(c).getString(KEY_RESTORED_EXTENSIONS, "").orEmpty().lines().filter { it.isNotBlank() }
                  val merged = (existingSaved + lines).distinct().joinToString("\n")
                  prefs(c).edit()
                      .putString(KEY_RESTORED_EXTENSIONS, merged)
                      .putString(KEY_LAST_BACKUP_EXTENSIONS, merged)
                      .commit()
                  cachedExtensionsText = merged

                  // Restore ONLY into extension/repo keys in app SharedPreferences (never touching system settings)
                  runCatching {
                      File(c.applicationInfo.dataDir, "shared_prefs").listFiles()
                          ?.filter { it.name.endsWith(".xml") && it.name != "$PREFS_NAME.xml" }
                          ?.forEach { f ->
                              val sp = c.applicationContext.getSharedPreferences(f.name.removeSuffix(".xml"), Context.MODE_PRIVATE)
                              val ed = sp.edit()
                              var changed = false
                              sp.all.forEach { (k, v) ->
                                  val kl = k.lowercase()
                                  if (isBlockedKey(kl)) return@forEach
                                  val isRepoKey = listOf("repo", "repository").any { kl.contains(it) }
                                  val isExtKey = listOf("extension", "plugin", "addon").any { kl.contains(it) }
                                  if (isRepoKey && urls.isNotEmpty()) {
                                      when (v) {
                                          is Set<*> -> {
                                              val next = LinkedHashSet<String>(v.filterIsInstance<String>())
                                              next.addAll(urls)
                                              ed.putStringSet(k, next); changed = true
                                          }
                                          is String -> if (v.trim().startsWith("[")) {
                                              runCatching {
                                                  val arr = JSONArray(v)
                                                  val existingSet = (0 until arr.length()).map { arr.optString(it) }.toSet()
                                                  urls.filter { it !in existingSet }.forEach { arr.put(it) }
                                                  ed.putString(k, arr.toString()); changed = true
                                              }
                                          }
                                      }
                                  } else if (isExtKey && (names.isNotEmpty() || urls.isNotEmpty())) {
                                      when (v) {
                                          is Set<*> -> {
                                              val next = LinkedHashSet<String>(v.filterIsInstance<String>())
                                              next.addAll(names.ifEmpty { urls })
                                              ed.putStringSet(k, next); changed = true
                                          }
                                      }
                                  }
                              }
                              if (changed) ed.commit()
                          }
                  }
                  return lines.size
              }
          }

          object VnShuffleGuard {
              var bannerMessage by mutableStateOf<String?>(null)
              var userWantsShuffle by mutableStateOf(false)
              var lastUserToggleAtMs by mutableLongStateOf(0L)
              var onReenableShuffleAction: (() -> Unit)? = null
              private var lastPopupAtMs = 0L

              fun reset() {
                  userWantsShuffle = false
                  bannerMessage = null
              }

              fun onUserExplicitShuffleToggle(newShuffleState: Boolean) {
                  lastUserToggleAtMs = SystemClock.elapsedRealtime()
                  userWantsShuffle = newShuffleState
              }

              fun onObservedShuffleState(isShuffleOn: Boolean, reenableKeepingQueue: (() -> Unit)? = null) {
                  if (reenableKeepingQueue != null) onReenableShuffleAction = reenableKeepingQueue
                  if (!VnFpsPref.shuffleGuardEnabled) {
                      userWantsShuffle = isShuffleOn
                      return
                  }
                  if (isShuffleOn) {
                      userWantsShuffle = true
                      return
                  }
                  val now = SystemClock.elapsedRealtime()
                  // If shuffle turned OFF automatically (not by a direct user tap within 1.2s)
                  if (userWantsShuffle && (now - lastUserToggleAtMs) > 1200L) {
                      (reenableKeepingQueue ?: onReenableShuffleAction)?.invoke()
                      if (now - lastPopupAtMs > 1800L) {
                          lastPopupAtMs = now
                          bannerMessage = "Η τυχαία σειρά επανενεργοποιήθηκε αυτόματα (διατηρήθηκε η ουρά σου)"
                      }
                  }
              }
          }

          fun vnPlayerInlineLyricText(rawText: String): String {
              val t = rawText.trim()
              val generic = setOf("", "στίχοι", "lyrics", "no lyrics", "δεν υπάρχουν στίχοι", "...")
              if (t.lowercase() !in generic && t.length >= 2) {
                  VnFpsPref.savedPlayerLyricText = rawText
                  return rawText
              }
              return VnFpsPref.savedPlayerLyricText.ifBlank { rawText }
          }

          @Composable
          fun vnPlayerInlineLyricText(rawText: AnnotatedString): AnnotatedString {
              val plain = rawText.text
              val t = plain.trim()
              val generic = setOf("", "στίχοι", "lyrics", "no lyrics", "δεν υπάρχουν στίχοι", "...")
              if (t.lowercase() !in generic && t.length >= 2) {
                  VnFpsPref.savedPlayerLyricText = plain
              }
              val enabled = VnFpsPref.lyricsBeautifulEnabled
              val scale = VnFpsPref.lyricsFontScale.coerceIn(0.70f, 1.70f)
              if (!enabled && abs(scale - 1.0f) < 0.01f) return rawText
              val baseUserColor = vnPlayerInlineLyricColor(Color.White)
              return buildAnnotatedString {
                  append(rawText.text)
                  rawText.spanStyles.forEach { range ->
                      val s = range.item
                      val origAlpha = if (s.color.isSpecified) s.color.alpha else 1.0f
                      val mappedColor = if (enabled) {
                          val targetAlpha = when {
                              origAlpha < 0.35f -> 0.40f
                              origAlpha < 0.85f -> 0.54f
                              else -> 1.0f
                          }
                          baseUserColor.copy(alpha = targetAlpha)
                      } else s.color
                      val mappedSize = if (s.fontSize.isSpecified && abs(scale - 1.0f) >= 0.01f) {
                          (s.fontSize.value * scale).sp
                      } else s.fontSize
                      addStyle(s.copy(color = mappedColor, fontSize = mappedSize), range.start, range.end)
                  }
                  if (enabled && rawText.spanStyles.isEmpty()) {
                      addStyle(SpanStyle(color = baseUserColor), 0, rawText.length)
                  }
              }
          }

