          @Composable
          fun vnScaleLyricTextStyle(base: TextStyle): TextStyle {
              val c = LocalContext.current
              VnFpsPref.ensureInit(c)
              val scale = VnFpsPref.lyricsFontScale.coerceIn(0.70f, 1.70f)
              val styled = if (VnFpsPref.lyricsBeautifulEnabled) {
                  base.copy(color = vnPlayerInlineLyricColor(base.color))
              } else base
              if (abs(scale - 1.0f) < 0.01f) return styled
              val baseSize = if (styled.fontSize.isSpecified) styled.fontSize else 15.sp
              val scaledSize = (baseSize.value * scale).sp
              val scaledLineHeight = if (styled.lineHeight.isSpecified) (styled.lineHeight.value * scale).sp else TextUnit.Unspecified
              return styled.copy(fontSize = scaledSize, lineHeight = scaledLineHeight)
          }

