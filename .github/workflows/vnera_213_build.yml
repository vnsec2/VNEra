name: VNEra Simple Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find and Build APK
        run: |
          # Βρίσκει αυτόματα τον φάκελο που περιέχει το αρχείο settings.gradle (εκεί που είναι το πραγματικό project)
          PROJECT_ROOT=$(dirname $(find . -maxdepth 3 -name "settings.gradle*" | head -n 1))
          echo "Το project βρέθηκε στον φάκελο: $PROJECT_ROOT"
          
          # Μπαίνει στον σωστό φάκελο, δίνει δικαιώματα στο gradlew και χτίζει το APK
          cd "$PROJECT_ROOT"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VNEra-Release-APK
          path: '**/build/outputs/apk/release/*.apk'
          retention-days: 14
