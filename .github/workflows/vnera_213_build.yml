          @Composable
          fun VnShuffleActionButton(
              isShuffled: Boolean,
              onToggleShuffle: () -> Unit,
              modifier: Modifier = Modifier,
              tint: Color = LocalContentColor.current
          ) {
              var showConfirm by remember { mutableStateOf(false) }
              IconButton(
                  onClick = {
                      if (VnFpsPref.shuffleGuardEnabled && !isShuffled) {
                          showConfirm = true
                      } else {
                          onToggleShuffle()
                      }
                  },
                  modifier = modifier
              ) {
                  Icon(
                      imageVector = Icons.Rounded.Shuffle,
                      contentDescription = "Shuffle",
                      tint = if (isShuffled) vnAccentColor() else tint
                  )
              }
              if (showConfirm) {
                  AlertDialog(
                      onDismissRequest = { showConfirm = false },
                      title = { Text("Ενεργοποίηση Shuffle;") },
                      text = { Text("Η τρέχουσα σειρά αναπαραγωγής θα ανακατευτεί.") },
                      confirmButton = {
                          TextButton(onClick = {
                              showConfirm = false
                              onToggleShuffle()
                          }) { Text("Ναι", color = vnAccentColor()) }
                      },
                      dismissButton = {
                          TextButton(onClick = { showConfirm = false }) { Text("Άκυρο") }
                      }
                  )
              }
          }
          EOF

          python3 <<'PY'
          import os, re
          from pathlib import Path

          has_sdk_37 = os.environ.get("HAS_SDK_37", "false") == "true"
          build_vcode = int(os.environ.get("BUILD_VERSION_CODE", "214001"))
          target_agp = "9.1.0" if has_sdk_37 else "8.7.2"

          # 1. Fix versions & SDK in root Gradle / TOML files
          for p in [Path("gradle/libs.versions.toml"), Path("build.gradle.kts"), Path("settings.gradle.kts")]:
              if p.exists():
                  t = p.read_text(encoding="utf-8").replace("2.4.10", "2.2.20").replace("2.4.21", "2.2.20").replace("9.4.1", target_agp)
                  if not has_sdk_37:
                      t = re.sub(r'(compileSdk|targetSdk)\s*=\s*"?37"?', r'\g<1> = "35"', t)
                  p.write_text(t, encoding="utf-8")

          if not has_sdk_37:
              for gf in Path(".").rglob("*.gradle.kts"):
                  t = gf.read_text(encoding="utf-8")
                  tn = re.sub(r'(compileSdk|targetSdk)\.set\(37\)', r'\g<1>.set(35)', re.sub(r'(compileSdk|targetSdk)\s*=\s*37', r'\g<1> = 35', t))
                  if t != tn:
                      gf.write_text(tn, encoding="utf-8")

          # 2. Ensure app_name is VNEra
          for sp in Path("app/src/main/res").rglob("strings.xml"):
              sx = sp.read_text(encoding="utf-8")
              sxn = re.sub(r'<string name="app_name"[^>]*>.*?</string>', '<string name="app_name">VNEra</string>', sx)
              if sx != sxn:
                  sp.write_text(sxn, encoding="utf-8")

          # 3. Fix app/build.gradle.kts (applicationId, versionName, versionCode, projectUrl, signingConfigs, packaging)
          gradle_file = Path("app/build.gradle.kts")
          if gradle_file.exists():
              t = gradle_file.read_text(encoding="utf-8")
              if has_sdk_37:
                  t = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 37", t)
              t = re.sub(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "app.vnera.music"', t)
              t = re.sub(r'versionName\s*=\s*".*?"', 'versionName = "2.1.4"', t)
              t = re.sub(r'versionCode\s*=\s*\d+', f'versionCode = {build_vcode}', t)

              if "projectUrl" in t and not re.search(r'\b(val|var)\s+projectUrl\b', t):
                  decl = 'val projectUrl = providers.gradleProperty("projectUrl").orElse("https://github.com/vnsec2/VNEra").get()\n\n'
                  if re.search(r'(?m)^(\s*android\s*\{)', t):
                      t = re.sub(r'(?m)^(\s*android\s*\{)', decl + r'\1', t, count=1)
                  else:
                      t = decl + t

              if "vnera-debug.keystore" not in t:
                  t += (
                      '\nandroid {\n'
                      '    signingConfigs { getByName("debug") { storeFile = file("vnera-debug.keystore"); storePassword = "android"; keyAlias = "androiddebugkey"; keyPassword = "android" } }\n'
                      '    buildTypes { getByName("debug") { signingConfig = signingConfigs.getByName("debug") } }\n'
                      '}\n'
                  )
              if "META-INF/versions/9/OSGI-INF/MANIFEST.MF" not in t:
                  t += '\nandroid { packaging { resources { excludes += "META-INF/versions/9/OSGI-INF/MANIFEST.MF"; excludes += "META-INF/versions/9/module-info.class" } } }\n'

              gradle_file.write_text(t, encoding="utf-8")

          # 4. Ensure UpdateChecker.kt constants exist if referenced
          upd = Path("app/src/main/java/com/music/spotui/data/api/UpdateChecker.kt")
          if upd.exists():
              ut = upd.read_text(encoding="utf-8")
              mc = []
              if re.search(r'(?<![.\w])UPDATE_BASE_URL\b', ut) and not re.search(r'\bval\s+UPDATE_BASE_URL\b', ut):
                  mc.append('private const val UPDATE_BASE_URL = "https://api.github.com/repos/vnsec2/VNEra"')
              if re.search(r'(?<![.\w])PROJECT_URL\b', ut) and not re.search(r'\bval\s+PROJECT_URL\b', ut):
                  mc.append('private const val PROJECT_URL = "https://github.com/vnsec2/VNEra"')
              if mc:
                  lines = ut.splitlines()
                  idx = max((i for i, l in enumerate(lines) if l.startswith("import ")), default=0)
                  lines.insert(idx + 1, "\n" + "\n".join(mc))
                  upd.write_text("\n".join(lines) + "\n", encoding="utf-8")

          src_root = Path("app/src/main/java/com/music/spotui")

          def find_matching_brace(s: str, open_idx: int) -> int:
              depth = 0
              i = open_idx
              in_str = False
              while i < len(s):
                  ch = s[i]
                  if ch == '"' and (i == 0 or s[i-1] != '\\'):
                      in_str = not in_str
                  elif not in_str:
                      if ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              return i
                  i += 1
              return -1

          def ensure_import(text: str, imp: str) -> str:
              if imp in text:
                  return text
              m = re.search(r"^package\s+[^\n]+\n", text)
              if m:
                  return text[:m.end()] + imp + "\n" + text[m.end():]
              return imp + "\n" + text

          # 5. Deduplicate Shuffle icons in PlayerControls.kt / ImmersivePlayer.kt (keep strictly 1 icon)
          for player_rel in [
              "ui/immersive/player/PlayerControls.kt",
              "ui/immersive/player/ImmersivePlayer.kt",
          ]:
              pf = src_root / player_rel
              if not pf.exists():
                  continue
              content = pf.read_text(encoding="utf-8")
              content = ensure_import(content, "import com.music.spotui.ui.screens.*")

              shuffle_blocks = []
              for m in re.finditer(r"\b(?:IconButton|VnShuffleActionButton)\s*\(", content):
                  start = m.start()
                  brace_open = content.find("{", m.end())
                  if brace_open == -1:
                      continue
                  paren_depth = 1
                  j = m.end()
                  while j < len(content) and paren_depth > 0:
                      if content[j] == "(":
                          paren_depth += 1
                      elif content[j] == ")":
                          paren_depth -= 1
                      j += 1
                  trailing_open = content.find("{", j)
                  if trailing_open != -1 and trailing_open - j < 20:
                      end = find_matching_brace(content, trailing_open)
                  else:
                      end = find_matching_brace(content, brace_open)
                  if end != -1:
                      block = content[start:end+1]
                      if re.search(r"\bShuffle\b|shuffle", block):
                          shuffle_blocks.append((start, end + 1, block))

              if len(shuffle_blocks) > 1:
                  for start, end, _ in reversed(shuffle_blocks[1:]):
                      content = content[:start] + content[end:]

              pf.write_text(content, encoding="utf-8")

          # 6. Distribute VNEra Settings into proper native categories (and remove old dump above Import/Export)
          for settings_rel in [
              "ui/screens/SettingsScreen.kt",
              "ui/immersive/pages/ImmersiveSettingsScreen.kt",
          ]:
              sf = src_root / settings_rel
              if not sf.exists():
                  continue
              stext = sf.read_text(encoding="utf-8")
              stext = ensure_import(stext, "import com.music.spotui.ui.screens.*")

              stext = re.sub(r"\n\s*Vn(?:AllSettings|ExtraSettings|CustomSettings)\w*\s*\([^)]*\)\s*\n", "\n", stext)

              category_injections = [
                  (r'("Appearance"|"Display"|"Theme"|"Εμφάνιση"|R\.string\.appearance|R\.string\.display|R\.string\.theme)', "VnDisplayCategorySettings()"),
                  (r'("Playback"|"Audio"|"Player"|"Αναπαραγωγή"|R\.string\.playback|R\.string\.audio)', "VnPlaybackCategorySettings()"),
                  (r'("Lyrics"|"Karaoke"|"Στίχοι"|R\.string\.lyrics)', "VnLyricsCategorySettings()"),
              ]

              for pat, call_code in category_injections:
                  if call_code in stext:
                      continue
                  m = re.search(pat, stext, flags=re.IGNORECASE)
                  if m:
                      brace_after = stext.find("{", m.end())
                      if brace_after != -1 and brace_after - m.end() < 300:
                          close_idx = find_matching_brace(stext, brace_after)
                          if close_idx != -1:
                              stext = stext[:close_idx+1] + f"\n        {call_code}\n" + stext[close_idx+1:]
                              continue
                      line_end = stext.find("\n", m.end())
                      if line_end != -1:
                          stext = stext[:line_end+1] + f"        {call_code}\n" + stext[line_end+1:]

              sf.write_text(stext, encoding="utf-8")

          # 7. Fix Karaoke / Lyrics color & font scale in Player Lyrics composables
          for kt in src_root.rglob("*.kt"):
              if not re.search(r"lyric|karaoke|player", kt.name, flags=re.IGNORECASE):
                  continue
              ktxt = kt.read_text(encoding="utf-8")
              orig = ktxt
              if "Color.White" in ktxt and re.search(r"lyric|karaoke|line|verse", ktxt, flags=re.IGNORECASE):
                  ktxt = ensure_import(ktxt, "import com.music.spotui.ui.screens.*")
                  ktxt = ensure_import(ktxt, "import androidx.compose.ui.graphics.Shadow")
                  ktxt = ensure_import(ktxt, "import androidx.compose.ui.geometry.Offset")
                  ktxt = re.sub(
                      r"\bColor\.White\.copy\(\s*alpha\s*=\s*([0-9.]+f?)\s*\)",
                      r"vnResolvedLyricsColor(Color.White).copy(alpha = \1)",
                      ktxt
                  )
                  ktxt = re.sub(
                      r"(color\s*=\s*)Color\.White\b",
                      r"\1vnResolvedLyricsColor(Color.White)",
                      ktxt
                  )
                  if "lyricsFontScale" not in ktxt:
                      ktxt = re.sub(
                          r"(fontSize\s*=\s*)(\d+(?:\.\d+)?\.sp)",
                          r"\1(\2 * VnFpsPref.lyricsFontScale)",
                          ktxt
                      )
              if ktxt != orig:
                  kt.write_text(ktxt, encoding="utf-8")
          PY

