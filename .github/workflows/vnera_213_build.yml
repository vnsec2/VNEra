          tailrec fun Context.findActivity(): Activity? = when (this) {
              is Activity -> this
              is ContextWrapper -> baseContext.findActivity()
              else -> null
          }

          @Suppress("DEPRECATION")
          private fun Activity.currentDisplay(): Display? =
              if (Build.VERSION.SDK_INT >= 30) display ?: windowManager?.defaultDisplay else windowManager?.defaultDisplay

          fun getSupportedRefreshRates(act: Activity): List<Int> {
              val d = act.currentDisplay() ?: return listOf(60, 120)
              val m = d.mode
              return d.supportedModes
                  .filter { it.physicalWidth == m.physicalWidth && it.physicalHeight == m.physicalHeight }
                  .map { it.refreshRate.roundToInt() }
                  .distinct()
                  .sorted()
          }

          fun applyWindowFrameRate(act: Activity, targetFps: Int, forceReset: Boolean = false) {
              val w = act.window ?: return
              val d = act.currentDisplay() ?: return
              val m = d.mode
              val modes = d.supportedModes.filter { it.physicalWidth == m.physicalWidth && it.physicalHeight == m.physicalHeight }
              val hz = if (targetFps <= 0) modes.maxOfOrNull { it.refreshRate } ?: m.refreshRate else targetFps.toFloat()
              val best = modes.minByOrNull { abs(it.refreshRate - hz) }
              if (forceReset) w.attributes = w.attributes.apply { preferredDisplayModeId = 0; preferredRefreshRate = 0f }
              w.attributes = w.attributes.apply {
                  preferredDisplayModeId = if (best != null && abs(best.refreshRate - hz) <= 2f) best.modeId else 0
                  preferredRefreshRate = hz
              }
              if (Build.VERSION.SDK_INT >= 35) {
                  runCatching {
                      View::class.java.getMethod("setRequestedFrameRate", Float::class.javaPrimitiveType)
                          .invoke(w.decorView, hz)
                  }
              }
              w.decorView.postInvalidateOnAnimation()
          }

          fun Modifier.vnAnimatedElement(phaseIndex: Int = 0): Modifier = composed {
              val c = LocalContext.current
              VnFpsPref.ensureInit(c)
              if (!VnFpsPref.elementAnimEnabled) return@composed this

              val mode = VnFpsPref.elementAnimMode
              val shouldPause = VnFpsPref.elementAnimPauseOnPause && !VnFpsPref.isPlaybackPlaying
              var elapsedSec by remember { mutableFloatStateOf((phaseIndex % 8) * 0.55f) }

              LaunchedEffect(VnFpsPref.elementAnimEnabled, shouldPause, mode) {
                  if (shouldPause) return@LaunchedEffect
                  var lastNanos = 0L
                  while (true) {
                      withFrameNanos { now ->
                          if (!VnFpsPref.elementAnimPauseOnPause || VnFpsPref.isPlaybackPlaying) {
                              if (lastNanos != 0L) {
                                  val dt = ((now - lastNanos) / 1_000_000_000f).coerceIn(0f, 0.05f)
                                  elapsedSec += dt
                              }
                          }
                          lastNanos = now
                      }
                  }
              }

              val period = when (mode) {
                  1 -> 4.8f
                  2 -> 4.2f
                  else -> 5.2f
              }
              val angle = (elapsedSec / period) * (2f * PI.toFloat())
              val wave = sin(angle)
              val wave2 = cos(angle * 0.9f)
              val scale = 0.988f + 0.018f * wave2

              graphicsLayer {
                  val maxTx = (size.width * 0.025f).coerceIn(1.5.dp.toPx(), 5.0.dp.toPx())
                  val maxTy = (size.height * 0.025f).coerceIn(1.5.dp.toPx(), 5.0.dp.toPx())
                  scaleX = scale
                  scaleY = scale
                  when (mode) {
                      1 -> {
                          translationY = wave * maxTy
                      }
                      2 -> {
                          translationX = wave * maxTx
                          translationY = -wave2 * maxTy
                          rotationZ = wave * 1.25f
                      }
                      else -> {
                          translationY = wave * maxTy
                          rotationY = wave * 3.4f
                          rotationX = -wave2 * 2.1f
                          cameraDistance = 16f * density
                      }
                  }
              }
          }

