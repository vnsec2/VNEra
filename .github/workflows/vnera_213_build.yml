          # 11. Σύνδεση VnPlaybackMonitor με τον πραγματικό ExoPlayer (PlaybackService.kt) + UI ποιότητας
          pb_service = Path("host-android/src/main/kotlin/app/myspoti/host/android/PlaybackService.kt")
          if pb_service.exists():
              pbt = pb_service.read_text()
              if "vnReportAudioFormat" not in pbt:
                  helper_code = '''
          private fun vnReportAudioFormat(p: androidx.media3.common.Player?) {
              if (p == null) return
              try {
                  val item = p.currentMediaItem ?: return
                  val trackId = item.mediaId.ifBlank { item.localConfiguration?.uri?.toString().orEmpty() }
                  val meta = item.mediaMetadata
                  val title = meta.title?.toString().orEmpty()
                  val extras = meta.extras
                  var srcName = ""
                  var declQuality = ""
                  if (extras != null) {
                      for (k in extras.keySet()) {
                          val kl = k.lowercase()
                          val v = extras.get(k)?.toString().orEmpty()
                          if (v.isBlank()) continue
                          if (srcName.isEmpty() && (kl.contains("source") || kl.contains("provider") || kl.contains("ext"))) {
                              srcName = v
                          }
                          if (declQuality.isEmpty() && (kl.contains("quality") || kl.contains("format") || kl.contains("badge"))) {
                              declQuality = v
                          }
                      }
                  }
                  val fmt = p.audioFormat
                  val sampleRate = fmt?.sampleRate ?: 0
                  val bitrateKbps = if ((fmt?.bitrate ?: 0) > 0) (fmt!!.bitrate / 1000) else 0
                  val mime = fmt?.sampleMimeType.orEmpty()
                  val codecs = fmt?.codecs.orEmpty()
                  val bitDepth = when (fmt?.pcmEncoding) {
                      androidx.media3.common.C.ENCODING_PCM_24BIT,
                      androidx.media3.common.C.ENCODING_PCM_24BIT_PACKED -> 24
                      androidx.media3.common.C.ENCODING_PCM_32BIT,
                      androidx.media3.common.C.ENCODING_PCM_FLOAT -> 32
                      androidx.media3.common.C.ENCODING_PCM_16BIT -> 16
                      else -> 0
                  }
                  val cls = Class.forName("com.music.spotui.ui.screens.VnPlaybackMonitor")
                  val inst = cls.getField("INSTANCE").get(null)
                  val m = cls.getMethod(
                      "onServiceAudioObserved",
                      android.content.Context::class.java,
                      String::class.java,
                      String::class.java,
                      String::class.java,
                      String::class.java,
                      String::class.java,
                      String::class.java,
                      Int::class.javaPrimitiveType,
                      Int::class.javaPrimitiveType,
                      Int::class.javaPrimitiveType,
                  )
                  m.invoke(inst, applicationContext, trackId, title, srcName, declQuality, mime, codecs, sampleRate, bitDepth, bitrateKbps)
              } catch (_: Throwable) {
              }
          }
          '''
                  # Εύρεση του player instance στο PlaybackService.kt και σύνδεση listener
                  m_player = re.search(r'\b(private\s+|internal\s+)?(?:lateinit\s+)?var\s+([A-Za-z0-9_]+)\s*:\s*(?:ExoPlayer|Player)\??', pbt)
                  if not m_player:
                      m_player = re.search(r'\b(private\s+|internal\s+)?val\s+([A-Za-z0-9_]+)\s*(?::\s*(?:ExoPlayer|Player)\??)?\s*=\s*(?:ExoPlayer\.Builder|buildPlayer)', pbt)
                  if m_player:
                      p_var = m_player.group(2)
                      # Προσθήκη listener αμέσως μετά το πρώτο .addListener( ή build()
                      pbt_new, n_pb = re.subn(
                          rf'(\b{re.escape(p_var)}\s*\.addListener\s*\([^)]+\))',
                          rf'\1\n        {p_var}.addListener(object : androidx.media3.common.Player.Listener {{\n            override fun onTracksChanged(tracks: androidx.media3.common.Tracks) {{ vnReportAudioFormat({p_var}) }}\n            override fun onMediaItemTransition(mediaItem: androidx.media3.common.MediaItem?, reason: Int) {{ vnReportAudioFormat({p_var}) }}\n            override fun onIsPlayingChanged(isPlaying: Boolean) {{ if (isPlaying) vnReportAudioFormat({p_var}) }}\n        }})',
                          pbt,
                          count=1,
                      )
                      if n_pb > 0:
                          last_brace = pbt_new.rfind("}")
                          if last_brace != -1:
                              pbt_new = pbt_new[:last_brace] + helper_code + "\n}\n"
                              pb_service.write_text(pbt_new)
                              print(f"Hooked real AudioFormat monitor (16/24-bit & kHz) into PlaybackService.kt ({p_var})")

          # Σύνδεση και στο UI όπου εμφανίζεται η δηλωμένη ποιότητα (16-bit / 24-bit / kHz / Lossless / Hi-Res / FLAC)
          for scan_file in sorted(Path("app/src/main/java/com/music/spotui").rglob("*.kt")):
              if scan_file.name == "VnFrameRateManager.kt":
                  continue
              ft = scan_file.read_text()
              if "onUiTrackObserved" in ft:
                  continue
              if any(tok in ft for tok in ['"Lossless"', '"Hi-Res"', '"24-bit"', '"16-bit"', '"FLAC"', 'kHz']) and "LocalContext.current" in ft and "@Composable" in ft:
                  lines = ft.splitlines(keepends=True)
                  for idx, l in enumerate(lines):
                      if any(tok in l for tok in ['"Lossless"', '"Hi-Res"', '"24-bit"', '"16-bit"', '"FLAC"', 'kHz']):
                          window_txt = "".join(lines[max(0, idx - 30):min(len(lines), idx + 15)])
                          m_ctx = re.search(r'\bval\s+([A-Za-z0-9_]+)\s*=\s*LocalContext\.current\b', window_txt)
                          m_q = re.search(r'\bval\s+([A-Za-z0-9_]*(?:quality|Quality|format|Format|badge|Badge|audioInfo|streamInfo)[A-Za-z0-9_]*)\b', window_txt)
                          m_t = re.search(r'\b([A-Za-z0-9_]+)\.(?:title|name)\b', window_txt)
                          m_s = re.search(r'\b([A-Za-z0-9_]+)\.(?:source|provider|extension|sourceName|providerName)\b', window_txt)
                          if m_ctx and m_q and m_t:
                              ctx_n = m_ctx.group(1)
                              q_n = m_q.group(1)
                              t_obj = m_t.group(1)
                              s_expr = f"{m_s.group(1)}.source?.toString().orEmpty()" if m_s else '""'
                              for k in range(max(0, idx - 30), idx + 1):
                                  if re.search(rf'\bval\s+{re.escape(q_n)}\b', lines[k]) and "=" in lines[k]:
                                      indent = re.match(r'^(\s*)', lines[k]).group(1)
                                      lines.insert(
                                          k + 1,
                                          f'{indent}androidx.compose.runtime.LaunchedEffect({t_obj}?.id, {q_n}) {{ com.music.spotui.ui.screens.VnPlaybackMonitor.onUiTrackObserved({ctx_n}, {t_obj}?.id?.toString().orEmpty(), {t_obj}?.title?.toString().orEmpty(), {s_expr}, {q_n}?.toString().orEmpty()) }}\n',
                                      )
                                      scan_file.write_text("".join(lines))
                                      print(f"Hooked UI declared-quality bridge into {scan_file}")
                                      break
                          break

          # 12. Βελτίωση VnSettingsBackup.kt (Full Export/Restore + κουμπί Αντιγραφής Extensions στο Column)
          backup_file = Path("app/src/main/java/com/music/spotui/ui/screens/VnSettingsBackup.kt")
          if backup_file.exists():
              bt = backup_file.read_text()
              bt_mod = bt

              ctx_var = "context"
              for cand in ["context", "ctx", "localContext", "appContext"]:
                  if re.search(rf'\b{cand}\b', bt_mod):
                      ctx_var = cand
                      break

              if "onBackupImported" not in bt_mod:
                  bt_mod = re.sub(
                      r'\bJSONObject\(\s*([A-Za-z0-9_]+)\s*\)',
                      rf'JSONObject(com.music.spotui.ui.screens.VnFpsPref.onBackupImported({ctx_var}, \1))',
                      bt_mod,
                      count=1,
                  )

              if "enrichBackupJson" not in bt_mod:
                  bt_mod = re.sub(
                      r'\b([A-Za-z0-9_]+\.toString\(\s*(?:2|4)?\s*\))',
                      rf'com.music.spotui.ui.screens.VnFpsPref.enrichBackupJson({ctx_var}, \1)',
                      bt_mod,
                      count=1,
                  )

              if "VnCopyBackupExtensionsButton" not in bt_mod:
                  lines = bt_mod.splitlines(keepends=True)
                  comp_start = next((idx for idx, l in enumerate(lines) if "@Composable" in l), None)
                  if comp_start is not None:
                      col_start = next(
                          (idx for idx in range(comp_start, len(lines)) if re.search(r'\bColumn\b', lines[idx])),
                          None,
                      )
                      if col_start is not None:
                          depth = 0
                          opened = False
                          for idx in range(col_start, len(lines)):
                              depth += lines[idx].count("{") - lines[idx].count("}")
                              if "{" in lines[idx]:
                                  opened = True
                              if opened and depth <= 0:
                                  indent = re.match(r'^(\s*)', lines[idx]).group(1) + "    "
                                  lines.insert(
                                      idx,
                                      f"{indent}com.music.spotui.ui.screens.VnCopyBackupExtensionsButton()\n",
                                  )
                                  bt_mod = "".join(lines)
                                  print(f"Hooked VnCopyBackupExtensionsButton into VnSettingsBackup.kt at line {idx + 1}")
                                  break

              if bt_mod != bt:
                  backup_file.write_text(bt_mod)

          # 13. Σύνδεση VnFpsSelectorCard πάνω από το VnSettingsBackup σε όλα τα UI αρχεία που το καλούν
          for ui_file in sorted(Path("app/src/main/java/com/music/spotui/ui").rglob("*.kt")):
              if ui_file.name in ("VnSettingsBackup.kt", "VnFrameRateManager.kt"):
                  continue
              st = ui_file.read_text()
              if "VnFpsSelectorCard" in st:
                  continue
              lines = st.splitlines(keepends=True)
              changed = False
              for i, line in enumerate(lines):
                  stripped = line.lstrip()
                  indent = line[:len(line) - len(stripped)]
                  if stripped.startswith(("import ", "package ", "//", "/*", "*", "fun ", "object ", "class ")):
                      continue
                  if re.match(r'^item\b.*\{.*\bVn(?:Settings)?Backup\w*', stripped):
                      lines.insert(i, f"{indent}item {{ com.music.spotui.ui.screens.VnFpsSelectorCard() }}\n")
                      changed = True
                      break
                  if re.match(r'^(?:com\.music\.spotui\.ui\.screens\.)?Vn(?:Settings)?Backup(?:\.[A-Za-z0-9_]+|\w*)\s*\(', stripped):
                      lines.insert(i, f"{indent}com.music.spotui.ui.screens.VnFpsSelectorCard()\n")
                      changed = True
                      break
              if changed:
                  ui_file.write_text("".join(lines))
                  print(f"Hooked VnFpsSelectorCard into {ui_file}")

          guard_hooked = False
          for act_path in sorted(Path("app/src/main/java").rglob("*Activity.kt")):
              at = act_path.read_text()
              if "setContent" in at and "VnFrameRateGuard" not in at:
                  at_new, n = re.subn(
                      r'(?m)^([ \t]*)(setContent(?:\([^)]*\))?\s*\{)\s*$',
                      r'\1\2\n\1    com.music.spotui.ui.screens.VnFrameRateGuard()',
                      at,
                      count=1,
                  )
                  if n > 0:
                      act_path.write_text(at_new)
                      print(f"Hooked VnFrameRateGuard into {act_path}")
                      guard_hooked = True
                      break

          if not guard_hooked and p2.exists():
              it = p2.read_text()
              if "VnFrameRateGuard" not in it:
                  it_new, n = re.subn(
                      r'(?m)^([ \t]*fun\s+ImmersivePlayer\b[^{]*\{)\s*$',
                      r'\1\n    com.music.spotui.ui.screens.VnFrameRateGuard()',
                      it,
                      count=1,
                  )
                  if n > 0:
                      p2.write_text(it_new)
                      print("Hooked VnFrameRateGuard into ImmersivePlayer.kt")
          PY

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VNEra-2.1.4-debug-apk
          path: app/build/outputs/apk/debug/*.apk
