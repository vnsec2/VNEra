          def strip_comments_and_strings(lines: list[str]) -> list[str]:
              clean = []
              in_bc = False
              for raw in lines:
                  s = raw
                  if in_bc:
                      end_bc = s.find("*/")
                      if end_bc == -1:
                          clean.append("")
                          continue
                      s = s[end_bc + 2:]
                      in_bc = False
                  while "/*" in s:
                      st_bc = s.find("/*")
                      en_bc = s.find("*/", st_bc + 2)
                      if en_bc != -1:
                          s = s[:st_bc] + " " + s[en_bc + 2:]
                      else:
                          s = s[:st_bc]
                          in_bc = True
                          break
                  s = s.split("//")[0]
                  s = re.sub(r'"(?:\\.|[^"\\])*"', '""', s)
                  s = re.sub(r"'(?:\\.|[^'\\])'", "''", s)
                  clean.append(s)
              return clean

          def extract_layout_containers(lines: list[str]) -> list[dict]:
              n = len(lines)
              clean = strip_comments_and_strings(lines)
              containers: list[dict] = []

              fun_spans: list[tuple[int, int, str]] = []
              i = 0
              while i < n:
                  m_fun = re.search(r'\bfun\s+(?:<[^>]+>\s*)?(?:[A-Za-z0-9_.]+\.)?([A-Za-z0-9_]+)\s*\(', clean[i])
                  if not m_fun:
                      i += 1
                      continue
                  fun_name = m_fun.group(1)
                  p_depth = 0
                  saw_p = False
                  body_line = None
                  is_expr = False
                  for li in range(i, n):
                      for ch in clean[li]:
                          if not saw_p:
                              if ch == '(':
                                  saw_p = True
                                  p_depth = 1
                              continue
                          if p_depth > 0:
                              if ch == '(': p_depth += 1
                              elif ch == ')': p_depth -= 1
                          else:
                              if ch == '=': is_expr = True; break
                              if ch == '{': body_line = li; break
                      if is_expr or body_line is not None:
                          break
                  if is_expr or body_line is None:
                      i += 1
                      continue
                  b_depth = 0
                  end_line = body_line
                  for li in range(body_line, n):
                      b_depth += clean[li].count('{') - clean[li].count('}')
                      if b_depth <= 0:
                          end_line = li
                          break
                  fun_spans.append((i, end_line, fun_name))
                  i = end_line + 1

              def enclosing_fun(line_idx: int) -> tuple[str, int, int]:
                  best = ("", 0, n - 1)
                  for fs, fe, fn in fun_spans:
                      if fs <= line_idx <= fe:
                          best = (fn, fs, fe)
                  return best

              block_nodes: list[dict] = []
              for start_li in range(n):
                  for m_call in re.finditer(r'(?<![.\w])([A-Z][A-Za-z0-9_]*)\b', clean[start_li]):
                      kind = m_call.group(1)
                      call_col = m_call.end(1)
                      p_depth = 0
                      in_parens = False
                      header_end_li = start_li
                      open_brace_li = None
                      open_brace_col = None

                      for li in range(start_li, min(n, start_li + 30)):
                          s = clean[li]
                          c0 = call_col if li == start_li else 0
                          for ci in range(c0, len(s)):
                              ch = s[ci]
                              if in_parens:
                                  if ch == '(': p_depth += 1
                                  elif ch == ')':
                                      p_depth -= 1
                                      if p_depth == 0:
                                          in_parens = False
                                          header_end_li = li
                                  continue
                              if ch.isspace():
                                  continue
                              if ch == '(' and open_brace_li is None:
                                  in_parens = True
                                  p_depth = 1
                                  continue
                              if ch == '{':
                                  open_brace_li = li
                                  open_brace_col = ci
                                  break
                              open_brace_li = -1
                              break
                          if open_brace_li is not None:
                              break

                      if open_brace_li is None or open_brace_li < 0:
                          continue

                      b_depth = 0
                      close_brace_li = None
                      lazy_items: list[tuple[int, int, str]] = []
                      cur_item_start: int | None = None
                      cur_item_indent: str = ""
                      p_inner = 0
                      last_word = ""
                      last_word_li = open_brace_li

                      for li in range(open_brace_li, n):
                          s = clean[li]
                          c0 = open_brace_col if li == open_brace_li else 0
                          idx_c = c0
                          L = len(s)
                          while idx_c < L:
                              ch = s[idx_c]
                              if ch.isalpha() or ch == '_':
                                  j_c = idx_c + 1
                                  while j_c < L and (s[j_c].isalnum() or s[j_c] == '_'):
                                      j_c += 1
                                  if b_depth == 1 and p_inner == 0:
                                      last_word = s[idx_c:j_c]
                                      last_word_li = li
                                  idx_c = j_c
                                  continue
                              if ch == '(':
                                  if b_depth >= 1:
                                      p_inner += 1
                              elif ch == ')':
                                  if b_depth >= 1:
                                      p_inner = max(0, p_inner - 1)
                              elif ch == '{':
                                  if b_depth == 1 and p_inner == 0 and kind == "LazyColumn" and last_word in LAZY_ITEM_CALLS:
                                      cur_item_start = last_word_li
                                      cur_item_indent = re.match(r'^(\s*)', lines[last_word_li]).group(1)
                                  b_depth += 1
                                  if b_depth == 1:
                                      last_word = ""
                              elif ch == '}':
                                  b_depth -= 1
                                  if b_depth == 1 and cur_item_start is not None:
                                      lazy_items.append((cur_item_start, li, cur_item_indent))
                                      cur_item_start = None
                                  if b_depth == 0:
                                      close_brace_li = li
                                      break
                              idx_c += 1
                          if close_brace_li is not None:
                              break

                      if close_brace_li is None or close_brace_li <= open_brace_li:
                          continue

                      header_txt = "".join(clean[start_li:header_end_li + 1])
                      block_nodes.append({
                          "kind": kind,
                          "start_li": start_li,
                          "header_end_li": header_end_li,
                          "open_li": open_brace_li,
                          "close_li": close_brace_li,
                          "has_vscroll": "verticalScroll" in header_txt,
                          "base_indent": re.match(r'^(\s*)', lines[start_li]).group(1),
                          "lazy_items": lazy_items,
                      })

              for node in block_nodes:
                  if node["kind"] not in ("LazyColumn", "Column"):
                      continue
                  fn_name, fn_s, fn_e = enclosing_fun(node["start_li"])
                  ancestors = [
                      other for other in block_nodes
                      if other is not node
                      and other["start_li"] >= fn_s
                      and other["close_li"] <= fn_e
                      and other["start_li"] <= node["start_li"]
                      and other["close_li"] >= node["close_li"]
                  ]
                  descendants = [
                      other for other in block_nodes
                      if other is not node
                      and other["start_li"] > node["start_li"]
                      and other["close_li"] < node["close_li"]
                  ]
                  if node["kind"] == "Column":
                      if any(a["kind"] in INLINE_ITEM_PARENTS for a in ancestors):
                          continue
                      if any(d["kind"] in WRAPPER_CHILDREN for d in descendants):
                          continue
                  has_scroll_ancestor = any(a["kind"] == "LazyColumn" or a["has_vscroll"] for a in ancestors)
                  node["fun_name"] = fn_name
                  node["has_scroll_ancestor"] = has_scroll_ancestor
                  node["is_scrollable"] = (node["kind"] == "LazyColumn") or node["has_vscroll"] or has_scroll_ancestor
                  containers.append(node)

              return containers

          def insert_into_container(lines: list[str], cont: dict, comp_call: str, before_backup: bool = False) -> list[str]:
              new_lines = list(lines)
              if cont["kind"] == "LazyColumn":
                  items = cont["lazy_items"]
                  if before_backup and items:
                      backup_item = next(((s, e, ind) for (s, e, ind) in items if "VnSettingsBackup" in "".join(new_lines[s:e+1])), None)
                      if backup_item is not None:
                          s_idx, _, item_ind = backup_item
                          new_lines.insert(s_idx, f"{item_ind}item {{ {comp_call} }}\n")
                          return new_lines
                  if items:
                      _, last_end, item_ind = items[-1]
                      new_lines.insert(last_end + 1, f"{item_ind}item {{ {comp_call} }}\n")
                      return new_lines
                  child_ind = cont["base_indent"] + "    "
                  new_lines.insert(cont["close_li"], f"{child_ind}item {{ {comp_call} }}\n")
                  return new_lines
              else:
                  if before_backup:
                      for li in range(cont["open_li"] + 1, cont["close_li"]):
                          if "VnSettingsBackup(" in new_lines[li]:
                              ind = re.match(r'^(\s*)', new_lines[li]).group(1)
                              new_lines.insert(li, f"{ind}{comp_call}\n")
                              return new_lines
                  child_ind = cont["base_indent"] + "    "
                  new_lines.insert(cont["close_li"], f"{child_ind}{comp_call}\n")
                  return new_lines

          ui_kt_files = [
              p for p in sorted(Path("app/src/main/java").rglob("*.kt"))
              if p.name not in ("VnFrameRateManager.kt", "VnSettingsBackup.kt")
          ]

          def file_priority(p: Path) -> tuple[int, str]:
              if p.name == "SettingsScreen.kt":
                  return (0, str(p))
              if p.name == "ImmersiveSettingsScreen.kt":
                  return (1, str(p))
              if "Setting" in p.name:
                  return (2, str(p))
              return (3, str(p))

          ui_kt_files.sort(key=file_priority)

          placed_standard: set[str] = set()
          placed_immersive: set[str] = set()

          for kt_file in ui_kt_files:
              is_imm_file = "immersive" in str(kt_file).lower()
              placed_set = placed_immersive if is_imm_file else placed_standard

              for cat_name, marker, anchor_rx, comp_call in cat_configs:
                  if cat_name in placed_set:
                      continue
                  src_text = kt_file.read_text()
                  if marker in src_text:
                      placed_set.add(cat_name)
                      continue
                  lines = src_text.splitlines(keepends=True)
                  containers = extract_layout_containers(lines)
                  if not containers:
                      continue

                  best_cont = None
                  best_score = 0
                  for cont in containers:
                      is_settings_subfn = bool(re.search(r'(?:Settings|Section|Tab|Page|Content)', cont["fun_name"], re.I))
                      if not cont["is_scrollable"] and not is_settings_subfn and not re.search(cat_name, cont["fun_name"], re.I):
                          continue
                      body_txt = "".join(lines[cont["start_li"]:cont["close_li"] + 1])
                      is_root_menu = (
                          bool(re.search(r'(?:Λογαριασμοί|Accounts)', body_txt, re.I)) and
                          bool(re.search(r'(?:Αποθηκευτικός χώρος|Storage)', body_txt, re.I)) and
                          bool(re.search(r'(?:Εφαρμογή|App)', body_txt, re.I))
                      )
                      if is_root_menu:
                          continue
                      score = 0
                      if re.search(cat_name, cont["fun_name"], re.I):
                          score += 20
                      hits = len(re.findall(anchor_rx, body_txt, re.I))
                      if hits > 0:
                          score += hits * 10
                      if cont["kind"] == "LazyColumn":
                          score += 4
                      elif cont["has_vscroll"]:
                          score += 2
                      if score > best_score:
                          best_score = score
                          best_cont = cont

                  if best_cont is not None and best_score >= 10:
                      updated_lines = insert_into_container(lines, best_cont, comp_call, before_backup=False)
                      kt_file.write_text("".join(updated_lines))
                      placed_set.add(cat_name)
                      print(f"Placed {marker} inside {kt_file}:{best_cont['fun_name']} ({best_cont['kind']}, score={best_score})")

          for mode_name, placed_set, is_imm_target in [("standard", placed_standard, False), ("immersive", placed_immersive, True)]:
              missing = [cfg for cfg in cat_configs if cfg[0] not in placed_set]
              if not missing:
                  continue
              for kt_file in ui_kt_files:
                  if ("immersive" in str(kt_file).lower()) != is_imm_target:
                      continue
                  if "setting" not in kt_file.name.lower():
                      continue
                  src_text = kt_file.read_text()
                  lines = src_text.splitlines(keepends=True)
                  containers = extract_layout_containers(lines)
                  fallback_cont = None
                  for cont in containers:
                      if not cont["is_scrollable"]:
                          continue
                      body_txt = "".join(lines[cont["start_li"]:cont["close_li"] + 1])
                      if re.search(app_fallback_rx, body_txt, re.I) or re.search(r'(?:AppSettings|ApplicationSettings|BackupSettings|GeneralSettings)', cont["fun_name"], re.I):
                          fallback_cont = cont
                          break
                  if fallback_cont is None:
                      fallback_cont = next((c for c in containers if c["is_scrollable"]), None)
                  if fallback_cont is not None:
                      for cat_name, marker, _, comp_call in missing:
                          if marker not in "".join(lines):
                              lines = insert_into_container(lines, fallback_cont, comp_call, before_backup=True)
                              containers = extract_layout_containers(lines)
                              fallback_cont = next((c for c in containers if c["fun_name"] == fallback_cont["fun_name"] and c["is_scrollable"]), fallback_cont)
                              placed_set.add(cat_name)
                              print(f"Fallback placed {marker} into {kt_file}:{fallback_cont['fun_name']}")
                      kt_file.write_text("".join(lines))
                      break

          ext_placed = 0
          for kt_file in ui_kt_files:
              s_ext = kt_file.read_text()
              if "VnCopyBackupExtensionsButton" in s_ext or "VnSettingsBackup" not in s_ext:
                  continue
              lines = s_ext.splitlines(keepends=True)
              containers = extract_layout_containers(lines)
              target_c = next((c for c in containers if c["is_scrollable"] and "VnSettingsBackup" in "".join(lines[c["start_li"]:c["close_li"] + 1])), None)
              if target_c is not None:
                  lines = insert_into_container(lines, target_c, "com.music.spotui.ui.screens.VnCopyBackupExtensionsButton()", before_backup=False)
                  kt_file.write_text("".join(lines))
                  ext_placed += 1
                  print(f"Placed VnCopyBackupExtensionsButton cleanly in {kt_file}:{target_c['fun_name']}")
              else:
                  s_ext_new, n_sub = re.subn(
                      r'(?m)^([ \t]*)(item\s*\{\s*)?(?:com\.music\.spotui\.ui\.screens\.)?VnSettingsBackup\s*\(\s*\)\s*(\})?',
                      lambda m: f"{m.group(0)}\n{m.group(1)}{m.group(2) or ''}com.music.spotui.ui.screens.VnCopyBackupExtensionsButton(){' }' if m.group(2) else ''}",
                      s_ext,
                      count=1
                  )
                  if n_sub > 0:
                      kt_file.write_text(s_ext_new)
                      ext_placed += 1

          for kt_file in Path("app/src/main/java").rglob("*.kt"):
              if kt_file.name == "VnFrameRateManager.kt": continue
              s = kt_file.read_text()
              if "VnFrameRateGuard" in s: continue
              lines = s.splitlines(keepends=True)
              for idx, line in enumerate(lines):
                  if re.search(r'\bsetContent\s*\{', line):
                      lines[idx] = re.sub(r'(\bsetContent\s*\{)', r'\1 com.music.spotui.ui.screens.VnFrameRateGuard();', line, count=1)
                      kt_file.write_text("".join(lines))
                      break

          for sb in Path("app/src/main/java").rglob("VnSettingsBackup.kt"):
              t = sb.read_text()
              if "onBackupImported" not in t:
                  t = re.sub(r'([A-Za-z0-9_]+\.readText\s*\(\s*\))', r'com.music.spotui.ui.screens.VnFpsPref.onBackupImported(context, \1)', t, count=1)
                  t = re.sub(r'(\.write\s*\(\s*)([A-Za-z0-9_]+)(\.toByteArray)', r'\1com.music.spotui.ui.screens.VnFpsPref.enrichBackupJson(context, \2)\3', t, count=1)
                  sb.write_text(t)
          def apply_animations_in_composables(src: str) -> str:
              if "vnAnimatedElement" in src or "@Composable" not in src:
                  return src
              lines = src.splitlines(keepends=True)
              clean = strip_comments_and_strings(lines)
              in_comp = False
              comp_pending = False
              b_depth = 0
              counter = 0

              def _anim_repl(m):
                  nonlocal counter
                  counter += 1
                  return f"{m.group(0)}.vnAnimatedElement({counter})"

              for idx, raw_l in enumerate(lines):
                  cl = clean[idx]
                  if "@Composable" in cl:
                      comp_pending = True
                  if comp_pending and re.search(r'\bfun\s+', cl):
                      in_comp = True
                      comp_pending = False
                      b_depth = 0
                  if in_comp:
                      b_depth += cl.count('{') - cl.count('}')
                      if b_depth <= 0 and idx > 0 and '{' not in cl and '}' in cl:
                          in_comp = False
                          continue
                      if "vnAnimatedElement" not in raw_l and "VnPlayerInlineLyricsBar" not in raw_l:
                          new_l, n = re.subn(
                              r'\bModifier\s*\.\s*(fillMaxWidth\s*\(\s*\)|clip\s*\((?:[^()]+|\([^()]*\))+\))',
                              _anim_repl,
                              raw_l,
                              count=1
                          )
                          if n > 0:
                              lines[idx] = new_l
              if counter > 0:
                  return ensure_imports("".join(lines), ["com.music.spotui.ui.screens.vnAnimatedElement"])
              return src

          for target_name in [
              "SettingsScreen.kt",
              "ImmersiveSettingsScreen.kt",
              "PlayerControls.kt",
              "ImmersivePlayer.kt",
              "PlayerScreen.kt",
              "MiniPlayer.kt",
          ]:
              ap = next(Path("app/src/main/java").rglob(target_name), None)
              if ap is not None and ap.exists():
                  orig_a = ap.read_text()
                  new_a = apply_animations_in_composables(orig_a)
                  if new_a != orig_a:
                      ap.write_text(new_a)
                      print(f"Applied vnAnimatedElement in {ap}")
          PY

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          EXTRA_FLAGS=""
          [ "$HAS_SDK_37" != "true" ] && EXTRA_FLAGS="-Pandroid.suppressUnsupportedCompileSdk=37"
          ./gradlew :app:assembleDebug $EXTRA_FLAGS -PappVersionName="2.1.5" -PappVersionCode="$BUILD_VERSION_CODE" -Pabis=arm64-v8a -PupdateRepo=vnsec2/VNEra --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VNEra-2.1.5-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
