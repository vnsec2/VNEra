name: Build VNEra 2.1.4 APK (Revera 1.0.8 Base)

on:
  workflow_dispatch:
  push:
    branches: [main, work/source-review]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main for Persistent Signing Key
        uses: actions/checkout@v4
        with:
          ref: main
          path: _keystore_repo
          fetch-depth: 1

      - name: Prepare Persistent Debug Keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "_keystore_repo/.github/vnera-debug.keystore" ]; then
            mkdir -p "_keystore_repo/.github"
            keytool -genkeypair -v \
              -keystore "_keystore_repo/.github/vnera-debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=VNEra Debug,O=VNEra,C=GR"
            cd _keystore_repo
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/vnera-debug.keystore
            git commit -m "Add persistent keystore for seamless VNEra updates"
            git push || echo "Warning: Could not push keystore to main"
            cd ..
          fi
          cp -f "_keystore_repo/.github/vnera-debug.keystore" "$HOME/.android/debug.keystore"
          cp -f "_keystore_repo/.github/vnera-debug.keystore" "/tmp/vnera-debug.keystore"

      - name: Checkout source-review
        uses: actions/checkout@v4
        with:
          ref: work/source-review
          fetch-depth: 0

      - name: Merge VNEra Custom Changes onto Revera 1.0.8 Base
        run: |
          set -euo pipefail
          rm -rf /tmp/vnera_gradle /tmp/vnera_res /tmp/vnera_custom /tmp/revera_108 /tmp/revera_old /tmp/merge_repo
          mkdir -p /tmp/vnera_gradle /tmp/vnera_res /tmp/vnera_custom /tmp/revera_108 /tmp/revera_old

          [ -f "gradlew" ] && cp -f "gradlew" /tmp/vnera_gradle/
          [ -f "gradlew.bat" ] && cp -f "gradlew.bat" /tmp/vnera_gradle/
          if [ -d "gradle/wrapper" ]; then
            mkdir -p /tmp/vnera_gradle/wrapper
            cp -rf gradle/wrapper/* /tmp/vnera_gradle/wrapper/
          fi
          if [ -d "app/src/main/res" ]; then
            cp -rn app/src/main/res/mipmap* /tmp/vnera_res/ 2>/dev/null || true
            find app/src/main/res -maxdepth 2 -name "*ic_launcher*" -exec cp --parents -rn {} /tmp/vnera_res/ \; 2>/dev/null || true
          fi

          tar --exclude='.git' --exclude='.github' --exclude='_keystore_repo' --exclude='*.zip' -cf - . | tar -xf - -C /tmp/vnera_custom

          git remote add upstream https://revera.caruno.wtf/carunodev/Revera.git
          git fetch upstream +refs/heads/*:refs/remotes/upstream/* +refs/tags/*:refs/tags/* --prune

          git archive refs/tags/v1.0.8 | tar -x -C /tmp/revera_108
          NEW_SETTINGS=$(find /tmp/revera_108 -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          [ -n "$NEW_SETTINGS" ] || { echo "ERROR: Δεν βρέθηκε Gradle root στο Revera v1.0.8"; exit 1; }
          NEW_BASE_ROOT=$(dirname "$NEW_SETTINGS")

          python3 <<'PY'
          import shutil, subprocess
          from pathlib import Path

          exts = {".kt", ".kts", ".xml", ".toml", ".properties", ".pro"}
          vnera_files = {
              str(p.relative_to("/tmp/vnera_custom")): p.read_bytes()
              for p in Path("/tmp/vnera_custom").rglob("*")
              if p.is_file() and p.suffix in exts and ".git" not in p.parts and ".github" not in p.parts
          }
          tags = [t for t in sorted(subprocess.check_output(["git", "tag", "-l", "v1.0.*"], text=True).splitlines()) if t != "v1.0.8"]
          best_label, best_ref, best_score = "v1.0.7", "refs/tags/v1.0.7", -1
          for t in tags:
              tmp_dir = Path("/tmp/rev_cand")
              shutil.rmtree(tmp_dir, ignore_errors=True)
              tmp_dir.mkdir(parents=True)
              subprocess.run(f"git archive refs/tags/{t} | tar -x -C {tmp_dir}", shell=True, check=True)
              base_dir = tmp_dir / "base" if (tmp_dir / "base").exists() else tmp_dir
              matches = sum(1 for rel, data in vnera_files.items() if (base_dir / rel).exists() and (base_dir / rel).read_bytes() == data)
              if matches > best_score:
                  best_label, best_ref, best_score = t, f"refs/tags/{t}", matches
          print(f"SELECTED_OLD_BASE={best_label} ({best_score}/{len(vnera_files)} files matched)")
          Path("/tmp/best_base_ref.txt").write_text(best_ref)
          PY

          git archive "$(cat /tmp/best_base_ref.txt)" | tar -x -C /tmp/revera_old
          OLD_SETTINGS=$(find /tmp/revera_old -maxdepth 3 \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1 || true)
          OLD_BASE_ROOT=$(dirname "${OLD_SETTINGS:-/tmp/revera_old/settings.gradle.kts}")

          git init /tmp/merge_repo
          cd /tmp/merge_repo
          git config user.name "VNEra Merge Bot"
          git config user.email "bot@vnera.local"

          cp -a "$OLD_BASE_ROOT"/. .
          git add -A && git commit -q -m "Old Revera base"

          git checkout -q -b vnera-custom
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp -a /tmp/vnera_custom/. .
          git add -A && git commit -q -m "VNEra custom changes"

          git checkout -q -b revera-108 master
          find . -mindepth 1 -maxdepth 1 ! -name ".git" -exec rm -rf {} +
          cp -a "$NEW_BASE_ROOT"/. .
          git add -A && git commit -q -m "Revera 1.0.8 base"

          git cherry-pick -X theirs vnera-custom || {
            git diff --name-only --diff-filter=U | xargs -r git checkout --theirs --
            git add -A
            git commit -q --no-edit
          }
          git diff --stat HEAD~1 HEAD

          cd "$GITHUB_WORKSPACE"
          find . -mindepth 1 -maxdepth 1 ! -name ".git" ! -name ".github" ! -name "_keystore_repo" -exec rm -rf {} +
          tar --exclude='.git' -cf - -C /tmp/merge_repo . | tar -xf - -C .

          mkdir -p app
          cp -f "/tmp/vnera-debug.keystore" "app/vnera-debug.keystore"

          if [ ! -f "gradlew" ] && [ -f "/tmp/vnera_gradle/gradlew" ]; then
            cp -f /tmp/vnera_gradle/gradlew ./gradlew
            [ -f "/tmp/vnera_gradle/gradlew.bat" ] && cp -f /tmp/vnera_gradle/gradlew.bat ./gradlew.bat
            mkdir -p gradle/wrapper
            [ -f "/tmp/vnera_gradle/wrapper/gradle-wrapper.jar" ] && cp -f /tmp/vnera_gradle/wrapper/gradle-wrapper.jar gradle/wrapper/
            [ ! -f "gradle/wrapper/gradle-wrapper.properties" ] && [ -f "/tmp/vnera_gradle/wrapper/gradle-wrapper.properties" ] && cp -f /tmp/vnera_gradle/wrapper/gradle-wrapper.properties gradle/wrapper/
          fi
          chmod +x ./gradlew

          if [ -d "/tmp/vnera_res" ] && [ -d "app/src/main/res" ]; then
            cp -rf /tmp/vnera_res/mipmap* app/src/main/res/ 2>/dev/null || true
            [ -d "/tmp/vnera_res/app/src/main/res" ] && cp -rf /tmp/vnera_res/app/src/main/res/* app/src/main/res/ 2>/dev/null || true
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Link SDK 37 & Fix Versions & Apply Patches
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SUDO=""; command -v sudo >/dev/null 2>&1 && [ ! -w "$SDK_ROOT/platforms" ] && SUDO="sudo"
          [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ] && $SUDO ln -sfn "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"

          export HAS_SDK_37="false"
          [ -d "$SDK_ROOT/platforms/android-37" ] && export HAS_SDK_37="true"
          export BUILD_VERSION_CODE=$((214000 + ${GITHUB_RUN_NUMBER:-1}))
          echo "HAS_SDK_37=$HAS_SDK_37" >> "$GITHUB_ENV"
          echo "BUILD_VERSION_CODE=$BUILD_VERSION_CODE" >> "$GITHUB_ENV"

          mkdir -p app/src/main/java/com/music/spotui/ui/screens
          cat <<'EOF' > app/src/main/java/com/music/spotui/ui/screens/VnFrameRateManager.kt
          package com.music.spotui.ui.screens

          import android.app.*
          import android.content.*
          import android.os.*
          import android.view.*
          import android.widget.Toast
          import androidx.compose.animation.core.*
          import androidx.compose.foundation.*
          import androidx.compose.foundation.gestures.*
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.rounded.Fullscreen
          import androidx.compose.material.icons.rounded.FullscreenExit
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.*
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.*
          import androidx.compose.ui.input.pointer.*
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalDensity
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.*
          import androidx.compose.ui.window.Popup
          import androidx.compose.ui.window.PopupProperties
          import androidx.core.view.*
          import kotlinx.coroutines.delay
          import org.json.*
          import java.io.File
          import kotlin.math.*

          object VnFpsPref {
              const val PREFS_NAME = "vnera_display_prefs"
              const val KEY_TARGET_FPS = "target_fps"
              const val KEY_LYRICS_IMMERSIVE = "lyrics_immersive_fullscreen"
              const val KEY_CUSTOM_COLOR = "custom_accent_color_argb"
              const val KEY_ANIM_ENABLED = "element_animation_enabled"
              const val KEY_ANIM_MODE = "element_animation_mode"
              const val KEY_PLAYBACK_ALERTS = "playback_quality_order_alerts"
              const val KEY_LAST_BACKUP_JSON = "last_loaded_backup_json"
              const val KEY_LAST_BACKUP_EXTENSIONS = "last_loaded_backup_extensions"
              const val KEY_LYRICS_BEAUTIFUL = "lyrics_beautiful_enabled"
              const val KEY_LYRICS_COLOR = "lyrics_custom_color_argb"
              const val KEY_LYRICS_FONT_SCALE = "lyrics_font_scale"

              var targetFps by mutableIntStateOf(0); private set
              var lyricsImmersiveEnabled by mutableStateOf(true); private set
              var lyricsBarsHidden by mutableStateOf(false)
              var isLyricsEdgeDragging by mutableStateOf(false)
              var activeLyricsScrollState: ScrollableState? = null
              var customAccentColorArgb by mutableLongStateOf(0L); private set
              var elementAnimEnabled by mutableStateOf(false); private set
              var elementAnimMode by mutableIntStateOf(1); private set
              var playbackAlertsEnabled by mutableStateOf(true); private set
              var cachedExtensionsText by mutableStateOf(""); private set
              var lyricsBeautifulEnabled by mutableStateOf(false); private set
              var lyricsCustomColorArgb by mutableLongStateOf(0L); private set
              var lyricsFontScale by mutableFloatStateOf(1.0f); private set
              var defaultThemePrimaryArgb by mutableLongStateOf(0L)

              val extraColorPalette = listOf(
                  "Default" to 0L, "Crimson" to 0xFFE53935L, "Coral" to 0xFFFF5722L, "Amber" to 0xFFFF9800L,
                  "Gold" to 0xFFFFC107L, "Lime" to 0xFFAEEA00L, "Emerald" to 0xFF00C853L, "Mint" to 0xFF00BFA5L,
                  "Cyan" to 0xFF00BCD4L, "Sky" to 0xFF29B6F6L, "Royal" to 0xFF2979FFL, "Indigo" to 0xFF3F51B5L,
                  "Violet" to 0xFF7C4DFFL, "Lavender" to 0xFFB388FFL, "Magenta" to 0xFFE040FBL, "Rose" to 0xFFFF4081L,
                  "Peach" to 0xFFFFAB91L, "Silver" to 0xFFCFD8DCL
              )

              private fun prefs(c: Context) = c.applicationContext.getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)

              fun init(c: Context) = prefs(c).run {
                  targetFps = getInt(KEY_TARGET_FPS, 0)
                  lyricsImmersiveEnabled = getBoolean(KEY_LYRICS_IMMERSIVE, true)
                  customAccentColorArgb = getLong(KEY_CUSTOM_COLOR, 0L)
                  elementAnimEnabled = getBoolean(KEY_ANIM_ENABLED, false)
                  elementAnimMode = getInt(KEY_ANIM_MODE, 1).coerceIn(1, 3)
                  playbackAlertsEnabled = getBoolean(KEY_PLAYBACK_ALERTS, true)
                  cachedExtensionsText = getString(KEY_LAST_BACKUP_EXTENSIONS, "").orEmpty()
                  lyricsBeautifulEnabled = getBoolean(KEY_LYRICS_BEAUTIFUL, false)
                  lyricsCustomColorArgb = getLong(KEY_LYRICS_COLOR, 0L)
                  lyricsFontScale = getFloat(KEY_LYRICS_FONT_SCALE, 1.0f).coerceIn(0.70f, 1.70f)
              }

              fun reload(c: Context) { init(c); c.findActivity()?.let { applyWindowFrameRate(it, targetFps, true) } }
              fun update(c: Context, fps: Int) { targetFps = fps; prefs(c).edit().putInt(KEY_TARGET_FPS, fps).apply(); c.findActivity()?.let { applyWindowFrameRate(it, fps, true) } }
              fun updateLyricsImmersive(c: Context, en: Boolean) { lyricsImmersiveEnabled = en; prefs(c).edit().putBoolean(KEY_LYRICS_IMMERSIVE, en).apply() }
              fun updateCustomColor(c: Context, argb: Long) { customAccentColorArgb = argb; prefs(c).edit().putLong(KEY_CUSTOM_COLOR, argb).apply() }
              fun updateElementAnim(c: Context, en: Boolean, mode: Int = elementAnimMode) {
                  val m = mode.coerceIn(1, 3); elementAnimEnabled = en; elementAnimMode = m
                  prefs(c).edit().putBoolean(KEY_ANIM_ENABLED, en).putInt(KEY_ANIM_MODE, m).apply()
              }
              fun updatePlaybackAlerts(c: Context, en: Boolean) { playbackAlertsEnabled = en; prefs(c).edit().putBoolean(KEY_PLAYBACK_ALERTS, en).apply() }
              fun updateLyricsBeautiful(c: Context, en: Boolean) { lyricsBeautifulEnabled = en; prefs(c).edit().putBoolean(KEY_LYRICS_BEAUTIFUL, en).apply() }
              fun updateLyricsCustomColor(c: Context, argb: Long) { lyricsCustomColorArgb = argb; prefs(c).edit().putLong(KEY_LYRICS_COLOR, argb).apply() }
              fun updateLyricsFontScale(c: Context, scale: Float) {
                  val s = ((scale * 20f).roundToInt() / 20f).coerceIn(0.70f, 1.70f)
                  lyricsFontScale = s
                  prefs(c).edit().putFloat(KEY_LYRICS_FONT_SCALE, s).apply()
              }

              fun resolvedLyricsArgb(): Long = when {
                  lyricsCustomColorArgb != 0L -> lyricsCustomColorArgb
                  customAccentColorArgb != 0L -> customAccentColorArgb
                  else -> defaultThemePrimaryArgb
              }

              @Composable
              fun resolveLyricsAccentColor(fallback: Color = MaterialTheme.colorScheme.primary): Color {
                  val argb = resolvedLyricsArgb()
                  return if (argb != 0L) Color(argb) else fallback
              }

              fun setSystemBarsHidden(act: Activity?, hidden: Boolean) {
                  lyricsBarsHidden = hidden
                  val w = act?.window ?: return
                  WindowCompat.getInsetsController(w, w.decorView).apply {
                      if (hidden) { systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE; hide(WindowInsetsCompat.Type.systemBars()) }
                      else show(WindowInsetsCompat.Type.systemBars())
                  }
              }
              fun toggleSystemBars(act: Activity?) = setSystemBarsHidden(act, !lyricsBarsHidden)

              fun exportAllPrefsJson(c: Context): JSONObject = JSONObject().also { all ->
                  File(c.applicationInfo.dataDir, "shared_prefs").listFiles()?.filter { it.name.endsWith(".xml") }?.forEach { f ->
                      val spName = f.name.removeSuffix(".xml")
                      val entries = JSONObject()
                      c.applicationContext.getSharedPreferences(spName, Context.MODE_PRIVATE).all.forEach { (k, v) ->
                          when (v) {
                              is Boolean -> entries.put(k, JSONObject().put("t", "b").put("v", v))
                              is Int -> entries.put(k, JSONObject().put("t", "i").put("v", v))
                              is Long -> entries.put(k, JSONObject().put("t", "l").put("v", v))
                              is Float -> entries.put(k, JSONObject().put("t", "f").put("v", v.toDouble()))
                              is String -> entries.put(k, JSONObject().put("t", "s").put("v", v))
                              is Set<*> -> entries.put(k, JSONObject().put("t", "set").put("v", JSONArray().apply { v.filterNotNull().forEach { put(it.toString()) } }))
                          }
                      }
                      all.put(spName, entries)
                  }
              }

              fun enrichBackupJson(c: Context, jsonStr: String): String = try {
                  JSONObject(jsonStr).put("__vnera_all_prefs__", exportAllPrefsJson(c)).toString(2).also { recordBackupAndExtractExtensions(c, it) }
              } catch (_: Exception) { recordBackupAndExtractExtensions(c, jsonStr); jsonStr }

              fun onBackupImported(c: Context, rawText: String): String {
                  recordBackupAndExtractExtensions(c, rawText)
                  try {
                      val root = JSONObject(rawText)
                      val allPrefs = root.optJSONObject("__vnera_all_prefs__")
                      if (allPrefs != null) {
                          allPrefs.keys().forEach { spName ->
                              val entries = allPrefs.optJSONObject(spName) ?: return@forEach
                              val ed = c.applicationContext.getSharedPreferences(spName, Context.MODE_PRIVATE).edit()
                              entries.keys().forEach { k ->
                                  if (k == KEY_LAST_BACKUP_JSON || k == KEY_LAST_BACKUP_EXTENSIONS) return@forEach
                                  val item = entries.optJSONObject(k) ?: return@forEach
                                  when (item.optString("t")) {
                                      "b" -> ed.putBoolean(k, item.optBoolean("v"))
                                      "i" -> ed.putInt(k, item.optInt("v"))
                                      "l" -> ed.putLong(k, item.optLong("v"))
                                      "f" -> ed.putFloat(k, item.optDouble("v").toFloat())
                                      "s" -> ed.putString(k, item.optString("v"))
                                      "set" -> item.optJSONArray("v")?.let { arr -> ed.putStringSet(k, (0 until arr.length()).mapTo(LinkedHashSet()) { arr.optString(it) }) }
                                  }
                              }
                              ed.commit()
                          }
                      } else {
                          File(c.applicationInfo.dataDir, "shared_prefs").listFiles()?.filter { it.name.endsWith(".xml") }?.forEach { f ->
                              val sp = c.applicationContext.getSharedPreferences(f.name.removeSuffix(".xml"), Context.MODE_PRIVATE)
                              val existing = sp.all; val ed = sp.edit(); var mod = false
                              root.keys().forEach { k ->
                                  when (val cur = existing[k]) {
                                      is Boolean -> { ed.putBoolean(k, root.optBoolean(k, cur)); mod = true }
                                      is Int -> { ed.putInt(k, root.optInt(k, cur)); mod = true }
                                      is Long -> { ed.putLong(k, root.optLong(k, cur)); mod = true }
                                      is Float -> { ed.putFloat(k, root.optDouble(k, cur.toDouble()).toFloat()); mod = true }
                                      is String -> { ed.putString(k, root.optString(k, cur)); mod = true }
                                  }
                              }
                              if (mod) ed.commit()
                          }
                      }
                  } catch (_: Exception) {}
                  reload(c)
                  c.findActivity()?.let { act -> Handler(Looper.getMainLooper()).postDelayed({ if (!act.isFinishing && !act.isDestroyed) act.recreate() }, 350L) }
                  return rawText
              }

              fun recordBackupAndExtractExtensions(c: Context, raw: String) {
                  val ext = extractExtensionsFromBackup(raw).also { cachedExtensionsText = it }
                  prefs(c).edit().putString(KEY_LAST_BACKUP_JSON, raw).putString(KEY_LAST_BACKUP_EXTENSIONS, ext).commit()
              }

              fun extractExtensionsFromBackup(raw: String): String {
                  val trimmed = raw.trim(); if (trimmed.isEmpty()) return ""
                  val found = LinkedHashSet<String>()
                  fun scan(node: Any?, hint: String = "") {
                      when (node) {
                          is JSONObject -> node.keys().forEach { k ->
                              val v = node.opt(k); val kl = k.lowercase()
                              if (listOf("extension", "addon", "plugin", "repo").any { kl.contains(it) }) {
                                  when (v) {
                                      is JSONArray -> (0 until v.length()).mapNotNull { v.opt(it)?.toString()?.trim() }.filter { it.isNotEmpty() && it != "[]" && it != "{}" }.forEach(found::add)
                                      is JSONObject -> if (v.length() > 0 && !v.has("t")) found.add(v.toString(2)) else if (v.has("v")) scan(v.opt("v"), k)
                                      else -> v?.toString()?.trim()?.takeIf { it.isNotEmpty() && it !in setOf("[]", "{}", "false", "true") }?.let(found::add)
                                  }
                              }
                              scan(v, k)
                          }
                          is JSONArray -> (0 until node.length()).forEach { scan(node.opt(it), hint) }
                          is String -> {
                              val s = node.trim()
                              if ((s.startsWith("{") || s.startsWith("[")) && s.length > 2) runCatching { scan(if (s.startsWith("{")) JSONObject(s) else JSONArray(s), hint) }
                              else if (hint.lowercase().contains("extension") && s.isNotEmpty()) found.add(s)
                          }
                      }
                  }
                  runCatching { if (trimmed.startsWith("{")) scan(JSONObject(trimmed)) else if (trimmed.startsWith("[")) scan(JSONArray(trimmed)) }
                  if (found.isEmpty()) Regex("""https?://[^\s"'<>]+""").findAll(trimmed).map { it.value }.filter { it.contains("ext", true) || listOf(".json", ".js", ".apk").any(it::endsWith) }.forEach(found::add)
                  return found.joinToString("\n")
              }

              fun copyExtensionsToClipboard(c: Context) {
                  init(c)
                  var text = cachedExtensionsText.ifBlank { prefs(c).getString(KEY_LAST_BACKUP_JSON, "").orEmpty().takeIf { it.isNotBlank() }?.let(::extractExtensionsFromBackup).orEmpty() }
                  if (text.isBlank()) {
                      val col = LinkedHashSet<String>()
                      File(c.applicationInfo.dataDir, "shared_prefs").listFiles()?.filter { it.name.endsWith(".xml") }?.forEach { f ->
                          c.applicationContext.getSharedPreferences(f.name.removeSuffix(".xml"), Context.MODE_PRIVATE).all.forEach { (k, v) ->
                              if (k.contains("extension", true) || k.contains("repo", true)) v?.toString()?.trim()?.takeIf { it.isNotEmpty() && it !in setOf("[]", "{}", "false", "true") }?.let(col::add)
                          }
                      }
                      text = col.joinToString("\n")
                  }
                  if (text.isBlank()) { Toast.makeText(c, "Δεν βρέθηκαν extensions στο τελευταίο backup", Toast.LENGTH_SHORT).show(); return }
                  (c.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager).setPrimaryClip(ClipData.newPlainText("VNEra Extensions", text))
                  Toast.makeText(c, "Αντιγράφηκαν ${text.lines().count { it.isNotBlank() }} extensions στο πρόχειρο", Toast.LENGTH_SHORT).show()
              }
          }

          fun vnLyricColor(original: Color): Color {
              if (!VnFpsPref.lyricsBeautifulEnabled) return original
              val argb = VnFpsPref.resolvedLyricsArgb()
              if (argb == 0L) return original
              return Color(argb).copy(alpha = original.alpha.coerceIn(0.45f, 1f))
          }

          @Composable
          fun VnLyricsStylingWrapper(content: @Composable () -> Unit) {
              val c = LocalContext.current
              LaunchedEffect(c) { VnFpsPref.init(c) }
              val baseScheme = MaterialTheme.colorScheme
              VnFpsPref.defaultThemePrimaryArgb = baseScheme.primary.toArgb().toLong()
              val baseDensity = LocalDensity.current
              val scale = VnFpsPref.lyricsFontScale.coerceIn(0.70f, 1.70f)
              val scaledDensity = remember(baseDensity, scale) {
                  Density(density = baseDensity.density, fontScale = baseDensity.fontScale * scale)
              }
              val beautiful = VnFpsPref.lyricsBeautifulEnabled
              val chosenColor = VnFpsPref.resolveLyricsAccentColor(baseScheme.primary)
              val styledScheme = if (beautiful) {
                  baseScheme.copy(
                      primary = chosenColor,
                      secondary = chosenColor,
                      onSurface = chosenColor,
                      onBackground = chosenColor
                  )
              } else {
                  baseScheme
              }
              CompositionLocalProvider(
                  LocalDensity provides scaledDensity,
