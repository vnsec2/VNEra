name: VNEra 2.1.3 Ultimate Build (Debug)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source-review
        uses: actions/checkout@v4
        with:
          ref: work/source-review
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix Gradle/Kotlin/SDK Versions & Apply Patches
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          # 1. Αυτόματη διόρθωση ανύπαρκτων εκδόσεων Kotlin & AGP
          for toml_path in [Path("gradle/libs.versions.toml"), Path("build.gradle.kts"), Path("settings.gradle.kts")]:
              if toml_path.exists():
                  t = toml_path.read_text()
                  t = t.replace('"2.4.10"', '"2.0.20"').replace('"2.4.21"', '"2.0.20"')
                  t = t.replace('"9.4.1"', '"8.7.2"')
                  t = re.sub(r'(compileSdk|targetSdk)\s*=\s*"?37"?', r'\g<1> = "35"', t)
                  toml_path.write_text(t)

          # 2. Αλλαγή compileSdk / targetSdk από 37 σε 35 σε όλα τα modules
          for gradle_file in Path(".").rglob("*.gradle.kts"):
              t = gradle_file.read_text()
              t_new = re.sub(r'(compileSdk|targetSdk)\s*=\s*37', r'\g<1> = 35', t)
              t_new = re.sub(r'(compileSdk|targetSdk)\.set\(37\)', r'\g<1>.set(35)', t_new)
              if t != t_new:
                  gradle_file.write_text(t_new)

          # 3. Update Versions and ONNX
          gradle = Path("app/build.gradle.kts")
          if gradle.exists():
              text = gradle.read_text()
              text = text.replace('onnxruntime-android:1.23.2', 'onnxruntime-android:1.32.0')
              text = re.sub(r'versionName\s*=\s*".*?"', 'versionName = "2.1.3"', text)
              text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 213', text)
              gradle.write_text(text)

          # 4. Add Classic Player lyrics swipe gestures
          path = Path("app/src/main/java/com/music/spotui/ui/screens/LyricsScreen.kt")
          if path.exists():
              source = path.read_text()
              detector_import = "import androidx.compose.foundation.gestures.detectVerticalDragGestures"
              if detector_import not in source:
                  anchor = "import androidx.compose.foundation.gestures.detectTapGestures"
                  if anchor in source:
                      source = source.replace(anchor, anchor + "\n" + detector_import, 1)

              header_old = "modifier = Modifier.fillMaxWidth().height(64.dp).padding(horizontal = 4.dp).revealIn(reveal, 0.3f, 8f),"
              header_new = """modifier = Modifier
                      .fillMaxWidth().height(64.dp).padding(horizontal = 4.dp)
                      .pointerInput(onClose) {
                          var drag = 0f
                          detectVerticalDragGestures(
                              onVerticalDrag = { change, amount ->
                                  drag += amount
                                  change.consume()
                              },
                              onDragEnd = {
                                  if (drag < -72.dp.toPx()) onClose()
                                  drag = 0f
                              },
                              onDragCancel = { drag = 0f },
                          )
                      }
                      .revealIn(reveal, 0.3f, 8f),"""
              if source.count(header_old) == 1:
                  source = source.replace(header_old, header_new, 1)

              card_old = ".clickable(interactionSource = remember { MutableInteractionSource() }, indication = null) { onExpand() }"
              card_new = """.clickable(interactionSource = remember { MutableInteractionSource() }, indication = null) { onExpand() }
                          .pointerInput(onExpand) {
                              var drag = 0f
                              detectVerticalDragGestures(
                                  onVerticalDrag = { change, amount ->
                                      drag += amount
                                      change.consume()
                                  },
                                  onDragEnd = {
                                      if (drag > 72.dp.toPx()) onExpand()
                                      drag = 0f
                                  },
                                  onDragCancel = { drag = 0f },
                              )
                          }"""
              if source.count(card_old) == 1:
                  source = source.replace(card_old, card_new, 1)
              path.write_text(source)

          # 5. Immersive Player fix
          p2 = Path("app/src/main/java/com/music/spotui/ui/immersive/player/ImmersivePlayer.kt")
          if p2.exists():
              s = p2.read_text()
              if "PointerEventPass" not in s: s = s.replace("import androidx.compose.ui.input.pointer.positionChange", "import androidx.compose.ui.input.pointer.positionChange\nimport androidx.compose.ui.input.pointer.PointerEventPass\nimport androidx.compose.ui.input.pointer.positionChangeIgnoreConsumed", 1)
              s = s.replace("awaitPointerEvent()", "awaitPointerEvent(PointerEventPass.Initial)").replace("change.positionChange().y", "change.positionChangeIgnoreConsumed().y").replace("76.dp.toPx()", "48.dp.toPx()")
              p2.write_text(s)
          PY

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug -PappVersionName="2.1.3" -PappVersionCode="213" -Pabis=arm64-v8a -PupdateRepo=vnsec2/VNEra --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VNEra-2.1.3-Debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14
