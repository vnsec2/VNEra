name: VNEra 2.1.3 Ultimate Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Clean Revera 1.0.8
        uses: actions/checkout@v4
        with:
          repository: caruno-git/Revera
          ref: v1.0.8
          fetch-depth: 0

      - name: Apply VNEra 2.1.3 Patches
        run: |
          cat << 'EOF' > patch.py
          import re
          from pathlib import Path

          gradle = Path("app/build.gradle.kts")
          if gradle.exists():
              text = gradle.read_text()
              text = text.replace('onnxruntime-android:1.23.2', 'onnxruntime-android:1.32.0')
              text = re.sub(r'versionName\s*=\s*".*?"', 'versionName = "2.1.3"', text)
              text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 213', text)
              gradle.write_text(text)

          p = Path("app/src/main/java/com/music/spotui/ui/screens/LyricsScreen.kt")
          if p.exists():
              s = p.read_text()
              needed = ["import androidx.compose.foundation.gestures.awaitEachGesture", "import androidx.compose.foundation.gestures.awaitFirstDown", "import androidx.compose.ui.input.pointer.PointerEventPass", "import androidx.compose.ui.input.pointer.positionChangeIgnoreConsumed"]
              for imp in needed:
                  if imp not in s: s = s.replace("import androidx.compose.ui.input.pointer.pointerInput", f"import androidx.compose.ui.input.pointer.pointerInput\n{imp}", 1)
              s = re.sub(r'\.pointerInput\(onExpand\)\s*\{.*?onDragCancel = \{ drag = 0f \},\s*\}', '.lyricsVerticalSwipe(threshold = 48.dp, direction = 1, onSwipe = onExpand)', s, flags=re.DOTALL)
              s = re.sub(r'\.pointerInput\(onClose\)\s*\{.*?onDragCancel = \{ drag = 0f \},\s*\}', '.lyricsVerticalSwipe(threshold = 48.dp, direction = -1, onSwipe = onClose)', s, flags=re.DOTALL)
              helper = "\nprivate fun Modifier.lyricsVerticalSwipe(threshold: androidx.compose.ui.unit.Dp, direction: Int, onSwipe: () -> Unit): Modifier = pointerInput(threshold, direction, onSwipe) { awaitEachGesture { val down = awaitFirstDown(requireUnconsumed = false); var total = 0f; var fired = false; while (!fired) { val event = awaitPointerEvent(PointerEventPass.Initial); val change = event.changes.firstOrNull { it.id == down.id } ?: break; total += change.positionChangeIgnoreConsumed().y; if (total * direction >= threshold.toPx()) { change.consume(); onSwipe(); fired = true }; if (!change.pressed) break } } }\n"
              marker = "/** The inline card's layout node, so the full screen can grow out of it and fold back into it. */"
              if "lyricsVerticalSwipe" not in s and marker in s: s = s.replace(marker, helper + marker, 1)
              p.write_text(s)

          p2 = Path("app/src/main/java/com/music/spotui/ui/immersive/player/ImmersivePlayer.kt")
          if p2.exists():
              s = p2.read_text()
              if "PointerEventPass" not in s: s = s.replace("import androidx.compose.ui.input.pointer.positionChange", "import androidx.compose.ui.input.pointer.positionChange\nimport androidx.compose.ui.input.pointer.PointerEventPass\nimport androidx.compose.ui.input.pointer.positionChangeIgnoreConsumed", 1)
              s = s.replace("awaitPointerEvent()", "awaitPointerEvent(PointerEventPass.Initial)").replace("change.positionChange().y", "change.positionChangeIgnoreConsumed().y").replace("76.dp.toPx()", "48.dp.toPx()")
              p2.write_text(s)
          EOF
          python3 patch.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Release APK
        run: |
          gradle :app:assembleRelease -PappVersionName="2.1.3" -PappVersionCode="213" -Pabis=arm64-v8a -PupdateRepo=vnsec2/VNEra --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VNEra-2.1.3-Release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
