          fun Modifier.vnFullscreenSlideContainer(isClosing: Boolean, matchPlayerBackground: Boolean = false): Modifier = composed {
              val screenHeightPx = with(LocalDensity.current) { LocalConfiguration.current.screenHeightDp.dp.toPx() }
              val progressAnim = remember { Animatable(0f) }
              LaunchedEffect(isClosing) {
                  if (isClosing) {
                      progressAnim.animateTo(0f, tween(durationMillis = 240, easing = FastOutSlowInEasing))
                  } else {
                      progressAnim.animateTo(1f, tween(durationMillis = 320, easing = FastOutSlowInEasing))
                  }
              }
              val p = progressAnim.value.coerceIn(0f, 1f)
              val baseBg = if (matchPlayerBackground && VnFpsPref.playerBackgroundColorArgb != 0L) {
                  Color(VnFpsPref.playerBackgroundColorArgb)
              } else {
                  Color.Black
              }
              this
                  .background(baseBg.copy(alpha = p))
                  .graphicsLayer {
                      translationY = (1f - p) * screenHeightPx * 0.24f
                      alpha = p
                      val s = 0.96f + 0.04f * p
                      scaleX = s
                      scaleY = s
                  }
          }

          fun Modifier.vnSmartLyricsSwipe(
              act: Activity?,
              isExpanded: Boolean,
              onExpandToFullscreen: (() -> Unit)? = null,
              onCollapseToPlayer: (() -> Unit)? = null
          ): Modifier = composed {
              val c = LocalContext.current
              val density = LocalDensity.current
              val thresholdPx = with(density) { 64.dp.toPx() }
              var accumDown by remember { mutableFloatStateOf(0f) }
              var accumUp by remember { mutableFloatStateOf(0f) }

              val nested = remember(act, isExpanded, thresholdPx) {
                  object : NestedScrollConnection {
                      override fun onPreScroll(available: Offset, source: NestedScrollSource): Offset {
                          if (source != NestedScrollSource.UserInput) return Offset.Zero
                          if (!VnFpsPref.isSwipeToExpandLyricsEnabled(c)) return Offset.Zero
                          if (available.y < 0f && accumDown > 0f) accumDown = (accumDown + available.y).coerceAtLeast(0f)
                          if (available.y > 0f && accumUp > 0f) accumUp = (accumUp - available.y).coerceAtLeast(0f)
                          return Offset.Zero
                      }

                      override fun onPostScroll(consumed: Offset, available: Offset, source: NestedScrollSource): Offset {
                          if (source != NestedScrollSource.UserInput) return Offset.Zero
                          if (!VnFpsPref.isSwipeToExpandLyricsEnabled(c)) return Offset.Zero
                          val listState = VnFpsPref.activeLyricsScrollState as? LazyListState
                          val atTop = listState == null || (!listState.canScrollBackward)
                          val atBottom = listState == null || (!listState.canScrollForward)

                          if (available.y > 0f && atTop) {
                              accumDown += available.y
                              if (accumDown >= thresholdPx) {
                                  accumDown = 0f
                                  VnFpsPref.openLyricsFullscreen(act, onExpandToFullscreen)
                              }
                              return Offset(0f, available.y)
                          }

                          if (available.y < 0f && atBottom) {
                              accumUp += -available.y
                              if (accumUp >= thresholdPx) {
                                  accumUp = 0f
                                  VnFpsPref.closeLyricsFullscreen(act, onCollapseToPlayer)
                              }
                              return Offset(0f, available.y)
                          }
                          return Offset.Zero
                      }
                  }
              }

              this
                  .nestedScroll(nested)
                  .pointerInput(act) {
                      awaitEachGesture {
                          val down = awaitFirstDown(requireUnconsumed = false)
                          val up = waitForUpOrCancellation()
                          if (up != null && !up.isConsumed) {
                              val dx = abs(up.position.x - down.position.x)
                              val dy = abs(up.position.y - down.position.y)
                              val w = size.width.toFloat()
                              if (dx < 18f && dy < 18f && w > 0f && up.position.x in (w * 0.25f)..(w * 0.75f)) {
                                  VnFpsPref.toggleSystemBars(act)
                              }
                          }
                      }
                  }
          }

          object VnShuffleGuard {
              var activeBannerMessage by mutableStateOf<String?>(null)
              var userWantsShuffle by mutableStateOf(false)
              var lastKnownShuffleOn by mutableStateOf(false)
              var explicitlyDisabledByUser by mutableStateOf(false)
              val shuffleLockedByUser: Boolean get() = VnFpsPref.keepShuffleEnabled && userWantsShuffle && !explicitlyDisabledByUser
              var onForceEnableShuffle: (() -> Unit)? = null
              private var lastReenableMs = 0L
              private var lastUserTapMs = 0L
              private var attachedPlayerRef: WeakReference<Any>? = null
              private var attachedPlayerIdentity: Int = 0

              fun dismissBanner() {
                  activeBannerMessage = null
              }

              fun syncFromPrefs(remembered: Boolean) {
                  userWantsShuffle = remembered
                  if (remembered) {
                      explicitlyDisabledByUser = false
                  }
              }

              fun markUserShuffleInteraction() {
                  lastUserTapMs = SystemClock.elapsedRealtime()
              }

              fun syncNativeShufflePrefs(c: Context, enabled: Boolean) {
                  runCatching {
                      val ac = c.applicationContext ?: c
                      File(ac.applicationInfo.dataDir, "shared_prefs").listFiles()?.filter { it.name.endsWith(".xml") }?.forEach { f ->
                          val spName = f.name.removeSuffix(".xml")
                          if (spName == VnFpsPref.PREFS_NAME) return@forEach
                          val sp = ac.getSharedPreferences(spName, Context.MODE_PRIVATE)
                          val ed = sp.edit()
                          var mod = false
                          sp.all.forEach { (k, v) ->
                              val kl = k.lowercase()
                              if (kl.contains("shuffle") && !kl.contains("keep") && !kl.contains("remember") && v is Boolean) {
                                  if (v != enabled) {
                                      ed.putBoolean(k, enabled)
                                      mod = true
                                  }
                              }
                          }
                          if (mod) ed.commit()
                      }
                  }
              }

              private fun getShuffleFromPlayer(playerObj: Any?): Boolean? {
                  if (playerObj == null) return null
                  return runCatching {
                      val m = playerObj.javaClass.methods.firstOrNull { it.parameterCount == 0 && (it.name == "getShuffleModeEnabled" || it.name == "isShuffleModeEnabled") }
                      m?.invoke(playerObj) as? Boolean
                  }.getOrNull()
              }

              private fun setShuffleOnPlayer(playerObj: Any?, enabled: Boolean): Boolean {
                  if (playerObj == null) return false
                  return runCatching {
                      val m = playerObj.javaClass.methods.firstOrNull {
                          it.name == "setShuffleModeEnabled" && it.parameterCount == 1 &&
                          (it.parameterTypes[0] == Boolean::class.javaPrimitiveType || it.parameterTypes[0] == java.lang.Boolean::class.java)
                      }
                      if (m != null) {
                          m.invoke(playerObj, enabled)
                          true
                      } else false
                  }.getOrDefault(false)
              }

              fun attachPlayer(playerObj: Any?) {
                  if (playerObj == null) return
                  val id = System.identityHashCode(playerObj)
                  if (id != attachedPlayerIdentity) {
                      attachedPlayerIdentity = id
                      attachedPlayerRef = WeakReference(playerObj)
                      runCatching {
                          val cl = playerObj.javaClass.classLoader
                          val listenerCls = runCatching { Class.forName("androidx.media3.common.Player\$Listener", false, cl) }.getOrNull()
                              ?: runCatching { Class.forName("com.google.android.exoplayer2.Player\$Listener", false, cl) }.getOrNull()
                          val addListenerMethod = if (listenerCls != null) {
                              playerObj.javaClass.methods.firstOrNull { it.name == "addListener" && it.parameterCount == 1 && it.parameterTypes[0].isAssignableFrom(listenerCls) }
                          } else null
                          if (listenerCls != null && addListenerMethod != null) {
                              val proxy = Proxy.newProxyInstance(cl, arrayOf(listenerCls)) { proxyObj, method, args ->
                                  when (method.name) {
                                      "equals" -> proxyObj === args?.getOrNull(0)
                                      "hashCode" -> System.identityHashCode(proxyObj)
                                      "toString" -> "VnShufflePlayerListener"
                                      "onShuffleModeEnabledChanged" -> {
                                          val shuf = args?.getOrNull(0) as? Boolean ?: false
                                          if (!shuf && VnFpsPref.keepShuffleEnabled && (VnFpsPref.rememberedShuffleState || userWantsShuffle) && !explicitlyDisabledByUser) {
                                              val now = SystemClock.elapsedRealtime()
                                              if ((now - lastUserTapMs) > 1400L) {
                                                  setShuffleOnPlayer(playerObj, true)
                                                  if (now - lastReenableMs > 1800L) {
                                                      lastReenableMs = now
                                                      activeBannerMessage = "Ενεργοποιήθηκε ξανά η τυχαία σειρά"
                                                  }
                                              }
                                          }
                                          null
                                      }
                                      "onTimelineChanged", "onPlaybackStateChanged" -> {
                                          if (VnFpsPref.keepShuffleEnabled && (VnFpsPref.rememberedShuffleState || userWantsShuffle) && !explicitlyDisabledByUser) {
                                              val now = SystemClock.elapsedRealtime()
                                              if ((now - lastUserTapMs) > 1400L && getShuffleFromPlayer(playerObj) == false) {
                                                  setShuffleOnPlayer(playerObj, true)
                                              }
                                          }
                                          null
                                      }
                                      "onIsPlayingChanged" -> {
                                          val playing = args?.getOrNull(0) as? Boolean ?: false
                                          VnFpsPref.reportPlayerIsPlaying(playing)
                                          null
                                      }
                                      "onMediaItemTransition" -> {
                                          val item = args?.getOrNull(0)
                                          if (item != null) VnPlaybackMonitor.inspectAndReportAuto(item)
                                          null
                                      }
                                      else -> null
                                  }
                              }
                              addListenerMethod.invoke(playerObj, proxy)
                          }
                      }
                  }
                  enforceOnAttachedPlayers(VnFpsPref.resolveAppContext())
              }

              fun enforceOnAttachedPlayers(c: Context?) {
                  c?.let { VnFpsPref.ensureInit(it) }
                  if (!VnFpsPref.keepShuffleEnabled || explicitlyDisabledByUser) return
                  if (!VnFpsPref.rememberedShuffleState && !userWantsShuffle) return
                  val p = attachedPlayerRef?.get() ?: return
                  if (getShuffleFromPlayer(p) == false) {
                      setShuffleOnPlayer(p, true)
                  }
              }

              fun restoreShuffleOnStartup(c: Context) {
                  VnFpsPref.ensureInit(c)
                  if (VnFpsPref.keepShuffleEnabled && VnFpsPref.rememberedShuffleState && !explicitlyDisabledByUser) {
                      userWantsShuffle = true
                      lastKnownShuffleOn = true
                      syncNativeShufflePrefs(c, true)
                      enforceOnAttachedPlayers(c)
                      runCatching { onForceEnableShuffle?.invoke() }
                  }
              }

              fun onUserTappedShuffleButton(wasShuffleOn: Boolean, c: Context? = null) {
                  lastUserTapMs = SystemClock.elapsedRealtime()
                  val targetState = !wasShuffleOn
                  userWantsShuffle = targetState
                  lastKnownShuffleOn = targetState
                  explicitlyDisabledByUser = !targetState
                  VnFpsPref.saveRememberedShuffleState(c, targetState)
              }

              fun onSettingChanged(enabled: Boolean, remembered: Boolean) {
                  if (enabled) {
                      explicitlyDisabledByUser = false
                      userWantsShuffle = remembered || lastKnownShuffleOn
                      if (userWantsShuffle) {
                          enforceOnAttachedPlayers(VnFpsPref.resolveAppContext())
                          runCatching { onForceEnableShuffle?.invoke() }
                      }
                  } else {
                      userWantsShuffle = false
                      explicitlyDisabledByUser = false
                  }
              }

              fun onUserExplicitShuffleToggle(newShuffleState: Boolean, c: Context? = null) {
                  lastUserTapMs = SystemClock.elapsedRealtime()
                  userWantsShuffle = newShuffleState
                  lastKnownShuffleOn = newShuffleState
                  explicitlyDisabledByUser = !newShuffleState
                  VnFpsPref.saveRememberedShuffleState(c, newShuffleState)
              }

              fun observeShuffleState(
                  c: Context,
                  isShuffleOn: Boolean,
                  reEnableWithoutBreakingQueue: () -> Unit
              ) {
                  VnFpsPref.ensureInit(c)
                  onForceEnableShuffle = reEnableWithoutBreakingQueue
                  val now = SystemClock.elapsedRealtime()
                  val recentlyTappedByUser = (now - lastUserTapMs) in 0L..1400L

                  if (!VnFpsPref.keepShuffleEnabled) {
                      lastKnownShuffleOn = isShuffleOn
                      userWantsShuffle = isShuffleOn
                      return
                  }

                  if (isShuffleOn) {
                      lastKnownShuffleOn = true
                      userWantsShuffle = true
                      explicitlyDisabledByUser = false
                      if (!VnFpsPref.rememberedShuffleState) {
                          VnFpsPref.saveRememberedShuffleState(c, true)
                      }
                      return
                  }

                  if (recentlyTappedByUser && !userWantsShuffle) {
                      lastKnownShuffleOn = false
                      explicitlyDisabledByUser = true
                      VnFpsPref.saveRememberedShuffleState(c, false)
                      return
                  }

                  if ((VnFpsPref.rememberedShuffleState || userWantsShuffle) && !explicitlyDisabledByUser) {
                      userWantsShuffle = true
                      val appliedDirect = attachedPlayerRef?.get()?.let { setShuffleOnPlayer(it, true) } ?: false
                      if (!appliedDirect) {
                          reEnableWithoutBreakingQueue()
                      }
                      if (now - lastReenableMs > 1800L) {
                          lastReenableMs = now
                          activeBannerMessage = "Ενεργοποιήθηκε ξανά η τυχαία σειρά"
                      }
                  } else {
                      lastKnownShuffleOn = false
                  }
              }
          }

