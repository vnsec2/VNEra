          python3 - <<'PY'
          import os, re, glob

          # 1. Inject VnFrameRateGuard into MainActivity
          for p in glob.glob("app/src/main/java/**/MainActivity.kt", recursive=True):
              with open(p, "r", encoding="utf-8") as f: s = f.read()
              if "VnFrameRateGuard()" not in s:
                  s = re.sub(r'(setContent\s*\{)', r'\1\n        com.music.spotui.ui.screens.VnFrameRateGuard()', s, count=1)
                  with open(p, "w", encoding="utf-8") as f: f.write(s)

          # 2. Hook Backup Export / Import (rich JSON export + restore)
          for p in glob.glob("app/src/main/java/**/*.kt", recursive=True):
              if "VnFrameRateManager.kt" in p: continue
              with open(p, "r", encoding="utf-8") as f: s = f.read()
              orig = s
              if "VnSettingsBackup" in s and "VnCopyBackupExtensionsButton" not in s:
                  s = re.sub(
                      r'(\bVnSettingsBackup\s*\([^\n]*\))',
                      r'\1\n    com.music.spotui.ui.screens.VnCopyBackupExtensionsButton()',
                      s,
                      count=1
                  )
              if s != orig:
                  with open(p, "w", encoding="utf-8") as f: f.write(s)

          # 3. Track Lyrics Screen presence & wrap black fullscreen background cleanly
          for target in ["LyricsScreen.kt", "ImmersiveLyricsPanel.kt"]:
              for p in glob.glob(f"app/src/main/java/**/{target}", recursive=True):
                  with open(p, "r", encoding="utf-8") as f: s = f.read()
                  orig = s
                  # Remove any duplicate VnLyricsFullscreenButton calls (now rendered once globally)
                  s = re.sub(r'^\s*(?:com\.music\.spotui\.ui\.screens\.)?VnLyricsFullscreenButton\s*\([^)]*\)\s*\n', '', s, flags=re.M)
                  s = re.sub(r'\.vnFullscreenSlideContainer\([^)]*\)', '', s)
                  # Track presence when lyrics screen/panel is composed
                  m_fn = re.search(r'(@Composable\s+(?:public\s+|internal\s+)?fun\s+(?:LyricsScreen|ImmersiveLyricsPanel)\s*\([^{]*\{)', s)
                  if m_fn and "VnTrackLyricsScreenPresence()" not in s:
                      s = s[:m_fn.end()] + "\n    com.music.spotui.ui.screens.VnTrackLyricsScreenPresence()\n    com.music.spotui.ui.screens.VnLyricsFullscreenEffect()" + s[m_fn.end():]
                  if s != orig:
                      with open(p, "w", encoding="utf-8") as f: f.write(s)
                      print(f"Patched lyrics presence in {p}")

          # 4. Patch inline player lyrics (both plain String and Karaoke AnnotatedString / word-by-word)
          for target in ["PlayerControls.kt", "ImmersivePlayer.kt"]:
              for p in glob.glob(f"app/src/main/java/**/{target}", recursive=True):
                  with open(p, "r", encoding="utf-8") as f: s = f.read()
                  orig = s
                  # Patch Text(...) inside lyric preview blocks to support both String and AnnotatedString karaoke
                  def patch_lyric_text_call(m):
                      call = m.group(0)
                      if "vnPlayerInlineLyricText" in call:
                          return call
                      # Wrap first text argument
                      call = re.sub(
                          r'(\bText\s*\(\s*(?:text\s*=\s*)?)([^,\n)]+)',
                          r'\1com.music.spotui.ui.screens.vnPlayerInlineLyricText(\2)',
                          call,
                          count=1
                      )
                      return call

                  # Target lyric-related composables/blocks
                  lines = s.splitlines()
                  in_lyric_ctx = 0
                  for idx, line in enumerate(lines):
                      if re.search(r'(lyric|karaoke|syncedLine|currentLine)', line, re.I):
                          in_lyric_ctx = 18
                      if in_lyric_ctx > 0:
                          in_lyric_ctx -= 1
                          if re.search(r'\bText\s*\(', line) and "vnPlayerInlineLyricText" not in line:
                              lines[idx] = re.sub(
                                  r'(\bText\s*\(\s*(?:text\s*=\s*)?)([^,\n)]+)',
                                  r'\1com.music.spotui.ui.screens.vnPlayerInlineLyricText(\2)',
                                  line,
                                  count=1
                              )
                          if "color =" in line and "vnKaraokeWordColor" not in line and "vnPlayerInlineLyricColor" not in line:
                              lines[idx] = re.sub(
                                  r'(\bcolor\s*=\s*)([^,\n)]+)',
                                  r'\1com.music.spotui.ui.screens.vnKaraokeWordColor(\2)',
                                  lines[idx],
                                  count=1
                              )
                  s = "\n".join(lines)
                  if s != orig:
                      with open(p, "w", encoding="utf-8") as f: f.write(s)
                      print(f"Patched inline & karaoke lyrics in {p}")

          # 5. Inject VNEra settings strictly into the exact category sections of Settings screens
          settings_files = [
              p for p in glob.glob("app/src/main/java/**/*.kt", recursive=True)
              if os.path.basename(p) in ("ImmersiveSettingsScreen.kt", "SettingsScreen.kt")
          ]

          cat_specs = [
              ("lyrics", ["lyrics", "στίχοι", "lrclib", "synced"], "com.music.spotui.ui.screens.VnLyricsSettingsCard()"),
              ("appearance", ["appearance", "εμφάνιση", "accent", "dynamic", "oled"], "com.music.spotui.ui.screens.VnAppearanceSettingsCard()"),
              ("playback", ["playback", "αναπαραγωγή", "gapless", "crossfade", "normalization", "audio_quality"], "com.music.spotui.ui.screens.VnPlaybackSettingsCard()"),
          ]

          for sp_file in settings_files:
              with open(sp_file, "r", encoding="utf-8") as f:
                  src = f.read()
              orig_src = src

              for cat_name, keywords, card_call in cat_specs:
                  if card_call in src:
                      continue
                  lines = src.splitlines()
                  best_insert_idx = None
                  best_is_lazy = False

                  # Search composable functions or when-branches for each category
                  for i, line in enumerate(lines):
                      ll = line.lower()
                      # Match category header, function declaration, or route/enum branch
                      if any(kw in ll for kw in keywords) and not any(b in ll for b in ["vnsettingsbackup", "vnera", "import", "export"]):
                          # Look forward up to 60 lines for the enclosing LazyColumn or scrollable Column
                          for j in range(i, min(len(lines), i + 60)):
                              lj = lines[j]
                              if re.search(r'\bLazyColumn\s*\(', lj):
                                  # Find matching closing brace of LazyColumn
                                  depth = 0
                                  started = False
                                  for k in range(j, len(lines)):
                                      depth += lines[k].count("{") - lines[k].count("}")
                                      if "{" in lines[k]: started = True
                                      if started and depth <= 0:
                                          best_insert_idx = k
                                          best_is_lazy = True
                                          break
                                  break
                              elif re.search(r'\bColumn\s*\(', lj) and ("verticalScroll" in lj or "Modifier" in lj):
                                  depth = 0
                                  started = False
                                  for k in range(j, len(lines)):
                                      depth += lines[k].count("{") - lines[k].count("}")
                                      if "{" in lines[k]: started = True
                                      if started and depth <= 0:
                                          best_insert_idx = k
                                          best_is_lazy = False
                                          break
                                  break
                          if best_insert_idx is not None:
                              break

                  if best_insert_idx is not None:
                      indent = re.match(r'^(\s*)', lines[best_insert_idx]).group(1) + "    "
                      injection = f"{indent}item {{ {card_call} }}" if best_is_lazy else f"{indent}{card_call}"
                      lines.insert(best_insert_idx, injection)
                      src = "\n".join(lines)
                      print(f"Injected {card_call} into {cat_name} category of {sp_file}")

              if src != orig_src:
                  with open(sp_file, "w", encoding="utf-8") as f:
                      f.write(src)

          # 6. Hook Shuffle Guard into Player / Queue controllers without altering custom user queue
          for p in glob.glob("app/src/main/java/**/*.kt", recursive=True):
              if "VnFrameRateManager.kt" in p: continue
              with open(p, "r", encoding="utf-8") as f: s = f.read()
              orig = s
              if re.search(r'\btoggleShuffle\s*\(', s):
                  s = re.sub(
                      r'(fun\s+toggleShuffle\s*\([^{]*\{)',
                      r'\1\n        com.music.spotui.ui.screens.VnShuffleGuard.onUserExplicitShuffleToggle(!shuffleEnabled)',
                      s,
                      count=1
                  )
              if s != orig:
                  with open(p, "w", encoding="utf-8") as f: f.write(s)
                  print(f"Hooked Shuffle Guard in {p}")
