                      stripped = body.rstrip()
                      sep = "" if stripped.endswith(",") else ","
                      return f"listOf({stripped}{sep} {extra_colors_str}\n)"
                  return m.group(0)
              updated = re.sub(r'listOf\(((?:\s*Color\([^)]+\)\s*,?)+)\s*\)', _expand_colors, orig)
              if updated != orig:
