[package]
name = "orpheon-audio-transport"
version = "0.1.0"
edition = "2021"
authors = ["carunodev"]
license = "GPL-3.0-only"

[lib]
name = "orpheon_audio"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "http2"] }
serde_json = "1"

[profile.release]
lto = "thin"
strip = "symbols"
