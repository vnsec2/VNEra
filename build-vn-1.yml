name: VNEra Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'VNEra-2.0.0-source.zip'
      - '.github/workflows/build-vn.yml'

permissions:
  contents: read

env:
  SOURCE_ZIP: VNEra-2.0.0-source.zip
  APP_VERSION_NAME: 2.0.0
  APP_VERSION_CODE: 220

jobs:
  build:
    name: Build VNEra Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP into workspace
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE_ZIP" || { echo "Missing $SOURCE_ZIP in repository root"; exit 1; }
          mkdir -p "$RUNNER_TEMP/vnera-source"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/vnera-source"
          PROJECT_ROOT="$(find "$RUNNER_TEMP/vnera-source" -type f -name gradlew -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_ROOT" || { echo 'Could not find gradlew inside source ZIP'; exit 1; }
          cp -a "$PROJECT_ROOT"/. "$GITHUB_WORKSPACE"/
          chmod +x ./gradlew
          test -f .github/workflows/vn-apk.yml || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.VNERA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.VNERA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing GitHub secret VNERA_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing GitHub secret VNERA_KEYSTORE_PASSWORD'; exit 1; }
          mkdir -p "$RUNNER_TEMP/vnera-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vnera-signing/vnera-release.jks"
          echo "MYSPOTI_KEYSTORE=$RUNNER_TEMP/vnera-signing/vnera-release.jks" >> "$GITHUB_ENV"
          echo "MYSPOTI_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MYSPOTI_KEY_ALIAS=vnera-release" >> "$GITHUB_ENV"
          echo "MYSPOTI_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed Release APK
        run: ./gradlew :app:assembleRelease -PappVersionName="$APP_VERSION_NAME" -PappVersionCode="$APP_VERSION_CODE" -Pabis=arm64-v8a --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: VNEra-2.0.0-Release-arm64
          path: '**/build/outputs/apk/release/*.apk'
          if-no-files-found: error
          retention-days: 14
