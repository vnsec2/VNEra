
name: Extract VNEra Source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source ZIP
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          unzip -q VNEra-2.1.0-source.zip -d "$RUNNER_TEMP/source"
          PROJECT_ROOT="$(find "$RUNNER_TEMP/source" -type f -name gradlew -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_ROOT"
          git checkout -b work/source-review
          cp -a "$PROJECT_ROOT"/. .
          chmod +x ./gradlew
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract VNEra 2.1.0 source"
          git push origin work/source-review
